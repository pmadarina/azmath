<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractions, Decimals & Percentages Practice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#eef3ff;min-height:100vh}

/* ── Header ── */
.header{background:linear-gradient(135deg,#4f8ef7,#6c5ce7);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 12px rgba(0,0,0,.2);gap:12px;flex-wrap:wrap}
.header-left h1{font-size:1.15rem;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.header-left p{font-size:.75rem;opacity:.85;margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}
.lang-toggle{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:800;cursor:pointer;letter-spacing:.5px;transition:background .15s;white-space:nowrap}
.lang-toggle:hover{background:rgba(255,255,255,.28)}
.smart-score-ring{position:relative;width:64px;height:64px;flex-shrink:0}
.smart-score-ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.25);stroke-width:5}
.ring-fill{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:188.5;transition:stroke-dashoffset .6s ease}
.score-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-label span{font-size:1.3rem;font-weight:900;line-height:1}
.score-label small{font-size:.48rem;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.5px}

/* ── Score bar ── */
.bar-wrap{background:#fff;border-bottom:1px solid #dce8ff;padding:9px 24px;display:flex;align-items:center;gap:12px}
.bar-track{flex:1;height:10px;background:#dde6ff;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#4f8ef7,#6c5ce7);border-radius:6px;transition:width .55s ease;width:0%}
.bar-pct{font-size:.78rem;color:#6c5ce7;font-weight:700;min-width:28px;text-align:right}

/* ── Stats row ── */
.stats-row{display:flex;gap:10px;margin-bottom:16px}
.stat-box{flex:1;background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 8px rgba(79,142,247,.1)}
.stat-box .val{font-size:1.75rem;font-weight:900;line-height:1}
.stat-box .lbl{font-size:.68rem;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.val-g{color:#00b894}.val-r{color:#d63031}.val-b{color:#4f8ef7}

/* ── Main ── */
.main{max-width:780px;margin:24px auto;padding:0 14px}

/* ── Section divider ── */
.section-banner{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border-radius:14px;padding:14px 20px;margin-bottom:14px;font-weight:800;font-size:.95rem;letter-spacing:.3px}

/* ── Progress dots ── */
.prog-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#cdd8ff;transition:all .3s}
.dot.done{background:#00b894}.dot.wrong-dot{background:#d63031}.dot.cur{background:#4f8ef7;box-shadow:0 0 0 3px rgba(79,142,247,.3)}

/* ── Question card ── */
.qcard{background:#fff;border-radius:20px;padding:28px 28px;box-shadow:0 4px 20px rgba(79,142,247,.12);animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-tag{display:inline-block;background:#eef3ff;color:#4f8ef7;font-size:.72rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.section-tag{background:#f0eeff;color:#6c5ce7}
.q-text{font-size:1.05rem;font-weight:600;color:#1a1a2e;margin-bottom:6px;line-height:1.55}
.math-big{font-size:1.7rem;margin:12px 0 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1}
.frac .n{border-bottom:2.5px solid currentColor;padding:1px 5px;font-size:.82em}
.frac .d{padding:1px 5px;font-size:.82em}

/* ── Word problem box ── */
.word-box{background:#f8faff;border-radius:13px;padding:18px 20px;margin:12px 0 20px;border-left:4px solid #4f8ef7;font-size:.97rem;line-height:1.85;color:#1a1a2e}
.word-box strong{color:#4f8ef7}
.price-card{display:block;background:#1e1e2e;color:#fff;border-radius:12px;padding:14px 18px;margin:12px 0;font-size:.88rem;line-height:2}
.price-card .menu-title{font-weight:900;color:#fdcb6e;font-size:.95rem;text-align:center;margin-bottom:4px;letter-spacing:1px}
.price-row{display:flex;justify-content:space-between;gap:28px}
.price-row .price{color:#00b894;font-weight:800}

/* ── Options ── */
.options{display:grid;gap:10px;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:13px;padding:12px 16px;border:2.5px solid #dce8ff;border-radius:13px;background:#fff;cursor:pointer;font-size:1rem;text-align:left;transition:all .15s;color:#1a1a2e;font-family:inherit}
.opt:hover:not(:disabled){border-color:#4f8ef7;background:#f4f7ff}
.opt-lbl{min-width:31px;height:31px;border-radius:50%;background:#eef3ff;color:#4f8ef7;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.84rem;transition:all .2s}
.opt:disabled{cursor:default}
.opt.correct{border-color:#00b894;background:#f0fff8}
.opt.correct .opt-lbl{background:#00b894;color:#fff}
.opt.wrong{border-color:#d63031;background:#fff5f5}
.opt.wrong .opt-lbl{background:#d63031;color:#fff}

/* ── Feedback ── */
.feedback{margin-top:16px;padding:15px 18px;border-radius:13px;font-size:.9rem;line-height:1.65;display:none;animation:fadeIn .3s ease}
.feedback.show{display:block}
.feedback.correct{background:#f0fff8;border:2px solid #00b894;color:#00634d}
.feedback.wrong{background:#fff5f5;border:2px solid #d63031;color:#6b1010}
.feedback.hint{background:#fffbf0;border:2px solid #fdcb6e;color:#7a5500}
.steps{margin-top:10px}
.step{display:flex;gap:9px;margin-bottom:6px;font-size:.88rem;align-items:flex-start}
.step-num{background:#4f8ef7;color:#fff;min-width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;flex-shrink:0;margin-top:1px}
.step-num.orange{background:#fdcb6e;color:#6b4c00}
.concept-box{margin-top:10px;padding:9px 13px;background:rgba(0,0,0,.04);border-radius:9px;font-size:.82rem}

/* ── Buttons ── */
.hint-btn{margin-top:12px;padding:7px 18px;background:transparent;color:#6c5ce7;border:2px solid #6c5ce7;border-radius:9px;font-size:.84rem;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.hint-btn:hover{background:#f4f0ff}
.hint-btn:disabled{opacity:.55;cursor:default}
.next-btn{margin-top:16px;padding:11px 30px;background:linear-gradient(135deg,#4f8ef7,#6c5ce7);color:#fff;border:none;border-radius:11px;font-size:.95rem;font-weight:800;cursor:pointer;display:none;font-family:inherit;box-shadow:0 3px 12px rgba(79,142,247,.35)}
.next-btn:hover{opacity:.9}
.next-btn.show{display:inline-block}
.opt.selected{border-color:#6c5ce7;background:#f4f0ff}
.opt.selected .opt-lbl{background:#6c5ce7;color:#fff}
.submit-btn{margin-top:12px;padding:11px 30px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:11px;font-size:.95rem;font-weight:800;cursor:pointer;display:none;font-family:inherit;box-shadow:0 3px 12px rgba(108,92,231,.35)}
.submit-btn:hover{opacity:.9}
.submit-btn.show{display:inline-block}

/* ── Streak badge ── */
.streak{display:inline-flex;align-items:center;gap:5px;background:#fff9ec;border:1.5px solid #fdcb6e;color:#7a5500;padding:4px 11px;border-radius:20px;font-size:.8rem;font-weight:700;margin-left:8px}

/* ── Weak area badge ── */
.weak-badge{display:inline-flex;align-items:center;gap:6px;background:#fff0f0;border:1.5px solid #d63031;color:#d63031;padding:5px 13px;border-radius:20px;font-size:.78rem;font-weight:800;margin-bottom:10px;animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

/* ── Weakness report ── */
.weak-report{background:#fff5f5;border:2px solid #ffcdd2;border-radius:14px;padding:16px 18px;margin:16px 0}
.weak-report h3{font-size:.9rem;font-weight:800;color:#d63031;margin-bottom:12px}
.weak-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.weak-row .topic-name{font-size:.85rem;font-weight:600;color:#333;flex:1}
.weak-bar-wrap{width:100px;height:8px;background:#fce4e4;border-radius:4px;overflow:hidden;flex-shrink:0}
.weak-bar-fill{height:100%;background:#d63031;border-radius:4px}
.weak-pct{font-size:.78rem;font-weight:800;color:#d63031;min-width:32px;text-align:right}
.strong-row .topic-name{color:#00634d}
.strong-row .weak-bar-fill{background:#00b894}
.strong-row .weak-pct{color:#00634d}

/* ── Adaptive practice button ── */
.practice-btn{padding:12px 28px;background:linear-gradient(135deg,#d63031,#e17055);color:#fff;border:none;border-radius:11px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 3px 12px rgba(214,48,49,.35);margin-right:10px}
.practice-btn:hover{opacity:.9}
.round-badge{display:inline-block;background:#eef3ff;color:#4f8ef7;font-size:.75rem;font-weight:800;padding:4px 12px;border-radius:20px;margin-bottom:8px;border:1.5px solid #c5d5f8}

/* ── Completion ── */
.completion{text-align:center;padding:44px 24px}
.trophy{font-size:4.5rem;margin-bottom:14px;animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.completion h2{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#4f8ef7,#6c5ce7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.completion p{color:#666;font-size:1rem;margin-bottom:22px}
.restart-btn{padding:13px 40px;background:linear-gradient(135deg,#4f8ef7,#6c5ce7);color:#fff;border:none;border-radius:13px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(79,142,247,.4)}
.restart-btn:hover{opacity:.9}

/* ── Confetti ── */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.cp{position:absolute;opacity:0;animation:fall 1.6s ease-in forwards}
@keyframes fall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* ── Mobile ── */
@media(max-width:540px){
  .header{padding:10px 14px;gap:6px}
  .header-left h1{font-size:.95rem}
  .header-left p{font-size:.68rem}
  .header-right{gap:8px}
  .lang-toggle{padding:5px 9px;font-size:.7rem;letter-spacing:.2px}
  .smart-score-ring{width:48px;height:48px}
  .smart-score-ring svg{width:48px;height:48px}
  .score-label span{font-size:1rem}
  .bar-wrap{padding:7px 14px}
  .main{padding:0 10px;margin-top:14px}
  .stats-row{gap:7px;margin-bottom:12px}
  .stat-box{padding:9px 5px;border-radius:11px}
  .stat-box .val{font-size:1.35rem}
  .stat-box .lbl{font-size:.62rem}
  .prog-dots{gap:4px;margin-bottom:14px}
  .dot{width:8px;height:8px}
  .section-banner{padding:11px 14px;font-size:.85rem;border-radius:11px}
  .qcard{padding:18px 14px;border-radius:16px}
  .q-text{font-size:.97rem}
  .math-big{font-size:1.3rem;margin:10px 0 16px}
  .word-box{padding:13px 14px;font-size:.88rem;line-height:1.7}
  .options{gap:8px}
  /* 16px prevents iOS Safari auto-zoom */
  .opt{padding:10px 11px;gap:9px;font-size:16px;border-radius:11px}
  .opt-lbl{min-width:27px;height:27px;font-size:.76rem}
  .feedback{padding:12px 14px;font-size:.85rem}
  .step{font-size:.82rem}
  .hint-btn{width:100%;margin-top:10px}
  .next-btn{width:100%;text-align:center;margin-top:12px;padding:12px 20px}
  .completion{padding:28px 16px}
  .trophy{font-size:3.8rem}
  .completion h2{font-size:1.5rem}
  .completion p{font-size:.9rem}
  .restart-btn{width:100%;max-width:260px;padding:12px 20px;font-size:.95rem}
  .practice-btn{width:100%;margin-right:0;margin-bottom:8px;padding:11px 20px}
  .weak-report{padding:13px 14px}
  .weak-row .topic-name{font-size:.78rem}
  .weak-bar-wrap{width:70px}
}
</style>
</head>
<body>

<div class="confetti-wrap" id="confWrap"></div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <h1 id="hTitle">Fractions, Decimals &amp; Percentages</h1>
    <p id="hSub">Grade 5 &bull; Mathematics &bull; Interactive Practice</p>
  </div>
  <div class="header-right">
    <a class="lang-toggle" href="../" style="text-decoration:none">← All Exercises</a>
    <button class="lang-toggle" onclick="toggleLang()" id="langBtn">🌐 Bahasa Indonesia</button>
    <div class="smart-score-ring" title="SmartScore">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle class="ring-bg" cx="32" cy="32" r="28"/>
        <circle class="ring-fill" id="ringFill" cx="32" cy="32" r="28"/>
      </svg>
      <div class="score-label"><span id="ssVal">0</span><small>Score</small></div>
    </div>
  </div>
</div>

<!-- Progress bar -->
<div class="bar-wrap">
  <span style="font-size:.75rem;color:#888;font-weight:600" id="barLbl">SmartScore</span>
  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  <span class="bar-pct" id="barPct">0</span>
</div>

<!-- Main -->
<div class="main">
  <div class="stats-row">
    <div class="stat-box"><div class="val val-g" id="sCorrect">0</div><div class="lbl" id="lCorrect">✅ Correct</div></div>
    <div class="stat-box"><div class="val val-r" id="sWrong">0</div><div class="lbl" id="lWrong">❌ Wrong</div></div>
    <div class="stat-box"><div class="val val-b" id="sTotal">0</div><div class="lbl" id="lTotal">📝 Answered</div></div>
  </div>
  <div class="prog-dots" id="progDots"></div>
  <div id="qArea"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────
function frac(n,d){return`<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`}
function mixed(w,n,d){return`${w}${frac(n,d)}`}

// ─────────────────────────────────────────────────────────────
// Language
// ─────────────────────────────────────────────────────────────
let lang='en';
function t(obj){ return typeof obj==='string'?obj:(obj[lang]||obj.en) }
function updateChapterHeader(){
  if(isExam){
    document.getElementById('hTitle').textContent=lang==='en'?'Full Exam':'Ujian Lengkap';
    document.getElementById('hSub').textContent=lang==='en'?'All Chapters · Grade 5 · Mathematics · No Hints':'Semua Bab · Kelas 5 · Matematika · Tanpa Petunjuk';
    return;
  }
  const ch=parseInt(new URLSearchParams(window.location.search).get('ch'))||0;
  const part=ch?Parts.find(p=>p.ch===ch):null;
  if(part){
    document.getElementById('hTitle').textContent=lang==='en'?part.section.en:part.section.id;
    document.getElementById('hSub').textContent=lang==='en'?'Grade 5 · Mathematics · MCQ Practice':'Kelas 5 · Matematika · Latihan MCQ';
  } else {
    document.getElementById('hTitle').textContent=lang==='en'?'Fractions, Decimals & Percentages':'Pecahan, Desimal & Persen';
    document.getElementById('hSub').textContent=lang==='en'?'Grade 5 • Mathematics • Interactive Practice':'Kelas 5 • Matematika • Latihan Interaktif';
  }
}

function toggleLang(){
  lang = lang==='en'?'id':'en';
  document.getElementById('langBtn').textContent = lang==='en'?'🌐 Bahasa Indonesia':'🌐 English';
  updateChapterHeader();
  document.getElementById('lCorrect').textContent = lang==='en'?'✅ Correct':'✅ Benar';
  document.getElementById('lWrong').textContent = lang==='en'?'❌ Wrong':'❌ Salah';
  document.getElementById('lTotal').textContent = lang==='en'?'📝 Answered':'📝 Dijawab';
  render(); // re-render current question in new language
}

// ─────────────────────────────────────────────────────────────
// Question Generators — fresh random question every call
// ─────────────────────────────────────────────────────────────
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pickA(arr){return arr[Math.floor(Math.random()*arr.length)];}
function gcd2(a,b){return b===0?a:gcd2(b,a%b);}
function sfrac(n,d){const g=gcd2(n,d);return[n/g,d/g];}
function shuffA(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// Cross-topic deduplication — cleared at start of each queue build
const _usedVals=new Set();
const _usedWordIdx={};
function pickFreshConv(pool,keyFn){
  const fresh=pool.filter(item=>!_usedVals.has(keyFn(item)));
  const chosen=pickA(fresh.length>0?fresh:pool);
  _usedVals.add(keyFn(chosen));
  return chosen;
}
function pickFreshWord(arr,key){
  const used=_usedWordIdx[key]||(_usedWordIdx[key]=new Set());
  if(used.size>=arr.length) used.clear();
  const avail=arr.map((_,i)=>i).filter(i=>!used.has(i));
  const idx=pickA(avail);
  used.add(idx);
  return arr[idx];
}
function mkOpts(correct,wrongs){
  const seen=new Set([String(correct)]);
  const uniq=wrongs.map(String).filter(x=>{if(seen.has(x))return false;seen.add(x);return true;});
  while(uniq.length<3)uniq.push(String(correct)+'?');
  const pool=shuffA([String(correct),...uniq.slice(0,3)]);
  const L=['A','B','C','D'];let ans='';
  const opts=pool.map((v,i)=>{if(v===String(correct))ans=L[i];return{l:L[i],v};});
  return{opts,ans};
}

const Generators={

  // ── Part 1 ──────────────────────────────────────────────────
  itm:()=>{
    const d=pickA([2,3,4,5,6,8,10]);
    const whole=ri(1,5);const rem=ri(1,d-1);const num=whole*d+rem;
    const cor=mixed(whole,rem,d);
    const w1=mixed(whole+1,rem,d);
    const w2=mixed(whole,rem===1?2:rem-1,d);
    const w3=whole>1?mixed(whole-1,rem,d):mixed(whole+2,rem,d);
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'Convert the improper fraction to a mixed number:',id:'Ubah pecahan biasa berikut menjadi pecahan campuran:'},
      math:frac(num,d),opts,ans,
      steps:{en:[`Divide: <b>${num} ÷ ${d}</b>`,`Quotient = <b>${whole}</b>, remainder = <b>${rem}</b>`,`So: ${frac(num,d)} = ${mixed(whole,rem,d)}`],
             id:[`Bagi: <b>${num} ÷ ${d}</b>`,`Hasil bagi = <b>${whole}</b>, sisa = <b>${rem}</b>`,`Jadi: ${frac(num,d)} = ${mixed(whole,rem,d)}`]},
      concept:{en:'Divide numerator ÷ denominator. Quotient = whole, remainder = new numerator, keep denominator.',
               id:'Bagi pembilang ÷ penyebut. Hasil = bulat, sisa = pembilang baru, penyebut tetap.'}};
  },

  mti:()=>{
    const d=pickA([2,3,4,5,6,8,10]);
    const whole=ri(1,5);const rem=ri(1,d-1);const num=whole*d+rem;
    const cor=frac(num,d);
    const w1=frac(whole+rem,d);const w2=frac(num+1,d);
    const w3=num-1>d?frac(num-1,d):frac(num+2,d);
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'Convert the mixed number to an improper fraction:',id:'Ubah pecahan campuran berikut menjadi pecahan biasa:'},
      math:mixed(whole,rem,d),opts,ans,
      steps:{en:[`Multiply: <b>${whole} × ${d} = ${whole*d}</b>`,`Add numerator: <b>${whole*d} + ${rem} = ${num}</b>`,`So: ${mixed(whole,rem,d)} = ${frac(num,d)}`],
             id:[`Kalikan: <b>${whole} × ${d} = ${whole*d}</b>`,`Tambah pembilang: <b>${whole*d} + ${rem} = ${num}</b>`,`Jadi: ${mixed(whole,rem,d)} = ${frac(num,d)}`]},
      concept:{en:'(whole × denominator) + numerator, keep the denominator.',id:'(bulat × penyebut) + pembilang, penyebut tetap.'}};
  },

  ftd:()=>{
    const pool=[[1,2,'0.5'],[1,4,'0.25'],[3,4,'0.75'],[1,5,'0.2'],[2,5,'0.4'],[3,5,'0.6'],[4,5,'0.8'],[1,10,'0.1'],[3,10,'0.3'],[7,10,'0.7'],[9,10,'0.9'],[1,20,'0.05'],[3,20,'0.15'],[1,25,'0.04'],[2,25,'0.08'],[3,25,'0.12'],[4,25,'0.16']];
    const[n,d,dec]=pickFreshConv(pool,item=>parseFloat(item[2]));const decN=parseFloat(dec);
    const delta=pickA([0.1,0.05,0.2,0.15,0.25]);
    const w1=String(+(decN+delta).toFixed(4)).replace(/0+$/,'').replace(/\.$/,'');
    const w2=String(+(decN-delta>0?decN-delta:decN+delta+0.1).toFixed(4)).replace(/0+$/,'').replace(/\.$/,'');
    const w3=String(+(d/n).toFixed(3)).replace(/0+$/,'').replace(/\.$/,'');
    const{opts,ans}=mkOpts(dec,[w1,w2,w3]);
    return{text:{en:'Convert the fraction to a decimal:',id:'Ubah pecahan berikut menjadi desimal:'},
      math:frac(n,d),opts,ans,
      steps:{en:[`Divide: <b>${n} ÷ ${d} = ${dec}</b>`],id:[`Bagi: <b>${n} ÷ ${d} = ${dec}</b>`]},
      concept:{en:'Divide numerator ÷ denominator.',id:'Bagi pembilang ÷ penyebut.'}};
  },

  cmp:()=>{
    const vals=[[0.5,'½',50],[0.25,'¼',25],[0.75,'¾',75],[0.2,'1/5',20],[0.4,'2/5',40],[0.6,'3/5',60],[0.8,'4/5',80],[0.1,'1/10',10],[0.3,'3/10',30],[0.7,'7/10',70],[0.65,'65%',65],[0.35,'35%',35]];
    let[v1,s1,p1]=pickA(vals),[v2,s2,p2]=pickA(vals);
    while(v1===v2){[v2,s2,p2]=pickA(vals);}
    const types=['frac','dec','pct'];
    const t1=pickA(types),t2=pickA(types);
    const d1=t1==='frac'?s1:t1==='dec'?String(v1):`${p1}%`;
    const d2=t2==='frac'?s2:t2==='dec'?String(v2):`${p2}%`;
    const ans=v1>v2?'A':v1<v2?'B':'C';
    const sym=v1>v2?'>':v1<v2?'<':'=';
    const opts=[{l:'A',v:'&gt;&nbsp;(greater than)'},{l:'B',v:'&lt;&nbsp;(less than)'},{l:'C',v:'=&nbsp;(equal to)'},{l:'D',v:{en:'Cannot be determined',id:'Tidak dapat ditentukan'}}];
    return{text:{en:'Fill in the blank with >, < or =',id:'Isi titik-titik dengan >, < atau ='},
      math:`${d1} &nbsp;_____&nbsp; ${d2}`,opts,ans,
      steps:{en:[`Convert to decimals: <b>${d1} = ${v1}</b>  and  <b>${d2} = ${v2}</b>`,`Compare: ${v1} ${sym} ${v2}`],
             id:[`Ubah ke desimal: <b>${d1} = ${v1}</b>  dan  <b>${d2} = ${v2}</b>`,`Bandingkan: ${v1} ${sym} ${v2}`]},
      concept:{en:'Convert to the same format (decimals), then compare.',id:'Samakan format ke desimal, lalu bandingkan.'}};
  },

  fadd:()=>{
    const pairs=[[1,8,3,8],[2,8,1,8],[3,10,4,10],[1,10,6,10],[1,6,1,6],[1,4,2,4],[1,3,1,6],[1,4,1,8],[1,3,1,9],[2,5,1,10],[1,4,3,8],[1,6,2,3],[2,3,1,6],[1,6,1,2],[3,10,1,5]];
    const[n1,d1,n2,d2]=pickA(pairs);
    const lcm=d1*d2/gcd2(d1,d2);
    const rn=n1*(lcm/d1)+n2*(lcm/d2);const rd=lcm;
    const[sn,sd]=sfrac(rn,rd);
    const cor=sd===1?String(sn):frac(sn,sd);
    const w1=frac(n1+n2,d1+d2);
    const w2=sd===1?String(sn+1):frac(sn+1,sd);
    const w3=frac(rn+1,rd);
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'What is the sum?',id:'Berapakah hasil penjumlahannya?'},
      math:`${frac(n1,d1)} + ${frac(n2,d2)}`,opts,ans,
      steps:{en:[`LCM of ${d1} and ${d2} = <b>${lcm}</b>`,`Add: <b>${rn}/${rd}</b>`,sn!==rn||sd!==rd?`Simplify: <b>${cor}</b>`:`Answer: <b>${cor}</b>`],
             id:[`KPK dari ${d1} dan ${d2} = <b>${lcm}</b>`,`Jumlahkan: <b>${rn}/${rd}</b>`,sn!==rn||sd!==rd?`Sederhanakan: <b>${cor}</b>`:`Jawaban: <b>${cor}</b>`]},
      concept:{en:'Find LCM, add numerators. Never add denominators!',id:'Cari KPK, jumlahkan pembilang. Jangan menjumlahkan penyebut!'}};
  },

  fmul:()=>{
    const d=pickA([2,3,4,5,6,8,10]);
    const n=ri(1,d-1);
    const whole=pickA([2,3,4,5,6,8,10,12]);
    const rawN=n*whole;
    const[sn,sd]=sfrac(rawN,d);
    const cor=sd===1?String(sn):frac(sn,sd);
    const w1=sd===1?String(sn+1):frac(sn+1,sd);
    const w2=frac(rawN,d);
    const w3=sd===1?String(sn*2):frac(sn*2,sd);
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'What is the product?',id:'Berapakah hasil perkaliannya?'},
      math:`${frac(n,d)} × ${whole}`,opts,ans,
      steps:{en:[`Multiply numerator: <b>${n} × ${whole} = ${rawN}</b>`,`Result: ${frac(rawN,d)}`,sn!==rawN||sd!==d?`Simplify: <b>${cor}</b>`:`Answer: <b>${cor}</b>`],
             id:[`Kalikan pembilang: <b>${n} × ${whole} = ${rawN}</b>`,`Hasil: ${frac(rawN,d)}`,sn!==rawN||sd!==d?`Sederhanakan: <b>${cor}</b>`:`Jawaban: <b>${cor}</b>`]},
      concept:{en:'Multiply numerator × whole, keep denominator, simplify.',id:'Kalikan pembilang × bilangan bulat, penyebut tetap, sederhanakan.'}};
  },

  // ── Part 2 ──────────────────────────────────────────────────
  dtf:()=>{
    const pool=[[0.1,1,10],[0.2,1,5],[0.25,1,4],[0.3,3,10],[0.4,2,5],[0.5,1,2],[0.6,3,5],[0.75,3,4],[0.8,4,5],[0.9,9,10],[0.05,1,20],[0.15,3,20],[0.04,1,25],[0.08,2,25],[0.35,7,20],[0.45,9,20],[0.55,11,20],[0.65,13,20]];
    const[dec,sn,sd]=pickFreshConv(pool,item=>item[0]);
    const cor=frac(sn,sd);
    const w1=frac(Math.round(dec*10),10);
    const w2=frac(Math.round(dec*100),100);
    const w3=frac(sn+1,sd);
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'Convert the decimal to a fraction in its simplest form:',id:'Ubah desimal berikut menjadi pecahan paling sederhana:'},
      math:`<b>${dec}</b>`,opts,ans,
      steps:{en:[`Write as fraction: <b>${Math.round(dec*100)}/100</b>`,`Simplify by GCF: <b>${sn}/${sd}</b>`],
             id:[`Tulis sebagai pecahan: <b>${Math.round(dec*100)}/100</b>`,`Sederhanakan dengan FPB: <b>${sn}/${sd}</b>`]},
      concept:{en:'Write decimal over 10 or 100, then simplify using GCF.',id:'Tulis desimal per 10 atau 100, lalu sederhanakan dengan FPB.'}};
  },

  ftp:()=>{
    const pool=[[1,2,50],[1,4,25],[3,4,75],[1,5,20],[2,5,40],[3,5,60],[4,5,80],[1,10,10],[3,10,30],[7,10,70],[9,10,90],[1,20,5],[1,25,4],[2,25,8],[1,100,1],[3,20,15]];
    const[n,d,pct]=pickFreshConv(pool,item=>item[2]/100);
    const cor=`${pct}%`;
    const w1=`${pct+10<=100?pct+10:pct-10}%`;
    const w2=`${pct-10>0?pct-10:pct+5}%`;
    const w3=`${pct+5<=100?pct+5:pct-5}%`;
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'Convert the fraction to a percentage:',id:'Ubah pecahan berikut menjadi persen:'},
      math:frac(n,d),opts,ans,
      steps:{en:[`${frac(n,d)} × 100 = <b>${n*100/d}</b>`,`Answer: <b>${pct}%</b>`],
             id:[`${frac(n,d)} × 100 = <b>${n*100/d}</b>`,`Jawaban: <b>${pct}%</b>`]},
      concept:{en:'Multiply fraction by 100 to get the percentage.',id:'Kalikan pecahan dengan 100 untuk mendapatkan persen.'}};
  },

  ptf:()=>{
    const pool=[[10,1,10],[20,1,5],[25,1,4],[40,2,5],[50,1,2],[60,3,5],[75,3,4],[80,4,5],[5,1,20],[30,3,10],[70,7,10],[8,2,25],[15,3,20],[35,7,20],[45,9,20],[90,9,10]];
    const[pct,sn,sd]=pickFreshConv(pool,item=>item[0]/100);
    const cor=frac(sn,sd);
    const w1=frac(pct,100);
    const w2=frac(sn+1,sd);
    const w3=frac(sn,sd+5>20?sd-2:sd+5);
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'Convert the percentage to a fraction in its simplest form:',id:'Ubah persen berikut menjadi pecahan paling sederhana:'},
      math:`<b>${pct}%</b>`,opts,ans,
      steps:{en:[`Write as fraction: <b>${pct}/100</b>`,`Simplify: <b>${sn}/${sd}</b>`],
             id:[`Tulis sebagai pecahan: <b>${pct}/100</b>`,`Sederhanakan: <b>${sn}/${sd}</b>`]},
      concept:{en:'Write % over 100, then simplify by GCF.',id:'Tulis % per 100, lalu sederhanakan dengan FPB.'}};
  },

  dtp:()=>{
    const pool=[0.1,0.2,0.25,0.3,0.4,0.5,0.6,0.7,0.75,0.8,0.9,0.05,0.15,0.35,0.45,0.55,0.65,0.85,0.95,0.04,0.08,0.12,0.16,0.24,0.36];
    const dec=pickFreshConv(pool,item=>item);const pct=Math.round(dec*100);
    const cor=`${pct}%`;
    const w1=`${pct+10<=100?pct+10:pct-10}%`;
    const w2=`${+(dec*10).toFixed(1)}%`;
    const w3=`${pct-5>0?pct-5:pct+5}%`;
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'Convert the decimal to a percentage:',id:'Ubah desimal berikut menjadi persen:'},
      math:`<b>${dec}</b>`,opts,ans,
      steps:{en:[`Multiply by 100: <b>${dec} × 100 = ${pct}</b>`,`Answer: <b>${pct}%</b>`],
             id:[`Kalikan dengan 100: <b>${dec} × 100 = ${pct}</b>`,`Jawaban: <b>${pct}%</b>`]},
      concept:{en:'Multiply decimal by 100 and add the % sign.',id:'Kalikan desimal dengan 100 dan tambahkan tanda %.'}};
  },

  ftd2:()=>{
    const pool=[[3,8,'0.375'],[5,8,'0.625'],[7,8,'0.875'],[1,8,'0.125'],[7,20,'0.35'],[9,20,'0.45'],[11,20,'0.55'],[13,20,'0.65'],[17,20,'0.85'],[3,25,'0.12'],[4,25,'0.16'],[6,25,'0.24'],[7,25,'0.28'],[9,25,'0.36'],[1,50,'0.02'],[3,50,'0.06'],[7,50,'0.14'],[19,20,'0.95']];
    const[n,d,dec]=pickFreshConv(pool,item=>parseFloat(item[2]));const decN=parseFloat(dec);
    const w1=String(+(decN+0.1).toFixed(3)).replace(/0+$/,'').replace(/\.$/,'');
    const w2=String(+(decN-0.05>0?decN-0.05:decN+0.125).toFixed(3)).replace(/0+$/,'').replace(/\.$/,'');
    const w3=String(+(n*10/d).toFixed(3)).replace(/0+$/,'').replace(/\.$/,'');
    const{opts,ans}=mkOpts(dec,[w1,w2,w3]);
    return{text:{en:'Convert the fraction to a decimal:',id:'Ubah pecahan berikut menjadi desimal:'},
      math:frac(n,d),opts,ans,
      steps:{en:[`Divide: <b>${n} ÷ ${d} = ${dec}</b>`],id:[`Bagi: <b>${n} ÷ ${d} = ${dec}</b>`]},
      concept:{en:'Divide numerator ÷ denominator.',id:'Bagi pembilang ÷ penyebut.'}};
  },

     isWord:true,math:null,opts:[{l:'A',v:'1.25 m'},{l:'B',v:'1.5 m'},{l:'C',v:'1.75 m'},{l:'D',v:'2.0 m'}],ans:'B',

  // ── Chapter 1 extra ─────────────────────────────────────────
  fdiv:()=>{
    const d=pickA([2,3,4,5,6,8,10]);
    const n=ri(1,d-1);
    const whole=pickA([2,3,4,5]);
    const[sn,sd]=sfrac(n,d*whole);
    const cor=sd===1?String(sn):frac(sn,sd);
    const w1=frac(n*whole,d);
    const w2=sd===1?frac(n,d*whole+1):frac(sn,sd+1);
    const w3=frac(n,d);
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'What is the result?',id:'Berapakah hasilnya?'},
      math:`${frac(n,d)} ÷ ${whole}`,opts,ans,
      steps:{en:[`Dividing by ${whole} means multiplying by ${frac(1,whole)}`,`${frac(n,d)} × ${frac(1,whole)} = ${frac(n,d*whole)}`,sn!==n||sd!==d*whole?`Simplify: <b>${cor}</b>`:`Answer: <b>${cor}</b>`],
             id:[`Membagi dengan ${whole} = mengalikan dengan ${frac(1,whole)}`,`${frac(n,d)} × ${frac(1,whole)} = ${frac(n,d*whole)}`,sn!==n||sd!==d*whole?`Sederhanakan: <b>${cor}</b>`:`Jawaban: <b>${cor}</b>`]},
      concept:{en:'To divide a fraction by a whole number, multiply by its reciprocal.',id:'Membagi pecahan dengan bilangan bulat = kalikan dengan kebalikannya.'}};
  },

  // ── Chapter 2 extra ─────────────────────────────────────────
  ord:()=>{
    const vals=[[0.75,'¾',75],[0.5,'½',50],[0.25,'¼',25],[0.4,'2/5',40],[0.6,'3/5',60],[0.8,'4/5',80],[0.2,'1/5',20],[0.3,'3/10',30],[0.7,'7/10',70],[0.1,'1/10',10]];
    const types=['frac','dec','pct'];
    const pool=shuffA([...vals]).slice(0,3);
    const items=pool.map(([v,s,p])=>{const tp=pickA(types);return{v,label:tp==='frac'?s:tp==='dec'?String(v):`${p}%`};});
    const sorted=[...items].sort((x,y)=>y.v-x.v);
    const[a,b,c]=sorted;
    const cor=`${a.label}, ${b.label}, ${c.label}`;
    const w1=`${c.label}, ${b.label}, ${a.label}`;
    const w2=`${a.label}, ${c.label}, ${b.label}`;
    const w3=`${b.label}, ${a.label}, ${c.label}`;
    const{opts,ans}=mkOpts(cor,[w1,w2,w3]);
    return{text:{en:'Which shows these values arranged from greatest to least?',id:'Manakah urutan nilai-nilai berikut dari terbesar ke terkecil?'},
      math:items.map(x=>x.label).join(' &nbsp;,&nbsp; '),opts,ans,
      steps:{en:[`Convert to decimals: ${items.map(x=>`${x.label} = ${x.v}`).join(', ')}`,`Greatest to least: <b>${cor}</b>`],
             id:[`Ubah ke desimal: ${items.map(x=>`${x.label} = ${x.v}`).join(', ')}`,`Terbesar ke terkecil: <b>${cor}</b>`]},
      concept:{en:'Convert all to decimals to compare, then arrange greatest to least.',id:'Ubah semua ke desimal untuk dibandingkan, lalu urutkan dari terbesar ke terkecil.'}};
  },

  // ── Chapter 3 ────────────────────────────────────────────────
  dadd:()=>{
    const pairs=[[1.2,0.8],[2.5,1.3],[0.7,0.6],[3.4,1.5],[0.35,0.45],[1.75,0.25],[2.4,0.75],[0.65,0.35],[4.2,0.8],[1.5,2.5],[0.8,0.9],[3.5,0.75],[0.45,0.55],[2.25,0.75],[1.8,1.4]];
    const[a,b]=pickA(pairs);
    const cor=+(a+b).toFixed(4);
    const w1=+(cor+0.1).toFixed(2);
    const w2=+(cor-0.1>0?cor-0.1:cor+0.2).toFixed(2);
    const w3=+Math.abs(a-b).toFixed(4);
    const{opts,ans}=mkOpts(String(cor),[String(w1),String(w2),String(w3)]);
    return{text:{en:'What is the sum?',id:'Berapakah hasil penjumlahannya?'},
      math:`<b>${a} + ${b}</b>`,opts,ans,
      steps:{en:[`Line up decimal points`,`${a} + ${b} = <b>${cor}</b>`],
             id:[`Sejajarkan titik desimal`,`${a} + ${b} = <b>${cor}</b>`]},
      concept:{en:'Line up decimal points, then add digit by digit.',id:'Sejajarkan titik desimal, lalu jumlahkan digit per digit.'}};
  },

  dsub:()=>{
    const pairs=[[2.0,0.7],[3.5,1.2],[5.0,2.4],[4.2,1.5],[3.0,0.8],[2.75,0.25],[6.5,2.5],[10.0,3.4],[7.0,2.75],[5.5,1.25],[4.8,0.9],[8.0,3.5],[3.25,1.75],[9.0,4.6],[6.4,2.8]];
    const[a,b]=pickA(pairs);
    const cor=+(a-b).toFixed(4);
    const w1=+(cor+0.1).toFixed(2);
    const w2=+(cor-0.1>0?cor-0.1:cor+0.2).toFixed(2);
    const w3=+(a+b).toFixed(4);
    const{opts,ans}=mkOpts(String(cor),[String(w1),String(w2),String(w3)]);
    return{text:{en:'What is the difference?',id:'Berapakah selisihnya?'},
      math:`<b>${a} − ${b}</b>`,opts,ans,
      steps:{en:[`Line up decimal points`,`${a} − ${b} = <b>${cor}</b>`],
             id:[`Sejajarkan titik desimal`,`${a} − ${b} = <b>${cor}</b>`]},
      concept:{en:'Line up decimal points and subtract, borrowing if needed.',id:'Sejajarkan titik desimal lalu kurangkan, pinjam jika perlu.'}};
  },

  dmul:()=>{
    const pairs=[[0.2,3],[0.3,4],[0.5,6],[0.4,5],[0.25,4],[0.75,8],[1.5,4],[2.5,6],[0.8,5],[1.25,8],[0.6,5],[3.5,4],[0.15,6],[0.45,4],[1.2,5],[2.4,3]];
    const[a,b]=pickA(pairs);
    const cor=+(a*b).toFixed(4);
    const w1=+(cor+a).toFixed(4);
    const w2=+(cor-a>0?cor-a:cor+b).toFixed(4);
    const w3=+(a+b).toFixed(2);
    const{opts,ans}=mkOpts(String(cor),[String(w1),String(w2),String(w3)]);
    const dp=(String(a).split('.')[1]||'').length;
    const aInt=Math.round(a*Math.pow(10,dp));
    return{text:{en:'What is the product?',id:'Berapakah hasil perkaliannya?'},
      math:`<b>${a} × ${b}</b>`,opts,ans,
      steps:{en:[`Ignore decimal: <b>${aInt} × ${b} = ${aInt*b}</b>`,`Place ${dp} decimal place(s): <b>${cor}</b>`],
             id:[`Abaikan desimal: <b>${aInt} × ${b} = ${aInt*b}</b>`,`Tempatkan ${dp} angka desimal: <b>${cor}</b>`]},
      concept:{en:'Multiply as whole numbers, then place the decimal point.',id:'Kalikan sebagai bilangan bulat, lalu letakkan titik desimal.'}};
  },
};

    nCorrect++;
    if(!isExam){
      const bonus=streak>=3?2:0;
      const gain=Math.max(4,Math.round((100-score)*0.2))+bonus;
      score=Math.min(100,score+gain);
    }
  } else {
    streak=0;
    topicStats[topic].wrong++;
    nWrong++;
    if(!isExam){
      const loss=Math.max(3,Math.round(score*0.13));
      score=Math.max(0,score-loss);
    }
  }
  // In exam mode, score stays at 0 until all questions done
  if(!isExam){
    document.getElementById('ssVal').textContent=score;
    document.getElementById('barFill').style.width=score+'%';
    document.getElementById('barPct').textContent=score;
    document.getElementById('ringFill').style.strokeDashoffset=175.9*(1-score/100);
  }
  document.getElementById('sCorrect').textContent=nCorrect;
  document.getElementById('sWrong').textContent=nWrong;
  document.getElementById('sTotal').textContent=nCorrect+nWrong;
}

// ─────────────────────────────────────────────────────────────
// Progress dots
// ─────────────────────────────────────────────────────────────
function renderDots(){
  const c=document.getElementById('progDots');
  c.innerHTML='';
  queue.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(results[i]==='correct'?' done':results[i]==='wrong'?' wrong-dot':i===cur?' cur':'');
    c.appendChild(d);
  });
}

// ─────────────────────────────────────────────────────────────
// Main render
// ─────────────────────────────────────────────────────────────
function render(){
  if(cur>=queue.length){renderDone();return}
  answered=false;
  hintUsed=false;
  selectedAnswer=null;
  renderDots();
  renderMCQ(queue[cur]);
}

// ─────────────────────────────────────────────────────────────
// Render MCQ
// ─────────────────────────────────────────────────────────────
function renderMCQ(q){
  const sectionHtml = q.section
    ? `<div class="section-banner">📚 ${t(q.section)}</div>`
    : '';

  const mathHtml = q.math
    ? `<div class="math-big">${q.math}</div>`
    : '';

  const extraHtml = q.extra || '';

  const wordWrap = q.isWord
    ? `<div class="word-box">${t(q.text)}${extraHtml}</div>`
    : `<div class="q-text">${t(q.text)}</div>${mathHtml}`;

  const optsHtml = q.opts.map(o=>`
    <button class="opt" data-l="${o.l}" onclick="pick('${o.l}')">
      <span class="opt-lbl">${o.l}</span>
      <span>${typeof o.v==='string'?o.v:t(o.v)}</span>
    </button>`).join('');

  const hintLabel = lang==='en'?'💡 Show Hint':'💡 Minta Petunjuk';
  const nextLabel = lang==='en'?'Next Question →':'Soal Berikutnya →';

  const stats=topicStats[q.topic]||{wrong:0,correct:0};
  const attempts=stats.wrong+stats.correct;
  const errRate=attempts>0?stats.wrong/attempts:0;
  const isWeakRepeat=q._isRepeat&&errRate>0.4;
  const weakBadge=isWeakRepeat
    ?`<div class="weak-badge">🔁 ${lang==='en'?'Weak area — keep practising!':'Area lemah — terus berlatih!'}</div>`:'';

  const roundBadge=round>1
    ?`<div class="round-badge">🔄 ${lang==='en'?`Round ${round} · Adaptive Practice`:`Putaran ${round} · Latihan Adaptif`}</div>`:'';

  document.getElementById('qArea').innerHTML=`
    ${sectionHtml}
    <div class="qcard">
      ${roundBadge}${weakBadge}
      <span class="q-tag ${q.section?'section-tag':''}">${t(q.tag)}</span>
      ${wordWrap}
      <div class="options">${optsHtml}</div>
      ${isExam
        ? `<button class="submit-btn" id="submitBtn" onclick="submitAnswer()">${lang==='en'?'Submit →':'Kirim →'}</button>`
        : `<button class="hint-btn" id="hintBtn" onclick="showHint()">${hintLabel}</button>`}
      <div class="feedback" id="fb"></div>
      <button class="next-btn" id="nxtBtn" onclick="next()">${nextLabel}</button>
    </div>`;
}

// ─────────────────────────────────────────────────────────────
// Pick answer
// ─────────────────────────────────────────────────────────────
function pick(l){
  if(answered) return;

  // ── Exam mode: select only, wait for Submit ────────────────────
  if(isExam){
    selectedAnswer=l;
    document.querySelectorAll('.opt').forEach(b=>{
      b.classList.toggle('selected', b.getAttribute('data-l')===l);
    });
    document.getElementById('submitBtn').classList.add('show');
    return;
  }

  // ── Practice mode: immediate submission ───────────────────────
  answered=true;
  const q=queue[cur];
  const ok=l===q.ans;
  if(!hintUsed) applyScore(ok);
  results[cur]=ok?'correct':'wrong';
  renderDots();

  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const bl=b.getAttribute('data-l');
    if(bl===q.ans) b.classList.add('correct');
    else if(bl===l&&!ok) b.classList.add('wrong');
  });

  const fb=document.getElementById('fb');
  const hintBtn=document.getElementById('hintBtn');
  const stHtml=t(q.steps).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('');
  const conceptBox=`<div class="concept-box">💡 ${t(q.concept)}</div>`;

  if(ok){
    const sm=streak>=3?`<span class="streak">🔥 ${streak}${lang==='en'?' in a row!':' Berturut-turut!'}</span>`:'';
    fb.className='feedback show correct';
    if(score>=100){
      fb.innerHTML=`<strong>🏆 ${lang==='en'?'Perfect Score! Chapter mastered!':'Sempurna! Bab ini sudah dikuasai!'}</strong>${conceptBox}`;
      confetti();
      if(hintBtn) hintBtn.style.display='none';
      setTimeout(()=>{window.scrollTo({top:0,behavior:'smooth'});renderDone();},1600);
      return;
    }
    fb.innerHTML=`<strong>${lang==='en'?'✅ Correct! Well done!':'✅ Benar! Keren!'} ${sm}</strong>${conceptBox}`;
    confetti();
  } else {
    const topicLabel=`<span style="background:#fce4e4;color:#d63031;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px">${t(topicNames[q.topic])}</span>`;
    fb.className='feedback show wrong';
    fb.innerHTML=`<strong>${lang==='en'?'❌ Not quite.':'❌ Belum tepat.'} ${topicLabel}</strong>
      <div class="steps" style="margin-top:10px">${stHtml}</div>${conceptBox}`;
  }
  if(hintBtn) hintBtn.style.display='none';
  document.getElementById('nxtBtn').classList.add('show');
}

// ─────────────────────────────────────────────────────────────
// Submit (exam mode only)
// ─────────────────────────────────────────────────────────────
function submitAnswer(){
  if(!selectedAnswer||answered) return;
  answered=true;
  const l=selectedAnswer;
  const q=queue[cur];
  const ok=l===q.ans;
  applyScore(ok);
  results[cur]=ok?'correct':'wrong';
  renderDots();

  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    b.classList.remove('selected');
    const bl=b.getAttribute('data-l');
    if(bl===q.ans) b.classList.add('correct');
    else if(bl===l&&!ok) b.classList.add('wrong');
  });
  document.getElementById('submitBtn').classList.remove('show');

  if(ok){
    if(streak>=3) confetti();
    setTimeout(()=>next(), 500);
  } else {
    const fb=document.getElementById('fb');
    const stHtml=t(q.steps).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('');
    const conceptBox=`<div class="concept-box">💡 ${t(q.concept)}</div>`;
    const topicLabel=`<span style="background:#fce4e4;color:#d63031;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:6px">${t(topicNames[q.topic])}</span>`;
    fb.className='feedback show wrong';
    fb.innerHTML=`<strong>❌ ${lang==='en'?'Incorrect.':'Salah.'} ${topicLabel}</strong>
      <div class="steps" style="margin-top:10px">${stHtml}</div>${conceptBox}`;
    document.getElementById('nxtBtn').classList.add('show');
  }
}

// ─────────────────────────────────────────────────────────────
// Hint
// ─────────────────────────────────────────────────────────────
function showHint(){
  hintUsed=true;
  const hintBtn=document.getElementById('hintBtn');
  hintBtn.textContent=lang==='en'?'💡 Hint shown — question not scored':'💡 Petunjuk aktif — soal ini tidak dinilai';
  hintBtn.disabled=true;
  const q=queue[cur];

  // Count as wrong for adaptive tracking — student needed help on this topic
  const topic=q.topic;
  if(topicStats[topic]) topicStats[topic].wrong++;
  nWrong++;
  document.getElementById('sWrong').textContent=nWrong;

  const stHtml=t(q.steps).map((s,i)=>`<div class="step"><div class="step-num orange">${i+1}</div><div>${s}</div></div>`).join('');
  const fb=document.getElementById('fb');
  fb.className='feedback show hint';
  fb.innerHTML=`<strong>💡 ${lang==='en'?'Step-by-step hint:':'Petunjuk Langkah demi Langkah:'}</strong>
    <div class="steps" style="margin-top:10px">${stHtml}</div>
    <div style="margin-top:8px;font-size:.79rem;opacity:.75">⚠️ ${lang==='en'?'This question won\'t affect your SmartScore since you used a hint.':'Soal ini tidak dihitung ke SmartScore karena kamu melihat petunjuk.'}</div>`;
}

// ─────────────────────────────────────────────────────────────
// Navigation
// ─────────────────────────────────────────────────────────────
function next(){
  cur++;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─────────────────────────────────────────────────────────────
// Queue builders
// ─────────────────────────────────────────────────────────────
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function getActiveParts(){
  const ch=parseInt(new URLSearchParams(window.location.search).get('ch'))||0;
  return ch?Parts.filter(p=>p.ch===ch):Parts;
}

function buildInitialQueue(){
  _usedVals.clear();
  Object.keys(_usedWordIdx).forEach(k=>_usedWordIdx[k].clear());
  let qNum=1;
  const result=getActiveParts().flatMap(part=>{
    const picked=part.topics.map(topic=>{
      const q=Generators[topic]();
      q.topic=topic;
      return q;
    });
    shuffle(picked);
    picked[0].section=part.section;
    picked.forEach(q=>{ q.tag={en:`Question ${qNum}`,id:`Soal ${qNum}`}; qNum++; });
    return picked;
  });
  if(isExam){
    shuffle(result);
    const tot=result.length;
    result.forEach((q,i)=>{ q.tag={en:`Q${i+1} of ${tot}`,id:`S${i+1} dari ${tot}`}; });
  }
  return result;
}

function buildAdaptiveQueue(){
  _usedVals.clear();
  Object.keys(_usedWordIdx).forEach(k=>_usedWordIdx[k].clear());
  let qNum=1;
  const newQueue=[];
  getActiveParts().forEach(part=>{
    const partQs=[];
    part.topics.forEach(topic=>{
      const s=topicStats[topic]||{wrong:0,correct:0};
      const att=s.wrong+s.correct;
      const err=att>0?s.wrong/att:0;
      const copies=err>0.66?3:err>0.33?2:1;
      for(let i=0;i<copies;i++){
        const q=Generators[topic]();
        q.topic=topic;
        q._isRepeat=i>0;
        partQs.push(q);
      }
    });
    shuffle(partQs);
    if(partQs.length) partQs[0].section=part.section;
    newQueue.push(...partQs);
  });
  newQueue.forEach((q,i)=>{ q.tag={en:`Question ${qNum}`,id:`Soal ${qNum}`}; qNum++; });
  const scored=Object.keys(topicStats).map(topic=>{
    const s=topicStats[topic];
    const att=s.wrong+s.correct;
    return{topic,errorRate:att>0?s.wrong/att:0,attempts:att};
  }).filter(x=>x.attempts>0).sort((a,b)=>b.errorRate-a.errorRate);
  return{queue:newQueue,scored};
}

// ─────────────────────────────────────────────────────────────
// Completion
// ─────────────────────────────────────────────────────────────
function renderDone(){
  document.getElementById('progDots').innerHTML='';
  const total=nCorrect+nWrong;
  const acc=total>0?Math.round(nCorrect/total*100):0;
  // Exam: final score = accuracy over all questions, revealed only now
  if(isExam){
    score=acc;
    document.getElementById('ssVal').textContent=score;
    document.getElementById('barFill').style.width=score+'%';
    document.getElementById('barPct').textContent=score;
    document.getElementById('ringFill').style.strokeDashoffset=175.9*(1-score/100);
  }
  let trophy='📚',msg={en:'Keep studying — you can do it!',id:'Terus belajar ya, kamu pasti bisa!'};
  if(isExam){
    if(acc>=90){trophy='🏆';msg={en:'Outstanding! Excellent exam result!',id:'Luar biasa! Hasil ujian yang sangat baik!'};}
    else if(acc>=70){trophy='⭐';msg={en:'Good result! Keep studying!',id:'Hasil bagus! Terus belajar ya!'};}
    else if(acc>=50){trophy='💪';msg={en:'Fair result — more practice needed!',id:'Lumayan — perlu lebih banyak latihan!'};}
    else{trophy='📚';msg={en:'Keep studying — you\'ll get there!',id:'Terus semangat belajar!'};}
  } else {
    if(score>=100){trophy='🏆';msg={en:'Perfect Score! You\'ve fully mastered this chapter!',id:'Sempurna! Kamu sudah menguasai bab ini sepenuhnya!'};}
    else if(score>=80){trophy='🏆';msg={en:'Amazing! You\'ve mastered this topic!',id:'Luar biasa! Kamu sudah menguasai materi ini!'};}
    else if(score>=50){trophy='⭐';msg={en:'Good job! Keep practising!',id:'Bagus! Terus semangat berlatih ya!'};}
    else if(score>=30){trophy='💪';msg={en:'Getting there! A bit more practice!',id:'Hampir! Sedikit lagi berlatih!'};}
  }

  const topicScores=Object.keys(topicStats)
    .map(tp=>({tp,s:topicStats[tp],att:topicStats[tp].wrong+topicStats[tp].correct}))
    .filter(x=>x.att>0)
    .sort((a,b)=>(b.s.wrong/b.att)-(a.s.wrong/a.att));

  const hasWeakness=topicScores.some(x=>x.s.wrong/x.att>0.33);

  const weakRowsHtml=topicScores.map(({tp,s,att})=>{
    const errPct=Math.round(s.wrong/att*100);
    const isWeak=errPct>33;
    return`<div class="weak-row${isWeak?'':' strong-row'}">
      <span class="topic-name">${isWeak?'⚠️':'✅'} ${t(topicNames[tp])}</span>
      <div class="weak-bar-wrap"><div class="weak-bar-fill" style="width:${errPct}%"></div></div>
      <span class="weak-pct">${errPct}% ${lang==='en'?'wrong':'salah'}</span>
    </div>`;
  }).join('');

  const weakReport=topicScores.length>0?`
    <div class="weak-report">
      <h3>📊 ${lang==='en'?'Performance by Topic':'Performa per Topik'}</h3>
      ${weakRowsHtml}
    </div>`:'';

  const adaptiveBtn=(!isExam && hasWeakness)?`
    <button class="practice-btn" onclick="startAdaptive()">
      🎯 ${lang==='en'?'Practice Weak Areas':'Latih Area Lemah'}
    </button>`:'';

  document.getElementById('qArea').innerHTML=`
  <div class="qcard completion">
    <div class="trophy">${trophy}</div>
    <h2>${isExam?(lang==='en'?'Exam Complete!':'Ujian Selesai!'):'SmartScore: '+score}</h2>
    <p>${t(msg)}</p>
    <div class="stats-row" style="max-width:360px;margin:0 auto 16px">
      <div class="stat-box"><div class="val val-g">${nCorrect}</div><div class="lbl">${lang==='en'?'Correct':'Benar'}</div></div>
      <div class="stat-box"><div class="val val-r">${nWrong}</div><div class="lbl">${lang==='en'?'Wrong':'Salah'}</div></div>
      <div class="stat-box"><div class="val val-b">${acc}%</div><div class="lbl">${lang==='en'?'Accuracy':'Akurasi'}</div></div>
    </div>
    ${weakReport}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">
      ${adaptiveBtn}
      <button class="restart-btn" onclick="restart()">🔄 ${lang==='en'?'Start Over':'Mulai Ulang'}</button>
    </div>
  </div>`;
  if(score>=70) confetti();
}

function startAdaptive(){
  const {queue:newQ}=buildAdaptiveQueue();
  queue=newQ;
  cur=0;
  results=new Array(queue.length).fill(null);
  nCorrect=0;nWrong=0;streak=0;answered=false;
  round++;
  ['sCorrect','sWrong','sTotal'].forEach(id=>document.getElementById(id).textContent='0');
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(){
  Object.keys(topicStats).forEach(k=>{ topicStats[k]={wrong:0,correct:0}; });
  score=0;nCorrect=0;nWrong=0;cur=0;streak=0;round=1;isAdaptive=false;
  queue=buildInitialQueue();
  results=new Array(queue.length).fill(null);
  answered=false;
  ['ssVal','sCorrect','sWrong','sTotal','barPct'].forEach(id=>document.getElementById(id).textContent='0');
  document.getElementById('barFill').style.width='0%';
  document.getElementById('ringFill').style.strokeDashoffset='175.9';
  render();
}

// ─────────────────────────────────────────────────────────────
// Confetti
// ─────────────────────────────────────────────────────────────
function confetti(){
  const wrap=document.getElementById('confWrap');
  const cols=['#4f8ef7','#6c5ce7','#00b894','#fdcb6e','#d63031','#fd79a8','#00cec9'];
  for(let i=0;i<65;i++){
    setTimeout(()=>{
      const p=document.createElement('div');
      p.className='cp';
      p.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${7+Math.random()*9}px;height:${7+Math.random()*9}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${1.2+Math.random()*.8}s;animation-delay:${Math.random()*.4}s`;
      wrap.appendChild(p);
      setTimeout(()=>p.remove(),2500);
    },i*18);
  }
}

// ─────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────
queue=buildInitialQueue();
results=new Array(queue.length).fill(null);
updateChapterHeader();
render();
</script>
