<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Practice — AzScience</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#e8f4ef 0%,#eaf2f7 100%);min-height:100vh;display:flex;flex-direction:column;color:#1a1a2e}

/* Header */
.hdr{background:linear-gradient(135deg,#00b894,#0ea5e9 60%,#6366f1);color:#fff;padding:18px 20px;position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr-back{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:18px;font-size:.78rem;font-weight:800;text-decoration:none}
.hdr-back:hover{background:rgba(255,255,255,.28)}
.hdr-title{font-size:1.1rem;font-weight:900;letter-spacing:-.3px;flex:1}
.hdr-meta{font-size:.78rem;font-weight:700;opacity:.9;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:16px}
.lang-toggle{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:18px;font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit}
.lang-toggle:hover{background:rgba(255,255,255,.28)}

/* Progress bar */
.progress-wrap{background:#fff;padding:10px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.progress{display:flex;gap:4px;align-items:center}
.progress-bar{flex:1;height:8px;background:#d4eadf;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#00b894,#0ea5e9);border-radius:5px;transition:width .35s ease}
.progress-text{font-size:.78rem;font-weight:800;color:#00b894;min-width:75px;text-align:right}

/* Score chips */
.score-row{display:flex;gap:10px;margin:14px auto 0;max-width:720px;padding:0 16px;flex-wrap:wrap}
.score-chip{flex:1;min-width:0;background:#fff;border-radius:14px;padding:10px 12px;text-align:center;border:1.5px solid #e8ecef;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#666}
.score-chip strong{display:block;font-size:1.3rem;letter-spacing:-.5px;margin-bottom:2px;color:#1a1a2e;text-transform:none}
.score-chip.correct{border-color:#00b894;background:#f0fff8}
.score-chip.correct strong{color:#00b894}
.score-chip.wrong{border-color:#d63031;background:#fff5f5}
.score-chip.wrong strong{color:#d63031}
.score-chip.answered{border-color:#6366f1;background:#eef2ff}
.score-chip.answered strong{color:#6366f1}

/* Main quiz container */
.main{max-width:720px;margin:18px auto 0;padding:0 16px 80px;width:100%}
.q-card{background:#fff;border-radius:24px;padding:30px 26px 24px;box-shadow:0 8px 32px rgba(0,184,148,.13)}
.q-badge{display:inline-block;background:#eef2ff;color:#6366f1;font-size:.7rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:14px;margin-bottom:14px}
.q-badge.mcq{background:#eef3ff;color:#4f8ef7}
.q-badge.tf{background:#fff5e8;color:#e17055}
.q-badge.fill{background:#f0eeff;color:#6c5ce7}
.q-badge.essay{background:#e8fff8;color:#00b894}
.q-badge.fill_bank{background:#fff0f5;color:#d6336c}
.q-badge.multi_check{background:#e8f4ff;color:#1971c2}
.q-badge.scenario{background:#fff8e8;color:#b7760a}
.q-badge.match_pairs{background:#f0eeff;color:#6c5ce7}
.q-badge.cycle_diagram{background:#e8f9ff;color:#0ea5e9}

/* Match pairs */
.mp-instr{font-size:.85rem;color:#666;font-weight:700;margin-bottom:10px}
.mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mp-col-title{font-size:.72rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#6c5ce7;margin-bottom:6px;text-align:center}
.mp-card{background:#fff;border:2px solid #e8ecef;border-radius:12px;padding:10px 12px;cursor:pointer;font-size:.9rem;font-weight:600;transition:all .15s;text-align:left;font-family:inherit;color:inherit;display:block;width:100%;margin-bottom:8px;line-height:1.4}
.mp-card:hover:not(:disabled){border-color:#6c5ce7;background:#faf9ff;transform:translateY(-1px)}
.mp-card.selected{border-color:#6c5ce7;background:#eef2ff;box-shadow:0 0 0 3px rgba(108,92,231,.18)}
.mp-card.matched{border-color:#00b894;background:#f0fff8;cursor:not-allowed;opacity:.85}
.mp-card.matched::before{content:'✓ ';color:#00b894;font-weight:900}
.mp-card.shake{animation:mp-shake .35s ease}
.mp-card:disabled{cursor:not-allowed}
@keyframes mp-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mp-progress{font-size:.78rem;font-weight:800;color:#6c5ce7;text-align:center;margin-top:10px}

/* Cycle diagram */
.cd-wrap{background:#f8faff;border:1.5px solid #d8e4ff;border-radius:14px;padding:14px;margin-bottom:12px}
.cd-svg{display:block;margin:0 auto;width:100%;max-width:460px;height:auto}
.cd-node{fill:#fff;stroke:#0ea5e9;stroke-width:2.5}
.cd-node.blank{fill:#fff8e8;stroke:#f9ca24;stroke-dasharray:6 4}
.cd-node.filled{fill:#f0fff8;stroke:#00b894;stroke-dasharray:none}
.cd-node.wrong{fill:#fff5f5;stroke:#d63031;stroke-dasharray:none}
.cd-node.active{stroke-width:4;filter:drop-shadow(0 0 6px rgba(249,202,36,.6))}
.cd-label{font-family:'Segoe UI',system-ui,sans-serif;font-size:11px;font-weight:700;fill:#1a1a2e;pointer-events:none}
.cd-label.placeholder{fill:#b7760a;font-style:italic}
.cd-arrow-label{font-family:'Segoe UI',system-ui,sans-serif;font-size:10px;font-weight:800;fill:#6366f1;pointer-events:none}
.cd-hit{fill:transparent;cursor:pointer}
.cd-hit.locked{cursor:not-allowed}

/* Word bank chips */
.bank-wrap{background:#fff8e8;border:1.5px solid #f9ca24;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.bank-title{font-size:.72rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#b7760a;margin-bottom:8px}
.bank-chips{display:flex;flex-wrap:wrap;gap:6px}
.bank-chip{background:#fff;border:1.5px solid #f9ca24;color:#7c5e02;padding:6px 12px;border-radius:14px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.bank-chip:hover:not(:disabled){background:#fff3c4;transform:translateY(-1px)}
.bank-chip:disabled{cursor:not-allowed;opacity:.5}
.bank-chip.used{background:#e8ecef;border-color:#bbb;color:#999;text-decoration:line-through}

/* Multi-check (checkboxes) */
.mc-instr{font-size:.85rem;color:#666;font-weight:700;margin-bottom:8px}
.mc-opt{background:#fff;border:2px solid #e8ecef;border-radius:14px;padding:12px 16px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;gap:12px;transition:all .15s;font-family:inherit;text-align:left;width:100%;color:inherit;margin-bottom:8px}
.mc-opt:hover:not(.locked){border-color:#1971c2;background:#e8f4ff}
.mc-box{width:24px;height:24px;border-radius:6px;border:2px solid #c0c8d0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900;color:#fff;background:#fff}
.mc-opt.checked .mc-box{background:#1971c2;border-color:#1971c2}
.mc-opt.checked .mc-box::after{content:'✓'}
.mc-opt.correct{border-color:#00b894;background:#f0fff8}
.mc-opt.correct .mc-box{background:#00b894;border-color:#00b894}
.mc-opt.correct .mc-box::after{content:'✓'}
.mc-opt.wrong{border-color:#d63031;background:#fff5f5}
.mc-opt.wrong .mc-box{background:#d63031;border-color:#d63031}
.mc-opt.wrong .mc-box::after{content:'✗'}
.mc-opt.missed{border-color:#f9ca24;background:#fffbe8}
.mc-opt.missed .mc-box{background:#f9ca24;border-color:#f9ca24}
.mc-opt.missed .mc-box::after{content:'!'}
.mc-opt.locked{cursor:not-allowed}

/* Scenario */
.scenario-diagram{display:block;margin:10px auto 14px;max-width:100%;background:#fff;border:1.5px solid #e8ecef;border-radius:12px;padding:8px}
.scenario-part{background:#fafbff;border-left:4px solid #6366f1;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.scenario-part-label{font-size:.78rem;font-weight:900;color:#6366f1;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.scenario-part-q{font-size:.96rem;line-height:1.5;margin-bottom:10px;font-weight:600}
.scenario-part .opts{margin-top:6px}
.scenario-part .opt{padding:10px 14px;font-size:.9rem}
.scenario-part .fill-row{margin-top:4px}
.scenario-part .essay-area{min-height:70px}
.scenario-part-result{margin-top:8px;font-size:.86rem;font-weight:700;padding:6px 10px;border-radius:8px;display:none}
.scenario-part-result.show{display:inline-block}
.scenario-part-result.ok{background:#f0fff8;color:#00b894}
.scenario-part-result.bad{background:#fff5f5;color:#d63031}
.scenario-check-all{background:linear-gradient(135deg,#00b894,#0ea5e9);color:#fff;border:none;border-radius:14px;padding:12px 24px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;width:100%;margin-top:6px}
.scenario-check-all:hover:not(:disabled){opacity:.9}
.scenario-check-all:disabled{cursor:not-allowed;opacity:.5}

.q-text{font-size:1.05rem;line-height:1.6;background:#f0fff8;border-left:4px solid #00b894;padding:14px 18px;border-radius:8px;margin-bottom:18px}
.q-text strong{font-weight:800}
.q-image{display:block;margin:0 auto 14px;max-width:100%;border-radius:10px}

/* MCQ options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid #e8ecef;border-radius:14px;padding:14px 18px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;gap:14px;transition:all .15s;font-family:inherit;text-align:left;width:100%;color:inherit}
.opt:hover:not(:disabled){border-color:#00b894;background:#f0fff8}
.opt-letter{width:30px;height:30px;border-radius:50%;background:#eef2ff;color:#6366f1;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.opt:disabled{cursor:not-allowed}
.opt.correct{border-color:#00b894;background:#f0fff8}
.opt.correct .opt-letter{background:#00b894;color:#fff}
.opt.wrong{border-color:#d63031;background:#fff5f5}
.opt.wrong .opt-letter{background:#d63031;color:#fff}

/* True/False */
.tf-row{display:flex;gap:12px}
.tf-btn{flex:1;background:#fff;border:2px solid #e8ecef;border-radius:14px;padding:20px 16px;cursor:pointer;font-size:1.1rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .15s;font-family:inherit;color:inherit}
.tf-btn:hover:not(:disabled){transform:translateY(-2px);border-color:#00b894}
.tf-btn.true{color:#00b894}
.tf-btn.false{color:#d63031}
.tf-btn:disabled{cursor:not-allowed;opacity:.7}
.tf-btn.correct{border-color:#00b894;background:#f0fff8}
.tf-btn.wrong{border-color:#d63031;background:#fff5f5}
.tf-icon{font-size:1.4rem}

/* Fill-in-blank */
.fill-row{display:flex;gap:10px;align-items:stretch}
.fill-input{flex:1;font-family:inherit;font-size:1rem;font-weight:700;padding:14px 18px;border:2px dashed #6c5ce7;border-radius:14px;background:#faf9ff;color:#1a1a2e;outline:none}
.fill-input:focus{border-style:solid;border-color:#4f8ef7;background:#fff;box-shadow:0 0 0 3px rgba(79,142,247,.2)}
.fill-input:disabled{opacity:.85;background:#f8f9fb}
.fill-submit{background:linear-gradient(135deg,#00b894,#0ea5e9);color:#fff;border:none;border-radius:14px;padding:0 24px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.fill-submit:hover:not(:disabled){opacity:.88}
.fill-submit:disabled{cursor:not-allowed;opacity:.5}

/* Essay */
.essay-area{width:100%;font-family:inherit;font-size:.95rem;padding:14px 16px;border:2px dashed #6c5ce7;border-radius:14px;background:#faf9ff;color:#1a1a2e;outline:none;resize:vertical;min-height:100px;line-height:1.5}
.essay-area:focus{border-style:solid;border-color:#4f8ef7;background:#fff;box-shadow:0 0 0 3px rgba(79,142,247,.2)}
.essay-area:disabled{opacity:.85;background:#f8f9fb}
.essay-show{margin-top:12px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:14px;padding:11px 22px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s}
.essay-show:hover:not(:disabled){opacity:.88}
.essay-self{display:none;gap:10px;margin-top:12px}
.essay-self.show{display:flex}
.essay-self button{flex:1;border:2px solid;border-radius:14px;padding:12px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;background:#fff}
.essay-self .got{border-color:#00b894;color:#00b894}
.essay-self .got:hover{background:#f0fff8}
.essay-self .miss{border-color:#e17055;color:#e17055}
.essay-self .miss:hover{background:#fff5f0}

/* Feedback */
.fb{border-radius:14px;padding:16px 18px;margin-top:16px;font-size:.92rem;line-height:1.6;display:none}
.fb.show{display:block}
.fb.correct{background:#f0fff8;border:1.5px solid #00b894;color:#005f48}
.fb.wrong{background:#fff5f5;border:1.5px solid #d63031;color:#a30000}
.fb.info{background:#eef2ff;border:1.5px solid #6366f1;color:#3730a3}
.fb strong{font-weight:900}
.steps{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.step-num{width:22px;height:22px;border-radius:50%;background:#00b894;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0}
.concept-box{margin-top:12px;background:#fffbe8;border:1.5px solid #f9ca24;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#7c5e02}

/* Hint button */
.hint-row{margin-top:14px}
.hint-btn{background:transparent;border:1.5px dashed #f9ca24;color:#b7760a;font-family:inherit;font-size:.85rem;font-weight:800;padding:8px 16px;border-radius:14px;cursor:pointer}
.hint-btn:hover{background:#fffbe8}
.hint-box{display:none;background:#fffbe8;border:1.5px solid #f9ca24;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#7c5e02;margin-top:10px}
.hint-box.show{display:block}

/* Done screen */
.done{text-align:center;padding:40px 20px}
.done h2{font-size:2rem;font-weight:900;margin-bottom:10px;background:linear-gradient(135deg,#00b894,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.done p{color:#666;margin-bottom:24px;line-height:1.6}
.done-stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.done-stat{text-align:center}
.done-stat strong{display:block;font-size:2.2rem;font-weight:900;color:#1a1a2e}
.done-stat span{font-size:.75rem;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:1px}
.restart-btn{background:linear-gradient(135deg,#00b894,#0ea5e9);color:#fff;border:none;border-radius:24px;padding:14px 32px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,184,148,.4)}
.restart-btn:hover{opacity:.92}

.breakdown{text-align:left;background:#f8faff;border-radius:14px;padding:14px 18px;margin:0 auto 22px;max-width:480px}
.breakdown h4{font-size:.85rem;font-weight:900;margin-bottom:10px;color:#3730a3;letter-spacing:.5px;text-transform:uppercase}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #e8ecef;font-size:.88rem}
.breakdown-row:last-child{border-bottom:none}
.breakdown-row .bd-label{font-weight:700;color:#333;flex:1}
.breakdown-row .bd-score{font-weight:800;color:#00b894}
.breakdown-row .bd-score.low{color:#d63031}

/* Confetti */
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1000}

@media(max-width:520px){
  .q-card{padding:22px 18px 18px}
  .q-text{font-size:.95rem;padding:12px 14px}
  .opt{padding:12px 14px;font-size:.9rem}
  .tf-btn{padding:16px 12px;font-size:1rem}
  .hdr-title{font-size:.95rem}
  .score-chip{font-size:.65rem;padding:8px}
  .score-chip strong{font-size:1.1rem}
  .fill-row{flex-direction:column}
  .fill-submit{padding:12px}
  .lang-toggle{padding:5px 9px;font-size:.7rem}
}
</style>
</head>
<body>

<div class="hdr">
  <a class="hdr-back" href="../">← All</a>
  <div class="hdr-title" id="hdrTitle">🔬 Science Practice</div>
  <button class="lang-toggle" id="langBtn" onclick="toggleLang()">🌐 ID</button>
  <div class="hdr-meta" id="hdrMeta">Question 1</div>
</div>

<div class="progress-wrap">
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <div class="progress-text" id="progText">0 / 0</div>
  </div>
</div>

<div class="score-row">
  <div class="score-chip correct"><strong id="sCorrect">0</strong><span id="lblCorrect">✓ Correct</span></div>
  <div class="score-chip wrong"><strong id="sWrong">0</strong><span id="lblWrong">✗ Wrong</span></div>
  <div class="score-chip answered"><strong id="sDone">0</strong><span id="lblDone">📝 Answered</span></div>
</div>

<div class="main">
  <div id="quizSlot"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const norm=s=>String(s||'').trim().toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');

// Language
let lang = localStorage.getItem('azsci_lang') || 'en';
function t(obj){
  if(obj==null) return '';
  if(typeof obj==='string') return obj;
  if(Array.isArray(obj)) return obj.map(t);
  if(typeof obj==='object' && ('en' in obj || 'id' in obj)) return obj[lang] || obj.en || obj.id || '';
  return obj;
}
function toggleLang(){
  lang = lang==='en' ? 'id' : 'en';
  localStorage.setItem('azsci_lang', lang);
  updateLangUI();
  if(current) renderQuestion();
}
function updateLangUI(){
  document.getElementById('langBtn').textContent = lang==='en' ? '🌐 ID' : '🌐 EN';
  document.getElementById('lblCorrect').textContent = lang==='en' ? '✓ Correct' : '✓ Benar';
  document.getElementById('lblWrong').textContent = lang==='en' ? '✗ Wrong' : '✗ Salah';
  document.getElementById('lblDone').textContent = lang==='en' ? '📝 Answered' : '📝 Dijawab';
  document.getElementById('hdrTitle').textContent = '🔬 ' + (currentChapterTitle ? t(currentChapterTitle) : (lang==='en'?'Science Practice':'Latihan Sains'));
  document.getElementById('hdrMeta').textContent = (lang==='en'?'Question ':'Soal ') + Math.min(idx+1,total) + (lang==='en'?' of ':' dari ') + total;
}

// MCQ shuffle helper: takes bilingual correct + array of bilingual distractors
function mkOpts(correct, distractors){
  const all=[correct, ...distractors].slice(0,4);
  while(all.length<4) all.push({en:'—',id:'—'});
  const sh=shuf(all);
  return {opts:sh, ans:sh.indexOf(correct)};
}

// ════════════════════════════════════════════════════════════════
// QUESTION BANK — Ch 7 SOUND
// ════════════════════════════════════════════════════════════════
const SOUND_GEN = {
  vibration_def:()=>{
    const cor={en:'a back and forth movement',id:'gerakan bolak-balik'};
    const{opts,ans}=mkOpts(cor,[
      {en:'a circular movement',id:'gerakan melingkar'},
      {en:'an upward movement',id:'gerakan ke atas'},
      {en:'electrical signals',id:'sinyal listrik'}]);
    return{type:'mcq',topic:'how_sounds_made',
      q:{en:'Sounds are made when objects vibrate. What is <b>vibration</b>?',
         id:'Bunyi dihasilkan saat benda bergetar. Apa itu <b>getaran</b>?'},
      opts,ans,
      hint:{en:'Think about a guitar string when you pluck it — which way does it move?',
            id:'Pikirkan senar gitar saat dipetik — ke arah mana ia bergerak?'},
      concept:{en:'Vibration is the rapid back-and-forth (oscillating) motion of an object.',
               id:'Getaran adalah gerakan bolak-balik (osilasi) yang cepat pada suatu benda.'},
      steps:{en:['Vibration = repeated back-and-forth motion.','Examples: a plucked string, a drum skin, your vocal cords.','So the answer is: <b>a back and forth movement</b>.'],
             id:['Getaran = gerakan bolak-balik yang berulang.','Contoh: senar yang dipetik, kulit drum, pita suara.','Jadi jawabannya: <b>gerakan bolak-balik</b>.']}};
  },
  sound_to_ears:()=>{
    const cor={en:'Through sound waves',id:'Melalui gelombang bunyi'};
    const{opts,ans}=mkOpts(cor,[
      {en:'Through our brain',id:'Melalui otak kita'},
      {en:'Through vibrations alone',id:'Hanya melalui getaran saja'},
      {en:'Through electrical signals',id:'Melalui sinyal listrik'}]);
    return{type:'mcq',topic:'how_sounds_made',
      q:{en:'How does sound reach our ears?',id:'Bagaimana bunyi sampai ke telinga kita?'},
      opts,ans,

  magnets_attract_repel_scenario:()=>{
    const pairs=[
      {left:['N','S'], right:['N','S'], result:'attract', sides:'S–N'},
      {left:['S','N'], right:['S','N'], result:'attract', sides:'N–S'},
      {left:['N','S'], right:['S','N'], result:'repel',   sides:'S–S'},
      {left:['S','N'], right:['N','S'], result:'repel',   sides:'N–N'}];
    const p=pick(pairs);
    const cor = p.result==='attract'
      ? {en:'They will attract each other.',id:'Keduanya akan saling tarik-menarik.'}
      : {en:'They will repel each other.',id:'Keduanya akan saling tolak-menolak.'};
    const opp = p.result==='attract'
      ? {en:'They will repel each other.',id:'Keduanya akan saling tolak-menolak.'}
      : {en:'They will attract each other.',id:'Keduanya akan saling tarik-menarik.'};
    const{opts,ans}=mkOpts(cor,[
      opp,
      {en:'Nothing will happen.',id:'Tidak terjadi apa-apa.'},
      {en:'They will spin around.',id:'Keduanya akan berputar.'}]);
    const mkMagnet = (x, sides) => `
      <g>
        <rect x="${x}" y="20" width="40" height="40" fill="#ffd6d6" stroke="#333" stroke-width="1.5"/>
        <rect x="${x+40}" y="20" width="40" height="40" fill="#d6ecff" stroke="#333" stroke-width="1.5"/>
        <text x="${x+20}" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">${sides[0]}</text>
        <text x="${x+60}" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5d8e">${sides[1]}</text>
      </g>`;
    const diagram = `<svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg" class="scenario-diagram" style="max-width:280px">
      ${mkMagnet(20, p.left)}
      ${mkMagnet(180, p.right)}
    </svg>`;
    return{type:'mcq',topic:'magnetic_force',
      q:{en:`Two bar magnets are placed near each other as shown. The facing poles are <b>${p.sides}</b>. What will happen?`,
         id:`Dua magnet batang didekatkan seperti pada gambar. Kutub yang saling berhadapan adalah <b>${p.sides}</b>. Apa yang akan terjadi?`},
      diagram,
      opts,ans,
      hint:{en:'Like poles repel. Unlike poles attract.',
            id:'Kutub sejenis tolak-menolak. Kutub tak sejenis tarik-menarik.'},
      concept:{en:'Like poles (N–N, S–S) repel. Unlike poles (N–S) attract.',
               id:'Kutub sejenis (N–N, S–S) tolak-menolak. Kutub tak sejenis (N–S) tarik-menarik.'},
      steps:{en:[`Facing poles: <b>${p.sides}</b>.`, p.result==='attract'?'Unlike poles → <b>attract</b>.':'Like poles → <b>repel</b>.'],
             id:[`Kutub berhadapan: <b>${p.sides}</b>.`, p.result==='attract'?'Kutub tak sejenis → <b>tarik-menarik</b>.':'Kutub sejenis → <b>tolak-menolak</b>.']}};
  },

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let queue=[], current=null, idx=0, total=0;
let stats={correct:0, wrong:0, done:0};
let lastResult=null;
let currentChapterTitle = null;
let isUAS = false;
let uasBreakdown = {}; // chapter -> {correct, total}

// ── Auto-Weak-Practice state (kicks in when UAS finishes with acc < 90%) ──
// Tracks per-topic correct/wrong counts so we know what to drill.
let topicStats = {};            // { topicKey: {correct, wrong, recentWrong:[]} }
let isWeakPractice = false;     // true once we leave UAS and enter drill mode
let smartScore = 0;             // 0-100, updated +5/-3 during weak practice
let originalUasAcc = 0;         // accuracy from the UAS exam (for celebration screen)
let weakTopicSet = [];          // list of topic keys the student got wrong
let weakCount = 0;              // # of weak-practice questions answered

function buildQueue(chKey){
  if(chKey === 'uas'){
    buildUAS();
    return;
  }
  isUAS = false;
  const ch = CHAPTERS[chKey] || CHAPTERS['1'];
  currentChapterTitle = ch.title;
  // For 'all', order by type group
  const keys = shuf(Object.keys(ch.gen));
  let qs = keys.map(k => ({key:k, gen:ch.gen[k]}));
  if(chKey === 'all'){
    const typeOrder = {mcq:0, multi_check:0, match_pairs:0, tf:1, fill:2, fill_bank:2, cycle_diagram:2, essay:3, scenario:3};
    qs = qs.map(q => ({...q, _t: q.gen().type}));
    qs.sort((a,b)=>(typeOrder[a._t]??9) - (typeOrder[b._t]??9));
  }
  queue = qs.map(q => q.gen());
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  updateLangUI();
  updateScore();
  next();
}

function buildUAS(){
  isUAS = true;
  currentChapterTitle = {en:'UAS — Final Exam (35 Q)',id:'UAS — Ujian Akhir (35 Soal)'};
  uasBreakdown = {};

  // Build lookup: topic + type -> [genKeys]
  // Type-aliasing: fill_bank counts as 'fill'; multi_check counts as 'mcq';
  // scenario counts as 'essay' (multi-part) or 'mcq' if its first part is mcq.
  const byTopicType = {};
  const typeAliases = (s) => {
    const out = [s.type];
    if(s.type === 'fill_bank') out.push('fill');
    if(s.type === 'multi_check') out.push('mcq');
    if(s.type === 'match_pairs') out.push('mcq');
    if(s.type === 'cycle_diagram') out.push('fill');
    if(s.type === 'scenario'){
      out.push('essay');
      if(s.parts && s.parts[0] && s.parts[0].kind === 'mcq') out.push('mcq');
    }
    return out;
  };
  for(const [key,fn] of Object.entries(ALL_GENS)){
    const sample = fn();
    for(const tp of typeAliases(sample)){
      const k = sample.topic + ':' + tp;
      (byTopicType[k] = byTopicType[k] || []).push(fn);
    }
  }

  const built = [];
  for(const spec of UAS_KISI){
    const key = spec.topic + ':' + spec.type;
    const pool = byTopicType[key] || [];
    uasBreakdown[spec.chapter] = uasBreakdown[spec.chapter] || {correct:0,total:0};
    uasBreakdown[spec.chapter].total += spec.n;
    if(pool.length === 0){
      // No generator — placeholder
      for(let i=0;i<spec.n;i++){
        built.push({type:spec.type,
          q:{en:`[Missing question for ${spec.topic}]`,id:`[Soal hilang untuk ${spec.topic}]`},
          opts:[{en:'—',id:'—'},{en:'—',id:'—'},{en:'—',id:'—'},{en:'—',id:'—'}],
          ans:0, answers:['—'], display:{en:'—',id:'—'}, model:{en:'—',id:'—'}, keys:[],
          _chapter:spec.chapter, _topic:spec.topic});
      }
      continue;
    }
    // Pick without immediate repeats; allow re-randomized variants if needed
    const shuffled = shuf(pool);
    for(let i=0;i<spec.n;i++){
      const fn = shuffled[i % shuffled.length];
      const q = fn();
      q._chapter = spec.chapter;
      q._topic = spec.topic;
      built.push(q);
    }
  }

  // Order: MCQ → FILL → ESSAY (chapter order preserved within each block)
  const typeOrder = {mcq:0, multi_check:0, match_pairs:0, fill:1, fill_bank:1, cycle_diagram:1, essay:2, scenario:2, tf:3};
  built.sort((a,b)=> (typeOrder[a.type]??9) - (typeOrder[b.type]??9));

  queue = built;
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  updateLangUI();
  updateScore();
  next();
}

function updateScore(){
  document.getElementById('sCorrect').textContent = stats.correct;
  document.getElementById('sWrong').textContent = stats.wrong;
  document.getElementById('sDone').textContent = stats.done;
  if(isWeakPractice){
    // During weak practice, the progress bar tracks SmartScore (0→100).
    document.getElementById('progFill').style.width = smartScore + '%';
    document.getElementById('progText').textContent =
      (lang==='en'?'SmartScore: ':'SmartScore: ') + smartScore + '/100';
    document.getElementById('hdrMeta').textContent =
      (lang==='en'?'Weak practice · Q':'Latihan area lemah · Soal ') + (idx+1);
  } else {
    const pct = total>0 ? (stats.done/total)*100 : 0;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('progText').textContent = `${stats.done} / ${total}`;
    document.getElementById('hdrMeta').textContent =
      (lang==='en'?'Question ':'Soal ') + Math.min(idx+1,total) + (lang==='en'?' of ':' dari ') + total;
  }
}

function next(){
  if(idx >= total){
    // Branch 1: still in weak-practice loop AND not yet mastered → refill & continue.
    if(isWeakPractice && smartScore < 100){
      refillWeakQueue();
      current = queue[idx];
      lastResult = null;
      renderQuestion();
      updateScore();
      return;
    }
    // Branch 2: UAS just finished with acc < 90% → enter weak-practice flow.
    if(isUAS && !isWeakPractice){
      const acc = total>0 ? Math.round((stats.correct/total)*100) : 0;
      if(acc < 90){
        enterWeakPractice(acc);
        return;
      }
    }
    // Branch 3: anything else → normal done screen (or mastery screen if weak-practice done).
    renderDone();
    return;
  }
  current = queue[idx];
  lastResult = null;
  renderQuestion();
  updateScore();
}

// ────────────────────────────────────────────────────────────────
// AUTO-WEAK-PRACTICE — drills the topics the student got wrong on UAS
// until SmartScore reaches 100.
// ────────────────────────────────────────────────────────────────

// Find generator keys whose questions match one of the given topics.
function _genKeysForTopics(topicSet){
  const out = [];
  for(const [key, fn] of Object.entries(ALL_GENS)){
    try {
      const sample = fn();
      if(topicSet.includes(sample.topic)) out.push(key);
    } catch(e){ /* skip broken gen */ }
  }
  return out;
}

// Transition from finished UAS into the weak-practice loop.
function enterWeakPractice(acc){
  // Identify topics with at least one wrong answer; if none (shouldn't happen at acc<90
  // but defensive), fall back to all topics that were attempted.
  weakTopicSet = Object.keys(topicStats).filter(tp => topicStats[tp].wrong > 0);
  if(weakTopicSet.length === 0){
    weakTopicSet = Object.keys(topicStats);
  }
  // If still empty (no topicStats collected), fall back to all generator topics.
  if(weakTopicSet.length === 0){
    const tset = new Set();
    for(const fn of Object.values(ALL_GENS)){
      try { tset.add(fn().topic); } catch(e){}
    }
    weakTopicSet = Array.from(tset);
  }

  isWeakPractice = true;
  originalUasAcc = acc;
  smartScore = acc;       // start SmartScore at UAS accuracy
  weakCount = 0;
  // reset per-question stats so weak-practice progress is clearly separate
  stats = {correct:0, wrong:0, done:0};
  idx = 0;

  // Build the initial weak-area queue (8 fresh questions, shuffled).
  const pool = _genKeysForTopics(weakTopicSet);
  const usePool = pool.length > 0 ? pool : Object.keys(ALL_GENS);
  const QN = 8;
  const built = [];
  const shuffled = shuf(usePool);
  for(let i=0;i<QN;i++){
    const k = shuffled[i % shuffled.length];
    const q = ALL_GENS[k]();
    q._weak = true;
    built.push(q);
  }
  queue = built;
  total = queue.length;

  // Show transition card → on click, start the first weak question.
  const enMsg  = `You got <strong>${acc}%</strong> on the UAS — let's master the topics you missed!`;
  const idMsg  = `Kamu dapat <strong>${acc}%</strong> di UAS — yuk kuasai topik yang masih lemah!`;
  const enSub  = `Practice continues until SmartScore 100.`;
  const idSub  = `Latihan berlanjut sampai SmartScore 100.`;
  const enBtn  = `Start Weak Practice →`;
  const idBtn  = `Mulai Latihan Area Lemah →`;
  document.getElementById('quizSlot').innerHTML = `
    <div class="q-card done">
      <h2>🎯 ${lang==='en'?'Time to level up!':'Saatnya naik level!'}</h2>
      <p>${lang==='en'?enMsg:idMsg}</p>
      <p style="opacity:.75;font-size:.9rem">${lang==='en'?enSub:idSub}</p>
      <button class="restart-btn" id="startWeakBtn">${lang==='en'?enBtn:idBtn}</button>
    </div>`;
  document.getElementById('startWeakBtn').addEventListener('click', ()=>{
    updateScore();
    next();
  });
}

// Top up the queue with more weak-area questions, weighted by recent wrongs.
function refillWeakQueue(){
  const pool = _genKeysForTopics(weakTopicSet);
  const usePool = pool.length > 0 ? pool : Object.keys(ALL_GENS);
  // Build per-generator weights from per-topic recent error counts.
  const weighted = usePool.map(k => {
    let w = 1;
    try {
      const tp = ALL_GENS[k]().topic;
      const st = topicStats[tp] || {wrong:0,correct:0,recentWrong:[]};
      const recent = (st.recentWrong||[]).slice(-3).reduce((a,b)=>a+b,0);
      w = 1 + 2*st.wrong + 3*recent;
    } catch(e){}
    return {k, w};
  });
  const totalW = weighted.reduce((s,x)=>s+x.w, 0) || 1;
  const need = 5;
  for(let i=0;i<need;i++){
    let r = Math.random()*totalW, pickKey = weighted[0].k;
    for(const w of weighted){ r -= w.w; if(r <= 0){ pickKey = w.k; break; } }
    const q = ALL_GENS[pickKey]();
    q._weak = true;
    queue.push(q);
  }
  total = queue.length;
}

function renderQuestion(){
  const slot = document.getElementById('quizSlot');
  let inner = '';
  switch(current.type){
    case 'mcq':         inner = mcqHtml(current); break;
    case 'tf':          inner = tfHtml(current); break;
    case 'fill':        inner = fillHtml(current); break;
    case 'essay':       inner = essayHtml(current); break;
    case 'fill_bank':   inner = fillBankHtml(current); break;
    case 'multi_check': inner = multiCheckHtml(current); break;
    case 'scenario':    inner = scenarioHtml(current); break;
    case 'match_pairs': inner = matchPairsHtml(current); break;
    case 'cycle_diagram': inner = cycleDiagramHtml(current); break;
  }
  slot.innerHTML = `<div class="q-card">${inner}</div>`;
  switch(current.type){
    case 'mcq':         attachMCQ(); break;
    case 'tf':          attachTF(); break;
    case 'fill':        attachFill(); break;
    case 'essay':       attachEssay(); break;
    case 'fill_bank':   attachFillBank(); break;
    case 'multi_check': attachMultiCheck(); break;
    case 'scenario':    attachScenario(); break;
    case 'match_pairs': attachMatchPairs(); break;
    case 'cycle_diagram': attachCycleDiagram(); break;
  }
  attachHint();
}

function badgeFor(typ){
  const labels = {
    mcq:{en:'📝 Multiple Choice',id:'📝 Pilihan Ganda'},
    tf:{en:'✅ True or False',id:'✅ Benar atau Salah'},
    fill:{en:'📋 Fill in the Blank',id:'📋 Isian Singkat'},
    essay:{en:'📖 Short Answer',id:'📖 Uraian Singkat'},
    fill_bank:{en:'🗂️ Word Bank Fill',id:'🗂️ Isian dengan Daftar Kata'},
    multi_check:{en:'☑️ Tick Multiple',id:'☑️ Centang Beberapa'},
    scenario:{en:'🔬 Scenario',id:'🔬 Skenario'},
    match_pairs:{en:'🔗 Match Pairs',id:'🔗 Pasangkan'},
    cycle_diagram:{en:'🔄 Cycle Diagram',id:'🔄 Diagram Siklus'}
  };
  return `<span class="q-badge ${typ}">${t(labels[typ])}</span>`;

function multiCheckHtml(q){
  const need = q.require || (q.correctIdx||[]).length;
  const instr = lang==='en'
    ? `Tick <b>${need}</b> answer${need>1?'s':''}.`
    : `Centang <b>${need}</b> jawaban.`;
  const subBtn = lang==='en' ? 'Submit' : 'Kirim';
  const opts = q.opts.map((o,i)=>`
    <button type="button" class="mc-opt" data-i="${i}">
      <span class="mc-box"></span>
      <span>${t(o)}</span>
    </button>`).join('');
  return `${badgeFor('multi_check')}<div class="q-text">${t(q.q)}</div>
    <div class="mc-instr">${instr}</div>
    <div>${opts}</div>
    <button class="scenario-check-all" id="mcSub" style="margin-top:10px">${subBtn}</button>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachMultiCheck(){
  const need = current.require || (current.correctIdx||[]).length;
  const picked = new Set();
  document.querySelectorAll('.mc-opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.classList.contains('locked')) return;
      const i = parseInt(b.dataset.i);
      if(picked.has(i)){ picked.delete(i); b.classList.remove('checked'); }
      else { picked.add(i); b.classList.add('checked'); }
    });
  });
  document.getElementById('mcSub').addEventListener('click', ()=>{
    if(picked.size !== need){
      const fb = document.getElementById('fb');
      fb.className='fb info show';
      fb.innerHTML = lang==='en'
        ? `<strong>Please select exactly ${need} answer${need>1?'s':''}.</strong>`
        : `<strong>Pilih tepat ${need} jawaban.</strong>`;
      return;
    }
    const correctSet = new Set(current.correctIdx);
    let allRight = true;
    for(const c of correctSet) if(!picked.has(c)) allRight = false;
    for(const p of picked) if(!correctSet.has(p)) allRight = false;
    checkAnswer(allRight, ()=>{
      document.querySelectorAll('.mc-opt').forEach(b=>{
        b.classList.add('locked');
        const i = parseInt(b.dataset.i);
        if(correctSet.has(i) && picked.has(i)) b.classList.add('correct');
        else if(picked.has(i) && !correctSet.has(i)) b.classList.add('wrong');
        else if(correctSet.has(i) && !picked.has(i)) b.classList.add('missed');
      });
      document.getElementById('mcSub').disabled = true;
    });
  });
}

  const parts = q.parts.map((p,i)=>{
    const labelLbl = lang==='en' ? `Part ${i+1}` : `Bagian ${i+1}`;

    } else if(p.kind==='fill'){

      body = `<div class="fill-row"><input type="text" class="fill-input sc-fill" data-part="${i}" placeholder="${ph}" autocomplete="off"/></div>`;

      const ph = lang==='en' ? 'Write your answer…' : 'Tulis jawabanmu…';
      body = `<textarea class="essay-area sc-essay" data-part="${i}" placeholder="${ph}"></textarea>`;
    }
    return `<div class="scenario-part" data-part="${i}">
      <div class="scenario-part-label">${labelLbl}</div>
      <div class="scenario-part-q">${t(p.q)}</div>

    ${hintBlock(q)}${feedbackBlock()}`;

function attachScenario(){
  // Selecting MCQ option highlights it
  document.querySelectorAll('.sc-opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      const part = b.dataset.part;
      document.querySelectorAll(`.sc-opt[data-part="${part}"]`).forEach(x=>{
        x.classList.remove('correct','wrong');
        x.dataset.picked = '0';
      });
      b.dataset.picked = '1';
      b.style.borderColor = '#6366f1';
      b.style.background = '#eef2ff';
    });
  });
  // Bank chips fill the focused input
  document.querySelectorAll('.bank-chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      if(c.disabled) return;
      const focused = document.activeElement;
      const last = window._scLastFill;
      const target = (focused && focused.classList.contains('sc-fill')) ? focused : last;
      if(target){ target.value = c.dataset.w; target.focus(); }
    });
  });
  document.querySelectorAll('.sc-fill').forEach(f=>{
    f.addEventListener('focus', ()=>{ window._scLastFill = f; });
  });

  document.getElementById('scCheck').addEventListener('click', ()=>{
    const parts = current.parts;
    let correctCount = 0;
    parts.forEach((p,i)=>{
      const resEl = document.querySelector(`[data-part-result="${i}"]`);
      let ok = false;
      if(p.kind==='mcq'){
        const picked = document.querySelector(`.sc-opt[data-part="${i}"][data-picked="1"]`);
        const pickedIdx = picked ? parseInt(picked.dataset.i) : -1;
        ok = pickedIdx === p.ans;
        document.querySelectorAll(`.sc-opt[data-part="${i}"]`).forEach(b=>{
          b.disabled = true;
          const j = parseInt(b.dataset.i);
          b.style.borderColor=''; b.style.background='';
          if(j === p.ans) b.classList.add('correct');
          else if(j === pickedIdx) b.classList.add('wrong');
        });
      } else if(p.kind==='fill'){
        const inp = document.querySelector(`.sc-fill[data-part="${i}"]`);
        const u = norm(inp.value);
        ok = !!u && p.answers.some(a => norm(a) === u);
        inp.disabled = true;
        inp.style.borderColor = ok ? '#00b894' : '#d63031';
        inp.style.background = ok ? '#f0fff8' : '#fff5f5';
      } else if(p.kind==='essay'){
        const area = document.querySelector(`.sc-essay[data-part="${i}"]`);
        const u = norm(area.value);
        const hits = (p.keys||[]).filter(k => u.includes(norm(k))).length;
        const need = Math.max(1, Math.ceil((p.keys||[]).length * 0.4));
        ok = u.length >= 20 && hits >= need;
        area.disabled = true;
        area.style.borderColor = ok ? '#00b894' : '#e17055';
        area.style.background = ok ? '#f0fff8' : '#fff8f0';
      }
      if(ok) correctCount++;
      resEl.classList.remove('ok','bad'); resEl.classList.add('show', ok?'ok':'bad');
      if(p.kind==='essay'){
        resEl.innerHTML = ok
          ? (lang==='en'?'✓ Good — key ideas covered.':'✓ Bagus — ide kunci tercakup.')
          : (lang==='en'?'✗ Missing key ideas. Model:':'✗ Belum lengkap. Contoh:') +
            `<div style="font-weight:600;margin-top:6px;color:#333">${t(p.model)}</div>`;
      } else if(p.kind==='fill'){
        resEl.innerHTML = ok
          ? (lang==='en'?'✓ Correct!':'✓ Benar!')
          : (lang==='en'?'✗ Expected: ':'✗ Jawaban: ') + `<b>${t(p.display)}</b>`;
      } else {
        resEl.innerHTML = ok ? (lang==='en'?'✓ Correct!':'✓ Benar!') : (lang==='en'?'✗ Not quite.':'✗ Belum tepat.');
      }
    });
    document.querySelectorAll('.bank-chip').forEach(c=>c.disabled=true);
    document.getElementById('scCheck').disabled = true;
    // Score = majority correct
    const partTotal = parts.length;
    const ok = correctCount >= Math.ceil(partTotal * 0.6);
    const fb = document.getElementById('fb');
    fb.className = `fb ${ok?'correct':'wrong'} show`;
    const conceptHtml = current.concept ? `<div class="concept-box">💡 ${t(current.concept)}</div>` : '';
    const summary = lang==='en'
      ? `You got <strong>${correctCount} of ${partTotal}</strong> parts correct.`
      : `Kamu menjawab benar <strong>${correctCount} dari ${partTotal}</strong> bagian.`;
    fb.innerHTML = `<strong>${ok?(lang==='en'?'✅ Well done!':'✅ Bagus!'):(lang==='en'?'📚 Keep practising.':'📚 Terus berlatih.')}</strong> ${summary}${conceptHtml}`;
    registerResult(ok);
    setTimeout(()=>{
      const nxt = document.createElement('button');
      nxt.className = 'restart-btn';
      nxt.style.marginTop = '16px';
      nxt.style.padding = '10px 24px';
      nxt.style.fontSize = '.88rem';
      nxt.textContent = idx+1 >= total ? (lang==='en' ? '🏁 See Results' : '🏁 Lihat Hasil') : (lang==='en' ? 'Next Question →' : 'Soal Berikutnya →');
      nxt.onclick = ()=>{ idx++; next(); };
      fb.appendChild(nxt);
    }, 300);
  });
}

// ── MATCH_PAIRS ─────────────────────────────────────────────────
function matchPairsHtml(q){
  const pairs = q.pairs || [];
  // Render meanings in a shuffled order (terms in given order on the left).
  // Use a stable shuffle stored per-render so checking is consistent.
  const order = q._meaningOrder || shuf(pairs.map((_,i)=>i));
  q._meaningOrder = order;
  const colTerm = lang==='en' ? 'Term' : 'Istilah';
  const colMean = lang==='en' ? 'Meaning' : 'Arti';
  const instr = lang==='en'
    ? 'Click a <b>term</b>, then click its matching <b>meaning</b>.'
    : 'Klik sebuah <b>istilah</b>, lalu klik <b>arti</b> yang cocok.';
  const total = pairs.length;
  const progressLbl = lang==='en' ? `Matched: <span id="mpMatched">0</span> / ${total}` : `Cocok: <span id="mpMatched">0</span> / ${total}`;
  const terms = pairs.map((p,i)=>`<button type="button" class="mp-card mp-term" data-i="${i}">${t(p.term)}</button>`).join('');
  const meanings = order.map(origIdx => `<button type="button" class="mp-card mp-mean" data-i="${origIdx}">${t(pairs[origIdx].meaning)}</button>`).join('');
  return `${badgeFor('match_pairs')}<div class="q-text">${t(q.q)}</div>
    <div class="mp-instr">${instr}</div>
    <div class="mp-grid">
      <div>
        <div class="mp-col-title">${colTerm}</div>
        ${terms}
      </div>
      <div>
        <div class="mp-col-title">${colMean}</div>
        ${meanings}
      </div>
    </div>
    <div class="mp-progress">${progressLbl}</div>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachMatchPairs(){
  const total = (current.pairs||[]).length;
  let matched = 0;
  let wrongCount = 0;
  let selTerm = null, selMean = null;
  const matchedSet = new Set();
  const matchedLbl = document.getElementById('mpMatched');

  function clearSel(){
    document.querySelectorAll('.mp-card.selected').forEach(c=>c.classList.remove('selected'));
    selTerm = null; selMean = null;
  }
  function tryMatch(){
    if(selTerm == null || selMean == null) return;
    const termEl = document.querySelector(`.mp-term[data-i="${selTerm}"]`);
    const meanEl = document.querySelector(`.mp-mean[data-i="${selMean}"]`);
    if(selTerm === selMean){
      // Correct pair
      termEl.classList.remove('selected'); meanEl.classList.remove('selected');
      termEl.classList.add('matched'); meanEl.classList.add('matched');
      termEl.disabled = true; meanEl.disabled = true;
      matchedSet.add(selTerm);
      matched++;
      if(matchedLbl) matchedLbl.textContent = matched;
      selTerm = null; selMean = null;
      if(matched >= total){
        // Done — score as correct only if no wrong attempts; partial credit allowed.
        const ok = wrongCount === 0;
        checkAnswer(ok, ()=>{
          document.querySelectorAll('.mp-card').forEach(c=>c.disabled=true);
        });
      }
    } else {
      // Wrong pair — shake and reset
      wrongCount++;
      [termEl, meanEl].forEach(el=>{
        el.classList.add('shake');
        setTimeout(()=>el.classList.remove('shake'), 400);
      });
      setTimeout(clearSel, 250);
    }
  }
  document.querySelectorAll('.mp-term').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      // Toggle off existing term selection
      document.querySelectorAll('.mp-term.selected').forEach(x=>x.classList.remove('selected'));
      selTerm = parseInt(b.dataset.i);
      b.classList.add('selected');
      tryMatch();
    });
  });
  document.querySelectorAll('.mp-mean').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      document.querySelectorAll('.mp-mean.selected').forEach(x=>x.classList.remove('selected'));
      selMean = parseInt(b.dataset.i);
      b.classList.add('selected');
      tryMatch();
    });
  });
}

// ── CYCLE_DIAGRAM ───────────────────────────────────────────────
function cycleDiagramHtml(q){
  const bankTitle = lang==='en' ? 'Word Bank' : 'Daftar Kata';
  const subBtn = lang==='en' ? '✓ Check Answers' : '✓ Periksa Jawaban';
  const bankWords = t(q.bank);
  const chips = bankWords.map((w,i)=>`<button type="button" class="bank-chip cd-chip" data-w="${w.replace(/"/g,'&quot;')}" data-i="${i}">${w}</button>`).join('');
  // SVG layout: 4 boxes at top/right/bottom/left of a 460x340 viewBox
  const positions = {
    top:    {x:230, y:50,  ax:230, ay:50},
    right:  {x:380, y:170, ax:380, ay:170},
    bottom: {x:230, y:290, ax:230, ay:290},
    left:   {x:80,  y:170, ax:80,  ay:170},
  };
  const boxW = 140, boxH = 56;
  const nodes = q.nodes || [];
  let svgNodes = '';
  nodes.forEach((n,i)=>{
    const p = positions[n.pos];
    const x = p.x - boxW/2, y = p.y - boxH/2;
    const isBlank = n.blank;
    const labelTxt = isBlank ? '?' : t(n.label);
    // wrap text into up to 3 lines (rough word-wrap)
    const words = String(labelTxt).split(' ');
    const lines = [];
    let cur = '';
    const maxLine = 18;
    for(const w of words){
      if((cur + ' ' + w).trim().length > maxLine){ if(cur) lines.push(cur); cur = w; }
      else cur = (cur + ' ' + w).trim();
    }
    if(cur) lines.push(cur);
    const lh = 12;
    const startY = p.y - ((lines.length-1)*lh)/2 + 4;
    const tspans = lines.map((ln,k)=>`<tspan x="${p.x}" y="${startY + k*lh}">${ln.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</tspan>`).join('');
    const cls = isBlank ? 'cd-node blank' : 'cd-node';
    const lblCls = isBlank ? 'cd-label placeholder' : 'cd-label';
    svgNodes += `<g data-node="${i}">
      <rect class="${cls}" data-node-rect="${i}" x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="10"/>
      <text class="${lblCls}" data-node-label="${i}" text-anchor="middle">${tspans}</text>
      ${isBlank ? `<rect class="cd-hit" data-blank="${i}" x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="10"/>` : ''}
    </g>`;
  });
  // Arrows: simple curved arcs labelled with process name
  const arrowPath = (fromIdx, toIdx) => {
    const f = positions[nodes[fromIdx].pos], t2 = positions[nodes[toIdx].pos];
    // Control point biased toward the centre creates a curve
    const cx = (f.x + t2.x)/2 + (f.y - t2.y) * 0.25;
    const cy = (f.y + t2.y)/2 + (t2.x - f.x) * 0.25;
    return `M${f.x},${f.y} Q${cx},${cy} ${t2.x},${t2.y}`;
  };
  // Mid-point of curve for label placement
  const arrowMid = (fromIdx, toIdx) => {
    const f = positions[nodes[fromIdx].pos], t2 = positions[nodes[toIdx].pos];
    const cx = (f.x + t2.x)/2 + (f.y - t2.y) * 0.25;
    const cy = (f.y + t2.y)/2 + (t2.x - f.x) * 0.25;
    // Quadratic midpoint
    return {x: 0.25*f.x + 0.5*cx + 0.25*t2.x, y: 0.25*f.y + 0.5*cy + 0.25*t2.y};
  };
  let svgArrows = '';
  (q.arrows||[]).forEach((a,i)=>{
    const d = arrowPath(a.from, a.to);
    const m = arrowMid(a.from, a.to);
    svgArrows += `<path d="${d}" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cdArrow)" opacity=".7"/>
      <rect x="${m.x-38}" y="${m.y-9}" width="76" height="18" rx="9" fill="#fff" stroke="#6366f1" stroke-width="1" opacity=".95"/>
      <text class="cd-arrow-label" x="${m.x}" y="${m.y+4}" text-anchor="middle">${t(a.label)}</text>`;
  });
  return `${badgeFor('cycle_diagram')}<div class="q-text">${t(q.q)}</div>
    <div class="bank-wrap">
      <div class="bank-title">📦 ${bankTitle}</div>
      <div class="bank-chips">${chips}</div>
    </div>
    <div class="cd-wrap">
      <svg class="cd-svg" viewBox="0 0 460 340" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="cdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
          </marker>
        </defs>
        ${svgArrows}
        ${svgNodes}
      </svg>
    </div>
    <button class="scenario-check-all" id="cdSub">${subBtn}</button>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachCycleDiagram(){
  const nodes = current.nodes || [];
  // Map node index → filled word (or null if not yet filled)
  const fills = nodes.map(n => n.blank ? null : t(n.label));
  let activeChip = null; // current selected word from bank
  let activeBlankIdx = null;

  function setNodeText(i, text, cls){
    const rect = document.querySelector(`[data-node-rect="${i}"]`);
    const label = document.querySelector(`[data-node-label="${i}"]`);
    if(rect){
      rect.setAttribute('class', cls || 'cd-node filled');
    }
    if(label){
      label.setAttribute('class', 'cd-label');
      // Re-wrap text
      const words = String(text).split(' ');
      const lines = [];
      let cur = '';
      const maxLine = 18;
      for(const w of words){
        if((cur + ' ' + w).trim().length > maxLine){ if(cur) lines.push(cur); cur = w; }
        else cur = (cur + ' ' + w).trim();
      }
      if(cur) lines.push(cur);
      const lh = 12;
      // positions
      const posMap = {top:{x:230,y:50},right:{x:380,y:170},bottom:{x:230,y:290},left:{x:80,y:170}};
      const p = posMap[nodes[i].pos];
      const startY = p.y - ((lines.length-1)*lh)/2 + 4;
      label.innerHTML = lines.map((ln,k)=>`<tspan x="${p.x}" y="${startY + k*lh}">${ln.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</tspan>`).join('');
    }
  }

  function clearActiveChip(){
    if(activeChip){
      activeChip.style.background = '';
      activeChip.style.boxShadow = '';
    }
    activeChip = null;
  }

  document.querySelectorAll('.cd-chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      if(c.disabled) return;
      if(activeChip === c){ clearActiveChip(); return; }
      clearActiveChip();
      activeChip = c;
      c.style.background = '#fff3c4';
      c.style.boxShadow = '0 0 0 3px rgba(249,202,36,.4)';
    });
  });

  document.querySelectorAll('.cd-hit').forEach(h=>{
    h.addEventListener('click', ()=>{
      if(h.classList.contains('locked')) return;
      const i = parseInt(h.dataset.blank);
      if(activeChip){
        // Fill this blank with the active chip's word
        const w = activeChip.dataset.w;
        // If this blank was previously filled, free that chip
        if(fills[i] != null){
          const prev = document.querySelector(`.cd-chip[data-w="${fills[i].replace(/"/g,'&quot;')}"]`);
          if(prev){ prev.classList.remove('used'); prev.disabled = false; }
        }
        fills[i] = w;
        setNodeText(i, w, 'cd-node filled');
        activeChip.classList.add('used');
        activeChip.disabled = true;
        clearActiveChip();
      } else {
        // Clicking a filled blank without an active chip → un-fill (return word to bank)
        if(fills[i] != null){
          const w = fills[i];
          const chip = document.querySelector(`.cd-chip[data-w="${w.replace(/"/g,'&quot;')}"]`);
          if(chip){ chip.classList.remove('used'); chip.disabled = false; }
          fills[i] = null;
          setNodeText(i, '?', 'cd-node blank');
        }
      }
    });
  });

  document.getElementById('cdSub').addEventListener('click', ()=>{
    // Check that all blanks are filled
    const blanksIdx = nodes.map((n,i)=>n.blank?i:-1).filter(i=>i>=0);
    const unfilled = blanksIdx.filter(i=>fills[i]==null);
    if(unfilled.length){
      const fb = document.getElementById('fb');
      fb.className='fb info show';
      fb.innerHTML = lang==='en'
        ? `<strong>Fill all the blanks first.</strong>`
        : `<strong>Isi semua kotak kosong dulu.</strong>`;
      return;
    }
    // Score each blank
    let okAll = true;
    blanksIdx.forEach(i=>{
      const exp = norm(t(nodes[i].label));
      const got = norm(fills[i]);
      const correct = exp === got;
      if(!correct) okAll = false;
      setNodeText(i, fills[i], correct ? 'cd-node filled' : 'cd-node wrong');
      // Lock hit area
      const h = document.querySelector(`[data-blank="${i}"]`);
      if(h) h.classList.add('locked');
    });
    document.querySelectorAll('.cd-chip').forEach(c=>c.disabled=true);
    document.getElementById('cdSub').disabled = true;
    // If wrong, show correct labels next to wrong ones
    if(!okAll){
      blanksIdx.forEach(i=>{
        if(norm(fills[i]) !== norm(t(nodes[i].label))){
          setTimeout(()=>setNodeText(i, t(nodes[i].label), 'cd-node filled'), 800);
        }
      });
    }
    checkAnswer(okAll, ()=>{});
  });
}

// ════════════════════════════════════════════════════════════════
// ANSWER CHECK
// ════════════════════════════════════════════════════════════════
function registerResult(ok){
  if(lastResult !== null) return;
  lastResult = ok ? 'correct' : 'wrong';
  if(ok) stats.correct++; else stats.wrong++;
  stats.done++;
  if(isUAS && current._chapter){
    uasBreakdown[current._chapter] = uasBreakdown[current._chapter] || {correct:0,total:0};
    if(ok) uasBreakdown[current._chapter].correct++;
  }
  // ── Per-topic tracking (used to build the weak-areas queue after UAS) ──
  const tp = (current && (current._topic || current.topic)) || null;
  if(tp){
    topicStats[tp] = topicStats[tp] || {correct:0, wrong:0, recentWrong:[]};
    if(ok){ topicStats[tp].correct++; topicStats[tp].recentWrong.push(0); }
    else  { topicStats[tp].wrong++;   topicStats[tp].recentWrong.push(1); }
    if(topicStats[tp].recentWrong.length > 5) topicStats[tp].recentWrong.shift();
  }
  // ── SmartScore update during weak-practice loop ──
  if(isWeakPractice){
    weakCount++;
    if(ok) smartScore = Math.min(100, smartScore + 5);
    else   smartScore = Math.max(0,   smartScore - 3);
  }
  updateScore();
}

function checkAnswer(ok, lockFn){
  registerResult(ok);
  if(lockFn) lockFn();
  const fb = document.getElementById('fb');
  const stepsArr = current.steps ? t(current.steps) : [];
  const stepsHtml = (stepsArr||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('');
  const conceptHtml = current.concept ? `<div class="concept-box">💡 ${t(current.concept)}</div>` : '';
  if(ok){
    fb.className = 'fb correct show';
    const lbl = lang==='en' ? '✅ Correct! Well done!' : '✅ Benar! Bagus sekali!';
    fb.innerHTML = `<strong>${lbl}</strong>${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
    if(stats.correct>0 && stats.correct%3===0) confetti();
  } else {
    fb.className = 'fb wrong show';
    let correctText = '';
    if(current.type==='mcq') correctText = t(current.opts[current.ans]);
    else if(current.type==='tf') correctText = current.ans ? (lang==='en'?'True':'Benar') : (lang==='en'?'False':'Salah');
    else if(current.type==='fill' || current.type==='fill_bank') correctText = current.display ? t(current.display) : current.answers[0];
    else if(current.type==='multi_check') correctText = current.correctIdx.map(i=>t(current.opts[i])).join(' + ');
    else if(current.type==='match_pairs') correctText = (current.pairs||[]).map(p=>`${t(p.term)} ↔ ${t(p.meaning)}`).join('; ');
    else if(current.type==='cycle_diagram') correctText = (current.nodes||[]).filter(n=>n.blank).map(n=>t(n.label)).join(' / ');
    const lbl = lang==='en' ? '❌ Not quite.' : '❌ Belum tepat.';
    const isLbl = lang==='en' ? 'The correct answer is' : 'Jawaban yang benar adalah';
    fb.innerHTML = `<strong>${lbl}</strong> ${isLbl} <strong>${correctText}</strong>.${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
  }
  // ── Mastery reached during weak-practice → auto-finish (math pattern) ──
  if(isWeakPractice && smartScore >= 100){
    confetti();
    setTimeout(()=>{ window.scrollTo({top:0,behavior:'smooth'}); renderDone(); }, 1600);
    return;
  }
  setTimeout(()=>{
    const nxt = document.createElement('button');
    nxt.className = 'restart-btn';
    nxt.style.marginTop = '16px';
    nxt.style.padding = '10px 24px';
    nxt.style.fontSize = '.88rem';
    const willContinue = isWeakPractice && smartScore < 100;
    nxt.textContent = (idx+1 >= total && !willContinue)
      ? (lang==='en' ? '🏁 See Results' : '🏁 Lihat Hasil')
      : (lang==='en' ? 'Next Question →' : 'Soal Berikutnya →');
    nxt.onclick = ()=>{ idx++; next(); };
    fb.appendChild(nxt);
  }, 300);
}

// ════════════════════════════════════════════════════════════════
// DONE SCREEN
// ════════════════════════════════════════════════════════════════
function renderDone(){
  // ── Mastery screen: weak-practice loop reached SmartScore 100 ──
  if(isWeakPractice && smartScore >= 100){
    const retryLbl = lang==='en'?'🔄 Try Again':'🔄 Coba Lagi';
    const backLbl  = lang==='en'?'← Back to topics':'← Kembali ke daftar topik';
    const head = lang==='en'
      ? '🏆 Mastered!'
      : '🏆 Mantap!';
    const sub = lang==='en'
      ? 'You reached 100% after practising your weak areas.'
      : 'Kamu mencapai 100% setelah berlatih area lemah.';
    const uasLbl    = lang==='en'?'UAS score':'Skor UAS';
    const smartLbl  = lang==='en'?'SmartScore':'SmartScore';
    const weakLbl   = lang==='en'?'Weak-area questions answered':'Soal latihan area lemah';
    document.getElementById('quizSlot').innerHTML = `
      <div class="q-card done">
        <h2>${head}</h2>
        <p>${sub}</p>
        <div class="done-stats">
          <div class="done-stat"><strong>${originalUasAcc}%</strong><span>${uasLbl}</span></div>
          <div class="done-stat"><strong>100/100</strong><span>${smartLbl}</span></div>
          <div class="done-stat"><strong>${weakCount}</strong><span>${weakLbl}</span></div>
        </div>
        <button class="restart-btn" onclick="location.reload()">${retryLbl}</button>
        <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#00b894;font-weight:700;text-decoration:none">${backLbl}</a></p>
      </div>`;
    for(let i=0;i<5;i++) setTimeout(confetti, i*250);
    return;
  }

  const pct = total>0 ? Math.round((stats.correct/total)*100) : 0;
  let msg;
  if(lang==='en'){
    msg = pct>=80 ? '🎉 Outstanding!' : pct>=60 ? '👍 Good job!' : pct>=40 ? '💪 Keep practising!' : '📚 Time to review!';
  } else {
    msg = pct>=80 ? '🎉 Luar biasa!' : pct>=60 ? '👍 Kerja bagus!' : pct>=40 ? '💪 Terus berlatih!' : '📚 Saatnya belajar lagi!';
  }
  const finishedLbl = lang==='en'
    ? `You finished <strong>${total}</strong> questions.`
    : `Kamu menyelesaikan <strong>${total}</strong> soal.`;
  const correctLbl = lang==='en'?'Correct':'Benar';
  const wrongLbl = lang==='en'?'Wrong':'Salah';
  const scoreLbl = lang==='en'?'Score':'Skor';
  const retryLbl = lang==='en'?'🔄 Try Again':'🔄 Coba Lagi';
  const backLbl = lang==='en'?'← Back to topics':'← Kembali ke daftar topik';

  let breakdownHtml = '';
  if(isUAS){
    const bdTitle = lang==='en'?'📊 Score by Chapter':'📊 Skor per Bab';
    const rows = Object.entries(uasBreakdown).map(([ch,v])=>{
      const ratio = v.total>0 ? (v.correct/v.total) : 0;
      const cls = ratio < 0.5 ? 'low' : '';
      return `<div class="breakdown-row"><span class="bd-label">${ch}</span><span class="bd-score ${cls}">${v.correct} / ${v.total}</span></div>`;
    }).join('');
    breakdownHtml = `<div class="breakdown"><h4>${bdTitle}</h4>${rows}</div>`;
  }

  // For a UAS with acc >= 90 we still show the normal done screen, but add a note.
  const greatWorkNote = (isUAS && !isWeakPractice && pct>=90) ? `
    <p style="margin-top:8px;color:#00b894;font-weight:600">
      ${lang==='en'?'✨ Great work — no weak-area practice needed!':'✨ Mantap — tidak perlu latihan area lemah!'}
    </p>` : '';

  document.getElementById('quizSlot').innerHTML = `
    <div class="q-card done">
      <h2>${msg}</h2>
      <p>${finishedLbl}</p>
      ${greatWorkNote}
      <div class="done-stats">
        <div class="done-stat"><strong>${stats.correct}</strong><span>${correctLbl}</span></div>
        <div class="done-stat"><strong>${stats.wrong}</strong><span>${wrongLbl}</span></div>
        <div class="done-stat"><strong>${pct}%</strong><span>${scoreLbl}</span></div>
      </div>
      ${breakdownHtml}
      <button class="restart-btn" onclick="location.reload()">${retryLbl}</button>
      <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#00b894;font-weight:700;text-decoration:none">${backLbl}</a></p>
    </div>`;
  if(pct>=70) for(let i=0;i<3;i++) setTimeout(confetti, i*250);
}

function confetti(){
  const colors=['#00b894','#0ea5e9','#6366f1','#f9ca24','#e17055','#fd79a8'];
  for(let i=0;i<24;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=pick(colors);
    c.style.left=(Math.random()*100)+'vw';
    c.style.top='-20px';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    c.style.borderRadius=Math.random()<0.5?'50%':'2px';
    document.body.appendChild(c);
    const dx=(Math.random()-0.5)*200;
    const dur=1500+Math.random()*1000;
    c.animate([{transform:c.style.transform,opacity:1,top:'-20px'},
               {transform:`translate(${dx}px,${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:0,top:`${window.innerHeight+40}px`}],
              {duration:dur,easing:'cubic-bezier(.3,.7,.4,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}
