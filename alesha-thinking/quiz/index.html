<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinking Lab — Practice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#0f172a 0%,#1e1b4b 100%);min-height:100vh;display:flex;flex-direction:column;color:#e2e8f0}

/* Header */
.hdr{background:linear-gradient(135deg,#0f172a,#312e81 60%,#1e293b);color:#fff;padding:18px 20px;position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1.5px solid rgba(251,191,36,.4)}
.hdr-back{background:rgba(251,191,36,.15);border:1.5px solid rgba(251,191,36,.5);color:#fbbf24;padding:6px 12px;border-radius:18px;font-size:.78rem;font-weight:800;text-decoration:none}
.hdr-back:hover{background:rgba(251,191,36,.28)}
.hdr-title{font-size:1.05rem;font-weight:900;letter-spacing:-.3px;flex:1;color:#fbbf24}
.hdr-meta{font-size:.72rem;font-weight:800;opacity:.95;background:rgba(251,191,36,.15);color:#fde68a;padding:5px 12px;border-radius:16px;font-family:'SF Mono','Menlo',monospace;letter-spacing:1px}
.lang-toggle{background:rgba(251,191,36,.15);border:1.5px solid rgba(251,191,36,.5);color:#fbbf24;padding:6px 12px;border-radius:18px;font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit}
.lang-toggle:hover{background:rgba(251,191,36,.28)}

/* Progress bar */
.progress-wrap{background:#1e293b;padding:10px 20px;box-shadow:0 2px 8px rgba(0,0,0,.4);border-bottom:1px solid #334155}
.progress{display:flex;gap:4px;align-items:center}
.progress-bar{flex:1;height:8px;background:#0f172a;border-radius:5px;overflow:hidden;border:1px solid #334155}
.progress-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:5px;transition:width .35s ease}
.progress-text{font-size:.74rem;font-weight:800;color:#fbbf24;min-width:75px;text-align:right;font-family:'SF Mono','Menlo',monospace}

/* Score chips */
.score-row{display:flex;gap:10px;margin:14px auto 0;max-width:720px;padding:0 16px;flex-wrap:wrap}
.score-chip{flex:1;min-width:0;background:#1e293b;border-radius:14px;padding:10px 12px;text-align:center;border:1.5px solid #334155;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;font-family:'SF Mono','Menlo',monospace}
.score-chip strong{display:block;font-size:1.3rem;letter-spacing:-.5px;margin-bottom:2px;color:#e2e8f0;text-transform:none;font-family:inherit}
.score-chip.correct{border-color:#10b981;background:rgba(16,185,129,.12)}
.score-chip.correct strong{color:#34d399}
.score-chip.wrong{border-color:#f43f5e;background:rgba(244,63,94,.12)}
.score-chip.wrong strong{color:#fb7185}
.score-chip.answered{border-color:#fbbf24;background:rgba(251,191,36,.12)}
.score-chip.answered strong{color:#fbbf24}

/* Main quiz container */
.main{max-width:720px;margin:18px auto 0;padding:0 16px 80px;width:100%}
.q-card{background:#1e293b;border-radius:18px;padding:28px 24px 22px;box-shadow:0 8px 32px rgba(0,0,0,.45);border:1.5px solid #334155;position:relative}
.q-card::before{content:'CASE FILE #' attr(data-case);position:absolute;top:14px;right:18px;font-family:'SF Mono','Menlo',monospace;font-size:.6rem;font-weight:900;letter-spacing:2px;color:#475569}
.q-badge{display:inline-block;background:rgba(251,191,36,.15);color:#fbbf24;font-size:.66rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:14px;margin-bottom:14px;font-family:'SF Mono','Menlo',monospace}
.q-badge.mcq{background:rgba(34,211,238,.18);color:#67e8f9}
.q-badge.tf{background:rgba(244,63,94,.18);color:#fda4af}
.q-badge.fill{background:rgba(139,92,246,.2);color:#c4b5fd}
.q-badge.essay{background:rgba(16,185,129,.18);color:#6ee7b7}
.q-badge.multi_check{background:rgba(56,189,248,.2);color:#7dd3fc}
.q-badge.scenario{background:rgba(251,191,36,.2);color:#fbbf24}
.q-badge.fill_bank{background:rgba(244,114,182,.2);color:#fbcfe8}

/* Question text */
.q-text{font-size:1.02rem;line-height:1.6;background:rgba(251,191,36,.06);border-left:4px solid #fbbf24;padding:14px 18px;border-radius:8px;margin-bottom:18px;color:#e2e8f0}
.q-text strong{font-weight:800;color:#fbbf24}
.q-text b{font-weight:800;color:#fde68a}

/* Evidence/Clues box */
.evidence{background:#0f172a;border:1.5px solid #475569;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-family:'SF Mono','Menlo',monospace}
.evidence-title{font-size:.7rem;font-weight:900;letter-spacing:2px;color:#fbbf24;margin-bottom:8px;text-transform:uppercase}
.evidence ul{list-style:none;padding:0;margin:0}
.evidence li{font-size:.86rem;color:#cbd5e1;padding:5px 0 5px 18px;position:relative;line-height:1.5}
.evidence li::before{content:'▸';position:absolute;left:2px;color:#fbbf24;font-weight:900}

/* MCQ options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#0f172a;border:2px solid #334155;border-radius:14px;padding:13px 16px;cursor:pointer;font-size:.94rem;display:flex;align-items:center;gap:14px;transition:all .15s;font-family:inherit;text-align:left;width:100%;color:#e2e8f0}
.opt:hover:not(:disabled){border-color:#fbbf24;background:rgba(251,191,36,.08)}
.opt-letter{width:30px;height:30px;border-radius:50%;background:rgba(251,191,36,.18);color:#fbbf24;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;font-family:'SF Mono','Menlo',monospace}
.opt:disabled{cursor:not-allowed}
.opt.correct{border-color:#10b981;background:rgba(16,185,129,.12)}
.opt.correct .opt-letter{background:#10b981;color:#fff}
.opt.wrong{border-color:#f43f5e;background:rgba(244,63,94,.12)}
.opt.wrong .opt-letter{background:#f43f5e;color:#fff}

/* True/False */
.tf-row{display:flex;gap:12px}
.tf-btn{flex:1;background:#0f172a;border:2px solid #334155;border-radius:14px;padding:18px 14px;cursor:pointer;font-size:1.05rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .15s;font-family:inherit;color:#e2e8f0}
.tf-btn:hover:not(:disabled){transform:translateY(-2px);border-color:#fbbf24}
.tf-btn.true{color:#34d399}
.tf-btn.false{color:#fb7185}
.tf-btn:disabled{cursor:not-allowed;opacity:.7}
.tf-btn.correct{border-color:#10b981;background:rgba(16,185,129,.12)}
.tf-btn.wrong{border-color:#f43f5e;background:rgba(244,63,94,.12)}
.tf-icon{font-size:1.3rem}

/* Fill-in-blank */
.fill-row{display:flex;gap:10px;align-items:stretch}
.fill-input{flex:1;font-family:inherit;font-size:1rem;font-weight:700;padding:13px 16px;border:2px dashed #c4b5fd;border-radius:14px;background:rgba(139,92,246,.08);color:#e2e8f0;outline:none}
.fill-input:focus{border-style:solid;border-color:#fbbf24;background:#0f172a;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.fill-input:disabled{opacity:.85;background:#0f172a}
.fill-submit{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0f172a;border:none;border-radius:14px;padding:0 22px;font-size:.9rem;font-weight:900;cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap;letter-spacing:.5px}
.fill-submit:hover:not(:disabled){opacity:.88}
.fill-submit:disabled{cursor:not-allowed;opacity:.5}

/* Essay */
.essay-area{width:100%;font-family:inherit;font-size:.94rem;padding:14px 16px;border:2px dashed #c4b5fd;border-radius:14px;background:rgba(139,92,246,.08);color:#e2e8f0;outline:none;resize:vertical;min-height:100px;line-height:1.5}
.essay-area:focus{border-style:solid;border-color:#fbbf24;background:#0f172a;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.essay-area:disabled{opacity:.85}
.essay-show{margin-top:12px;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border:none;border-radius:14px;padding:11px 22px;font-size:.86rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s}
.essay-show:hover:not(:disabled){opacity:.88}
.essay-self{display:none;gap:10px;margin-top:12px}
.essay-self.show{display:flex}
.essay-self button{flex:1;border:2px solid;border-radius:14px;padding:12px;font-size:.86rem;font-weight:800;cursor:pointer;font-family:inherit;background:#0f172a}
.essay-self .got{border-color:#10b981;color:#34d399}
.essay-self .got:hover{background:rgba(16,185,129,.12)}
.essay-self .miss{border-color:#fb923c;color:#fb923c}
.essay-self .miss:hover{background:rgba(251,146,60,.12)}

/* Multi-check */
.mc-instr{font-size:.85rem;color:#94a3b8;font-weight:700;margin-bottom:8px}
.mc-opt{background:#0f172a;border:2px solid #334155;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:.93rem;display:flex;align-items:center;gap:12px;transition:all .15s;font-family:inherit;text-align:left;width:100%;color:#e2e8f0;margin-bottom:8px}
.mc-opt:hover:not(.locked){border-color:#67e8f9;background:rgba(34,211,238,.08)}
.mc-box{width:22px;height:22px;border-radius:6px;border:2px solid #475569;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:900;color:#fff;background:#1e293b}
.mc-opt.checked .mc-box{background:#0891b2;border-color:#0891b2}
.mc-opt.checked .mc-box::after{content:'✓'}
.mc-opt.correct{border-color:#10b981;background:rgba(16,185,129,.12)}
.mc-opt.correct .mc-box{background:#10b981;border-color:#10b981}
.mc-opt.correct .mc-box::after{content:'✓'}
.mc-opt.wrong{border-color:#f43f5e;background:rgba(244,63,94,.12)}
.mc-opt.wrong .mc-box{background:#f43f5e;border-color:#f43f5e}
.mc-opt.wrong .mc-box::after{content:'✗'}
.mc-opt.missed{border-color:#fbbf24;background:rgba(251,191,36,.12)}
.mc-opt.missed .mc-box{background:#fbbf24;border-color:#fbbf24}
.mc-opt.missed .mc-box::after{content:'!'}
.mc-opt.locked{cursor:not-allowed}

/* Word bank */
.bank-wrap{background:rgba(251,191,36,.06);border:1.5px solid rgba(251,191,36,.35);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.bank-title{font-size:.7rem;font-weight:900;letter-spacing:2px;color:#fbbf24;margin-bottom:8px;font-family:'SF Mono','Menlo',monospace}
.bank-chips{display:flex;flex-wrap:wrap;gap:6px}
.bank-chip{background:#0f172a;border:1.5px solid rgba(251,191,36,.5);color:#fde68a;padding:6px 12px;border-radius:14px;font-size:.84rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.bank-chip:hover:not(:disabled){background:rgba(251,191,36,.15);transform:translateY(-1px)}
.bank-chip:disabled{cursor:not-allowed;opacity:.4}
.bank-chip.used{background:#1e293b;border-color:#475569;color:#64748b;text-decoration:line-through}

/* Scenario */
.scenario-part{background:rgba(99,102,241,.08);border-left:4px solid #6366f1;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.scenario-part-label{font-size:.72rem;font-weight:900;color:#a5b4fc;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;font-family:'SF Mono','Menlo',monospace}
.scenario-part-q{font-size:.95rem;line-height:1.5;margin-bottom:10px;font-weight:600;color:#e2e8f0}
.scenario-part .opts{margin-top:6px}
.scenario-part .opt{padding:10px 14px;font-size:.88rem}
.scenario-part .fill-row{margin-top:4px}
.scenario-part .essay-area{min-height:70px}
.scenario-part-result{margin-top:8px;font-size:.85rem;font-weight:700;padding:6px 10px;border-radius:8px;display:none}
.scenario-part-result.show{display:block}
.scenario-part-result.ok{background:rgba(16,185,129,.15);color:#6ee7b7}
.scenario-part-result.bad{background:rgba(244,63,94,.15);color:#fda4af}
.scenario-check-all{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0f172a;border:none;border-radius:14px;padding:13px 24px;font-size:.92rem;font-weight:900;cursor:pointer;font-family:inherit;width:100%;margin-top:6px;letter-spacing:.5px}
.scenario-check-all:hover:not(:disabled){opacity:.92}
.scenario-check-all:disabled{cursor:not-allowed;opacity:.5}

/* Feedback */
.fb{border-radius:14px;padding:16px 18px;margin-top:16px;font-size:.92rem;line-height:1.6;display:none}
.fb.show{display:block}
.fb.correct{background:rgba(16,185,129,.12);border:1.5px solid #10b981;color:#a7f3d0}
.fb.wrong{background:rgba(244,63,94,.12);border:1.5px solid #f43f5e;color:#fecdd3}
.fb.info{background:rgba(99,102,241,.15);border:1.5px solid #6366f1;color:#c7d2fe}
.fb strong{font-weight:900;color:#fff}
.fb b{color:#fde68a;font-weight:800}
.steps{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.step-num{width:22px;height:22px;border-radius:50%;background:#fbbf24;color:#0f172a;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0;font-family:'SF Mono','Menlo',monospace}
.concept-box{margin-top:12px;background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#78350f;font-weight:600}
.concept-box b{color:#451a03}

/* Hint */
.hint-row{margin-top:14px}
.hint-btn{background:transparent;border:1.5px dashed #fbbf24;color:#fbbf24;font-family:inherit;font-size:.85rem;font-weight:800;padding:8px 16px;border-radius:14px;cursor:pointer}
.hint-btn:hover{background:rgba(251,191,36,.12)}
.hint-box{display:none;background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#78350f;margin-top:10px;font-weight:600}
.hint-box.show{display:block}

/* Done screen */
.done{text-align:center;padding:34px 18px}
.done h2{font-size:2rem;font-weight:900;margin-bottom:10px;background:linear-gradient(135deg,#fbbf24,#fde68a 60%,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.done p{color:#cbd5e1;margin-bottom:22px;line-height:1.6}
.done-stats{display:flex;justify-content:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.done-stat{text-align:center}
.done-stat strong{display:block;font-size:2.2rem;font-weight:900;color:#fbbf24;font-family:inherit}
.done-stat span{font-size:.72rem;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;font-family:'SF Mono','Menlo',monospace}
.restart-btn{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#0f172a;border:none;border-radius:24px;padding:13px 30px;font-size:.95rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(251,191,36,.4);letter-spacing:.5px}
.restart-btn:hover{opacity:.92}

/* Logic grid puzzle */
.grid-puzzle{margin:10px 0 14px;overflow-x:auto}
.grid-puzzle table{border-collapse:collapse;margin:0 auto;background:#0f172a;border:1.5px solid #475569;border-radius:8px;overflow:hidden}
.grid-puzzle th,.grid-puzzle td{border:1px solid #334155;padding:6px 10px;text-align:center;font-size:.82rem;color:#e2e8f0;min-width:60px}
.grid-puzzle th{background:rgba(251,191,36,.15);color:#fbbf24;font-family:'SF Mono','Menlo',monospace;font-weight:900;letter-spacing:1px;font-size:.72rem;text-transform:uppercase}
.grid-puzzle td.head{background:rgba(251,191,36,.08);color:#fde68a;font-weight:800;text-align:left;padding-left:12px}

/* Suspects list (mystery cases) */
.suspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0 14px}
.suspect{background:#0f172a;border:1.5px solid #475569;border-radius:10px;padding:10px;text-align:center;font-size:.84rem;color:#cbd5e1}
.suspect .suspect-emoji{font-size:1.6rem;display:block;margin-bottom:4px}
.suspect strong{display:block;font-weight:800;color:#fde68a;font-size:.88rem}
.suspect small{color:#94a3b8;font-size:.7rem}

/* Confetti */
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1000}

@media(max-width:520px){
  .q-card{padding:24px 18px 18px}
  .q-text{font-size:.95rem;padding:12px 14px}
  .opt{padding:11px 13px;font-size:.88rem}
  .tf-btn{padding:16px 12px;font-size:1rem}
  .hdr-title{font-size:.92rem}
  .score-chip{font-size:.62rem;padding:8px}
  .score-chip strong{font-size:1.1rem}
  .fill-row{flex-direction:column}
  .fill-submit{padding:12px}
  .lang-toggle{padding:5px 9px;font-size:.7rem}
  .suspects{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="hdr">
  <a class="hdr-back" href="../">← Lab</a>
  <div class="hdr-title" id="hdrTitle">🕵️ Thinking Lab</div>
  <button class="lang-toggle" id="langBtn" onclick="toggleLang()">🌐 ID</button>
  <div class="hdr-meta" id="hdrMeta">Case 1</div>
</div>

<div class="progress-wrap">
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <div class="progress-text" id="progText">0 / 0</div>
  </div>
</div>

<div class="score-row">
  <div class="score-chip correct"><strong id="sCorrect">0</strong><span id="lblCorrect">✓ Solved</span></div>
  <div class="score-chip wrong"><strong id="sWrong">0</strong><span id="lblWrong">✗ Missed</span></div>
  <div class="score-chip answered"><strong id="sDone">0</strong><span id="lblDone">📋 Cases</span></div>
</div>

<div class="main">
  <div id="quizSlot"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const norm=s=>String(s||'').trim().toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');

let lang = localStorage.getItem('azth_lang') || 'en';
function t(obj){
  if(obj==null) return '';
  if(typeof obj==='string') return obj;
  if(Array.isArray(obj)) return obj.map(t);
  if(typeof obj==='object' && ('en' in obj || 'id' in obj)) return obj[lang] || obj.en || obj.id || '';
  return obj;
}
function toggleLang(){
  lang = lang==='en' ? 'id' : 'en';
  localStorage.setItem('azth_lang', lang);
  updateLangUI();
  if(current) renderQuestion();
}
function updateLangUI(){
  document.getElementById('langBtn').textContent = lang==='en' ? '🌐 ID' : '🌐 EN';
  document.getElementById('lblCorrect').textContent = lang==='en' ? '✓ Solved' : '✓ Selesai';
  document.getElementById('lblWrong').textContent = lang==='en' ? '✗ Missed' : '✗ Meleset';
  document.getElementById('lblDone').textContent = lang==='en' ? '📋 Cases' : '📋 Kasus';
  document.getElementById('hdrTitle').textContent = (currentChapterTitle ? t(currentChapterTitle) : (lang==='en'?'🕵️ Thinking Lab':'🕵️ Lab Berpikir'));
  document.getElementById('hdrMeta').textContent = (lang==='en'?'Case ':'Kasus ') + Math.min(idx+1,total) + (lang==='en'?' of ':' dari ') + total;
}

function mkOpts(correct, distractors){
  const all=[correct, ...distractors].slice(0,4);
  while(all.length<4) all.push({en:'—',id:'—'});
  const sh=shuf(all);
  return {opts:sh, ans:sh.indexOf(correct)};
}

// Render evidence list (used in mystery cases)
function evidenceBlock(title, items){
  const tt = title || {en:'CLUES',id:'PETUNJUK'};
  const lis = items.map(it=>`<li>${t(it)}</li>`).join('');
  return `<div class="evidence"><div class="evidence-title">🔍 ${t(tt)}</div><ul>${lis}</ul></div>`;
}
function suspectsBlock(list){
  const items = list.map(s=>`<div class="suspect"><span class="suspect-emoji">${s.emoji||'👤'}</span><strong>${t(s.name)}</strong>${s.tag?`<small>${t(s.tag)}</small>`:''}</div>`).join('');
  return `<div class="suspects">${items}</div>`;
}
function gridBlock(headers, rows){
  const hd = headers.map(h=>`<th>${t(h)}</th>`).join('');
  const bd = rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<td class="head">${t(c)}</td>`:`<td>${t(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="grid-puzzle"><table><thead><tr>${hd}</tr></thead><tbody>${bd}</tbody></table></div>`;
}

// ════════════════════════════════════════════════════════════════
// CHAPTER 1 — DETECTIVE LAB (mystery & deduction)
// ════════════════════════════════════════════════════════════════
const DETECTIVE_GEN = {
  // ─── Mystery Cases ───────────────────────────────────────────
  cookie_thief:()=>{
    const cor={en:'Budi',id:'Budi'};
    const{opts,ans}=mkOpts(cor,[{en:'Sari',id:'Sari'},{en:'Anya',id:'Anya'},{en:'Doni',id:'Doni'}]);

const CHAPTERS = {
  '1': {title:{en:'🕵️ Ch 1 · Detective Lab',id:'🕵️ Bab 1 · Lab Detektif'}, gen: DETECTIVE_GEN},
  '2': {title:{en:'🧩 Ch 2 · Brain Puzzles',id:'🧩 Bab 2 · Puzzle Otak'}, gen: PUZZLE_GEN},
  '3': {title:{en:'🤔 Ch 3 · Argument Detective',id:'🤔 Bab 3 · Detektif Argumen'}, gen: ARGUMENT_GEN},
  '4': {title:{en:'⚓ Ch 4 · Strategy Lab',id:'⚓ Bab 4 · Lab Strategi'}, gen: STRATEGY_GEN},
  'mix': {title:{en:'🎯 Mixed Cases',id:'🎯 Kasus Campuran'}, gen: {...DETECTIVE_GEN, ...PUZZLE_GEN, ...ARGUMENT_GEN, ...STRATEGY_GEN}, mixed:true},
};

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let queue=[], current=null, idx=0, total=0;
let stats={correct:0, wrong:0, done:0};
let lastResult=null;
let currentChapterTitle = null;

function buildQueue(chKey){
  const ch = CHAPTERS[chKey] || CHAPTERS['1'];
  currentChapterTitle = ch.title;
  const keys = shuf(Object.keys(ch.gen));
  let qs = keys.map(k => ch.gen[k]());
  if(ch.mixed){
    qs = shuf(qs).slice(0, 20);
  }
  queue = qs;
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  updateLangUI();
  updateScore();
  next();
}

function updateScore(){
  document.getElementById('sCorrect').textContent = stats.correct;
  document.getElementById('sWrong').textContent = stats.wrong;
  document.getElementById('sDone').textContent = stats.done;
  const pct = total>0 ? (stats.done/total)*100 : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progText').textContent = `${stats.done} / ${total}`;
  document.getElementById('hdrMeta').textContent = (lang==='en'?'Case ':'Kasus ') + Math.min(idx+1,total) + (lang==='en'?' of ':' dari ') + total;
}

function next(){
  if(idx >= total){
    renderDone();
    return;
  }
  current = queue[idx];
  lastResult = null;
  renderQuestion();
  updateScore();
}

// ════════════════════════════════════════════════════════════════
// RENDERERS
// ════════════════════════════════════════════════════════════════
function renderQuestion(){
  const slot = document.getElementById('quizSlot');
  let inner = '';
  switch(current.type){
    case 'mcq':         inner = mcqHtml(current); break;
    case 'tf':          inner = tfHtml(current); break;
    case 'fill':        inner = fillHtml(current); break;
    case 'essay':       inner = essayHtml(current); break;
    case 'multi_check': inner = multiCheckHtml(current); break;
    case 'scenario':    inner = scenarioHtml(current); break;
  }
  const caseNum = String(idx+1).padStart(3,'0');
  slot.innerHTML = `<div class="q-card" data-case="${caseNum}">${inner}</div>`;
  switch(current.type){
    case 'mcq':         attachMCQ(); break;
    case 'tf':          attachTF(); break;
    case 'fill':        attachFill(); break;
    case 'essay':       attachEssay(); break;
    case 'multi_check': attachMultiCheck(); break;
    case 'scenario':    attachScenario(); break;
  }
  attachHint();
}

function badgeFor(typ){
  const labels = {
    mcq:{en:'📋 Case Question',id:'📋 Soal Kasus'},
    tf:{en:'✅ True or False',id:'✅ Benar atau Salah'},
    fill:{en:'📝 Fill In',id:'📝 Isi Jawaban'},
    essay:{en:'📖 Short Answer',id:'📖 Uraian Singkat'},
    multi_check:{en:'☑️ Tick Multiple',id:'☑️ Centang Beberapa'},
    scenario:{en:'🔬 Multi-Step Case',id:'🔬 Kasus Bertahap'},
  };
  return `<span class="q-badge ${typ}">${t(labels[typ])}</span>`;
}

function diagramOf(q){
  if(!q.diagram) return '';
  if(typeof q.diagram === 'function') return q.diagram();
  if(typeof q.diagram === 'string') return q.diagram;
  return t(q.diagram);
}

function hintBlock(q){
  if(!q.hint) return '';
  const showLbl = lang==='en' ? '💡 Show Hint' : '💡 Tampilkan Petunjuk';
  return `<div class="hint-row">
    <button class="hint-btn" id="hintBtn">${showLbl}</button>
    <div class="hint-box" id="hintBox">${t(q.hint)}</div>
  </div>`;
}

function feedbackBlock(){
  return `<div class="fb" id="fb"></div>`;
}

// ── MCQ ─────────────────────────────────────────────────────────
function mcqHtml(q){
  const letters=['A','B','C','D'];
  const opts = q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="opt-letter">${letters[i]}</span><span>${t(o)}</span></button>`).join('');
  return `${badgeFor('mcq')}<div class="q-text">${t(q.q)}</div>${diagramOf(q)}<div class="opts">${opts}</div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachMCQ(){
  document.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = parseInt(b.dataset.i);
      checkAnswer(i === current.ans, ()=>{
        document.querySelectorAll('.opt').forEach((btn,j)=>{
          btn.disabled = true;
          if(j === current.ans) btn.classList.add('correct');
          else if(j === i) btn.classList.add('wrong');
        });
      });
    });
  });
}

// ── T/F ─────────────────────────────────────────────────────────
function tfHtml(q){
  const tL = lang==='en'?'True':'Benar';
  const fL = lang==='en'?'False':'Salah';
  return `${badgeFor('tf')}<div class="q-text">${t(q.q)}</div>${diagramOf(q)}
    <div class="tf-row">
      <button class="tf-btn true" data-v="true"><span class="tf-icon">✓</span> ${tL}</button>
      <button class="tf-btn false" data-v="false"><span class="tf-icon">✗</span> ${fL}</button>
    </div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachTF(){
  document.querySelectorAll('.tf-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const v = b.dataset.v === 'true';
      checkAnswer(v === current.ans, ()=>{
        document.querySelectorAll('.tf-btn').forEach(btn=>{
          btn.disabled = true;
          const bv = btn.dataset.v === 'true';
          if(bv === current.ans) btn.classList.add('correct');
          else if(bv === v) btn.classList.add('wrong');
        });
      });
    });
  });
}

// ── FILL ────────────────────────────────────────────────────────
function fillHtml(q){
  const ph = lang==='en' ? 'Type your answer…' : 'Ketik jawabanmu…';
  const btn = lang==='en' ? 'Check' : 'Periksa';
  return `${badgeFor('fill')}<div class="q-text">${t(q.q)}</div>${diagramOf(q)}
    <div class="fill-row">
      <input type="text" class="fill-input" id="fillInp" placeholder="${ph}" autocomplete="off"/>
      <button class="fill-submit" id="fillSub">${btn}</button>
    </div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachFill(){
  const inp = document.getElementById('fillInp');
  const sub = document.getElementById('fillSub');
  inp.focus();
  const submit = ()=>{
    const u = norm(inp.value);
    if(!u){ inp.focus(); return; }
    const ok = current.answers.some(a => norm(a) === u);
    checkAnswer(ok, ()=>{
      inp.disabled = true; sub.disabled = true;
      inp.style.borderColor = ok ? '#10b981' : '#f43f5e';
      inp.style.background = ok ? 'rgba(16,185,129,.12)' : 'rgba(244,63,94,.12)';
    });
  };
  sub.addEventListener('click', submit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

// ── ESSAY ───────────────────────────────────────────────────────
function essayHtml(q){
  const ph = lang==='en' ? 'Write your answer…' : 'Tulis jawabanmu…';
  const showBtn = lang==='en' ? '📋 Show Model Answer' : '📋 Tampilkan Jawaban Contoh';
  const got = lang==='en' ? '✓ I got it right' : '✓ Saya benar';
  const miss = lang==='en' ? '✗ Need to review' : '✗ Perlu belajar lagi';
  return `${badgeFor('essay')}<div class="q-text">${t(q.q)}</div>${diagramOf(q)}
    <textarea class="essay-area" id="essayInp" placeholder="${ph}"></textarea>
    <button class="essay-show" id="essayShow">${showBtn}</button>
    <div class="essay-self" id="essaySelf">
      <button class="got" data-v="1">${got}</button>
      <button class="miss" data-v="0">${miss}</button>
    </div>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachEssay(){
  const area = document.getElementById('essayInp');
  const show = document.getElementById('essayShow');
  const self = document.getElementById('essaySelf');
  const fb = document.getElementById('fb');
  show.addEventListener('click', ()=>{
    if(area.value.trim().length < 5){
      fb.className='fb info show';
      fb.innerHTML = lang==='en'
        ? `<strong>Write your answer first</strong> — even a sentence.`
        : `<strong>Tulis jawabanmu dulu</strong> — minimal satu kalimat.`;
      return;
    }
    area.disabled = true;
    show.style.display = 'none';
    fb.className = 'fb info show';
    const modelLbl = lang==='en' ? '📋 Model Answer:' : '📋 Jawaban Contoh:';
    fb.innerHTML = `<strong>${modelLbl}</strong><br><br>${t(current.model)}`;
    self.classList.add('show');
  });
  self.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const ok = b.dataset.v === '1';
      self.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.style.background = ok ? 'rgba(16,185,129,.18)' : 'rgba(251,146,60,.18)';
      registerResult(ok);
      if(current.concept){
        fb.innerHTML += `<div class="concept-box">💡 ${t(current.concept)}</div>`;
      }
      setTimeout(()=>{ idx++; next(); }, 1600);
    });
  });
}

// ── MULTI_CHECK ─────────────────────────────────────────────────
function multiCheckHtml(q){
  const need = q.require || (q.correctIdx||[]).length;
  const instr = lang==='en'
    ? `Tick <b>${need}</b> answer${need>1?'s':''}.`
    : `Centang <b>${need}</b> jawaban.`;
  const subBtn = lang==='en' ? 'Submit' : 'Kirim';
  const opts = q.opts.map((o,i)=>`
    <button type="button" class="mc-opt" data-i="${i}">
      <span class="mc-box"></span>
      <span>${t(o)}</span>
    </button>`).join('');
  return `${badgeFor('multi_check')}<div class="q-text">${t(q.q)}</div>${diagramOf(q)}
    <div class="mc-instr">${instr}</div>
    <div>${opts}</div>
    <button class="scenario-check-all" id="mcSub" style="margin-top:10px">${subBtn}</button>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachMultiCheck(){
  const need = current.require || (current.correctIdx||[]).length;
  const picked = new Set();
  document.querySelectorAll('.mc-opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.classList.contains('locked')) return;
      const i = parseInt(b.dataset.i);
      if(picked.has(i)){ picked.delete(i); b.classList.remove('checked'); }
      else { picked.add(i); b.classList.add('checked'); }
    });
  });
  document.getElementById('mcSub').addEventListener('click', ()=>{
    if(picked.size !== need){
      const fb = document.getElementById('fb');
      fb.className='fb info show';
      fb.innerHTML = lang==='en'
        ? `<strong>Please select exactly ${need} answer${need>1?'s':''}.</strong>`
        : `<strong>Pilih tepat ${need} jawaban.</strong>`;
      return;
    }
    const correctSet = new Set(current.correctIdx);
    let allRight = true;
    for(const c of correctSet) if(!picked.has(c)) allRight = false;
    for(const p of picked) if(!correctSet.has(p)) allRight = false;
    checkAnswer(allRight, ()=>{
      document.querySelectorAll('.mc-opt').forEach(b=>{
        b.classList.add('locked');
        const i = parseInt(b.dataset.i);
        if(correctSet.has(i) && picked.has(i)) b.classList.add('correct');
        else if(picked.has(i) && !correctSet.has(i)) b.classList.add('wrong');
        else if(correctSet.has(i) && !picked.has(i)) b.classList.add('missed');
      });
      document.getElementById('mcSub').disabled = true;
    });
  });
}

// ── SCENARIO ────────────────────────────────────────────────────
function scenarioHtml(q){
  const checkBtn = lang==='en' ? '✓ Check All Answers' : '✓ Periksa Semua Jawaban';
  const parts = q.parts.map((p,i)=>{
    const labelLbl = lang==='en' ? `Step ${i+1}` : `Langkah ${i+1}`;
    let body = '';
    if(p.kind==='mcq'){
      const letters=['A','B','C','D'];
      body = `<div class="opts">${p.opts.map((o,j)=>`<button type="button" class="opt sc-opt" data-part="${i}" data-i="${j}"><span class="opt-letter">${letters[j]}</span><span>${t(o)}</span></button>`).join('')}</div>`;
    } else if(p.kind==='fill'){
      const ph = lang==='en' ? 'Type your answer…' : 'Ketik jawabanmu…';
      body = `<div class="fill-row"><input type="text" class="fill-input sc-fill" data-part="${i}" placeholder="${ph}" autocomplete="off"/></div>`;
    } else if(p.kind==='essay'){
      const ph = lang==='en' ? 'Write your answer…' : 'Tulis jawabanmu…';
      body = `<textarea class="essay-area sc-essay" data-part="${i}" placeholder="${ph}"></textarea>`;
    }
    return `<div class="scenario-part" data-part="${i}">
      <div class="scenario-part-label">${labelLbl}</div>
      <div class="scenario-part-q">${t(p.q)}</div>
      ${body}
      <div class="scenario-part-result" data-part-result="${i}"></div>
    </div>`;
  }).join('');
  return `${badgeFor('scenario')}<div class="q-text">${t(q.q)}</div>${diagramOf(q)}
    ${parts}
    <button class="scenario-check-all" id="scCheck">${checkBtn}</button>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachScenario(){
  document.querySelectorAll('.sc-opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      const part = b.dataset.part;
      document.querySelectorAll(`.sc-opt[data-part="${part}"]`).forEach(x=>{
        x.dataset.picked = '0';
        x.style.borderColor=''; x.style.background='';
      });
      b.dataset.picked = '1';
      b.style.borderColor = '#fbbf24';
      b.style.background = 'rgba(251,191,36,.15)';
    });
  });
  document.getElementById('scCheck').addEventListener('click', ()=>{
    const parts = current.parts;
    let correctCount = 0;
    parts.forEach((p,i)=>{
      const resEl = document.querySelector(`[data-part-result="${i}"]`);
      let ok = false;
      if(p.kind==='mcq'){
        const picked = document.querySelector(`.sc-opt[data-part="${i}"][data-picked="1"]`);
        const pickedIdx = picked ? parseInt(picked.dataset.i) : -1;
        ok = pickedIdx === p.ans;
        document.querySelectorAll(`.sc-opt[data-part="${i}"]`).forEach(b=>{
          b.disabled = true;
          const j = parseInt(b.dataset.i);
          b.style.borderColor=''; b.style.background='';
          if(j === p.ans) b.classList.add('correct');
          else if(j === pickedIdx) b.classList.add('wrong');
        });
      } else if(p.kind==='fill'){
        const inp = document.querySelector(`.sc-fill[data-part="${i}"]`);
        const u = norm(inp.value);
        ok = !!u && p.answers.some(a => norm(a) === u);
        inp.disabled = true;
        inp.style.borderColor = ok ? '#10b981' : '#f43f5e';
        inp.style.background = ok ? 'rgba(16,185,129,.12)' : 'rgba(244,63,94,.12)';
      } else if(p.kind==='essay'){
        const area = document.querySelector(`.sc-essay[data-part="${i}"]`);
        const u = norm(area.value);
        const hits = (p.keys||[]).filter(k => u.includes(norm(k))).length;
        const need = Math.max(1, Math.ceil((p.keys||[]).length * 0.4));
        ok = u.length >= 20 && hits >= need;
        area.disabled = true;
      }
      if(ok) correctCount++;
      resEl.classList.remove('ok','bad'); resEl.classList.add('show', ok?'ok':'bad');
      if(p.kind==='fill'){
        resEl.innerHTML = ok
          ? (lang==='en'?'✓ Correct!':'✓ Benar!')
          : (lang==='en'?'✗ Expected: ':'✗ Jawaban: ') + `<b>${t(p.display)}</b>`;
      } else {
        resEl.innerHTML = ok ? (lang==='en'?'✓ Correct!':'✓ Benar!') : (lang==='en'?'✗ Not quite.':'✗ Belum tepat.');
      }
    });
    document.getElementById('scCheck').disabled = true;
    const partTotal = parts.length;
    const ok = correctCount >= Math.ceil(partTotal * 0.6);
    const fb = document.getElementById('fb');
    fb.className = `fb ${ok?'correct':'wrong'} show`;
    const conceptHtml = current.concept ? `<div class="concept-box">💡 ${t(current.concept)}</div>` : '';
    const summary = lang==='en'
      ? `You got <strong>${correctCount} of ${partTotal}</strong> steps right.`
      : `Kamu menjawab benar <strong>${correctCount} dari ${partTotal}</strong> langkah.`;
    fb.innerHTML = `<strong>${ok?(lang==='en'?'✅ Case cracked!':'✅ Kasus terpecahkan!'):(lang==='en'?'📚 Keep practising.':'📚 Terus berlatih.')}</strong> ${summary}${conceptHtml}`;
    registerResult(ok);
    setTimeout(()=>{
      const nxt = document.createElement('button');
      nxt.className = 'restart-btn';
      nxt.style.marginTop = '16px';
      nxt.style.padding = '10px 24px';
      nxt.style.fontSize = '.88rem';
      nxt.textContent = idx+1 >= total ? (lang==='en' ? '🏁 Case Closed' : '🏁 Tutup Kasus') : (lang==='en' ? 'Next Case →' : 'Kasus Berikutnya →');
      nxt.onclick = ()=>{ idx++; next(); };
      fb.appendChild(nxt);
    }, 300);
  });
}

function attachHint(){
  const btn = document.getElementById('hintBtn');
  const box = document.getElementById('hintBox');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    box.classList.toggle('show');
    const show = box.classList.contains('show');
    btn.textContent = show
      ? (lang==='en' ? '🙈 Hide Hint' : '🙈 Sembunyikan Petunjuk')
      : (lang==='en' ? '💡 Show Hint' : '💡 Tampilkan Petunjuk');
  });
}

// ════════════════════════════════════════════════════════════════
// ANSWER CHECK
// ════════════════════════════════════════════════════════════════
function registerResult(ok){
  if(lastResult !== null) return;
  lastResult = ok ? 'correct' : 'wrong';
  if(ok) stats.correct++; else stats.wrong++;
  stats.done++;
  updateScore();
}

function checkAnswer(ok, lockFn){
  registerResult(ok);
  if(lockFn) lockFn();
  const fb = document.getElementById('fb');
  const stepsArr = current.steps ? t(current.steps) : [];
  const stepsHtml = (stepsArr||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('');
  const conceptHtml = current.concept ? `<div class="concept-box">💡 ${t(current.concept)}</div>` : '';
  if(ok){
    fb.className = 'fb correct show';
    const lbl = lang==='en' ? '✅ Case cracked! Sharp thinking.' : '✅ Kasus terpecahkan! Berpikir tajam.';
    fb.innerHTML = `<strong>${lbl}</strong>${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
    if(stats.correct>0 && stats.correct%3===0) confetti();
  } else {
    fb.className = 'fb wrong show';
    let correctText = '';
    if(current.type==='mcq') correctText = t(current.opts[current.ans]);
    else if(current.type==='tf') correctText = current.ans ? (lang==='en'?'True':'Benar') : (lang==='en'?'False':'Salah');
    else if(current.type==='fill') correctText = current.display ? t(current.display) : current.answers[0];
    else if(current.type==='multi_check') correctText = current.correctIdx.map(i=>t(current.opts[i])).join(' + ');
    const lbl = lang==='en' ? '❌ Not quite — re-examine the clues.' : '❌ Belum tepat — periksa lagi petunjuknya.';
    const isLbl = lang==='en' ? 'The correct answer is' : 'Jawaban yang benar adalah';
    fb.innerHTML = `<strong>${lbl}</strong> ${isLbl} <strong>${correctText}</strong>.${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
  }
  setTimeout(()=>{
    const nxt = document.createElement('button');
    nxt.className = 'restart-btn';
    nxt.style.marginTop = '16px';
    nxt.style.padding = '10px 24px';
    nxt.style.fontSize = '.88rem';
    nxt.textContent = (idx+1 >= total)
      ? (lang==='en' ? '🏁 Case Closed' : '🏁 Tutup Kasus')
      : (lang==='en' ? 'Next Case →' : 'Kasus Berikutnya →');
    nxt.onclick = ()=>{ idx++; next(); };
    fb.appendChild(nxt);
  }, 300);
}

// ════════════════════════════════════════════════════════════════
// DONE SCREEN
// ════════════════════════════════════════════════════════════════
function renderDone(){
  const pct = total>0 ? Math.round((stats.correct/total)*100) : 0;
  let msg;
  if(lang==='en'){
    msg = pct>=80 ? '🏆 Case Closed — Master Detective!' : pct>=60 ? '🎉 Case Closed — Sharp work!' : pct>=40 ? '🔍 Case Closed — keep training!' : '📚 Back to the lab — review the files!';
  } else {
    msg = pct>=80 ? '🏆 Kasus Selesai — Detektif Master!' : pct>=60 ? '🎉 Kasus Selesai — Tajam!' : pct>=40 ? '🔍 Kasus Selesai — terus berlatih!' : '📚 Kembali ke lab — periksa ulang berkas!';
  }
  const finishedLbl = lang==='en'
    ? `You worked <strong>${total}</strong> cases.`
    : `Kamu mengerjakan <strong>${total}</strong> kasus.`;
  const correctLbl = lang==='en'?'Solved':'Selesai';
  const wrongLbl = lang==='en'?'Missed':'Meleset';
  const scoreLbl = lang==='en'?'Score':'Skor';
  const retryLbl = lang==='en'?'🔄 New Cases':'🔄 Kasus Baru';
  const backLbl = lang==='en'?'← Back to Lab':'← Kembali ke Lab';

  // Update solved count for rank tracking
  try {
    const prev = parseInt(localStorage.getItem('azth_solved')||'0',10) || 0;
    localStorage.setItem('azth_solved', String(prev + stats.correct));
  } catch(e){}

  document.getElementById('quizSlot').innerHTML = `
    <div class="q-card done">
      <h2>${msg}</h2>
      <p>${finishedLbl}</p>
      <div class="done-stats">
        <div class="done-stat"><strong>${stats.correct}</strong><span>${correctLbl}</span></div>
        <div class="done-stat"><strong>${stats.wrong}</strong><span>${wrongLbl}</span></div>
        <div class="done-stat"><strong>${pct}%</strong><span>${scoreLbl}</span></div>
      </div>
      <button class="restart-btn" onclick="location.reload()">${retryLbl}</button>
      <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#fbbf24;font-weight:700;text-decoration:none">${backLbl}</a></p>
    </div>`;
  if(pct>=70) for(let i=0;i<3;i++) setTimeout(confetti, i*250);
}

function confetti(){
  const colors=['#f59e0b','#fbbf24','#fde68a','#7c3aed','#f43f5e','#22d3ee'];
  for(let i=0;i<24;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=pick(colors);
    c.style.left=(Math.random()*100)+'vw';
    c.style.top='-20px';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    c.style.borderRadius=Math.random()<0.5?'50%':'2px';
    document.body.appendChild(c);
    const dx=(Math.random()-0.5)*200;
    const dur=1500+Math.random()*1000;
    c.animate([{transform:c.style.transform,opacity:1,top:'-20px'},
               {transform:`translate(${dx}px,${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:0,top:`${window.innerHeight+40}px`}],
              {duration:dur,easing:'cubic-bezier(.3,.7,.4,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}
