<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alesha's Code Lab — Play</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#fef3c7 0%,#e0f2fe 50%,#fce7f3 100%);min-height:100vh;color:#1f2937;display:flex;flex-direction:column}

/* Header */
.hdr{background:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(0,0,0,.06);border-bottom:3px solid #fbbf24}
.hdr-back{background:#fef3c7;border:2px solid #fbbf24;color:#b45309;padding:6px 14px;border-radius:18px;font-size:.78rem;font-weight:900;text-decoration:none}
.hdr-back:hover{background:#fde68a}
.hdr-title{font-size:1.1rem;font-weight:900;letter-spacing:-.4px;flex:1;color:#1f2937}
.hdr-meta{font-size:.72rem;font-weight:900;background:#f3f4f6;color:#475569;padding:5px 12px;border-radius:14px;font-family:'SF Mono','Menlo',monospace;letter-spacing:1px}
.lang-toggle{background:#ede9fe;border:2px solid #8b5cf6;color:#6d28d9;padding:6px 14px;border-radius:18px;font-size:.78rem;font-weight:900;cursor:pointer;font-family:inherit}
.lang-toggle:hover{background:#ddd6fe}

/* Mode accent strip */
.accent{height:6px}
body.mode-robot .accent{background:linear-gradient(90deg,#34d399,#10b981)}
body.mode-bug .accent{background:linear-gradient(90deg,#fb923c,#f97316)}
body.mode-gates .accent{background:linear-gradient(90deg,#a78bfa,#8b5cf6)}
body.mode-algorithm .accent{background:linear-gradient(90deg,#f472b6,#ec4899)}
body.mode-cipher .accent{background:linear-gradient(90deg,#60a5fa,#1e40af)}

/* Main */
.main{max-width:820px;margin:18px auto 0;padding:0 16px 80px;width:100%}
.card{background:#fff;border-radius:24px;padding:24px 22px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:3px solid #e5e7eb;margin-bottom:16px}

.level-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.level-badge{background:#fef3c7;color:#b45309;font-size:.7rem;font-weight:900;letter-spacing:1.5px;padding:5px 12px;border-radius:14px;font-family:'SF Mono','Menlo',monospace;text-transform:uppercase}
.level-title{font-size:1.2rem;font-weight:900;letter-spacing:-.4px;flex:1;min-width:200px}
.level-desc{font-size:.94rem;color:#475569;line-height:1.5;margin-bottom:14px;font-weight:600}

/* ───── ROBOT PROGRAMMER ───── */
.robot-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.robot-layout{grid-template-columns:1fr}}
.grid-wrap{background:#f0fdf4;border:3px solid #10b981;border-radius:18px;padding:12px;display:flex;justify-content:center;align-items:center}
.grid-board{position:relative;background:#fff;border-radius:12px;overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.06)}
.grid-tile{position:absolute;border:1px solid #d1fae5;background:#ecfdf5}
.grid-tile.wall{background:#1f2937;border-color:#111827}
.grid-tile.target{background:#fef3c7;border-color:#fbbf24}
.grid-tile.lit{background:#fde68a;box-shadow:inset 0 0 10px rgba(251,191,36,.6)}
.grid-tile.tolight{background:#dbeafe;border-color:#60a5fa}
.grid-char{position:absolute;font-size:32px;display:flex;align-items:center;justify-content:center;transition:left .3s ease,top .3s ease,transform .25s ease;z-index:5;line-height:1}
.grid-target-icon{position:absolute;font-size:24px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3}

.cmd-panel{display:flex;flex-direction:column;gap:12px}
.cmd-section-title{font-size:.74rem;font-weight:900;letter-spacing:1.5px;color:#475569;text-transform:uppercase;font-family:'SF Mono','Menlo',monospace}
.cmd-palette{display:flex;flex-wrap:wrap;gap:6px}
.cmd-btn{background:#fff;border:2px solid #10b981;color:#047857;padding:8px 12px;border-radius:14px;font-size:.84rem;font-weight:900;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:transform .12s}
.cmd-btn:hover{transform:translateY(-2px);background:#ecfdf5}
.cmd-btn:active{transform:translateY(0)}
.cmd-btn.loop{border-color:#8b5cf6;color:#6d28d9}
.cmd-btn.proc{border-color:#ec4899;color:#be185d}
.cmd-btn.cond{border-color:#f97316;color:#c2410c}

.queue{background:#f9fafb;border:2px dashed #d1d5db;border-radius:14px;padding:12px;min-height:80px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.queue:empty::before{content:attr(data-empty);color:#9ca3af;font-size:.84rem;font-weight:700;align-self:center;width:100%;text-align:center}
.queue-chip{background:#fff;border:2px solid #10b981;color:#047857;padding:6px 10px;border-radius:12px;font-size:.78rem;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.queue-chip:hover{background:#fee2e2;border-color:#ef4444;color:#b91c1c}
.queue-chip:hover::after{content:'✕';margin-left:3px}
.queue-chip.loop{border-color:#8b5cf6;color:#6d28d9}
.queue-chip.proc{border-color:#ec4899;color:#be185d}
.queue-chip.cond{border-color:#f97316;color:#c2410c}
.queue-chip.running{background:#fef3c7;border-color:#fbbf24;color:#b45309;animation:pulse .5s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.run-row{display:flex;gap:8px;flex-wrap:wrap}
.run-btn{flex:1;min-width:90px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:14px;padding:11px 14px;font-size:.92rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(16,185,129,.3);letter-spacing:.5px}
.run-btn:hover:not(:disabled){opacity:.92}
.run-btn:disabled{opacity:.5;cursor:not-allowed}
.run-btn.reset{background:linear-gradient(135deg,#6b7280,#4b5563);box-shadow:0 4px 12px rgba(107,114,128,.3)}
.run-btn.hint{background:linear-gradient(135deg,#fbbf24,#f59e0b);box-shadow:0 4px 12px rgba(251,191,36,.3);color:#78350f}

.proc-block{background:#fdf2f8;border:2px solid #ec4899;border-radius:12px;padding:10px;margin-top:6px}
.proc-label{font-size:.7rem;font-weight:900;color:#be185d;letter-spacing:1.5px;text-transform:uppercase;font-family:'SF Mono','Menlo',monospace;margin-bottom:6px}

.feedback{margin-top:14px;padding:14px 16px;border-radius:14px;font-size:.92rem;font-weight:700;line-height:1.5;display:none}
.feedback.show{display:block}
.feedback.ok{background:#ecfdf5;border:2px solid #10b981;color:#047857}
.feedback.bad{background:#fef2f2;border:2px solid #ef4444;color:#b91c1c}
.feedback.info{background:#eff6ff;border:2px solid #60a5fa;color:#1e40af}

.concept-box{margin-top:12px;background:#fef3c7;border:2px solid #fbbf24;border-radius:12px;padding:11px 14px;font-size:.86rem;color:#78350f;font-weight:700}
.concept-box b{color:#451a03}

/* ───── BUG HUNT ───── */
.code-block{background:#0f172a;border-radius:14px;padding:16px 14px;font-family:'SF Mono','Menlo',monospace;font-size:1.02rem;color:#e2e8f0;margin-bottom:14px;overflow-x:auto;line-height:1.9;border:2px solid #334155}
.code-line{display:flex;gap:14px;padding:3px 8px;border-radius:6px;transition:background .2s}
.code-line:hover{background:rgba(251,191,36,.08)}
.line-num{color:#fbbf24;width:30px;text-align:right;font-weight:900;user-select:none;flex-shrink:0;font-size:1.05rem}
.line-body{flex:1;white-space:pre}
.code-line.bug{background:rgba(239,68,68,.18);border-left:3px solid #ef4444;padding-left:5px}
.code-line.bug .line-num{color:#f87171}
.code-line.executing{background:rgba(251,191,36,.25);box-shadow:inset 0 0 0 2px #fbbf24}
.code-line.fix-line{background:rgba(16,185,129,.15);border-left:3px solid #10b981;padding-left:5px}
.code-line.fix-line .line-num{color:#34d399}

.bug-run-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bug-run-btn{background:linear-gradient(135deg,#fbbf24,#f97316);color:#78350f;border:none;border-radius:12px;padding:9px 16px;font-weight:900;cursor:pointer;font-family:inherit;font-size:.88rem;box-shadow:0 4px 12px rgba(251,146,60,.3)}
.bug-run-btn:hover:not(:disabled){opacity:.92}
.bug-run-btn:disabled{opacity:.5;cursor:not-allowed}

.bug-layout{display:grid;grid-template-columns:1fr;gap:10px}
.trace-box{background:#1e293b;border:2px solid #475569;border-radius:12px;padding:12px;color:#e2e8f0;font-family:'SF Mono','Menlo',monospace;font-size:.86rem;min-height:60px;margin-bottom:12px;display:none}
.trace-box.show{display:block}
.trace-title{font-size:.7rem;font-weight:900;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;margin-bottom:6px}
.trace-line{padding:3px 0;color:#cbd5e1}
.trace-line .var-name{color:#fbbf24;font-weight:900}
.trace-line .var-val{color:#86efac}

.io-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:560px){.io-row{grid-template-columns:1fr}}
.io-box{background:#f9fafb;border:3px solid #d1d5db;border-radius:14px;padding:14px 16px;position:relative}
.io-label{font-size:.78rem;font-weight:900;letter-spacing:1.5px;color:#6b7280;text-transform:uppercase;font-family:'SF Mono','Menlo',monospace;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.io-val{font-family:'SF Mono','Menlo',monospace;font-size:1.05rem;color:#1f2937;font-weight:800;white-space:pre-wrap;min-height:1.4em}
.io-box.expected{border-color:#10b981;background:#ecfdf5}
.io-box.expected .io-label{color:#047857;font-size:.85rem}
.io-box.actual{border-color:#ef4444;background:#fef2f2}
.io-box.actual .io-label{color:#b91c1c;font-size:.85rem}

/* ───── CIPHER LAB ───── */
body.mode-cipher .level-badge{background:#dbeafe;color:#1e40af}
.cipher-msg-box{background:#0f172a;border:3px solid #1e40af;border-radius:16px;padding:20px 16px;text-align:center;margin-bottom:14px}
.cipher-label{font-size:.7rem;font-weight:900;letter-spacing:2px;color:#60a5fa;text-transform:uppercase;font-family:'SF Mono','Menlo',monospace;margin-bottom:10px}
.cipher-encrypted{font-family:'SF Mono','Menlo',monospace;font-size:1.6rem;font-weight:900;letter-spacing:4px;color:#fbbf24;word-break:break-word;line-height:1.4}
.cipher-preview{font-family:'SF Mono','Menlo',monospace;font-size:1.3rem;font-weight:900;letter-spacing:3px;color:#86efac;margin-top:10px;min-height:1.6em;word-break:break-word}
.cipher-slider-wrap{background:#dbeafe;border:2px solid #1e40af;border-radius:14px;padding:14px 18px;margin-bottom:14px}
.cipher-slider-label{font-size:.82rem;font-weight:900;color:#1e3a8a;margin-bottom:8px;display:flex;justify-content:space-between}
.cipher-slider{width:100%;height:8px;border-radius:8px;background:#bfdbfe;outline:none;-webkit-appearance:none;appearance:none}
.cipher-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#1e40af;cursor:pointer;border:3px solid #fff;box-shadow:0 2px 8px rgba(30,64,175,.4)}
.cipher-slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#1e40af;cursor:pointer;border:3px solid #fff}
.cipher-key-table{background:#eff6ff;border:2px solid #60a5fa;border-radius:12px;padding:12px;margin-bottom:14px;font-family:'SF Mono','Menlo',monospace;font-size:.86rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.cipher-key-cell{background:#fff;border:1px solid #93c5fd;border-radius:6px;padding:5px 8px;text-align:center;font-weight:900;color:#1e40af}
.cipher-key-cell .sym{color:#dc2626;font-size:1.1em}
.cipher-input-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cipher-input{flex:1;min-width:200px;padding:11px 14px;font-size:1rem;font-weight:800;font-family:'SF Mono','Menlo',monospace;border:2px solid #1e40af;border-radius:12px;outline:none;text-transform:uppercase;letter-spacing:2px}
.cipher-input:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.cipher-decode-btn{background:linear-gradient(135deg,#1e40af,#1e3a8a);color:#fff;border:none;border-radius:12px;padding:11px 22px;font-weight:900;font-family:inherit;cursor:pointer;font-size:.92rem;box-shadow:0 4px 12px rgba(30,64,175,.3)}
.cipher-decode-btn:hover{opacity:.92}
.cipher-hint-btn{background:transparent;border:2px dashed #fbbf24;color:#b45309;font-family:inherit;font-size:.84rem;font-weight:900;padding:8px 14px;border-radius:12px;cursor:pointer}
.cipher-hint-btn:hover{background:#fef3c7}
.cipher-reveal{font-family:'SF Mono','Menlo',monospace;font-size:1.6rem;font-weight:900;letter-spacing:4px;color:#10b981;text-align:center;margin:10px 0;min-height:1.6em}
.cipher-reveal span{display:inline-block;opacity:0;animation:popLetter .4s ease forwards}
@keyframes popLetter{from{opacity:0;transform:scale(.5) translateY(-10px)}to{opacity:1;transform:scale(1) translateY(0)}}

.mode-cipher .opt-letter{background:#dbeafe;color:#1e40af}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:12px 14px;cursor:pointer;font-size:.92rem;display:flex;align-items:center;gap:12px;font-family:inherit;text-align:left;width:100%;color:#1f2937;font-weight:700;transition:all .12s}
.opt:hover:not(:disabled){border-color:#f97316;background:#fff7ed}
.opt-letter{width:28px;height:28px;border-radius:50%;background:#fff7ed;color:#c2410c;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;font-family:'SF Mono','Menlo',monospace}
.opt:disabled{cursor:not-allowed}
.opt.correct{border-color:#10b981;background:#ecfdf5}
.opt.correct .opt-letter{background:#10b981;color:#fff}
.opt.wrong{border-color:#ef4444;background:#fef2f2}
.opt.wrong .opt-letter{background:#ef4444;color:#fff}

/* ───── LOGIC GATES ───── */
.circuit{background:#0f172a;border:3px solid #8b5cf6;border-radius:18px;padding:16px;margin-bottom:14px}
.circuit svg{width:100%;height:auto;display:block}
.input-sw{cursor:pointer}
.input-sw circle{transition:fill .2s}
.wire{stroke-width:3;fill:none;transition:stroke .25s}
.wire.on{stroke:#fbbf24;filter:drop-shadow(0 0 4px #fbbf24)}
.wire.off{stroke:#475569}
.gate-shape{fill:#1e293b;stroke:#a78bfa;stroke-width:2}
.gate-label{fill:#e9d5ff;font-weight:900;font-size:14px;font-family:'SF Mono',monospace;text-anchor:middle;dominant-baseline:middle}
.bulb{transition:fill .25s,filter .25s}
.bulb.on{fill:#fbbf24;filter:drop-shadow(0 0 12px #fbbf24)}
.bulb.off{fill:#334155}
.node-label{fill:#cbd5e1;font-family:'SF Mono',monospace;font-size:13px;font-weight:900;text-anchor:middle;dominant-baseline:middle}

/* ───── ALGORITHM LAB ───── */
.bars{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:200px;background:#fdf2f8;border:3px solid #ec4899;border-radius:14px;padding:10px;margin-bottom:14px}
.bar{flex:0 0 50px;background:linear-gradient(180deg,#f472b6,#ec4899);border-radius:8px 8px 4px 4px;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:900;font-family:'SF Mono',monospace;padding-top:6px;font-size:.86rem;transition:transform .35s ease,background .25s;cursor:pointer;border:2px solid transparent}
.bar:hover{transform:translateY(-4px)}
.bar.selected{background:linear-gradient(180deg,#fde047,#f59e0b);color:#78350f;border-color:#f59e0b}
.bar.locked{cursor:default;opacity:.7}
.swap-btn{display:block;margin:0 auto 10px;background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;border:none;border-radius:14px;padding:9px 18px;font-weight:900;font-family:inherit;cursor:pointer;font-size:.88rem}
.swap-btn:disabled{opacity:.5;cursor:not-allowed}

.bs-display{background:#fdf2f8;border:3px solid #ec4899;border-radius:14px;padding:18px;text-align:center;margin-bottom:14px}
.bs-range{font-family:'SF Mono',monospace;font-weight:900;color:#be185d;font-size:1rem;margin-bottom:10px}
.bs-input{width:120px;padding:10px 14px;font-size:1.2rem;font-weight:900;font-family:'SF Mono',monospace;border:2px solid #ec4899;border-radius:12px;text-align:center;color:#1f2937;outline:none}
.bs-input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.bs-guess-btn{margin-left:6px;background:#ec4899;color:#fff;border:none;border-radius:12px;padding:10px 18px;font-weight:900;font-family:inherit;cursor:pointer}
.bs-history{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bs-guess{padding:5px 10px;border-radius:10px;font-size:.82rem;font-weight:900;font-family:'SF Mono',monospace;background:#fff;border:2px solid #d1d5db;color:#374151}
.bs-guess.high{border-color:#ef4444;color:#b91c1c;background:#fef2f2}
.bs-guess.low{border-color:#60a5fa;color:#1d4ed8;background:#eff6ff}
.bs-guess.win{border-color:#10b981;color:#047857;background:#ecfdf5}

.maze-grid{display:grid;gap:3px;background:#fdf2f8;border:3px solid #ec4899;border-radius:14px;padding:10px;margin:0 auto 14px;width:fit-content}
.maze-cell{width:44px;height:44px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;border:2px solid transparent;transition:all .15s}
.maze-cell.wall{background:#374151;cursor:default}
.maze-cell.start{background:#bbf7d0;border-color:#10b981}
.maze-cell.end{background:#fde68a;border-color:#fbbf24}
.maze-cell.path{background:#fce7f3;border-color:#ec4899}

.pattern-display{background:#fdf2f8;border:3px solid #ec4899;border-radius:14px;padding:18px;text-align:center;margin-bottom:14px}
.pattern-seq{font-size:1.4rem;font-weight:900;font-family:'SF Mono',monospace;color:#be185d;letter-spacing:4px;margin-bottom:12px}
.pattern-inputs{display:flex;gap:8px;justify-content:center}
.pattern-input{width:60px;padding:8px;font-size:1.1rem;font-weight:900;font-family:'SF Mono',monospace;border:2px solid #ec4899;border-radius:10px;text-align:center;outline:none}
.pattern-input:focus{border-color:#f59e0b}

.algo-stats{display:flex;gap:10px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.algo-stat{background:#fdf2f8;border:2px solid #ec4899;color:#be185d;padding:6px 14px;border-radius:14px;font-size:.78rem;font-weight:900;font-family:'SF Mono',monospace}

/* Done screen */
.done{text-align:center;padding:28px 18px;background:#fff;border-radius:24px;border:3px solid #fbbf24;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.done h2{font-size:2.2rem;font-weight:900;margin-bottom:10px;background:linear-gradient(135deg,#34d399,#fbbf24,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.done p{color:#475569;margin-bottom:18px;font-weight:600;line-height:1.5}
.done-stats{display:flex;justify-content:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.done-stat{text-align:center}
.done-stat strong{display:block;font-size:2rem;font-weight:900;color:#f97316}
.done-stat span{font-size:.7rem;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px}
.restart-btn{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;border:none;border-radius:24px;padding:12px 28px;font-size:.95rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(251,146,60,.35);margin:4px}
.restart-btn.alt{background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 6px 16px rgba(139,92,246,.35)}
.restart-btn:hover{opacity:.92}

/* Confetti */
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1000;border-radius:2px}

.hint-btn{background:transparent;border:2px dashed #fbbf24;color:#b45309;font-family:inherit;font-size:.84rem;font-weight:900;padding:7px 14px;border-radius:14px;cursor:pointer;margin-top:10px}
.hint-btn:hover{background:#fef3c7}
.hint-box{display:none;background:#fef3c7;border:2px solid #fbbf24;border-radius:12px;padding:10px 14px;font-size:.86rem;color:#78350f;margin-top:10px;font-weight:700}
.hint-box.show{display:block}

.next-btn{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;border-radius:14px;padding:11px 24px;font-size:.92rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(16,185,129,.3);margin-top:12px;letter-spacing:.5px}
.next-btn:hover{opacity:.92}

@media(max-width:520px){
  .hdr-title{font-size:.95rem}
  .level-title{font-size:1rem}
}

/* ── Tutorial overlay ── */
.tutorial-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.75);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .25s ease}
.tutorial-backdrop.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.tutorial-card{background:#fff;border-radius:28px;max-width:480px;width:100%;padding:30px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.tut-skip{position:absolute;top:14px;right:18px;background:transparent;border:none;color:#94a3b8;font-size:.82rem;font-weight:800;cursor:pointer;padding:6px 10px;border-radius:10px;transition:color .15s,background .15s}
.tut-skip:hover{color:#475569;background:#f1f5f9}
.tut-owl{font-size:3.4rem;display:block;text-align:center;margin-bottom:8px;animation:owlBob 2.5s ease-in-out infinite}
@keyframes owlBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.tut-title{font-size:1.35rem;font-weight:900;text-align:center;color:#1e293b;margin-bottom:6px;letter-spacing:-.4px}
.tut-step-label{font-size:.72rem;font-weight:900;color:#fbbf24;text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.tut-body{background:#f8fafc;border-radius:16px;padding:18px 18px;margin-bottom:18px;font-size:.95rem;line-height:1.55;color:#334155;font-weight:500}
.tut-body strong{color:#1e293b;font-weight:800}
.tut-body code{background:#1e293b;color:#fbbf24;font-family:'SF Mono','Menlo',monospace;font-size:.84em;padding:2px 7px;border-radius:6px}
.tut-body kbd{background:#fff;border:1.5px solid #cbd5e1;border-bottom-width:2.5px;border-radius:7px;padding:3px 8px;font-family:'SF Mono','Menlo',monospace;font-size:.8em;font-weight:800;color:#334155}
.tut-emoji-row{font-size:2rem;text-align:center;letter-spacing:14px;margin:8px 0 4px}
.tut-dots{display:flex;justify-content:center;gap:7px;margin-bottom:14px}
.tut-dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;transition:background .2s,transform .2s}
.tut-dot.active{background:#fbbf24;transform:scale(1.3)}
.tut-actions{display:flex;gap:10px;justify-content:space-between;align-items:center}
.tut-btn{font-family:inherit;font-weight:800;font-size:.92rem;padding:11px 22px;border-radius:14px;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tut-btn.prev{background:#f1f5f9;color:#64748b}
.tut-btn.prev:hover:not(:disabled){background:#e2e8f0}
.tut-btn.prev:disabled{opacity:.4;cursor:not-allowed}
.tut-btn.next{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;box-shadow:0 6px 16px rgba(251,146,60,.4);flex:1;max-width:200px}
.tut-btn.next:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(251,146,60,.5)}
.tut-replay-btn{position:fixed;bottom:18px;right:18px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;border:none;font-size:1.4rem;cursor:pointer;box-shadow:0 6px 18px rgba(251,146,60,.5);z-index:90;transition:transform .2s}
.tut-replay-btn:hover{transform:scale(1.1) rotate(15deg)}
</style>

const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'robot';
document.body.classList.add('mode-'+MODE);

let lang = localStorage.getItem('alesha_code_lang') || 'en';
function t(obj){
  if(obj==null) return '';
  if(typeof obj==='string') return obj;
  if(typeof obj==='object' && ('en' in obj || 'id' in obj)) return obj[lang] || obj.en || obj.id || '';
  return String(obj);
}
function toggleLang(){
  lang = lang==='en' ? 'id' : 'en';
  localStorage.setItem('alesha_code_lang', lang);
  document.getElementById('langBtn').textContent = lang==='en' ? '🌐 ID' : '🌐 EN';
  render();
}

const MODE_TITLES = {
  robot: {en:'🐢 Robot Programmer', id:'🐢 Programmer Robot'},

  algorithm: {en:'🦊 Algorithm Lab', id:'🦊 Lab Algoritma'},
  cipher: {en:'🔐 Cipher Lab', id:'🔐 Lab Sandi'},
};

// Fisher-Yates shuffle (in-place)
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function setHeader(meta){
  document.getElementById('hdrTitle').textContent = t(MODE_TITLES[MODE]);
  document.getElementById('hdrMeta').textContent = meta || '';
  document.getElementById('langBtn').textContent = lang==='en' ? '🌐 ID' : '🌐 EN';
  document.getElementById('backBtn').textContent = lang==='en' ? '← Back' : '← Kembali';
}

function confetti(){
  const colors=['#fbbf24','#f97316','#ec4899','#10b981','#8b5cf6','#60a5fa'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.top='-20px';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.transform='rotate('+Math.random()*360+'deg)';
    document.body.appendChild(c);
    const dx=(Math.random()-0.5)*300;
    const dy=window.innerHeight+50;
    const dur=2000+Math.random()*1500;
    c.animate([
      {transform:c.style.transform, opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`, opacity:0}
    ],{duration:dur, easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>c.remove();
  }
}

function saveProgress(key, id){
  const arr = JSON.parse(localStorage.getItem(key)||'[]');
  if(!arr.includes(id)){ arr.push(id); localStorage.setItem(key, JSON.stringify(arr)); }
}
function getProgress(key){
  return JSON.parse(localStorage.getItem(key)||'[]');
}

function renderRobot(){
  const lvl = ROBOT_LEVELS[ROBOT_STATE.level];
  if(!lvl){ renderDone('robot'); return; }
  setHeader((lang==='en'?'Level ':'Level ')+(ROBOT_STATE.level+1)+'/'+ROBOT_LEVELS.length);

  ROBOT_STATE.pos = {x:lvl.start.x, y:lvl.start.y};
  ROBOT_STATE.dir = lvl.start.dir;
  ROBOT_STATE.lit = new Set();

  const tileSize = lvl.grid.cols > 5 ? 50 : 60;
  const w = lvl.grid.cols * tileSize;
  const h = lvl.grid.rows * tileSize;

  let tilesHtml = '';
  for(let y=0; y<lvl.grid.rows; y++){
    for(let x=0; x<lvl.grid.cols; x++){
      const isWall = lvl.walls.some(w=>w.x===x&&w.y===y);
      const isTarget = lvl.target && lvl.target.x===x && lvl.target.y===y;
      const isToLight = lvl.tilesToLight.some(p=>p.x===x&&p.y===y);
      let cls='grid-tile';
      if(isWall) cls+=' wall';
      else if(isTarget) cls+=' target';
      else if(isToLight) cls+=' tolight';
      tilesHtml += `<div class="${cls}" data-x="${x}" data-y="${y}" style="left:${x*tileSize}px;top:${y*tileSize}px;width:${tileSize}px;height:${tileSize}px"></div>`;
    }
  }
  // Target icon
  let targetIcon = '';
  if(lvl.target){
    targetIcon = `<div class="grid-target-icon" style="left:${lvl.target.x*tileSize}px;top:${lvl.target.y*tileSize}px;width:${tileSize}px;height:${tileSize}px">🚩</div>`;
  }

  const dirAngle = {east:0, south:90, west:180, north:270}[lvl.start.dir];
  const charHtml = `<div class="grid-char" id="grid-char" style="left:${lvl.start.x*tileSize}px;top:${lvl.start.y*tileSize}px;width:${tileSize}px;height:${tileSize}px;transform:rotate(${dirAngle}deg)">🐢</div>`;

  // Command palette
  const paletteHtml = lvl.available.map(cmd=>{
    const m = ROBOT_CMD_META[cmd];
    return `<button class="cmd-btn ${m.cls}" onclick="addCmd('${cmd}')">${m.emoji} ${t(m.label)}</button>`;
  }).join('');

  const procSection = lvl.available.includes('proc') ? `
    <div>
      <div class="cmd-section-title">📦 ${lang==='en'?'Procedure body':'Isi prosedur'}</div>
      <div class="proc-block">
        <div class="proc-label">${lang==='en'?'proc() =':'proc() ='}</div>
        <div class="queue" id="proc-queue" data-empty="${lang==='en'?'Define the procedure body, then add commands here':'Isi prosedur, lalu tambah perintah di sini'}"></div>
      </div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        ${lvl.available.filter(c=>c!=='proc'&&c!=='loop'&&c!=='if_wall').map(cmd=>{
          const m = ROBOT_CMD_META[cmd];
          return `<button class="cmd-btn ${m.cls}" onclick="addCmd('${cmd}', true)" style="padding:5px 9px;font-size:.76rem">${m.emoji} ${t(m.label)}</button>`;
        }).join('')}
      </div>
    </div>` : '';

  document.getElementById('main').innerHTML = `
    <div class="card">
      <div class="level-head">
        <span class="level-badge">${lang==='en'?'LEVEL ':'LEVEL '}${ROBOT_STATE.level+1}</span>
        <div class="level-title">${t(lvl.title)}</div>
      </div>
      <div class="level-desc">${t(lvl.description)}</div>
      <div class="robot-layout">
        <div class="grid-wrap">
          <div class="grid-board" style="width:${w}px;height:${h}px">${tilesHtml}${targetIcon}${charHtml}</div>
        </div>
        <div class="cmd-panel">
          <div>
            <div class="cmd-section-title">🎯 ${lang==='en'?'Commands':'Perintah'}</div>
            <div class="cmd-palette">${paletteHtml}</div>
          </div>
          <div>
            <div class="cmd-section-title">📝 ${lang==='en'?'Your program':'Programmu'}</div>
            <div class="queue" id="main-queue" data-empty="${lang==='en'?'Click commands above to build your program':'Klik perintah di atas untuk bangun program'}"></div>
          </div>
          ${procSection}
          <div class="run-row">
            <button class="run-btn" id="runBtn" onclick="runProgram()">▶️ ${lang==='en'?'Run':'Jalan'}</button>
            <button class="run-btn reset" onclick="resetRobot()">🔄 ${lang==='en'?'Reset':'Ulang'}</button>
            <button class="run-btn hint" onclick="showHint()">💡 ${lang==='en'?'Hint':'Petunjuk'}</button>
          </div>
          <div class="hint-box" id="hint-box">${lang==='en'?'Optimal solution uses about ':'Solusi optimal pakai sekitar '}<b>${lvl.hintMinSteps}</b>${lang==='en'?' commands.':' perintah.'}</div>
          <div class="feedback" id="feedback"></div>
        </div>
      </div>
    </div>
  `;
  ROBOT_STATE.queue = [];
  ROBOT_STATE.proc = [];
  refreshQueues();
}

function refreshQueues(){
  const mainQ = document.getElementById('main-queue');
  const procQ = document.getElementById('proc-queue');
  if(mainQ) mainQ.innerHTML = ROBOT_STATE.queue.map((it,i)=>chipHtml(it,i,'main')).join('');
  if(procQ) procQ.innerHTML = ROBOT_STATE.proc.map((it,i)=>chipHtml(it,i,'proc')).join('');
}
function chipHtml(it,i,where){
  const m = ROBOT_CMD_META[it.cmd];
  let label = m.emoji + ' ' + t(m.label);
  if(it.cmd==='loop') label = '🔁 ×'+it.n;
  return `<button class="queue-chip ${m.cls}" onclick="removeChip(${i}, '${where}')">${label}</button>`;
}
function removeChip(i, where){
  const arr = where==='proc' ? ROBOT_STATE.proc : ROBOT_STATE.queue;
  arr.splice(i,1);
  refreshQueues();
}
function addCmd(cmd, toProc=false){
  let item = {cmd};
  if(cmd==='loop'){
    const n = prompt(lang==='en'?'Repeat how many times? (2-9)':'Ulang berapa kali? (2-9)', '3');
    const nn = parseInt(n,10);
    if(!nn || nn<2 || nn>9) return;
    item.n = nn;
  }
  const arr = toProc ? ROBOT_STATE.proc : ROBOT_STATE.queue;
  arr.push(item);
  refreshQueues();
}
function resetRobot(){
  if(ROBOT_STATE.running) return;
  ROBOT_STATE.queue = [];
  ROBOT_STATE.proc = [];
  document.getElementById('feedback').classList.remove('show');
  refreshQueues();
  // reset char to start
  const lvl = ROBOT_LEVELS[ROBOT_STATE.level];
  const tileSize = lvl.grid.cols > 5 ? 50 : 60;
  ROBOT_STATE.pos = {x:lvl.start.x, y:lvl.start.y};
  ROBOT_STATE.dir = lvl.start.dir;
  ROBOT_STATE.lit = new Set();
  const ch = document.getElementById('grid-char');
  ch.style.left = lvl.start.x*tileSize+'px';
  ch.style.top  = lvl.start.y*tileSize+'px';
  const dirAngle = {east:0,south:90,west:180,north:270}[lvl.start.dir];
  ch.style.transform = `rotate(${dirAngle}deg)`;
  document.querySelectorAll('.grid-tile.lit').forEach(el=>el.classList.remove('lit'));
}
function showHint(){
  document.getElementById('hint-box').classList.toggle('show');
}

function expandProgram(items, depth=0){
  if(depth>50) return [];
  const out = [];
  for(const it of items){
    if(it.cmd==='loop'){
      // Next single command/proc is "body"; for simplicity loop wraps proc call or single forward etc.
      // We'll interpret loop as: repeat ALL following commands N times within its own scope.
      // Simpler: loop wraps next item only.
      // To keep usable, treat loop ×N as: repeat the NEXT item N times. But user-friendly: treat as repeat next single token.
    } else if(it.cmd==='proc'){
      out.push(...expandProgram(ROBOT_STATE.proc, depth+1));
    } else {
      out.push(it);
    }
  }
  return out;
}
// Better expand: loop wraps the NEXT command only (or next proc call).
function expandQueue(items, depth=0){
  if(depth>40) return [];
  const out = [];
  for(let i=0; i<items.length; i++){
    const it = items[i];
    if(it.cmd==='loop'){
      const next = items[i+1];
      if(!next){ continue; }
      for(let r=0; r<it.n; r++){
        if(next.cmd==='proc'){
          out.push(...expandQueue(ROBOT_STATE.proc, depth+1));
        } else if(next.cmd==='loop'){
          // nested loop: expand sub-sequence
          out.push(...expandQueue([next, items[i+2]].filter(Boolean), depth+1));
        } else {
          out.push(next);
        }
      }
      i++; // skip the wrapped command
    } else if(it.cmd==='proc'){
      out.push(...expandQueue(ROBOT_STATE.proc, depth+1));
    } else {
      out.push(it);
    }
  }
  return out;
}

function isWallAhead(){
  const lvl = ROBOT_LEVELS[ROBOT_STATE.level];
  const dx = {east:1,west:-1,north:0,south:0}[ROBOT_STATE.dir];
  const dy = {east:0,west:0,north:-1,south:1}[ROBOT_STATE.dir];
  const nx = ROBOT_STATE.pos.x + dx;
  const ny = ROBOT_STATE.pos.y + dy;
  if(nx<0||ny<0||nx>=lvl.grid.cols||ny>=lvl.grid.rows) return true;
  if(lvl.walls.some(w=>w.x===nx&&w.y===ny)) return true;
  return false;
}

async function runProgram(){
  if(ROBOT_STATE.running) return;
  ROBOT_STATE.running = true;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('feedback').classList.remove('show');
  resetCharOnly();

  // Build expanded sequence; handle if_wall as runtime decision (skip-next on false)
  const program = ROBOT_STATE.queue.slice();
  const expanded = expandQueue(program);

  const lvl = ROBOT_LEVELS[ROBOT_STATE.level];
  const tileSize = lvl.grid.cols > 5 ? 50 : 60;
  const ch = document.getElementById('grid-char');

  for(let i=0; i<expanded.length && i<200; i++){
    const it = expanded[i];
    await sleep(420);

    if(it.cmd==='forward'){
      if(isWallAhead()){
        showFeedback('bad', lang==='en'?'💥 Bonk! The turtle hit a wall. Try again!':'💥 Aduh! Kura-kura kena tembok. Coba lagi!');
        ROBOT_STATE.running = false;
        document.getElementById('runBtn').disabled = false;
        return;
      }
      const dx = {east:1,west:-1,north:0,south:0}[ROBOT_STATE.dir];
      const dy = {east:0,west:0,north:-1,south:1}[ROBOT_STATE.dir];
      ROBOT_STATE.pos.x += dx;
      ROBOT_STATE.pos.y += dy;
      ch.style.left = ROBOT_STATE.pos.x*tileSize+'px';
      ch.style.top  = ROBOT_STATE.pos.y*tileSize+'px';
    } else if(it.cmd==='turnRight'){
      const order=['east','south','west','north'];
      ROBOT_STATE.dir = order[(order.indexOf(ROBOT_STATE.dir)+1)%4];
      ch.style.transform = `rotate(${ {east:0,south:90,west:180,north:270}[ROBOT_STATE.dir] }deg)`;
    } else if(it.cmd==='turnLeft'){
      const order=['east','north','west','south'];
      ROBOT_STATE.dir = order[(order.indexOf(ROBOT_STATE.dir)+1)%4];
      ch.style.transform = `rotate(${ {east:0,south:90,west:180,north:270}[ROBOT_STATE.dir] }deg)`;
    } else if(it.cmd==='light'){
      const key = ROBOT_STATE.pos.x+','+ROBOT_STATE.pos.y;
      ROBOT_STATE.lit.add(key);
      const tileEl = document.querySelector(`.grid-tile[data-x="${ROBOT_STATE.pos.x}"][data-y="${ROBOT_STATE.pos.y}"]`);
      if(tileEl) tileEl.classList.add('lit');
    } else if(it.cmd==='if_wall'){
      // peek next; execute if wall, else skip next
      const next = expanded[i+1];
      if(!next) continue;
      if(!isWallAhead()){
        i++; // skip next
      }
    }
  }

  // Check win
  const lvlNow = ROBOT_LEVELS[ROBOT_STATE.level];
  let win = true;
  if(lvlNow.target){
    if(ROBOT_STATE.pos.x !== lvlNow.target.x || ROBOT_STATE.pos.y !== lvlNow.target.y) win = false;
  }
  if(lvlNow.tilesToLight.length){
    for(const tl of lvlNow.tilesToLight){
      if(!ROBOT_STATE.lit.has(tl.x+','+tl.y)){ win=false; break; }
    }
  }

  ROBOT_STATE.running = false;
  document.getElementById('runBtn').disabled = false;

  if(win){
    saveProgress('alesha_code_robot_progress', lvlNow.id);
    confetti();
    showFeedback('ok',
      `<strong>🎉 ${lang==='en'?'You did it!':'Berhasil!'}</strong> ${t(lvlNow.concept)}<br>
       <button class="next-btn" onclick="nextRobot()">${lang==='en'?'Next Level →':'Level Berikut →'}</button>`);
  } else {
    showFeedback('bad', lang==='en'?'😿 Not quite. Check your path and try again!':'😿 Belum tepat. Cek jalurmu dan coba lagi!');
  }
}
function nextRobot(){
  ROBOT_STATE.level++;
  render();
}
function resetCharOnly(){
  const lvl = ROBOT_LEVELS[ROBOT_STATE.level];
  const tileSize = lvl.grid.cols > 5 ? 50 : 60;
  ROBOT_STATE.pos = {x:lvl.start.x, y:lvl.start.y};
  ROBOT_STATE.dir = lvl.start.dir;
  ROBOT_STATE.lit = new Set();
  const ch = document.getElementById('grid-char');
  ch.style.left = lvl.start.x*tileSize+'px';
  ch.style.top  = lvl.start.y*tileSize+'px';
  ch.style.transform = `rotate(${ {east:0,south:90,west:180,north:270}[lvl.start.dir] }deg)`;
  document.querySelectorAll('.grid-tile.lit').forEach(el=>el.classList.remove('lit'));
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function showFeedback(kind, html){
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show '+kind;
  fb.innerHTML = html;
}

const BUG_STATE = {idx:0, answered:false, shuffled:null, running:false};

function getBugLevels(){
  if(!BUG_STATE.shuffled) BUG_STATE.shuffled = shuffle(BUG_LEVELS.slice());
  return BUG_STATE.shuffled;
}

function renderBug(){
  const levels = getBugLevels();
  const lvl = levels[BUG_STATE.idx];
  if(!lvl){ renderDone('bug'); return; }
  setHeader((lang==='en'?'Bug ':'Bug ')+(BUG_STATE.idx+1)+'/'+levels.length);

  const codeHtml = lvl.code.map((ln,i)=>
    `<div class="code-line" data-line="${i}"><span class="line-num">${i+1}</span><span class="line-body">${ln.replace(/</g,'&lt;')}</span></div>`
  ).join('');

  const optsHtml = lvl.options.map((opt,i)=>
    `<button class="opt" data-i="${i}" onclick="answerBug(${i})"><span class="opt-letter">${String.fromCharCode(65+i)}</span><span>${t(opt)}</span></button>`
  ).join('');

  document.getElementById('main').innerHTML = `
    <div class="card">
      <div class="level-head">
        <span class="level-badge" style="background:#fff7ed;color:#c2410c">🐛 ${lang==='en'?'BUG':'BUG'} ${BUG_STATE.idx+1}</span>
        <div class="level-title">${t(lvl.title)}</div>
      </div>
      <div class="level-desc">${t(lvl.question)}</div>
      <div class="bug-run-row">
        <button class="bug-run-btn" id="bugRunBtn" onclick="runBugSlow()">▶ ${lang==='en'?'Run slow':'Jalan pelan'}</button>
      </div>
      <div class="code-block" id="bug-code">${codeHtml}</div>
      <div class="trace-box" id="bug-trace"><div class="trace-title">📊 ${lang==='en'?'Variable Trace':'Jejak Variabel'}</div><div id="bug-trace-body"></div></div>
      <div class="io-row">
        <div class="io-box expected"><div class="io-label">✓ ${lang==='en'?'Expected Output':'Output Diharapkan'}</div><div class="io-val">${lvl.expected.replace(/</g,'&lt;')}</div></div>
        <div class="io-box actual"><div class="io-label">✗ ${lang==='en'?'Actual Output':'Output Sebenarnya'}</div><div class="io-val" id="bug-actual">${lvl.actual.replace(/</g,'&lt;')}</div></div>

function runBugSlow(){
  if(BUG_STATE.running) return;
  BUG_STATE.running = true;
  const lvl = getBugLevels()[BUG_STATE.idx];
  const btn = document.getElementById('bugRunBtn');
  btn.disabled = true;
  btn.textContent = lang==='en'?'▶ Running...':'▶ Berjalan...';
  // Clear any previous highlight
  document.querySelectorAll('.code-line.executing').forEach(el=>el.classList.remove('executing'));
  // Show trace box
  const trace = document.getElementById('bug-trace');
  const traceBody = document.getElementById('bug-trace-body');
  trace.classList.add('show');
  traceBody.innerHTML = '<div class="trace-line" style="color:#94a3b8">'+(lang==='en'?'Starting execution...':'Memulai eksekusi...')+'</div>';

  const lines = lvl.code;
  let i = 0;
  const vars = {};
  function step(){
    // clear previous
    document.querySelectorAll('.code-line.executing').forEach(el=>el.classList.remove('executing'));
    if(i >= lines.length){
      // Final: show actual output mismatch
      traceBody.innerHTML += `<div class="trace-line" style="color:#f87171;margin-top:6px">↳ ${lang==='en'?'Output mismatch detected. Find the bug!':'Output beda — temukan bug-nya!'}</div>`;
      btn.disabled = false;
      btn.textContent = '▶ '+(lang==='en'?'Run slow':'Jalan pelan');
      BUG_STATE.running = false;
      return;
    }
    const el = document.querySelector(`.code-line[data-line="${i}"]`);
    if(el) el.classList.add('executing');
    // Try to parse simple assignments for trace
    const ln = lines[i];
    const m = ln.match(/^\s*(\w+)\s*=\s*(.+)$/);
    let traceText = '';
    if(m && !ln.includes('==') && !ln.includes('function') && !ln.startsWith('  if')){
      const name = m[1];
      const val = m[2].trim();
      vars[name] = val;
      traceText = `<span class="var-name">${name}</span> = <span class="var-val">${val.replace(/</g,'&lt;')}</span>`;
    } else if(ln.trim().startsWith('print')){
      traceText = `<span style="color:#fbbf24">→ ${lang==='en'?'output':'cetak'}</span>: <span class="var-val">${ln.replace(/</g,'&lt;')}</span>`;
    } else if(ln.trim().startsWith('for') || ln.trim().startsWith('while')){
      traceText = `<span style="color:#a78bfa">${lang==='en'?'loop':'loop'}</span>: ${ln.replace(/</g,'&lt;')}`;
    } else if(ln.trim().startsWith('if')){
      traceText = `<span style="color:#f472b6">${lang==='en'?'check':'cek'}</span>: ${ln.replace(/</g,'&lt;')}`;
    } else if(ln.trim().startsWith('function')){
      traceText = `<span style="color:#60a5fa">${lang==='en'?'define':'definisi'}</span>: ${ln.replace(/</g,'&lt;')}`;
    } else {
      traceText = `<span style="color:#cbd5e1">${ln.replace(/</g,'&lt;')}</span>`;
    }
    traceBody.innerHTML += `<div class="trace-line">L${i+1}: ${traceText}</div>`;
    // scroll trace
    trace.scrollTop = trace.scrollHeight;
    i++;
    setTimeout(step, 600);
  }
  setTimeout(step, 300);
}

function answerBug(i){
  if(BUG_STATE.answered) return;
  if(BUG_STATE.running) return;
  BUG_STATE.answered = true;
  const lvl = getBugLevels()[BUG_STATE.idx];
  document.querySelectorAll('.opt').forEach((el,j)=>{
    el.disabled = true;
    if(j===lvl.ans) el.classList.add('correct');
    else if(j===i) el.classList.add('wrong');
  });
  // Highlight buggy line red, then insert fix line in green
  const bugLineEl = document.querySelector(`.code-line[data-line="${lvl.bugLine}"]`);
  if(bugLineEl){
    bugLineEl.classList.add('bug');
    if(lvl.fix){
      const fixLines = lvl.fix.split('\n');
      const fixHtml = fixLines.map(fl=>
        `<div class="code-line fix-line"><span class="line-num">✓</span><span class="line-body">${fl.replace(/</g,'&lt;')}</span></div>`
      ).join('');
      bugLineEl.insertAdjacentHTML('afterend', fixHtml);
    }
  }

  if(i===lvl.ans){
    saveProgress('alesha_code_bug_progress', lvl.id);
    confetti();
    showFeedback('ok',
      `<strong>🎉 ${lang==='en'?'Bug found!':'Bug ketemu!'}</strong><br><div class="concept-box">${t(lvl.concept)}</div>
       <button class="next-btn" onclick="nextBug()">${lang==='en'?'Next Bug →':'Bug Berikut →'}</button>`);
  } else {
    showFeedback('bad',
      `<strong>${lang==='en'?'Not quite!':'Belum tepat!'}</strong> ${lang==='en'?'The correct answer is highlighted.':'Jawaban benar disorot.'}<br><div class="concept-box">${t(lvl.concept)}</div>
       <button class="next-btn" onclick="nextBug()">${lang==='en'?'Next Bug →':'Bug Berikut →'}</button>`);
  }
}
function nextBug(){
  BUG_STATE.idx++;
  render();
}

const GATES_STATE = {idx:0, values:{}, shuffled:null};

function getGatesLevels(){
  if(!GATES_STATE.shuffled) GATES_STATE.shuffled = shuffle(GATES_LEVELS.slice());
  return GATES_STATE.shuffled;
}

function evalGate(g, vals){
  const ev = name => name in vals ? vals[name] : false;
  if(g.op==='AND') return ev(g.in[0]) && ev(g.in[1]);
  if(g.op==='OR')  return ev(g.in[0]) || ev(g.in[1]);
  if(g.op==='NOT') return !ev(g.in[0]);
  if(g.op==='XOR') return ev(g.in[0]) !== ev(g.in[1]);
  if(g.op==='NAND') return !(ev(g.in[0]) && ev(g.in[1]));
  if(g.op==='NOR') return !(ev(g.in[0]) || ev(g.in[1]));
  return false;
}
function computeGates(lvl){
  const vals = {};
  for(const inp of lvl.inputs) vals[inp] = !!GATES_STATE.values[inp];
  for(const g of lvl.gates) vals[g.id] = evalGate(g, vals);
  return vals;
}

function renderGates(){
  const lvl = getGatesLevels()[GATES_STATE.idx];
  if(!lvl){ renderDone('gates'); return; }
  setHeader((lang==='en'?'Circuit ':'Sirkuit ')+(GATES_STATE.idx+1)+'/'+getGatesLevels().length);

  // initialize values
  if(GATES_STATE.idx !== GATES_STATE.lastIdx){
    GATES_STATE.values = {};
    for(const inp of lvl.inputs) GATES_STATE.values[inp] = false;
    GATES_STATE.lastIdx = GATES_STATE.idx;
  }

  const goalText = lvl.goal
    ? (lang==='en'?'Make the bulb LIGHT UP 💡':'Nyalakan lampu 💡')
    : (lang==='en'?'Make the bulb GO OFF 🌑':'Matikan lampu 🌑');

  document.getElementById('main').innerHTML = `
    <div class="card">

        <span class="level-badge" style="background:#ede9fe;color:#6d28d9">🔀 ${lang==='en'?'CIRCUIT':'SIRKUIT'} ${GATES_STATE.idx+1}</span>

      </div>
      <div class="level-desc">${t(lvl.description)}<br><b>${lang==='en'?'Goal:':'Tujuan:'}</b> ${goalText}</div>
      <div class="circuit" id="circuit"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
  drawCircuit();
}

function drawCircuit(){
  const lvl = getGatesLevels()[GATES_STATE.idx];
  const vals = computeGates(lvl);
  const out = vals[lvl.outputFrom];

  // layout: column-based. Inputs col=0; gates by topological level; output last col.
  const colOf = {};
  for(const inp of lvl.inputs) colOf[inp] = 0;
  let maxCol = 1;
  for(const g of lvl.gates){
    const c = Math.max(...g.in.map(n=>colOf[n]||0)) + 1;
    colOf[g.id] = c;
    if(c > maxCol) maxCol = c;
  }
  const outputCol = maxCol + 1;
  const totalCols = outputCol + 1;

  // assign Y positions per column
  const colItems = {};
  for(let c=0; c<=outputCol; c++) colItems[c] = [];
  for(const inp of lvl.inputs) colItems[0].push({type:'input', name:inp});
  for(const g of lvl.gates) colItems[colOf[g.id]].push({type:'gate', g});
  colItems[outputCol].push({type:'output'});

  const colW = 110;
  const rowH = 70;
  const maxRows = Math.max(...Object.values(colItems).map(a=>a.length));
  const W = totalCols * colW + 40;
  const H = Math.max(maxRows*rowH + 40, 180);

  const posOf = {};
  for(let c=0; c<=outputCol; c++){
    const items = colItems[c];
    const startY = (H - items.length*rowH)/2 + rowH/2;
    items.forEach((it,i)=>{
      const x = 30 + c*colW;
      const y = startY + i*rowH;
      if(it.type==='input') posOf[it.name] = {x,y};
      else if(it.type==='gate') posOf[it.g.id] = {x,y};
      else posOf['_out'] = {x,y};
    });
  }

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;

  // wires (draw under)
  for(const g of lvl.gates){
    const gp = posOf[g.id];
    g.in.forEach((src,i)=>{
      const sp = posOf[src];
      const isOn = vals[src];
      // input port offset
      const portY = g.in.length===1 ? gp.y : gp.y + (i===0?-10:10);
      svg += `<path class="wire ${isOn?'on':'off'}" d="M ${sp.x+25} ${sp.y} C ${sp.x+60} ${sp.y}, ${gp.x-35} ${portY}, ${gp.x-20} ${portY}"/>`;
    });
  }
  // wire to output bulb
  const outGate = posOf[lvl.outputFrom];
  const outPos = posOf['_out'];
  svg += `<path class="wire ${out?'on':'off'}" d="M ${outGate.x+25} ${outGate.y} C ${outGate.x+60} ${outGate.y}, ${outPos.x-40} ${outPos.y}, ${outPos.x-18} ${outPos.y}"/>`;

  // inputs (switches)
  for(const inp of lvl.inputs){
    const p = posOf[inp];
    const on = vals[inp];
    svg += `<g class="input-sw" onclick="toggleInput('${inp}')">
      <circle cx="${p.x}" cy="${p.y}" r="22" fill="${on?'#fbbf24':'#475569'}" stroke="${on?'#f59e0b':'#1e293b'}" stroke-width="3"/>
      <text x="${p.x}" y="${p.y}" class="node-label" style="fill:${on?'#78350f':'#e2e8f0'}">${on?'1':'0'}</text>
      <text x="${p.x}" y="${p.y-32}" class="node-label" style="font-size:12px;fill:#a78bfa">${inp}</text>
    </g>`;
  }

  // gates (rectangles)
  for(const g of lvl.gates){
    const p = posOf[g.id];
    const on = vals[g.id];
    svg += `<g>
      <rect x="${p.x-22}" y="${p.y-22}" width="44" height="44" rx="10" class="gate-shape" style="stroke:${on?'#fbbf24':'#a78bfa'}"/>
      <text x="${p.x}" y="${p.y}" class="gate-label">${g.op}</text>
    </g>`;
  }

  // output bulb
  svg += `<g>
    <circle cx="${outPos.x}" cy="${outPos.y}" r="20" class="bulb ${out?'on':'off'}" stroke="#fde68a" stroke-width="2"/>
    <text x="${outPos.x}" y="${outPos.y+6}" class="node-label" style="font-size:18px">${out?'💡':'⚫'}</text>
  </g>`;

  svg += `</svg>`;
  document.getElementById('circuit').innerHTML = svg;

  // Check goal
  const fb = document.getElementById('feedback');
  if(out === lvl.goal){
    saveProgress('alesha_code_gates_progress', lvl.id);
    fb.className='feedback show ok';
    fb.innerHTML = `<strong>🎉 ${lang==='en'?'Circuit complete!':'Sirkuit selesai!'}</strong><br><div class="concept-box">${t(lvl.concept)}</div>
       <button class="next-btn" onclick="nextGates()">${lang==='en'?'Next Circuit →':'Sirkuit Berikut →'}</button>`;
    if(!GATES_STATE.confettiShown){ confetti(); GATES_STATE.confettiShown = true; }
  } else {
    fb.classList.remove('show');
    GATES_STATE.confettiShown = false;
  }
}
function toggleInput(name){
  GATES_STATE.values[name] = !GATES_STATE.values[name];
  drawCircuit();
}
function nextGates(){
  GATES_STATE.idx++;
  GATES_STATE.confettiShown = false;
  render();
}

const ALGO_STATE = {idx:0, shuffled:null};

function getAlgoLevels(){
  if(!ALGO_STATE.shuffled){
    // Group by kind, shuffle within each, then concat in fixed group order
    const groups = {sort:[], bsearch:[], path:[], pattern:[]};
    for(const lvl of ALGO_LEVELS){
      if(groups[lvl.kind]) groups[lvl.kind].push(lvl);
    }
    ALGO_STATE.shuffled = [
      ...shuffle(groups.sort),
      ...shuffle(groups.bsearch),
      ...shuffle(groups.path),
      ...shuffle(groups.pattern),
    ];
  }
  return ALGO_STATE.shuffled;
}

function renderAlgo(){
  const lvl = getAlgoLevels()[ALGO_STATE.idx];
  if(!lvl){ renderDone('algorithm'); return; }
  setHeader((lang==='en'?'Lab ':'Lab ')+(ALGO_STATE.idx+1)+'/'+getAlgoLevels().length);

  let body = '';
  if(lvl.kind==='sort')    body = renderSort(lvl);
  else if(lvl.kind==='bsearch') body = renderBsearch(lvl);
  else if(lvl.kind==='path')    body = renderPath(lvl);
  else if(lvl.kind==='pattern') body = renderPattern(lvl);

  document.getElementById('main').innerHTML = `
    <div class="card">
      <div class="level-head">
        <span class="level-badge" style="background:#fce7f3;color:#be185d">🦊 ${lang==='en'?'LAB':'LAB'} ${ALGO_STATE.idx+1}</span>
        <div class="level-title">${t(lvl.title)}</div>
      </div>
      <div class="level-desc">${t(lvl.description)}</div>
      ${body}
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  if(lvl.kind==='sort') initSort(lvl);
  else if(lvl.kind==='bsearch') initBsearch(lvl);
  else if(lvl.kind==='path') initPath(lvl);
  else if(lvl.kind==='pattern') {} // nothing
}

// --- Sort sub-mode ---
let SORT_STATE = null;
function renderSort(lvl){
  return `
    <div class="algo-stats">
      <div class="algo-stat" id="sort-swaps">${lang==='en'?'Swaps':'Tukar'}: 0</div>
      <div class="algo-stat">${lang==='en'?'Target':'Target'}: ≤ ${lvl.optimal}</div>
    </div>
    <button class="swap-btn" id="swap-btn" disabled onclick="doSwap()">${lang==='en'?'🔄 Swap Selected':'🔄 Tukar Pilihan'}</button>
    <div class="bars" id="bars"></div>
  `;
}
function initSort(lvl){
  SORT_STATE = {arr:lvl.nums.slice(), selected:[], swaps:0, locked:false, optimal:lvl.optimal};
  drawBars();
}
function drawBars(){
  const max = Math.max(...SORT_STATE.arr);
  const html = SORT_STATE.arr.map((n,i)=>{
    const h = 40 + (n/max)*140;
    const sel = SORT_STATE.selected.includes(i) ? ' selected' : '';
    const locked = SORT_STATE.locked ? ' locked' : '';
    return `<div class="bar${sel}${locked}" data-i="${i}" style="height:${h}px" onclick="pickBar(${i})">${n}</div>`;
  }).join('');
  document.getElementById('bars').innerHTML = html;
  document.getElementById('sort-swaps').textContent = (lang==='en'?'Swaps: ':'Tukar: ')+SORT_STATE.swaps;
  document.getElementById('swap-btn').disabled = SORT_STATE.selected.length !== 2 || SORT_STATE.locked;
}
function pickBar(i){
  if(SORT_STATE.locked) return;
  const idx = SORT_STATE.selected.indexOf(i);
  if(idx>=0) SORT_STATE.selected.splice(idx,1);
  else if(SORT_STATE.selected.length<2) SORT_STATE.selected.push(i);
  drawBars();
}
function doSwap(){
  if(SORT_STATE.selected.length!==2) return;
  const [a,b] = SORT_STATE.selected;
  if(Math.abs(a-b)!==1){
    showFeedback('bad', lang==='en'?'⚠️ Only ADJACENT cards can swap!':'⚠️ Hanya kartu BERSEBELAHAN bisa ditukar!');
    return;
  }
  document.getElementById('feedback').classList.remove('show');
  [SORT_STATE.arr[a], SORT_STATE.arr[b]] = [SORT_STATE.arr[b], SORT_STATE.arr[a]];
  SORT_STATE.swaps++;
  SORT_STATE.selected = [];
  drawBars();
  // Check sorted
  const sorted = SORT_STATE.arr.every((v,i,a)=>i===0||a[i-1]<=v);
  if(sorted){
    SORT_STATE.locked = true;
    drawBars();
    const lvl = getAlgoLevels()[ALGO_STATE.idx];
    saveProgress('alesha_code_algorithm_progress', lvl.id);
    confetti();
    const extra = SORT_STATE.swaps<=SORT_STATE.optimal
      ? (lang==='en'?'✨ Optimal!':'✨ Optimal!')
      : (lang==='en'?'Done — try fewer swaps next time!':'Selesai — coba lebih sedikit lain kali!');
    showFeedback('ok',
      `<strong>🎉 ${lang==='en'?'Sorted!':'Terurut!'}</strong> ${extra}<br><div class="concept-box">${t(lvl.concept)}</div>
       <button class="next-btn" onclick="nextAlgo()">${lang==='en'?'Next Lab →':'Lab Berikut →'}</button>`);
  }
}

let BS_STATE = null;
function renderBsearch(lvl){
  return `
    <div class="algo-stats">
      <div class="algo-stat" id="bs-tries">${lang==='en'?'Tries':'Coba'}: 0/${lvl.maxGuesses}</div>
      <div class="algo-stat" id="bs-range">${lvl.range[0]} – ${lvl.range[1]}</div>
    </div>
    <div class="bs-display">
      <div class="bs-range" id="bs-hint">${lang==='en'?'I picked a number between ':'Aku pilih angka antara '}<b>${lvl.range[0]}</b>${lang==='en'?' and ':' dan '}<b>${lvl.range[1]}</b>!</div>
      <input class="bs-input" id="bs-input" type="number" min="${lvl.range[0]}" max="${lvl.range[1]}" placeholder="?">
      <button class="bs-guess-btn" onclick="bsGuess()">${lang==='en'?'Guess':'Tebak'}</button>
      <div class="bs-history" id="bs-history"></div>
    </div>
  `;
}
function initBsearch(lvl){
  const secret = Math.floor(Math.random()*(lvl.range[1]-lvl.range[0]+1)) + lvl.range[0];
  BS_STATE = {secret, tries:0, maxTries:lvl.maxGuesses, history:[], lo:lvl.range[0], hi:lvl.range[1], done:false};
  document.getElementById('bs-input').focus();
  document.getElementById('bs-input').addEventListener('keydown', e=>{if(e.key==='Enter') bsGuess();});
}
function bsGuess(){
  if(BS_STATE.done) return;
  const v = parseInt(document.getElementById('bs-input').value, 10);
  if(isNaN(v)) return;
  BS_STATE.tries++;
  let cls='', txt='';
  if(v === BS_STATE.secret){ cls='win'; txt=`${v} ✓`; }
  else if(v > BS_STATE.secret){ cls='high'; txt=`${v} ↓ ${lang==='en'?'too high':'kebesaran'}`; BS_STATE.hi = Math.min(BS_STATE.hi, v-1); }
  else { cls='low'; txt=`${v} ↑ ${lang==='en'?'too low':'kekecilan'}`; BS_STATE.lo = Math.max(BS_STATE.lo, v+1); }
  BS_STATE.history.push({v, cls, txt});
  document.getElementById('bs-tries').textContent = (lang==='en'?'Tries: ':'Coba: ')+BS_STATE.tries+'/'+BS_STATE.maxTries;
  document.getElementById('bs-range').textContent = BS_STATE.lo+' – '+BS_STATE.hi;
  document.getElementById('bs-history').innerHTML = BS_STATE.history.map(h=>`<span class="bs-guess ${h.cls}">${h.txt}</span>`).join('');
  document.getElementById('bs-input').value='';
  if(v===BS_STATE.secret){
    BS_STATE.done = true;
    const lvl = getAlgoLevels()[ALGO_STATE.idx];
    saveProgress('alesha_code_algorithm_progress', lvl.id);
    confetti();
    showFeedback('ok',
      `<strong>🎉 ${lang==='en'?'You found it in ':'Kamu temukan dalam '}${BS_STATE.tries} ${lang==='en'?'tries!':'tebakan!'}</strong><br><div class="concept-box">${t(lvl.concept)}</div>
       <button class="next-btn" onclick="nextAlgo()">${lang==='en'?'Next Lab →':'Lab Berikut →'}</button>`);
  } else if(BS_STATE.tries >= BS_STATE.maxTries){
    BS_STATE.done = true;
    showFeedback('bad',
      `${lang==='en'?'Out of tries! The number was ':'Habis kesempatan! Angkanya '}<b>${BS_STATE.secret}</b>. ${lang==='en'?'Try again!':'Coba lagi!'}<br>
       <button class="next-btn" onclick="render()">${lang==='en'?'Retry':'Coba lagi'}</button>`);
  }
}

// --- Path ---
let PATH_STATE = null;
function renderPath(lvl){
  return `
    <div class="algo-stats">
      <div class="algo-stat" id="path-count">${lang==='en'?'Tiles':'Ubin'}: 0</div>
      <div class="algo-stat">${lang==='en'?'Target':'Target'}: ≤ ${lvl.optimal}</div>
      <button class="algo-stat" style="cursor:pointer" onclick="resetPath()">↻ ${lang==='en'?'Reset':'Ulang'}</button>
    </div>
    <div class="maze-grid" id="maze" style="grid-template-columns:repeat(${lvl.grid[0].length},44px)"></div>
  `;
}
function initPath(lvl){
  PATH_STATE = {grid:lvl.grid.map(r=>r.slice()), path:[], done:false, optimal:lvl.optimal};
  // find start
  for(let y=0;y<lvl.grid.length;y++) for(let x=0;x<lvl.grid[0].length;x++){
    if(lvl.grid[y][x]==='S') PATH_STATE.path.push({x,y});
  }
  drawMaze();
}
function resetPath(){
  initPath(getAlgoLevels()[ALGO_STATE.idx]);
  document.getElementById('feedback').classList.remove('show');
}
function drawMaze(){
  const grid = PATH_STATE.grid;
  let html='';
  for(let y=0;y<grid.length;y++){
    for(let x=0;x<grid[0].length;x++){
      const c = grid[y][x];
      const onPath = PATH_STATE.path.some(p=>p.x===x&&p.y===y);
      let cls='maze-cell';
      let label='';
      if(c==='#'){ cls+=' wall'; }
      else if(c==='S'){ cls+=' start'; label='🐾'; }
      else if(c==='E'){ cls+=' end'; label='🏁'; }
      if(onPath && c!=='S' && c!=='E') cls+=' path';
      else if(onPath && c==='S') cls+=' start';
      html += `<div class="${cls}" data-x="${x}" data-y="${y}" onclick="pickMazeCell(${x},${y})">${label}</div>`;
    }
  }
  document.getElementById('maze').innerHTML = html;
  document.getElementById('path-count').textContent = (lang==='en'?'Tiles: ':'Ubin: ')+PATH_STATE.path.length;
}
function pickMazeCell(x,y){
  if(PATH_STATE.done) return;
  const grid = PATH_STATE.grid;
  if(grid[y][x]==='#') return;
  const last = PATH_STATE.path[PATH_STATE.path.length-1];
  if(!last) return;
  // adjacent?
  if(Math.abs(last.x-x)+Math.abs(last.y-y) !== 1){
    // allow undo: clicking second-to-last removes last
    if(PATH_STATE.path.length>=2){
      const prev = PATH_STATE.path[PATH_STATE.path.length-2];
      if(prev.x===x&&prev.y===y){ PATH_STATE.path.pop(); drawMaze(); return; }
    }
    return;
  }
  // already on path? rewind to that cell
  const existsIdx = PATH_STATE.path.findIndex(p=>p.x===x&&p.y===y);
  if(existsIdx>=0){
    PATH_STATE.path = PATH_STATE.path.slice(0, existsIdx+1);
    drawMaze();
    return;
  }
  PATH_STATE.path.push({x,y});
  drawMaze();
  if(grid[y][x]==='E'){
    PATH_STATE.done = true;
    const lvl = getAlgoLevels()[ALGO_STATE.idx];
    saveProgress('alesha_code_algorithm_progress', lvl.id);
    confetti();
    const extra = PATH_STATE.path.length<=PATH_STATE.optimal
      ? (lang==='en'?'✨ Optimal path!':'✨ Jalur optimal!')
      : (lang==='en'?'Done — try shorter next time!':'Selesai — coba lebih pendek!');
    showFeedback('ok',
      `<strong>🎉 ${lang==='en'?'Reached the goal!':'Sampai tujuan!'}</strong> ${extra}<br><div class="concept-box">${t(lvl.concept)}</div>
       <button class="next-btn" onclick="nextAlgo()">${lang==='en'?'Next Lab →':'Lab Berikut →'}</button>`);
  }
}

// --- Pattern ---
function renderPattern(lvl){
  const seqText = lvl.seq.join(', ') + ', ?, ?, ?';
  return `
    <div class="pattern-display">
      <div class="pattern-seq">${seqText}</div>
      <div class="pattern-inputs">
        <input class="pattern-input" id="pat-0" type="number" placeholder="?">

// Recompute correct encrypted for Caesar L3, L4, L5 at runtime to guarantee correctness
function caesarShift(s, n){
  return s.split('').map(c=>{
    const code = c.charCodeAt(0);
    if(code>=65 && code<=90) return String.fromCharCode((code-65+n+26)%26+65);
    return c;
  }).join('');
}
// Auto-fix encrypted strings for any caesar levels (in case manual encoding was wrong)
for(const lvl of CIPHER_LEVELS){
  if(lvl.kind==='caesar') lvl.encrypted = caesarShift(lvl.answer, lvl.shift);
}

const CIPHER_STATE = {idx:0, shuffled:null, sliderVal:0, hintUsed:false, done:false};

function getCipherLevels(){
  if(!CIPHER_STATE.shuffled){
    const tiers = {caesar:[], atbash:[], subst:[]};
    for(const l of CIPHER_LEVELS){ if(tiers[l.tier]) tiers[l.tier].push(l); }
    CIPHER_STATE.shuffled = [
      ...shuffle(tiers.caesar),
      ...shuffle(tiers.atbash),
      ...shuffle(tiers.subst),
    ];
  }
  return CIPHER_STATE.shuffled;
}

function atbashDecode(s){
  return s.split('').map(c=>{
    const code = c.charCodeAt(0);
    if(code>=65 && code<=90) return String.fromCharCode(90 - (code-65));
    return c;
  }).join('');
}

function substDecode(s, key){
  return s.split('').map(c=> key[c] || c).join('');
}

function renderCipher(){
  const levels = getCipherLevels();
  const lvl = levels[CIPHER_STATE.idx];
  if(!lvl){ renderDone('cipher'); return; }

  CIPHER_STATE.hintUsed = false;

  let body = '';
  if(lvl.kind==='caesar') body = renderCaesar(lvl);
  else if(lvl.kind==='atbash') body = renderAtbash(lvl);
  else if(lvl.kind==='subst') body = renderSubst(lvl);

  const tierName = lvl.kind==='caesar' ? (lang==='en'?'Caesar Shift':'Geser Caesar')
                 : lvl.kind==='atbash' ? (lang==='en'?'Atbash':'Atbash')

function renderCaesar(lvl){
  return `
    <div class="cipher-slider-wrap">
      <div class="cipher-slider-label">
        <span>${lang==='en'?'Shift':'Geser'}: <b id="cipher-shift-val">0</b></span>
        <span>${lang==='en'?'Try sliding!':'Coba geser!'}</span>
      </div>
      <input class="cipher-slider" id="cipher-slider" type="range" min="-25" max="25" value="0" oninput="cipherSliderChange(this.value)">
    </div>
  `;
}

function renderAtbash(lvl){
  // Build key table A=Z, B=Y, ...
  const letters = ['A','B','C','D','E','F','G','H','I','J','K','L','M'];
  let cells = '';
  for(const L of letters){
    const code = L.charCodeAt(0);
    const mirror = String.fromCharCode(90 - (code-65));
    cells += `<div class="cipher-key-cell">${L}↔<span class="sym">${mirror}</span></div>`;
  }
  return `
    <div class="cipher-key-table">${cells}</div>
  `;
}

function renderSubst(lvl){
  let cells = '';
  for(const [sym, ltr] of Object.entries(lvl.key)){
    cells += `<div class="cipher-key-cell"><span class="sym">${sym}</span>=${ltr}</div>`;
  }
  return `
    <div class="cipher-key-table">${cells}</div>
  `;
}

function cipherSliderChange(v){
  CIPHER_STATE.sliderVal = parseInt(v,10);
  document.getElementById('cipher-shift-val').textContent = v;
  updateCipherPreview();
}

function updateCipherPreview(){
  const lvl = getCipherLevels()[CIPHER_STATE.idx];
  const prev = document.getElementById('cipher-preview');
  if(!prev) return;
  let decoded = '';
  if(lvl.kind==='caesar'){
    decoded = caesarShift(lvl.encrypted, CIPHER_STATE.sliderVal);
  } else if(lvl.kind==='atbash'){
    decoded = atbashDecode(lvl.encrypted);
  } else if(lvl.kind==='subst'){
    decoded = substDecode(lvl.encrypted, lvl.key);
  }
  prev.textContent = decoded;
}

function cipherHint(){
  const lvl = getCipherLevels()[CIPHER_STATE.idx];
  CIPHER_STATE.hintUsed = true;
  const firstLetter = lvl.answer.replace(/[^A-Z]/g,'').charAt(0);

}

function checkCipher(){
  if(CIPHER_STATE.done) return;
  const lvl = getCipherLevels()[CIPHER_STATE.idx];
  const inp = document.getElementById('cipher-answer');
  const guess = (inp.value||'').toUpperCase().replace(/\s+/g,' ').trim();
  const target = lvl.answer.toUpperCase().trim();
  if(guess === target){
    CIPHER_STATE.done = true;
    saveProgress('alesha_code_cipher_progress', lvl.id);
    confetti();
    // Animated reveal
    const reveal = lvl.answer.split('').map((c,i)=>`<span style="animation-delay:${i*100}ms">${c==' '?'&nbsp;':c}</span>`).join('');
    showFeedback('ok',
      `<strong>🎉 ${lang==='en'?'Message decoded!':'Pesan terpecahkan!'}</strong>

       <div class="concept-box">${t(lvl.concept)}</div>

    showFeedback('bad', `❌ ${lang==='en'?'Not quite — keep trying!':'Belum tepat — coba lagi!'}`);
  }
}

      {en:`You're a secret agent 🕵️! Each puzzle hides a real message inside coded letters.`,
       id:`Kamu agen rahasia 🕵️! Tiap teka-teki menyembunyikan pesan asli di balik huruf rahasia.`},
      {en:`<strong>Caesar Shift</strong>: every letter moves N positions. E.g. shift=3 means A→D, B→E, K→N. So KHOOR (shift=3 back) becomes HELLO.`,
       id:`<strong>Geser Caesar</strong>: tiap huruf bergeser N posisi. Misal geser=3 berarti A→D, B→E, K→N. Jadi KHOOR (geser=3 mundur) jadi HELLO.`},
      {en:`Use the <strong>slider</strong> (Caesar) or check the <strong>key table</strong> (others) to figure out the original letters. Live preview helps you see what looks right.`,
       id:`Pakai <strong>slider</strong> (Caesar) atau cek <strong>tabel kunci</strong> (lainnya) untuk cari huruf asli. Pratinjau langsung bantu lihat yang masuk akal.`},
      {en:`Type the decoded message and hit Decode. Need help? Tap <kbd>💡 Hint</kbd> to reveal the first letter.`,
       id:`Ketik pesan terdekode dan tekan Pecahkan. Butuh bantuan? Tekan <kbd>💡 Petunjuk</kbd> untuk lihat huruf pertama.`},
    ]
  }
};

let tutStep = 0;
let tutMode = null;

function showTutorial(force){
  tutMode = MODE;
  if(!TUTORIALS[tutMode]) return;
  // If not forced and already seen, skip
  if(!force && localStorage.getItem('alesha_code_tut_seen_'+tutMode) === '1'){
    document.getElementById('tutReplay').style.display = 'block';
    return;
  }
  tutStep = 0;
  document.getElementById('tutBackdrop').classList.add('show');
  renderTutorial();
}

function renderTutorial(){
  const tut = TUTORIALS[tutMode];
  const total = tut.steps.length;
  document.getElementById('tutTitle').innerHTML = t(tut.title);
  document.getElementById('tutStepLabel').textContent =
    (lang==='en' ? 'Step ' : 'Langkah ') + (tutStep+1) +
    (lang==='en' ? ' of ' : ' dari ') + total;
  document.getElementById('tutBody').innerHTML = t(tut.steps[tutStep]);
  // Dots
  document.getElementById('tutDots').innerHTML =
    tut.steps.map((_,i)=>`<span class="tut-dot${i===tutStep?' active':''}"></span>`).join('');
  // Buttons
  document.getElementById('tutPrev').disabled = tutStep === 0;
  document.getElementById('tutPrev').textContent = lang==='en' ? '← Prev' : '← Kembali';
  const nxt = document.getElementById('tutNext');
  if(tutStep === total - 1){
    nxt.textContent = lang==='en' ? "🚀 Let's go!" : '🚀 Mulai!';
  } else {
    nxt.textContent = lang==='en' ? 'Next →' : 'Lanjut →';
  }
  document.getElementById('tutSkip').textContent = lang==='en' ? 'Skip ✕' : 'Lewati ✕';
}

function closeTutorial(){
  document.getElementById('tutBackdrop').classList.remove('show');
  if(tutMode) localStorage.setItem('alesha_code_tut_seen_'+tutMode, '1');
  document.getElementById('tutReplay').style.display = 'block';
}

document.getElementById('tutSkip').onclick = closeTutorial;
document.getElementById('tutPrev').onclick = ()=>{ if(tutStep>0){ tutStep--; renderTutorial(); } };
document.getElementById('tutNext').onclick = ()=>{
  const total = TUTORIALS[tutMode].steps.length;
  if(tutStep < total - 1){ tutStep++; renderTutorial(); }
  else closeTutorial();
};
document.getElementById('tutReplay').onclick = ()=>{
  document.getElementById('tutReplay').style.display = 'none';
  showTutorial(true);
};

// Wrap render() so language toggle also updates tutorial in place
const originalRender = render;
render = function(){
  originalRender();
  // If tutorial is visible during a lang toggle, re-render its text
  if(document.getElementById('tutBackdrop').classList.contains('show')){
    renderTutorial();
  }
};

render();
showTutorial(false);
</script>
