<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alesha's English Mastery — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff8eb;
  --paper:#ffffff;
  --ink:#1f2937;
  --slate:#64748b;
  --rule:#fde68a;
  --green:#15803d;
  --green-bg:#dcfce7;
  --coral:#fb7185;
  --coral-bg:#ffe4e6;
  --grape:#a78bfa;
  --gold:#f59e0b;
  --gold-bg:#fef3c7;
  --sky:#0ea5e9;
}
html,body{background:var(--bg);color:var(--ink);min-height:100vh}
body{font-family:'Lora',Georgia,serif;line-height:1.65;-webkit-font-smoothing:antialiased}

/* Per-track accent (changes hero + card stripe color) */
body[data-track=reading]{--acc:#0ea5e9;--acc-dark:#0369a1;--acc-bg:#e0f2fe}
body[data-track=vocab]{--acc:#fb7185;--acc-dark:#be123c;--acc-bg:#ffe4e6}
body[data-track=critical]{--acc:#f59e0b;--acc-dark:#a16207;--acc-bg:#fef3c7}
body[data-track=writing]{--acc:#a78bfa;--acc-dark:#6d28d9;--acc-bg:#ede9fe}

.topbar{background:var(--paper);border-bottom:3px solid var(--rule);padding:14px 22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.back-link{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.88rem;color:var(--acc-dark,#0f766e);text-decoration:none;background:var(--acc-bg,#ccfbf1);padding:8px 16px;border-radius:18px;border:2px solid var(--acc,#5eead4);justify-self:start;transition:transform .15s}
.back-link:hover{transform:translateX(-3px)}
.crest{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.74rem;letter-spacing:.1em;color:var(--coral);text-transform:uppercase;text-align:center}
.lang-toggle{justify-self:end;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.82rem;color:var(--ink);background:#fff;border:2px solid var(--gold);border-radius:18px;padding:7px 14px;cursor:pointer;transition:transform .15s}
.lang-toggle:hover{transform:rotate(-3deg)}

.track-bar{background:linear-gradient(135deg,var(--acc-bg,#ccfbf1) 0%,#fff8eb 100%);border-bottom:3px solid var(--rule);padding:20px 22px;text-align:center;position:relative;overflow:hidden}
.track-bar::after{content:'';position:absolute;top:-20px;right:-10px;width:80px;height:80px;background:radial-gradient(circle,var(--acc,#0ea5e9) 0%,transparent 70%);opacity:.18}
.track-bar .roman{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dark,#0369a1);margin-bottom:4px;position:relative}
.track-bar h1{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.45rem;color:var(--acc-dark,#0369a1);letter-spacing:-.3px;position:relative}
.track-bar h1 em{font-style:italic}

.wrap{max-width:780px;margin:0 auto;padding:32px 22px 80px}

.meta-row{font-family:'Quicksand',sans-serif;font-weight:600;font-size:.78rem;color:var(--slate);display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

.card{background:var(--paper);border:2px solid var(--rule);border-radius:22px;padding:32px 28px;position:relative;animation:fadeIn .3s ease;box-shadow:0 6px 18px rgba(251,191,36,.12)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,var(--acc,#0ea5e9),var(--acc-dark,#0369a1))}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.q-tag{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-dark,#0369a1);background:var(--acc-bg,#e0f2fe);display:inline-block;padding:4px 12px;border-radius:11px;margin-bottom:14px}
.q-text{font-family:'Lora',serif;font-size:1.05rem;line-height:1.7;color:var(--ink);margin-bottom:22px}
.q-text em{color:var(--acc-dark,#0369a1);font-weight:600}
.q-text strong{font-weight:600;color:var(--ink)}

.passage{background:linear-gradient(135deg,#fff7ed 0%,#fef3c7 100%);border:2px dashed #fbbf24;border-radius:14px;padding:20px 24px;margin-bottom:22px;font-family:'Lora',serif;font-size:1rem;line-height:1.75;color:var(--ink);position:relative}
.passage::before{content:'📖';position:absolute;top:-14px;left:18px;background:var(--bg);padding:2px 6px;font-size:1.1rem}
.passage .src{display:block;margin-top:10px;font-style:italic;font-size:.84rem;color:var(--slate);text-align:right}
.passage p+p{margin-top:10px}

.sub-head{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.1em;color:var(--coral);text-transform:uppercase;margin-bottom:8px}

.options{list-style:none;margin-bottom:18px}
.options li{font-family:'Lora',serif;font-size:1rem;line-height:1.55;padding:13px 14px 13px 44px;border:2px solid var(--rule);border-radius:14px;margin-bottom:9px;cursor:pointer;position:relative;transition:all .15s;background:#fff}
.options li:hover{background:#fffbeb;border-color:var(--gold);transform:translateX(3px)}
.options li .letter{position:absolute;left:14px;top:11px;font-family:'Quicksand',sans-serif;font-weight:700;color:var(--gold);background:var(--gold-bg);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.84rem}
.options li.selected{background:#fffbeb;border-color:var(--gold)}
.options li.correct{background:var(--green-bg);border-color:var(--green);color:#166534}
.options li.correct .letter{background:var(--green);color:#fff}
.options li.wrong{background:var(--coral-bg);border-color:var(--coral);color:#9f1239}
.options li.wrong .letter{background:var(--coral);color:#fff}
.options li.disabled{cursor:default;pointer-events:none}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.pair-col{display:flex;flex-direction:column;gap:8px}
.pair-col .label{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.1em;color:var(--slate);text-transform:uppercase;margin-bottom:4px}
.pair-item{font-family:'Lora',serif;font-size:.98rem;padding:11px 13px;border:2px solid var(--rule);border-radius:12px;background:#fff;cursor:pointer;transition:all .15s}
.pair-item:hover{background:#fffbeb;border-color:var(--gold)}
.pair-item.selected{background:#fffbeb;border-color:var(--gold)}
.pair-item.matched{background:var(--green-bg);border-color:var(--green);color:#166534;cursor:default}
.pair-item.wrong{background:var(--coral-bg);border-color:var(--coral);color:#9f1239}

.fill-input,.essay-input{width:100%;font-family:'Lora',serif;font-size:1rem;padding:13px 16px;border:2px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:14px;line-height:1.55}
.fill-input:focus,.essay-input:focus{outline:none;border-color:var(--gold);background:#fffbeb;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.essay-input{min-height:150px;resize:vertical}

.model{background:linear-gradient(135deg,#f5f3ff 0%,#ede9fe 100%);border:2px solid #c4b5fd;border-radius:14px;padding:18px 22px;margin-bottom:16px;font-family:'Lora',serif;font-size:.96rem;line-height:1.65;color:var(--ink);position:relative}
.model::before{content:'✨';position:absolute;top:-12px;left:18px;background:var(--bg);padding:2px 6px;font-size:1rem}
.model .label{display:block;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.1em;color:#6d28d9;text-transform:uppercase;margin-bottom:8px}

.explain{background:var(--gold-bg);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:16px;font-family:'Lora',serif;font-size:.95rem;line-height:1.6;color:var(--ink)}
.explain strong{color:#a16207;font-weight:600}

.hint{background:#f0fdf4;border:2px dashed #86efac;border-radius:12px;padding:11px 16px;margin-bottom:14px;font-family:'Lora',serif;font-style:italic;font-size:.92rem;color:#166534}
.hint::before{content:'💡 ';font-style:normal}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.88rem;padding:11px 22px;border-radius:18px;border:2px solid var(--acc,#0ea5e9);background:var(--acc,#0ea5e9);color:#fff;cursor:pointer;transition:all .18s cubic-bezier(.34,1.4,.64,1);text-decoration:none;display:inline-block;box-shadow:0 3px 10px rgba(14,165,233,.25)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(14,165,233,.4)}
.btn.ghost{background:#fff;color:var(--acc,#0ea5e9);box-shadow:0 3px 8px rgba(0,0,0,.06)}
.btn.ghost:hover{background:var(--acc-bg,#e0f2fe)}
.btn.crimson{background:var(--coral);border-color:var(--coral);box-shadow:0 3px 10px rgba(251,113,133,.3)}
.btn.crimson:hover{box-shadow:0 6px 16px rgba(251,113,133,.45)}
.btn.gold{background:#fff;color:#a16207;border-color:var(--gold);box-shadow:0 3px 8px rgba(245,158,11,.2)}
.btn.gold:hover{background:var(--gold-bg)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

.intro{text-align:center;padding:24px 0 14px}
.intro .roman{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dark,#0369a1);margin-bottom:12px}
.intro .intro-emoji{font-size:3rem;margin-bottom:8px;display:block}
.intro h2{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.9rem;color:var(--ink);margin-bottom:14px;letter-spacing:-.4px}
.intro h2 em{font-style:italic;color:var(--acc-dark,#0369a1)}
.intro .desc{font-family:'Lora',serif;font-style:italic;font-size:1.04rem;color:var(--slate);max-width:520px;margin:0 auto 26px;line-height:1.6}
.intro .rule{display:none}

.done{text-align:center;padding:30px 0}
.done .roman{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dark,#0369a1);margin-bottom:8px}
.done .done-emoji{font-size:3.2rem;display:block;margin-bottom:6px;animation:bounce 1.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.done h2{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.85rem;color:var(--ink);margin-bottom:6px;letter-spacing:-.4px}
.done h2 em{font-style:italic;color:var(--acc-dark,#0369a1)}
.done .rule{display:none}
.done .score{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.2rem;color:var(--ink);margin-bottom:18px;margin-top:8px}
.done .score strong{color:var(--acc-dark,#0369a1)}
.done .verdict{font-family:'Lora',serif;font-style:italic;font-size:1.08rem;color:var(--coral);margin-bottom:18px;font-weight:600}
.done .review{font-family:'Lora',serif;font-size:.98rem;color:var(--slate);line-height:1.65;max-width:540px;margin:0 auto 28px}

.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule);transition:all .2s}
.dot.done{background:var(--acc,#0ea5e9)}
.dot.current{background:var(--gold);transform:scale(1.4)}

.self-grade{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

.foot{text-align:center;font-family:'Lora',serif;font-style:italic;font-size:.86rem;color:var(--slate);margin-top:32px;padding-top:20px;border-top:2px dashed var(--rule)}

@media(max-width:600px){
  .card{padding:24px 20px}
  .pairs{grid-template-columns:1fr}
  .topbar{grid-template-columns:auto 1fr auto;font-size:.85rem}
  .crest{font-size:.62rem;letter-spacing:.08em}
  .intro h2,.done h2{font-size:1.5rem}
}
</style>
</head>
<body data-track="reading">

<div class="topbar">
  <a class="back-link" href="../">&larr; Library</a>
  <div class="crest">Academic Track &middot; Beyond School</div>
  <button class="lang-toggle" id="langToggle">EN | ID</button>
</div>

<div class="track-bar">
  <div class="roman" id="trackRoman">Track I</div>
  <h1 id="trackTitle">Advanced Reading Comprehension</h1>
</div>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">Studium sine fine &mdash; study without end.</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const TRACK = ['reading','vocab','critical','writing'].includes(params.get('track')) ? params.get('track') : 'reading';
document.body.dataset.track = TRACK;

const LANG_KEY = 'alesha_excel_lang';
let LANG = localStorage.getItem(LANG_KEY) || 'en';

function t(obj){ return obj[LANG] || obj.en; }

const UI = {
  begin: {en:'Begin', id:'Mulai'},
  continueArr: {en:'Continue →', id:'Lanjutkan →'},
  hint: {en:'Show hint', id:'Tampilkan petunjuk'},
  submit: {en:'Submit', id:'Jawab'},
  showModel: {en:'Show model answer', id:'Tampilkan jawaban model'},
  gotRight: {en:'I got it right', id:'Saya benar'},
  needsReview: {en:'Needs review', id:'Perlu diulas'},
  concluding: {en:'Concluding...', id:'Menyimpulkan...'},
  conclusionOf: {en:'The Conclusion of', id:'Penutup'},
  ofShort: {en:'of', id:'dari'},
  question: {en:'Question', id:'Pertanyaan'},
  passage: {en:'Passage', id:'Bacaan'},
  yourAnswer: {en:'Type your answer...', id:'Tulis jawabanmu...'},
  returnLanding: {en:'Return to library', id:'Kembali ke perpustakaan'},
  restart: {en:'Restart track', id:'Ulang dari awal'},
  modelAnswer: {en:'Model answer', id:'Jawaban model'},
  correct: {en:'Correct.', id:'Benar.'},
  notQuite: {en:'Not quite.', id:'Belum tepat.'},
  youAnswered: {en:'You answered', id:'Kamu menjawab'},
  ofShort2: {en:'of', id:'dari'},
  correctly: {en:'correctly', id:'dengan benar'}
};

const TRACK_META = {
  reading: {
    roman: {en:'Track I', id:'Trek I'},
    title: {en:'Advanced Reading Comprehension', id:'Pemahaman Bacaan Lanjutan'},
    desc: {en:'Five short story passages plus one science passage. Read carefully and listen for what the writer is hinting — the best answers often hide between the lines.', id:'Lima petikan cerita pendek dan satu bacaan sains. Baca dengan saksama dan dengarkan apa yang penulis isyaratkan — jawaban terbaik sering tersembunyi di antara baris-barisnya.'},
    skill: {en:'reading comprehension', id:'pemahaman bacaan'}
  },
  vocab: {
    roman: {en:'Track II', id:'Trek II'},
    title: {en:'Vocabulary & Etymology', id:'Kosakata & Etimologi'},
    desc: {en:'Powerful words, sneaky Greek and Latin roots, and word puzzles. Take your time — the goal is to really feel each word, not to race.', id:'Kata-kata kuat, akar Yunani dan Latin yang licik, dan teka-teki kata. Pelan-pelan saja — tujuannya benar-benar merasakan tiap kata, bukan balapan.'},
    skill: {en:'vocabulary and word origin', id:'kosakata dan asal kata'}
  },
  critical: {
    roman: {en:'Track III', id:'Trek III'},
    title: {en:'Critical Reading & Argument', id:'Membaca Kritis & Argumen'},
    desc: {en:'Find the main point, tell facts from opinions, and spot the thinking mistakes writers (and friends!) make when they argue. You\'re becoming a detective of ideas.', id:'Temukan inti, bedakan fakta dari opini, dan kenali kesalahan berpikir yang dibuat penulis (dan teman!) saat berargumen. Kamu sedang jadi detektif ide.'},
    skill: {en:'critical reading', id:'membaca kritis'}
  },
  writing: {
    roman: {en:'Track IV', id:'Trek IV'},
    title: {en:'Advanced Grammar & Writing Craft', id:'Tata Bahasa Lanjutan & Kerajinan Menulis'},
    desc: {en:'How sentences are built, how writers paint pictures with words (similes, metaphors, personification), and two real essay prompts where YOU get to write. This is where reading turns into writing.', id:'Cara kalimat dibangun, cara penulis melukis dengan kata (simile, metafora, personifikasi), dan dua tugas esai sungguhan di mana KAMU yang menulis. Di sinilah membaca berubah jadi menulis.'},
    skill: {en:'writing craft', id:'kerajinan menulis'}
  }
};

const READING = [
  {
    type:'scenario',
    title: {en:'The Barn Before Breakfast', id:'Kandang Sebelum Sarapan'},
    sourceNote: {en:'Original passage in the spirit of E. B. White', id:'Bacaan asli dalam semangat E. B. White'},
    passage: {
      en:'<p>The barn smelled the way a barn should smell on a good morning — like sweet hay, sleepy cows, and the warm dusty coats of horses who had pulled wagons since long before Wilbur was born. It was the kind of place that, on mornings like this one, seemed to promise that nothing bad would ever happen to a small pig with a curly tail.</p><p>Wilbur stood very still in his pen. He listened for the rooster, and the rooster crowed right on time. He listened for the swallow under the roof, and the swallow gave one squeaky chirp. Then he listened for Charlotte. From Charlotte\'s corner there was nothing — no rustle, no soft hello — and Wilbur\'s small pink heart squeezed tight.</p>',
      id:'<p>Kandang itu tercium seperti kandang seharusnya pada pagi yang baik — bau jerami manis, sapi-sapi mengantuk, dan mantel hangat berdebu kuda-kuda yang sudah menarik gerobak jauh sebelum Wilbur lahir. Tempat itu, pada pagi seperti ini, seakan berjanji bahwa tak akan pernah ada hal buruk terjadi pada babi kecil berekor keriting.</p><p>Wilbur berdiri sangat diam di kandangnya. Ia mendengarkan ayam jantan, dan ayam jantan berkokok tepat waktu. Ia mendengarkan burung walet di bawah atap, dan walet berdecit sekali. Lalu ia mendengarkan Charlotte. Dari sudut Charlotte tak ada apa-apa — tak ada gerak, tak ada sapaan lembut — dan jantung kecil merah jambu Wilbur mengerut.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'When the story says the barn "seemed to promise that nothing bad would ever happen," what kind of feeling is the author building?', id:'Saat cerita berkata kandang "seakan berjanji tak akan pernah ada hal buruk terjadi", perasaan macam apa yang dibangun penulis?'}, options:[{en:'a scary, spooky feeling',id:'rasa seram dan menakutkan'},{en:'a cozy peace that feels easy to break',id:'ketenangan hangat yang mudah pecah'},{en:'a silly, joking mood',id:'suasana konyol dan bercanda'},{en:'a strict, serious lesson',id:'pelajaran ketat dan serius'}], a:1, explain:{en:'The peace feels real, but the very next paragraph cracks it open when Wilbur\'s heart squeezes — so the calm was the kind that wouldn\'t last.', id:'Ketenangannya nyata, tetapi paragraf berikutnya langsung memecahkannya ketika jantung Wilbur mengerut — jadi tenangnya memang mudah pecah.'}},
      {type:'mcq', q:{en:'When Wilbur\'s "small pink heart squeezed tight," what is he probably feeling?', id:'Saat "jantung kecil merah jambu Wilbur mengerut", apa yang mungkin sedang ia rasakan?'}, options:[{en:'a tummy ache',id:'sakit perut'},{en:'sleepy and full',id:'mengantuk dan kenyang'},{en:'a quiet worry',id:'kekhawatiran yang sunyi'},{en:'wild excitement',id:'kegembiraan liar'}], a:2, explain:{en:'A tight heart plus no Charlotte equals worry — not sickness, not joy.', id:'Jantung yang mengerut ditambah Charlotte yang tak terdengar sama dengan khawatir — bukan sakit, bukan senang.'}},
      {type:'mcq', q:{en:'Which word best describes how the narrator feels about Wilbur?', id:'Kata mana yang paling menggambarkan perasaan narator terhadap Wilbur?'}, options:[{en:'cold and distant',id:'dingin dan menjauh'},{en:'warm and tender',id:'hangat dan lembut'},{en:'teasing',id:'menggoda'},{en:'in a panic',id:'panik'}], a:1, explain:{en:'Words like "sweet," "sleepy," "small pink heart" show real affection — the narrator loves this little pig.', id:'Kata seperti "manis", "mengantuk", "jantung kecil merah jambu" menunjukkan kasih sayang — narator sayang pada babi kecil ini.'}},
      {type:'essay', q:{en:'In two or three sentences, explain how the writer makes the barn feel safe AND a tiny bit scary at the same time. Use one short quote from the passage.', id:'Dalam dua atau tiga kalimat, jelaskan bagaimana penulis membuat kandang terasa aman SEKALIGUS sedikit menakutkan. Pakai satu kutipan singkat dari bacaan.'}, model:{en:'The author makes the barn feel cozy by piling up warm details — "sweet hay, sleepy cows" — so we trust the place before anything bad arrives. Then the trust gets pulled out from under us when Wilbur listens for Charlotte and hears nothing. The silence feels louder because the peace right before it felt so real.', id:'Penulis membuat kandang terasa hangat dengan menumpuk detail nyaman — "jerami manis, sapi-sapi mengantuk" — supaya kita percaya pada tempat itu sebelum hal buruk datang. Lalu kepercayaan itu ditarik saat Wilbur mendengarkan Charlotte dan tak mendengar apa-apa. Sunyi itu terasa lebih keras karena tenangnya tadi sudah terasa sungguhan.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'The Ant on the Blanket', id:'Semut di Atas Selimut'},
    sourceNote: {en:'Original passage in the spirit of Madeleine L\'Engle', id:'Bacaan asli dalam semangat Madeleine L\'Engle'},
    passage: {
      en:'<p>Mrs. Whatsit picked up a tiny ant from the windowsill and placed it gently on one corner of her stripey picnic blanket. "This ant," she said, "needs to walk allllll the way across to the other corner." The ant began its long march. Then, with a sneaky smile, Mrs. Whatsit lifted the blanket and brought the two far corners together — pinch! — and the ant, without taking another step, was suddenly exactly where it wanted to be.</p><p>Meg\'s stomach did a flip. The math of it was wonderful and a little scary all at once. She really, really wanted to argue. But her little brother Charles Wallace was already nodding the tiny careful nod he saved for things that were impossible and also true.</p>',
      id:'<p>Nyonya Whatsit mengambil seekor semut mungil dari ambang jendela dan meletakkannya pelan di satu sudut selimut piknik bergaris-garisnya. "Semut ini," katanya, "harus berjalaaaan jauh sekali sampai ke sudut yang lain." Semut itu mulai berbaris. Lalu, dengan senyum nakal, Nyonya Whatsit mengangkat selimut dan menyatukan dua sudut yang berjauhan — cep! — dan semut itu, tanpa melangkah lagi, tiba-tiba persis berada di tempat yang dituju.</p><p>Perut Meg jungkir balik. Matematikanya menakjubkan sekaligus sedikit menakutkan. Ia sangat, sangat ingin membantah. Tapi adik kecilnya, Charles Wallace, sudah mengangguk kecil hati-hati seperti yang ia simpan untuk hal-hal yang mustahil dan juga benar.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'The folded blanket is mostly used by the writer as —', id:'Selimut yang dilipat itu paling utama dipakai penulis sebagai —'}, options:[{en:'a real map of the ant\'s trip',id:'peta sungguhan perjalanan semut'},{en:'a picture-trick to show how far places can be folded close together',id:'trik gambar untuk menunjukkan bagaimana tempat-tempat jauh bisa dilipat dekat'},{en:'proof that Mrs. Whatsit can sew',id:'bukti bahwa Nyonya Whatsit bisa menjahit'},{en:'a warning never to take shortcuts',id:'peringatan agar tak mengambil jalan pintas'}], a:1, explain:{en:'The blanket is a hands-on way to show how two far-apart points can be folded right next to each other — that\'s the big idea.', id:'Selimut itu cara nyata menunjukkan dua titik berjauhan bisa dilipat agar berdampingan — itulah ide besarnya.'}},
      {type:'mcq', q:{en:'"Wonderful and a little scary all at once" is an example of —', id:'"Menakjubkan sekaligus sedikit menakutkan" adalah contoh —'}, options:[{en:'hyperbole (a huge exaggeration)',id:'hiperbola (pelebihan besar)'},{en:'paradox (two opposite things held together)',id:'paradoks (dua hal berlawanan disatukan)'},{en:'simile (a "like" or "as" comparison)',id:'simile (perbandingan "bagai/seperti")'},{en:'understatement (saying less than you mean)',id:'litotes (mengatakan kurang dari maksudnya)'}], a:1, explain:{en:'Two opposite feelings smushed together = paradox. It\'s how real moments often feel.', id:'Dua perasaan berlawanan disatukan = paradoks. Begitulah momen sungguhan sering terasa.'}},
      {type:'mcq', q:{en:'Charles Wallace\'s little nod tells us that he —', id:'Anggukan kecil Charles Wallace memberi tahu kita bahwa ia —'}, options:[{en:'has heard this explained before',id:'pernah mendengar penjelasan ini'},{en:'is almost falling asleep',id:'hampir tertidur'},{en:'thinks Mrs. Whatsit is wrong',id:'mengira Nyonya Whatsit salah'},{en:'can accept a kind of "knowing" that Meg pushes back against',id:'bisa menerima "pengetahuan" yang ditolak Meg'}], a:3, explain:{en:'He nods at the impossible-and-true; Meg wants to argue with it. They handle wonder differently.', id:'Ia mengangguk pada yang mustahil-dan-benar; Meg ingin membantahnya. Mereka menanggapi keajaiban dengan cara berbeda.'}},
      {type:'essay', q:{en:'In three sentences, explain what Meg\'s reaction tells us about who she is. (Read between the lines!)', id:'Dalam tiga kalimat, jelaskan apa yang reaksi Meg ceritakan tentang siapa dirinya. (Bacalah yang tersirat!)'}, model:{en:'Meg feels the truth in her stomach before she lets her brain accept it, which means her body trusts what is happening even when her mind is busy doubting. She wants to argue because she likes things that make logical sense, and magic doesn\'t. But she doesn\'t actually argue, and that little detail tells us she is brave enough to be convinced when the evidence is right in front of her.', id:'Meg merasakan kebenarannya di perut sebelum otaknya mau menerima, artinya tubuhnya sudah percaya saat pikirannya masih sibuk meragukan. Ia ingin membantah karena ia suka hal-hal yang logis, dan keajaiban tidak begitu. Tapi ia tak benar-benar membantah, dan detail kecil itu menunjukkan ia cukup berani untuk diyakinkan saat buktinya ada di depan mata.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'Through the Coats', id:'Lewat Mantel-Mantel'},
    sourceNote: {en:'Original passage in the spirit of C. S. Lewis', id:'Bacaan asli dalam semangat C. S. Lewis'},
    passage: {
      en:'<p>Lucy pushed past the rough, scratchy fur coats — and instead of bumping into the back of the wardrobe, she felt something cold and powdery tickle the back of her hand. A second later she was standing in a snowy forest at night, with snow crunching under her shoes and slow white flakes drifting down through the dark.</p><p>She was a tiny bit scared, but she was also super curious and, honestly, kind of delighted. She peeked back over her shoulder, and there — between two dark tree trunks — she could still see the open wardrobe door and even catch a glimpse of the empty spare room she had just stepped out of.</p>',
      id:'<p>Lucy mendorong tubuhnya melewati mantel-mantel bulu yang kasar dan menggelitik — dan alih-alih membentur dinding belakang lemari, ia merasakan sesuatu yang dingin dan berbubuk menggelitik punggung tangannya. Sedetik kemudian ia berdiri di hutan bersalju di malam hari, dengan salju berbunyi kresek di bawah sepatunya dan kepingan putih lambat jatuh menembus gelap.</p><p>Ia sedikit takut, tetapi juga sangat penasaran dan, sejujurnya, agak senang. Ia mengintip ke belakang lewat bahunya, dan di sana — di antara dua batang pohon gelap — ia masih bisa melihat pintu lemari yang terbuka dan bahkan menangkap sekilas kamar tamu kosong yang baru saja ia tinggalkan.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'Why do you think the writer makes us feel "rough fur" and then "cold powdery" snow back-to-back?', id:'Menurutmu, kenapa penulis membuat kita merasakan "bulu yang kasar" lalu "salju dingin berbubuk" berurutan?'}, options:[{en:'to show Lucy is clumsy',id:'untuk menunjukkan Lucy ceroboh'},{en:'so we feel her cross from one world into another, just through touch',id:'agar kita merasakan ia menyeberang dari satu dunia ke dunia lain, hanya lewat sentuhan'},{en:'to warn us a fight is coming',id:'memperingatkan akan ada perkelahian'},{en:'to make fun of her family',id:'mengolok-olok keluarganya'}], a:1, explain:{en:'The switch from fur to snow IS the moment of crossing — we feel the doorway with her fingertips.', id:'Pergantian dari bulu ke salju ITULAH momen menyeberang — kita merasakan ambang dengan ujung jarinya.'}},
      {type:'mcq', q:{en:'How would you describe Lucy\'s feelings in this moment?', id:'Bagaimana kamu menggambarkan perasaan Lucy saat ini?'}, options:[{en:'totally terrified',id:'ketakutan total'},{en:'doing a boring chore',id:'sedang melakukan tugas membosankan'},{en:'a little scared, but mostly excited and curious',id:'sedikit takut, tapi kebanyakan penasaran dan senang'},{en:'bored and not caring',id:'bosan dan tak peduli'}], a:2, explain:{en:'"A tiny bit scared" + "super curious" + "kind of delighted" — that\'s fear and curiosity braided together.', id:'"Sedikit takut" + "sangat penasaran" + "agak senang" — itulah takut dan rasa ingin tahu yang dijalin.'}},
      {type:'mcq', q:{en:'The fact that Lucy can still see the wardrobe doorway is important because it shows —', id:'Fakta bahwa Lucy masih bisa melihat pintu lemari penting karena menunjukkan —'}, options:[{en:'the new world is a dream',id:'dunia baru itu mimpi'},{en:'there\'s a way home, at least for now',id:'ada jalan pulang, setidaknya untuk saat ini'},{en:'the wardrobe is broken',id:'lemari itu rusak'},{en:'time has frozen',id:'waktu telah membeku'}], a:1, explain:{en:'The open door is the writer\'s gentle promise — you can go home. That makes the adventure feel safer to enter.', id:'Pintu terbuka adalah janji lembut dari penulis — kamu bisa pulang. Itu membuat petualangan ini lebih aman dimasuki.'}},
      {type:'essay', q:{en:'Why does it matter that Lucy goes through the wardrobe alone, with no brothers or sisters? Answer in three or four sentences.', id:'Mengapa penting bahwa Lucy masuk lemari sendirian, tanpa kakak atau adik? Jawab dalam tiga atau empat kalimat.'}, model:{en:'Going alone makes the moment hers — there\'s no one else to nod and say "yes, I saw it too," which means her siblings will have to choose whether to believe her. Being alone also lets us really see Lucy\'s personality: curious and brave instead of panicked. And finally, going first makes Lucy the kid we trust — the one who sees the magic before anyone else, and shows them the way in.', id:'Pergi sendirian membuat momen itu menjadi miliknya — tak ada orang lain yang mengangguk dan berkata "ya, aku juga melihat", artinya saudara-saudaranya harus memilih mempercayainya atau tidak. Sendirian juga membuat kita benar-benar melihat siapa Lucy: penasaran dan berani, bukan panik. Dan terakhir, dengan pergi duluan, Lucy menjadi anak yang kita percayai — yang melihat keajaiban lebih dulu dan menunjukkan jalan masuk pada yang lain.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'The First Memory', id:'Ingatan Pertama'},
    sourceNote: {en:'Original passage in the spirit of Lois Lowry', id:'Bacaan asli dalam semangat Lois Lowry'},
    passage: {
      en:'<p>The old man rested his hands gently on Jonas\'s back. At first Jonas felt only the warmth of two old palms. Then, slowly, a feeling that wasn\'t his own settled into him: a hillside, snow drifting down, and the very particular cold of a wind that had a <em>direction</em>. Jonas had never once imagined that wind could have a direction. In his town the air just sat there, polite and the same.</p><p>When the memory ended, Jonas opened his eyes. The room was the same. The old man was the same. But Jonas understood, with a sharpness that felt almost like sadness, that his whole community had been living their whole lives without weather.</p>',
      id:'<p>Lelaki tua itu meletakkan tangan dengan lembut di punggung Jonas. Mulanya Jonas hanya merasakan hangat dua telapak tangan tua. Lalu, perlahan, sebuah perasaan yang bukan miliknya menetap di dalam dirinya: lereng bukit, salju yang turun, dan dinginnya angin yang punya <em>arah</em>. Jonas belum pernah sekali pun membayangkan angin bisa punya arah. Di kotanya, udara hanya diam di tempat, sopan dan sama saja.</p><p>Ketika ingatan itu berakhir, Jonas membuka mata. Ruangan itu sama. Lelaki tua itu sama. Tapi Jonas mengerti, dengan ketajaman yang nyaris terasa seperti kesedihan, bahwa seluruh komunitasnya selama ini hidup tanpa cuaca.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'"A sharpness that felt almost like sadness" tells us mostly about —', id:'"Ketajaman yang nyaris terasa seperti kesedihan" terutama memberi tahu kita tentang —'}, options:[{en:'a pain in his back',id:'sakit di punggungnya'},{en:'the price of suddenly knowing something new',id:'harga karena tiba-tiba mengetahui sesuatu yang baru'},{en:'being afraid of the old man',id:'takut pada lelaki tua'},{en:'feeling cold from the snow',id:'kedinginan karena salju'}], a:1, explain:{en:'New knowledge has a cost. Jonas is sad because he just learned what his town has been missing.', id:'Pengetahuan baru ada harganya. Jonas sedih karena baru tahu apa yang selama ini hilang dari kotanya.'}},
      {type:'mcq', q:{en:'"Living without weather" works on TWO levels at once. Which two?', id:'"Hidup tanpa cuaca" bekerja pada DUA tingkat sekaligus. Yang mana?'}, options:[{en:'history and money',id:'sejarah dan uang'},{en:'the real meaning AND a deeper, hidden meaning',id:'makna sungguhan DAN makna lebih dalam yang tersembunyi'},{en:'funny and sad',id:'lucu dan sedih'},{en:'science and politics',id:'sains dan politik'}], a:1, explain:{en:'Literally there\'s no wind or snow. Underneath, it means his town has no surprises, no change, no real feelings.', id:'Secara harfiah tak ada angin atau salju. Di baliknya, artinya kota itu tak punya kejutan, tak punya perubahan, tak punya perasaan sungguhan.'}},
      {type:'mcq', q:{en:'Why is the tiny detail "wind had a direction" so important to this story?', id:'Mengapa detail kecil "angin punya arah" begitu penting dalam cerita ini?'}, options:[{en:'because it introduces a map',id:'karena memperkenalkan peta'},{en:'because it shows Jonas\'s world has been emptied of small, interesting details',id:'karena menunjukkan dunia Jonas telah dikosongkan dari detail-detail kecil yang menarik'},{en:'because a storm is coming',id:'karena badai akan datang'},{en:'because it makes fun of the old man',id:'karena mengejek lelaki tua'}], a:1, explain:{en:'A wind without direction is plain. Real wind has personality. Jonas is realising his world erased the personality.', id:'Angin tanpa arah itu hambar. Angin sungguhan punya karakter. Jonas sadar dunianya telah menghapus karakter itu.'}},
      {type:'essay', q:{en:'Is Jonas\'s new knowledge a gift or a heavy weight? In three or four sentences, take a side — and explain why "almost like sadness" makes the question harder.', id:'Apakah pengetahuan baru Jonas adalah hadiah atau beban berat? Dalam tiga atau empat kalimat, pilih sisi — dan jelaskan mengapa "nyaris seperti kesedihan" membuat pertanyaan ini lebih sulit.'}, model:{en:'Jonas\'s new knowledge is both a gift and a heavy weight at the same time. It\'s a gift because he can now feel snow, wind, and the real texture of being alive — things his town threw away. But it\'s heavy because once he knows what\'s missing, he can\'t un-know it, and he sees that everyone he loves is living a flatter life. "Almost like sadness" tells us the truth: learning something amazing can also make you grieve a little for everyone who doesn\'t know yet.', id:'Pengetahuan baru Jonas adalah hadiah sekaligus beban berat. Hadiah karena ia kini bisa merasakan salju, angin, dan tekstur sungguhan dari kehidupan — hal-hal yang dibuang kotanya. Tapi berat karena begitu ia tahu apa yang hilang, ia tak bisa lagi tidak tahu, dan ia melihat semua yang ia sayangi menjalani hidup yang lebih datar. "Nyaris seperti kesedihan" membuka kebenarannya: belajar sesuatu yang luar biasa juga bisa membuatmu sedih untuk semua yang belum tahu.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'The Locked Garden Door', id:'Pintu Taman yang Terkunci'},
    sourceNote: {en:'Original passage in the spirit of Frances Hodgson Burnett', id:'Bacaan asli dalam semangat Frances Hodgson Burnett'},
    passage: {
      en:'<p>Mary stood with one hand on the heavy door and listened hard. There was no sound in the garden at all except for the small busy chirping of a red-breasted robin somewhere in the tangled, twisty vines. Mary had been a thin, grumpy kind of kid for as long as she could remember — but she hadn\'t known, until this exact morning, that she could feel her own heart beating from the inside.</p><p>She pushed. The door swung open slowly, with a long, sleepy groan from hinges that hadn\'t been asked to move in ten whole years.</p>',
      id:'<p>Mary berdiri dengan satu tangan di pintu berat itu dan mendengarkan dengan sungguh-sungguh. Tak ada suara apa pun di taman, kecuali suara kecil sibuk seekor robin berdada merah di antara sulur-sulur yang kusut berliku. Mary sudah menjadi anak yang kurus dan suka cemberut sejauh yang ia ingat — tapi sampai pagi ini ia tak pernah tahu bahwa ia bisa merasakan jantungnya sendiri berdetak dari dalam.</p><p>Ia mendorong. Pintu itu terbuka pelan, dengan erangan panjang dan mengantuk dari engsel yang tak diminta bergerak selama sepuluh tahun penuh.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'When Mary "could feel her own heart beating from the inside," what is the writer hinting?', id:'Saat Mary "bisa merasakan jantungnya berdetak dari dalam", apa yang penulis sedang isyaratkan?'}, options:[{en:'she has a fever',id:'ia demam'},{en:'she\'s starting to feel really alive for the first time',id:'ia mulai merasa benar-benar hidup untuk pertama kalinya'},{en:'she\'s about to run a race',id:'ia akan ikut lomba lari'},{en:'she\'s scared of the robin',id:'ia takut pada robin'}], a:1, explain:{en:'Noticing your own heartbeat is the moment you wake up to yourself — Mary is becoming a real person inside.', id:'Menyadari detak jantung sendiri adalah momen kamu bangun pada dirimu sendiri — Mary mulai menjadi seseorang yang utuh di dalam.'}},
      {type:'mcq', q:{en:'"A long, sleepy groan from hinges" — what kind of figurative language is this?', id:'"Erangan panjang dan mengantuk dari engsel" — ini majas apa?'}, options:[{en:'metaphor',id:'metafora'},{en:'personification (giving human qualities to non-human things)',id:'personifikasi (memberi sifat manusia pada benda)'},{en:'irony',id:'ironi'},{en:'alliteration',id:'aliterasi'}], a:1, explain:{en:'Hinges can\'t actually feel sleepy — only people can. Giving human feelings to objects = personification.', id:'Engsel tak benar-benar bisa mengantuk — hanya manusia bisa. Memberi perasaan manusia pada benda = personifikasi.'}},
      {type:'mcq', q:{en:'Why does the writer tell us the door hasn\'t moved "in ten whole years"?', id:'Mengapa penulis memberi tahu kita bahwa pintu tak bergerak "selama sepuluh tahun penuh"?'}, options:[{en:'to give us a repair schedule',id:'memberi kita jadwal perbaikan'},{en:'to hint at a buried sadness connected to this garden',id:'mengisyaratkan kesedihan terkubur yang terkait taman ini'},{en:'because Mary is ten',id:'karena Mary berusia sepuluh'},{en:'because the gardener died',id:'karena tukang kebun meninggal'}], a:1, explain:{en:'A locked-up place for ten years is a clue: somebody important was sad enough to close it off — and we\'re about to find out who.', id:'Tempat terkunci sepuluh tahun adalah petunjuk: ada orang penting yang cukup sedih sampai menutupnya — dan kita akan segera tahu siapa.'}},
      {type:'essay', q:{en:'How does the writer make Mary and the garden feel like they match each other? Answer in three sentences.', id:'Bagaimana penulis membuat Mary dan taman terasa seperti pasangan? Jawab dalam tiga kalimat.'}, model:{en:'The garden has been locked up and forgotten for ten years; Mary has felt closed-up inside herself for as long as she can remember — so they\'re kind of twins. Both are described as tangled or grumpy, and both are starting to wake up: the hinges with their sleepy groan, Mary with the heartbeat she can finally feel. By pushing open the door, Mary is also pushing open something inside herself, and we get the feeling that fixing one will mean fixing the other.', id:'Taman telah terkunci dan terlupakan selama sepuluh tahun; Mary merasa tertutup di dalam dirinya selama yang ia ingat — jadi mereka semacam kembaran. Keduanya digambarkan kusut atau cemberut, dan keduanya mulai bangun: engsel dengan erangan mengantuknya, Mary dengan detak jantung yang akhirnya ia rasakan. Dengan mendorong pintu itu terbuka, Mary juga mendorong sesuatu di dalam dirinya, dan kita merasa bahwa memperbaiki yang satu akan berarti memperbaiki yang lain.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'Why is the Sky Blue?', id:'Kenapa Langit Berwarna Biru?'},
    sourceNote: {en:'Non-fiction science passage (original)', id:'Bacaan sains non-fiksi (asli)'},
    passage: {
      en:'<p>Sunlight looks white, but here\'s the secret: it\'s actually a giant bundle of every colour mashed together. When that bundle of light zooms into Earth\'s atmosphere, it crashes into tiny molecules of nitrogen and oxygen and bounces off in every direction. Scientists have a fancy name for this bouncing — they call it <em>Rayleigh scattering</em>. Shorter colours of light, like blue and violet, bounce way, way more than longer ones, like red.</p><p>So why isn\'t the sky violet, then? Because human eyes don\'t notice violet as well as blue, AND some of that violet light gets soaked up way up high in the sky. Add it all up, and you get the familiar blue dome above us every day. At sunset, sunlight has to slant sideways through much more atmosphere to reach you. All the blues get bounced away on that long slanted trip, and only the longest wavelengths — orange and red — survive to reach your eyeballs. That\'s your sunset.</p>',
      id:'<p>Sinar matahari tampak putih, tapi ini rahasianya: sebenarnya ia adalah ikatan raksasa dari semua warna yang menyatu. Saat ikatan cahaya itu masuk ke atmosfer Bumi, ia menabrak molekul-molekul mungil nitrogen dan oksigen lalu memantul ke segala arah. Ilmuwan punya nama keren untuk pantulan ini — mereka menyebutnya <em>hamburan Rayleigh</em>. Warna-warna cahaya yang lebih pendek, seperti biru dan ungu, memantul jauh, jauh lebih kuat daripada yang panjang, seperti merah.</p><p>Kalau begitu, kenapa langit tidak ungu? Karena mata manusia tidak melihat ungu sebaik biru, DAN sebagian cahaya ungu terserap tinggi di atas sana. Jumlahkan semuanya, dan kamu mendapat kubah biru yang akrab di atas kita setiap hari. Saat matahari terbenam, cahayanya harus menembus atmosfer jauh lebih banyak dengan sudut miring untuk mencapaimu. Semua biru terpantul habis di perjalanan miring panjang itu, dan hanya panjang gelombang terpanjang — jingga dan merah — yang sampai ke bola matamu. Itulah matahari terbenammu.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'According to the passage, why doesn\'t the sky look violet (since violet bounces even more than blue)?', id:'Menurut bacaan, kenapa langit tidak terlihat ungu (padahal ungu memantul lebih banyak dari biru)?'}, options:[{en:'Violet light doesn\'t bounce at all',id:'Cahaya ungu sama sekali tak memantul'},{en:'Our eyes don\'t notice violet as well, and some violet is soaked up high in the sky',id:'Mata kita tak melihat ungu sebaik biru, dan sebagian ungu terserap tinggi di atas'},{en:'Violet is blocked by clouds',id:'Ungu dihalangi awan'},{en:'The sun doesn\'t make any violet light',id:'Matahari tak membuat cahaya ungu'}], a:1, explain:{en:'The passage gives BOTH reasons: our eyes prefer blue, and high-up air absorbs some violet.', id:'Bacaan menyebut KEDUA alasannya: mata kita lebih suka biru, dan udara tinggi menyerap sebagian ungu.'}},
      {type:'mcq', q:{en:'What is the main job of the second paragraph?', id:'Apa tugas utama paragraf kedua?'}, options:[{en:'to argue against the first paragraph',id:'membantah paragraf pertama'},{en:'to use the same idea to explain something new (sunsets!)',id:'menggunakan ide yang sama untuk menjelaskan hal baru (matahari terbenam!)'},{en:'to bring up a totally different topic',id:'memperkenalkan topik yang tak nyambung'},{en:'to say Rayleigh scattering isn\'t real',id:'mengatakan hamburan Rayleigh tidak nyata'}], a:1, explain:{en:'Same science (scattering) — but applied to a different time of day. That\'s good non-fiction writing.', id:'Sains yang sama (hamburan) — tapi dipakai untuk waktu yang berbeda. Itulah ciri tulisan non-fiksi yang baik.'}},
      {type:'mcq', q:{en:'When the passage says sunlight "slants sideways" at sunset, it means light is —', id:'Saat bacaan berkata cahaya matahari "miring" saat matahari terbenam, artinya cahaya —'}, options:[{en:'traveling straight down',id:'menembus lurus ke bawah'},{en:'traveling through WAY more air because of the angle',id:'menempuh udara JAUH lebih banyak karena sudutnya'},{en:'skipping the atmosphere',id:'menghindari atmosfer'},{en:'curving around the moon',id:'membelok mengitari bulan'}], a:1, explain:{en:'The slant makes the path longer, so more blue gets bounced out and only red/orange survive.', id:'Sudut miring membuat lintasannya lebih panjang, sehingga lebih banyak biru terpantul keluar dan hanya merah/jingga yang sampai.'}},
      {type:'essay', q:{en:'In your own words, in three sentences, explain why sunsets are red. Use only ideas from the passage.', id:'Pakai kata-katamu sendiri, dalam tiga kalimat, jelaskan mengapa matahari terbenam berwarna merah. Gunakan hanya ide dari bacaan.'}, model:{en:'When the sun is setting, its light enters our atmosphere at a slanted, sideways angle, which means it has to push through way more air than at lunchtime. Along that long path, almost all the blue and violet light gets bounced away in every direction by tiny air molecules. Only the longest colours — red and orange — make it all the way to our eyes, and those are the colours we see painted across the sky.', id:'Saat matahari terbenam, cahayanya masuk atmosfer dengan sudut miring, artinya ia harus mendorong menembus udara jauh lebih banyak dibanding waktu siang. Di sepanjang lintasan panjang itu, hampir semua cahaya biru dan ungu terpantul ke segala arah oleh molekul udara mungil. Hanya warna terpanjang — merah dan jingga — yang berhasil sampai ke mata kita, dan itulah warna-warna yang kita lihat melukis langit.'}}
    ]
  }
];

const VOCAB = [
  {type:'mcq', tag:{en:'What does this word mean?',id:'Apa makna kata ini?'}, q:{en:'"Even when her friends teased her, Maya\'s love for chess was <em>steadfast</em>." What does <em>steadfast</em> mean here?', id:'"Bahkan saat teman-temannya mengejek, kecintaan Maya pada catur tetap <em>steadfast</em>." Apa arti <em>steadfast</em> di sini?'}, options:[{en:'wobbly and changing',id:'goyah dan berubah-ubah'},{en:'firm and unshakeable',id:'kokoh dan tak tergoyahkan'},{en:'only sometimes',id:'hanya kadang-kadang'},{en:'shy and quiet',id:'malu dan pendiam'}], a:1, explain:{en:'Steadfast = solid as a rock. Comes from Old English stede (place) + fast (stuck) — literally "stuck in place." Maya\'s love won\'t budge.', id:'Steadfast = kokoh bagai batu. Dari stede (tempat) + fast (lekat) Inggris Kuno — secara harfiah "terpaku di tempat." Cinta Maya tak akan goyah.'}},
  {type:'mcq', tag:{en:'What does this word mean?',id:'Apa makna kata ini?'}, q:{en:'"Dad gave a <em>perfunctory</em> nod when I asked if he\'d heard about my science project — clearly he was still reading his phone." What does <em>perfunctory</em> mean?', id:'"Ayah memberi anggukan <em>perfunctory</em> saat aku tanya apakah ia tahu soal proyek sainsku — jelas ia masih membaca HP-nya." Apa arti <em>perfunctory</em>?'}, options:[{en:'super excited',id:'sangat antusias'},{en:'done quickly without really paying attention',id:'dilakukan cepat tanpa benar-benar memperhatikan'},{en:'angry and mean',id:'marah dan galak'},{en:'careful and thoughtful',id:'hati-hati dan penuh pikir'}], a:1, explain:{en:'Perfunctory = going through the motions, no heart in it. From Latin perfungi (to get through a duty). We\'ve ALL been on the receiving end of one.', id:'Perfunctory = sekadar formalitas, tanpa hati di dalamnya. Dari Latin perfungi (menyelesaikan kewajiban). Kita SEMUA pernah merasakannya.'}},
  {type:'mcq', tag:{en:'Greek root: chron- (time)',id:'Akar Yunani: chron- (waktu)'}, q:{en:'The Greek root <em>chron-</em> means TIME (like chronos = time in Greek). Which word does NOT have this root?', id:'Akar Yunani <em>chron-</em> berarti WAKTU (chronos = waktu dalam bahasa Yunani). Kata mana yang TIDAK punya akar ini?'}, options:[{en:'chronic (lasting a long time)',id:'chronic (berlangsung lama)'},{en:'chronicle (story told in time order)',id:'chronicle (kisah dalam urutan waktu)'},{en:'chrome (a shiny metal finish)',id:'chrome (lapisan logam mengilap)'},{en:'synchronize (happen at the same time)',id:'synchronize (terjadi serentak)'}], a:2, explain:{en:'Chrome is a sneaky imposter! It comes from Greek chroma (COLOUR), not chronos (time). Same first letters, totally different family.', id:'Chrome adalah penyusup licik! Berasal dari chroma (WARNA) Yunani, bukan chronos (waktu). Huruf depannya sama, keluarganya beda jauh.'}},
  {type:'mcq', tag:{en:'Latin root: scrib- (to write)',id:'Akar Latin: scrib- (menulis)'}, q:{en:'The Latin root <em>scrib-/script-</em> means "to write." So a <em>scribe</em> is —', id:'Akar Latin <em>scrib-/script-</em> berarti "menulis." Maka <em>scribe</em> adalah —'}, options:[{en:'a person who sings',id:'orang yang bernyanyi'},{en:'a person who writes or copies texts by hand',id:'orang yang menulis atau menyalin teks dengan tangan'},{en:'a type of bird',id:'sejenis burung'},{en:'someone who designs buildings',id:'orang yang merancang bangunan'}], a:1, explain:{en:'Once you know scrib- means "write," you unlock a whole army of words: inscribe (write on), manuscript (handwritten), prescription (a doctor\'s written note), describe (write down what something is like).', id:'Begitu kamu tahu scrib- = "menulis," kamu membuka pasukan kata: inscribe (menulis pada), manuscript (tulisan tangan), prescription (catatan dokter), describe (menuliskan ciri-cirinya).'}},
  {type:'mcq', tag:{en:'Word analogy',id:'Analogi kata'}, q:{en:'Figure out the pattern! <em>ARID : DESERT</em> :: ? : ? (Hint: what kind of relationship?)', id:'Cari polanya! <em>ARID (kering) : DESERT (gurun)</em> :: ? : ? (Petunjuk: hubungannya apa?)'}, options:[{en:'humid : jungle (steamy : place)',id:'humid (lembap) : jungle (hutan rimba)'},{en:'cold : fire',id:'cold : fire'},{en:'dark : noon',id:'dark : noon'},{en:'silent : market',id:'silent : market'}], a:0, explain:{en:'A desert IS arid (super dry); a jungle IS humid (super steamy). Each word describes the most obvious feeling of that place.', id:'Gurun ITU arid (super kering); hutan rimba ITU humid (super lembap). Tiap kata menggambarkan rasa paling khas dari tempat itu.'}},
  {type:'mcq', tag:{en:'Word analogy',id:'Analogi kata'}, q:{en:'<em>WHISPER : SHOUT</em> :: ? : ? (Hint: think small version vs. big version of the same action.)', id:'<em>WHISPER (bisik) : SHOUT (teriak)</em> :: ? : ? (Petunjuk: versi kecil vs versi besar dari aksi yang sama.)'}, options:[{en:'sip : gulp (small drink : big drink)',id:'sip (seruput) : gulp (teguk besar)'},{en:'eat : sleep',id:'eat : sleep'},{en:'sing : dance',id:'sing : dance'},{en:'walk : think',id:'walk : think'}], a:0, explain:{en:'Whisper and shout are both ways of speaking (small vs. huge). Sip and gulp are both ways of drinking (small vs. huge). Same kind of action, different volume!', id:'Whisper dan shout sama-sama berbicara (kecil vs besar). Sip dan gulp sama-sama minum (kecil vs besar). Aksi sejenis, volume beda!'}},
  {type:'mcq', tag:{en:'Prefix: bene-',id:'Awalan: bene-'}, q:{en:'In <em>benevolent</em> ("kind and wanting good things for people"), what does the prefix <em>bene-</em> mean?', id:'Dalam <em>benevolent</em> ("baik hati dan menginginkan hal baik untuk orang"), apa arti awalan <em>bene-</em>?'}, options:[{en:'against',id:'melawan'},{en:'well or good',id:'baik'},{en:'under',id:'di bawah'},{en:'two',id:'dua'}], a:1, explain:{en:'Bene- = good (Latin). You\'ve seen it in benefit (a good thing), benediction (a good word, like a blessing), and benevolent (wishing well).', id:'Bene- = baik (Latin). Kamu sudah melihatnya di benefit (hal baik), benediction (kata baik, seperti berkat), dan benevolent (berkehendak baik).'}},
  {type:'mcq', tag:{en:'Suffix: -ology',id:'Akhiran: -ology'}, q:{en:'When you see <em>-ology</em> at the end of a word, it means —', id:'Saat kamu lihat <em>-ology</em> di akhir kata, artinya —'}, options:[{en:'the study of something',id:'kajian tentang sesuatu'},{en:'fear of something',id:'takut pada sesuatu'},{en:'someone who loves something',id:'pencinta sesuatu'},{en:'hatred of something',id:'kebencian terhadap sesuatu'}], a:0, explain:{en:'-ology comes from Greek logos (word/study). So biology = study of LIFE, zoology = study of ANIMALS, geology = study of EARTH. Crack open any "-ology" word and you find a curious scientist inside.', id:'-ology dari logos Yunani (kata/kajian). Jadi biology = kajian KEHIDUPAN, zoology = kajian HEWAN, geology = kajian BUMI. Bongkar kata "-ology" mana saja, kamu akan menemukan ilmuwan penasaran di dalamnya.'}},
  {type:'mcq', tag:{en:'What does this word mean?',id:'Apa makna kata ini?'}, q:{en:'"Lina\'s argument for getting a puppy was <em>cogent</em>: she listed responsibilities, showed her savings, and even made a chore chart." What does <em>cogent</em> mean?', id:'"Argumen Lina untuk meminta anak anjing sangat <em>cogent</em>: ia mendaftar tanggung jawab, menunjukkan tabungannya, bahkan membuat daftar tugas." Apa arti <em>cogent</em>?'}, options:[{en:'confused and messy',id:'kacau dan berantakan'},{en:'clear and really convincing',id:'jernih dan sangat meyakinkan'},{en:'angry and loud',id:'marah dan keras'},{en:'long and boring',id:'panjang dan membosankan'}], a:1, explain:{en:'Cogent = an argument so well-built it almost forces you to agree. From Latin cogere (to drive together, to compel). Lina built a case mom couldn\'t say no to.', id:'Cogent = argumen yang dibangun begitu baik sampai hampir memaksamu setuju. Dari Latin cogere (mendorong bersatu, memaksa). Lina membangun argumen yang tak bisa ditolak mama.'}},
  {type:'mcq', tag:{en:'What does this word mean?',id:'Apa makna kata ini?'}, q:{en:'"Sam spoke with <em>candor</em> when he told his coach he\'d skipped practice — no excuses, just the truth." What does <em>candor</em> mean?', id:'"Sam berbicara dengan <em>candor</em> saat ia memberi tahu pelatihnya bahwa ia bolos latihan — tanpa alasan, hanya kebenaran." Apa arti <em>candor</em>?'}, options:[{en:'cheerful flattery',id:'sanjungan ceria'},{en:'honest, straight-from-the-heart truth',id:'kejujuran terus-terang dari hati'},{en:'a cold, distant attitude',id:'sikap dingin dan menjauh'},{en:'making fun of someone',id:'mengolok-olok seseorang'}], a:1, explain:{en:'Candor = saying the real thing without dressing it up. From Latin candidus (bright, white) — the same root as "candid" photos: unposed, no filter.', id:'Candor = mengatakan hal yang sebenarnya tanpa dihias. Dari candidus (cerah, putih) Latin — akar yang sama dengan foto "candid": tanpa pose, tanpa filter.'}},
  {type:'mcq', tag:{en:'Greek root: phil- (love)',id:'Akar Yunani: phil- (cinta)'}, q:{en:'The root <em>phil-</em> means "love" and <em>anthropos</em> means "human." So <em>philanthropy</em> literally means —', id:'Akar <em>phil-</em> berarti "cinta" dan <em>anthropos</em> berarti "manusia." Maka <em>philanthropy</em> secara harfiah berarti —'}, options:[{en:'love of money',id:'cinta uang'},{en:'love of humankind (helping people!)',id:'cinta kemanusiaan (membantu orang!)'},{en:'love of music',id:'cinta musik'},{en:'love of yourself',id:'cinta diri sendiri'}], a:1, explain:{en:'A philanthropist is basically someone who loves people so much they share what they have. Bonus: bibliophile = book-lover, philharmonic = music-lover.', id:'Philanthropist pada dasarnya orang yang begitu mencintai sesama sampai mau berbagi. Bonus: bibliophile = pencinta buku, philharmonic = pencinta musik.'}},
  {type:'mcq', tag:{en:'Latin root: vid-/vis- (to see)',id:'Akar Latin: vid-/vis- (melihat)'}, q:{en:'The root <em>vid-/vis-</em> means "to see." Which one of these does NOT actually share that root?', id:'Akar <em>vid-/vis-</em> berarti "melihat." Mana yang sebenarnya TIDAK punya akar itu?'}, options:[{en:'evident (clearly seen)',id:'evident (jelas terlihat)'},{en:'vision (the ability to see)',id:'vision (kemampuan melihat)'},{en:'video (moving pictures we see)',id:'video (gambar bergerak yang kita lihat)'},{en:'vivid (full of life and colour)',id:'vivid (penuh hidup dan warna)'}], a:3, explain:{en:'Tricky! Vivid LOOKS like it should be from "see," but it actually comes from Latin vivere (to LIVE). That\'s why a vivid memory feels alive, not just seen.', id:'Jebakan! Vivid TERLIHAT seperti berasal dari "melihat," tapi sebenarnya dari vivere (HIDUP) Latin. Itu sebabnya ingatan vivid terasa hidup, bukan hanya dilihat.'}},
  {type:'mcq', tag:{en:'Word analogy',id:'Analogi kata'}, q:{en:'<em>NOVEL : CHAPTER</em> :: ? : ? (Hint: a whole thing and one of its big parts.)', id:'<em>NOVEL : CHAPTER (bab)</em> :: ? : ? (Petunjuk: hal utuh dan salah satu bagian besarnya.)'}, options:[{en:'symphony : movement (a long piece of music : one section of it)',id:'symphony (simfoni) : movement (bagian)'},{en:'forest : ocean',id:'forest : ocean'},{en:'door : house',id:'door : house'},{en:'bread : flour',id:'bread : flour'}], a:0, explain:{en:'A novel is made of chapters; a symphony is made of movements. Same kind of "whole splits into named parts" relationship.', id:'Novel terdiri dari bab-bab; simfoni terdiri dari movement. Hubungan yang sama: "keseluruhan terbagi jadi bagian-bagian bernama."'}},
  {type:'mcq', tag:{en:'What does this word mean?',id:'Apa makna kata ini?'}, q:{en:'"The teacher\'s instructions were so <em>ambiguous</em> that half the class drew dragons and the other half drew dinosaurs." What does <em>ambiguous</em> mean?', id:'"Instruksi guru begitu <em>ambiguous</em> sampai separuh kelas menggambar naga dan separuh lagi menggambar dinosaurus." Apa arti <em>ambiguous</em>?'}, options:[{en:'open to more than one meaning',id:'bisa diartikan lebih dari satu cara'},{en:'very strict',id:'sangat ketat'},{en:'brand new',id:'baru sekali'},{en:'funny',id:'lucu'}], a:0, explain:{en:'Ambiguous = could mean THIS or could mean THAT. From Latin ambi- (both) + agere (to drive). Bad instructions = ambiguous instructions.', id:'Ambiguous = bisa berarti INI atau bisa berarti ITU. Dari ambi- (kedua) + agere (mendorong) Latin. Instruksi buruk = instruksi ambiguous.'}},
  {type:'mcq', tag:{en:'Prefix: mal-',id:'Awalan: mal-'}, q:{en:'In <em>malevolent</em>, the prefix <em>mal-</em> means —', id:'Dalam <em>malevolent</em>, awalan <em>mal-</em> berarti —'}, options:[{en:'great or huge',id:'besar atau raksasa'},{en:'bad or evil',id:'buruk atau jahat'},{en:'tiny',id:'kecil'},{en:'around',id:'sekitar'}], a:1, explain:{en:'Mal- = bad (Latin). Malevolent = wishing BAD things on someone — the opposite of benevolent. You\'ll spot mal- in malfunction, malware, and malice.', id:'Mal- = buruk (Latin). Malevolent = berkehendak BURUK pada seseorang — lawan dari benevolent. Kamu akan menemukan mal- di malfunction, malware, dan malice.'}},
  {type:'mcq', tag:{en:'What does this word mean?',id:'Apa makna kata ini?'}, q:{en:'"The referee was completely <em>impartial</em> — she didn\'t care which team won, only that the rules were followed." What does <em>impartial</em> mean?', id:'"Wasit itu benar-benar <em>impartial</em> — ia tak peduli tim mana yang menang, hanya peduli aturan ditaati." Apa arti <em>impartial</em>?'}, options:[{en:'making mistakes',id:'membuat kesalahan'},{en:'fair, not picking a side',id:'adil, tidak memilih sisi'},{en:'really strict',id:'sangat ketat'},{en:'private',id:'pribadi'}], a:1, explain:{en:'Im- (not) + partial (taking one part\'s side) = not picking sides. That\'s exactly what we want in a referee — or a good judge.', id:'Im- (tidak) + partial (memihak satu pihak) = tak memilih pihak. Itulah persis yang kita inginkan dari wasit — atau hakim yang baik.'}},
  {type:'match_pairs', tag:{en:'Roots & meanings',id:'Akar & makna'}, q:{en:'Match each Greek or Latin root with what it means. (You probably already know a word from each family!)', id:'Pasangkan tiap akar Yunani atau Latin dengan maknanya. (Kamu mungkin sudah tahu satu kata dari tiap keluarga!)'}, left:[{en:'aqua-',id:'aqua-'},{en:'bio-',id:'bio-'},{en:'geo-',id:'geo-'},{en:'tele-',id:'tele-'}], right:[{en:'water',id:'air'},{en:'life',id:'hidup'},{en:'earth',id:'bumi'},{en:'far',id:'jauh'}], pairs:[[0,0],[1,1],[2,2],[3,3]], explain:{en:'Once you know these, words unlock themselves! Aquarium = water-place. Biology = life-study. Geography = earth-drawing. Television = far-seeing. Magic, right?', id:'Begitu kamu tahu ini, kata-kata terbuka sendiri! Aquarium = tempat air. Biology = kajian hidup. Geography = penggambaran bumi. Television = melihat dari jauh. Ajaib, kan?'}},
  {type:'fill', tag:{en:'Word in context',id:'Kata dalam konteks'}, q:{en:'Fill in the blank: "Mira\'s hunch turned out to be ____ — she just FELT her best friend was hiding something, without any real clue, and she was right." (one word, starts with i)', id:'Isi titik-titik: "Firasat Mira ternyata ____ — ia hanya MERASA sahabatnya menyembunyikan sesuatu, tanpa petunjuk nyata, dan ternyata benar." (satu kata, mulai dengan i)'}, answers:['intuitive','intuition'], explain:{en:'Intuitive = knowing something without being able to explain HOW you know. From Latin intueri (to look upon). It\'s that gut-feeling thing — and sometimes our guts are scary smart.', id:'Intuitive = tahu sesuatu tanpa bisa menjelaskan BAGAIMANA kamu tahu. Dari intueri (memandang) Latin. Itulah perasaan dari dalam — dan kadang perasaan kita pintar mengerikan.'}}
];

const CRITICAL = [
  {type:'mcq', tag:{en:'Find the main point',id:'Temukan inti'}, q:{en:'Maya wrote: "Lots of schools add a few playground swings and hope kids will exercise more. But studies of schools in Finland, Japan, and Australia show it\'s the LENGTH of recess — at least 30 minutes — that actually makes kids move and focus better. If a school really wants healthier students, the answer isn\'t more swings; it\'s more minutes." What is Maya\'s main point?', id:'Maya menulis: "Banyak sekolah menambah beberapa ayunan di taman bermain dan berharap anak akan lebih banyak gerak. Tapi penelitian di sekolah-sekolah Finlandia, Jepang, dan Australia menunjukkan yang benar-benar berpengaruh adalah LAMA istirahatnya — minimal 30 menit — yang membuat anak bergerak dan fokus lebih baik. Kalau sekolah benar-benar mau murid lebih sehat, jawabannya bukan menambah ayunan; jawabannya menambah menit." Apa inti dari Maya?'}, options:[{en:'Schools add swings to the playground',id:'Sekolah menambah ayunan di taman bermain'},{en:'Swings are cheap',id:'Ayunan itu murah'},{en:'What actually helps kids is longer recess, not more equipment',id:'Yang benar-benar membantu adalah istirahat lebih panjang, bukan lebih banyak alat'},{en:'Finland is similar to Japan',id:'Finlandia mirip Jepang'}], a:2, explain:{en:'The main point is the claim all that evidence supports — minutes matter more than swings. Everything else is setup or detail.', id:'Inti adalah klaim yang didukung semua bukti — menit lebih penting daripada ayunan. Sisanya hanya pengantar atau detail.'}},
  {type:'mcq', tag:{en:'Fact vs. opinion',id:'Fakta vs. opini'}, q:{en:'Which sentence is a FACT we could actually check, not an opinion?', id:'Kalimat mana yang FAKTA, bisa benar-benar dicek, bukan opini?'}, options:[{en:'"Charlotte\'s Web" is the most beautiful book ever written.',id:'"Charlotte\'s Web" adalah buku paling indah yang pernah ditulis.'},{en:'"Charlotte\'s Web" was published in 1952.',id:'"Charlotte\'s Web" terbit pada 1952.'},{en:'Every kid should read "Charlotte\'s Web."',id:'Setiap anak seharusnya membaca "Charlotte\'s Web."'},{en:'"Charlotte\'s Web" deserves more attention than it gets.',id:'"Charlotte\'s Web" pantas mendapat perhatian lebih.'}], a:1, explain:{en:'A publication date you can look up in a library = fact. Words like "most beautiful," "should," and "deserves" reveal somebody\'s opinion.', id:'Tanggal terbit yang bisa dicek di perpustakaan = fakta. Kata seperti "paling indah", "seharusnya", dan "pantas" mengungkap opini.'}},
  {type:'mcq', tag:{en:'Spot the thinking mistake',id:'Cari kesalahan berpikir'}, q:{en:'Dani says: "Either we let kids have unlimited screen time, or kids will never learn how to read." What\'s the thinking mistake here?', id:'Dani berkata: "Boleh nonton layar tanpa batas, atau anak-anak tak akan pernah belajar membaca." Apa kesalahan berpikir di sini?'}, options:[{en:'attacking somebody personally',id:'menyerang seseorang secara pribadi'},{en:'false dilemma — pretending there are only TWO choices when really there are many',id:'dilema palsu — pura-pura cuma ada DUA pilihan padahal sebenarnya banyak'},{en:'going in circles',id:'berputar-putar'},{en:'changing the subject',id:'mengganti topik'}], a:1, explain:{en:'There are tons of in-between answers (limited screens, screen-free hours, screen rewards for reading). Pretending only two extremes exist is a false dilemma.', id:'Ada banyak jawaban di tengah (layar dibatasi, jam bebas layar, layar sebagai hadiah membaca). Berpura-pura cuma ada dua ekstrem = dilema palsu.'}},
  {type:'mcq', tag:{en:'Spot the thinking mistake',id:'Cari kesalahan berpikir'}, q:{en:'Theo says: "Of course Lily is wrong about how we should split the team snacks. She\'s only been on the team two weeks!" What\'s the thinking mistake?', id:'Theo berkata: "Tentu Lily salah soal cara membagi camilan tim. Dia baru gabung tim dua minggu!" Apa kesalahan berpikirnya?'}, options:[{en:'changing the topic',id:'mengganti topik'},{en:'ad hominem — attacking the PERSON instead of their idea',id:'ad hominem — menyerang ORANGNYA, bukan idenya'},{en:'slippery slope',id:'slippery slope'},{en:'leaning on a famous person',id:'mengandalkan tokoh terkenal'}], a:1, explain:{en:'Lily\'s idea about snacks might be great or terrible — but how LONG she\'s been on the team has nothing to do with it. Theo attacked her instead of her idea.', id:'Ide Lily soal camilan bisa hebat atau buruk — tapi BERAPA LAMA ia di tim tak ada hubungannya. Theo menyerang dia, bukan idenya.'}},
  {type:'mcq', tag:{en:'Spot the thinking mistake',id:'Cari kesalahan berpikir'}, q:{en:'"This phone game must be great — over a million kids play it!" What\'s the thinking mistake?', id:'"Game HP ini pasti hebat — lebih dari satu juta anak memainkannya!" Apa kesalahan berpikirnya?'}, options:[{en:'jumping on the bandwagon — using popularity as proof it\'s good',id:'ikut-ikutan — memakai popularitas sebagai bukti hal itu bagus'},{en:'mixing up cause and effect',id:'tertukar sebab dan akibat'},{en:'making fun of an idea',id:'mengolok-olok ide'},{en:'using yourself as proof',id:'memakai diri sendiri sebagai bukti'}], a:0, explain:{en:'Tons of kids playing something doesn\'t make it good — just popular. Junk food is popular too! Popularity ≠ quality.', id:'Banyak anak memainkan sesuatu tak berarti hal itu bagus — hanya populer. Junk food juga populer! Populer ≠ berkualitas.'}},
  {type:'mcq', tag:{en:'Spot the loaded words',id:'Cari kata bermuatan'}, q:{en:'A school newsletter says: "Reckless principal finally admits silly policy was a disaster." Which words give away the writer\'s strong opinion (bias)?', id:'Buletin sekolah berbunyi: "Kepala sekolah ceroboh akhirnya mengakui kebijakan konyol itu bencana." Kata mana yang membongkar opini kuat penulisnya (bias)?'}, options:[{en:'principal, policy, admits',id:'kepala sekolah, kebijakan, mengakui'},{en:'reckless, silly, disaster',id:'ceroboh, konyol, bencana'},{en:'finally, was, that',id:'akhirnya, itu, telah'},{en:'none of them are biased',id:'tak ada yang bias'}], a:1, explain:{en:'A neutral report would say "the principal\'s policy" — not "reckless," "silly," "disaster." Loaded adjectives smuggle in the writer\'s feelings.', id:'Laporan netral akan menulis "kebijakan kepala sekolah" — bukan "ceroboh", "konyol", "bencana". Kata sifat bermuatan menyelundupkan perasaan penulis.'}},
  {type:'mcq', tag:{en:'Spot the thinking mistake',id:'Cari kesalahan berpikir'}, q:{en:'Ben says: "I started wearing my lucky red socks, and now our basketball team is winning every game. The socks are obviously magic!" What\'s the thinking mistake?', id:'Ben berkata: "Aku mulai pakai kaos kaki merah keberuntunganku, dan sekarang tim basket kami menang terus. Kaos kakinya jelas ajaib!" Apa kesalahan berpikirnya?'}, options:[{en:'post hoc — assuming that because B happened after A, A caused B',id:'post hoc — mengira karena B terjadi setelah A, maka A menyebabkan B'},{en:'changing the topic',id:'mengganti topik'},{en:'distracting from the point',id:'mengalihkan dari inti'},{en:'leaning on a famous person',id:'mengandalkan tokoh terkenal'}], a:0, explain:{en:'Just because winning came AFTER the red socks doesn\'t mean the socks caused it. Maybe the team practised more, or got a new coach, or just had luck. Time order ≠ cause.', id:'Hanya karena kemenangan terjadi SETELAH kaos kaki merah, tak berarti kaos kakinya yang menyebabkan. Mungkin tim lebih banyak latihan, ganti pelatih, atau beruntung saja. Urutan waktu ≠ sebab.'}},
  {type:'mcq', tag:{en:'Which evidence is strongest?',id:'Bukti mana yang terkuat?'}, q:{en:'A company says their new app helps kids fall asleep faster. Which kind of evidence would BEST support that claim?', id:'Sebuah perusahaan mengklaim aplikasi baru mereka membantu anak tidur lebih cepat. Bukti mana yang PALING mendukung klaim itu?'}, options:[{en:'one happy five-star review',id:'satu ulasan bintang lima yang senang'},{en:'a careful study comparing 800 kids who used the app to 800 who didn\'t',id:'penelitian cermat membandingkan 800 anak yang pakai aplikasi dan 800 yang tidak'},{en:'the company founder saying her own kids love it',id:'pendiri perusahaan berkata anak-anaknya sendiri menyukainya'},{en:'a famous YouTuber recommending it',id:'YouTuber terkenal merekomendasikannya'}], a:1, explain:{en:'A big study with a comparison group is much harder to fake than one happy review or a paid endorsement. Real evidence > vibes.', id:'Penelitian besar dengan kelompok pembanding jauh lebih sulit dipalsukan dibanding satu ulasan senang atau dukungan berbayar. Bukti sungguhan > rasa.'}},
  {type:'mcq', tag:{en:'Spot the thinking mistake',id:'Cari kesalahan berpikir'}, q:{en:'"If we let kids retake ONE math test, soon they\'ll want to retake every test, then redo whole grades, and pretty soon school will mean nothing!" What\'s the thinking mistake?', id:'"Kalau kita izinkan anak mengulang SATU ujian matematika, sebentar lagi mereka mau mengulang semua ujian, lalu mengulang seluruh kelas, dan sebentar lagi sekolah jadi tak berarti!" Apa kesalahan berpikirnya?'}, options:[{en:'slippery slope — claiming one small step will tumble all the way to disaster',id:'slippery slope (lereng licin) — mengklaim satu langkah kecil akan meluncur sampai bencana'},{en:'false dilemma',id:'dilema palsu'},{en:'attacking the person',id:'menyerang orangnya'},{en:'just because it\'s old',id:'hanya karena sudah lama'}], a:0, explain:{en:'A "slippery slope" pretends every small choice rolls inevitably into catastrophe. Real life has stopping points. One retake doesn\'t mean "school means nothing."', id:'"Lereng licin" pura-pura tiap pilihan kecil pasti meluncur ke bencana. Kehidupan nyata punya rem. Satu kali mengulang tak berarti "sekolah jadi tak berarti."'}},
  {type:'mcq', tag:{en:'Find the strongest claim',id:'Cari klaim terkuat'}, q:{en:'Read: "Spelling bees say they test how well kids spell. But mostly they test how many hours a kid has had to memorise word lists at home. Kids with parents who can drill them every night score way higher — even when other kids are just as smart. Until we change that, spelling bees mostly measure who has time at home, not who can spell." What is the writer\'s STRONGEST claim?', id:'Baca: "Lomba mengeja mengaku menguji kemampuan eja anak. Tapi sebenarnya yang diuji adalah berapa jam seorang anak punya waktu menghafal daftar kata di rumah. Anak dengan orang tua yang bisa melatihnya tiap malam nilainya jauh lebih tinggi — bahkan saat anak lain sama cerdasnya. Sampai itu diubah, lomba mengeja kebanyakan mengukur siapa yang punya waktu di rumah, bukan siapa yang bisa mengeja." Apa klaim TERKUAT penulis?'}, options:[{en:'Tutoring is expensive',id:'Bimbingan itu mahal'},{en:'Spelling bees right now measure home practice time more than real spelling ability',id:'Lomba mengeja saat ini mengukur waktu latihan di rumah, lebih dari kemampuan mengeja sungguhan'},{en:'Spelling bees should be banned',id:'Lomba mengeja harus dilarang'},{en:'Smart kids always win',id:'Anak cerdas selalu menang'}], a:1, explain:{en:'The writer doesn\'t say "ban spelling bees" — they say spelling bees are measuring the WRONG thing. That\'s the sharper, more honest claim.', id:'Penulis tak berkata "larang lomba mengeja" — penulis berkata lomba mengeja mengukur hal yang SALAH. Itulah klaim yang lebih tajam dan jujur.'}}
];

const WRITING = [
  {type:'mcq', tag:{en:'Subject and verb agreement',id:'Subjek dan predikat'}, q:{en:'Which sentence is grammatically correct? (Hint: find the REAL subject first.)', id:'Kalimat mana yang benar secara tata bahasa? (Petunjuk: temukan subjek SEBENARNYA dulu.)'}, options:[{en:'The basket of muffins are on the counter.',id:'The basket of muffins are on the counter.'},{en:'The basket of muffins is on the counter.',id:'The basket of muffins is on the counter.'},{en:'The basket of muffins were on the counter.',id:'The basket of muffins were on the counter.'},{en:'The basket of muffins be on the counter.',id:'The basket of muffins be on the counter.'}], a:1, explain:{en:'The subject is "basket" (one basket!), not "muffins." One basket = "is." The muffins are just hitching a ride in the prepositional phrase.', id:'Subjek adalah "basket" (satu keranjang!), bukan "muffins". Satu keranjang = "is". Muffin-muffinnya hanya menumpang di frasa preposisional.'}},
  {type:'mcq', tag:{en:'Dangling modifier',id:'Keterangan menggantung'}, q:{en:'Which sentence is NOT accidentally saying that a statue can run?', id:'Kalimat mana yang TIDAK secara tak sengaja mengatakan bahwa patung bisa berlari?'}, options:[{en:'Running through the park, the statue startled Tom.',id:'Running through the park, the statue startled Tom.'},{en:'Running through the park, Tom was startled by the statue.',id:'Running through the park, Tom was startled by the statue.'},{en:'The statue startled, running through the park, Tom.',id:'The statue startled, running through the park, Tom.'},{en:'Startled the statue running through the park Tom.',id:'Startled the statue running through the park Tom.'}], a:1, explain:{en:'"Running through the park" has to belong to a HUMAN (Tom), not a statue. Otherwise we get a hilariously athletic statue.', id:'"Running through the park" harus melekat pada MANUSIA (Tom), bukan patung. Kalau tidak, kita dapat patung yang sangat atletis.'}},
  {type:'mcq', tag:{en:'Parallel structure',id:'Struktur paralel'}, q:{en:'Lila loves three things. Which sentence keeps them in matching form?', id:'Lila menyukai tiga hal. Kalimat mana yang menjaganya dalam bentuk yang sama?'}, options:[{en:'Lila loves running, to swim, and biking.',id:'Lila loves running, to swim, and biking.'},{en:'Lila loves running, swimming, and biking.',id:'Lila loves running, swimming, and biking.'},{en:'Lila loves to run, swimming, and bike.',id:'Lila loves to run, swimming, and bike.'},{en:'Lila loves run, swim, and biking.',id:'Lila loves run, swim, and biking.'}], a:1, explain:{en:'When you list things, dress them in matching outfits! All three should be the same kind of word — here, all -ing forms (running, swimming, biking).', id:'Saat melist sesuatu, pakaikan kostum yang serasi! Ketiganya harus bentuk yang sama — di sini, semua bentuk -ing (running, swimming, biking).'}},
  {type:'mcq', tag:{en:'Commas',id:'Koma'}, q:{en:'Choose the sentence with the right commas.', id:'Pilih kalimat dengan koma yang benar.'}, options:[{en:'After the long quiet recital the audience clapped.',id:'After the long quiet recital the audience clapped.'},{en:'After the long, quiet recital, the audience clapped.',id:'After the long, quiet recital, the audience clapped.'},{en:'After the, long quiet recital the audience, clapped.',id:'After the, long quiet recital the audience, clapped.'},{en:'After the long quiet, recital the audience clapped.',id:'After the long quiet, recital the audience clapped.'}], a:1, explain:{en:'Two rules at once: a comma between two adjectives that both describe the same thing (long, quiet) AND a comma after an opening phrase ("After the long, quiet recital,").', id:'Dua aturan sekaligus: koma di antara dua kata sifat yang menjelaskan hal yang sama (long, quiet) DAN koma setelah frasa pembuka ("After the long, quiet recital,").'}},
  {type:'mcq', tag:{en:'Figurative language',id:'Bahasa figuratif'}, q:{en:'"Her laugh was sunshine on a rainy day." What kind of figurative language is this?', id:'"Tawanya adalah sinar matahari di hari hujan." Ini majas apa?'}, options:[{en:'simile (uses "like" or "as")',id:'simile (pakai "seperti/bagai")'},{en:'metaphor (says one thing IS another)',id:'metafora (mengatakan satu hal ADALAH hal lain)'},{en:'hyperbole (huge exaggeration)',id:'hiperbola (pelebihan besar)'},{en:'oxymoron (two opposite words side-by-side)',id:'oksimoron (dua kata berlawanan berdampingan)'}], a:1, explain:{en:'No "like" or "as" — it says her laugh IS sunshine directly. That direct claim is a metaphor. (If it said "her laugh was LIKE sunshine," that\'d be a simile.)', id:'Tak ada "seperti/bagai" — langsung berkata tawanya ADALAH sinar matahari. Klaim langsung itulah metafora. (Kalau ada "seperti", itu simile.)'}},
  {type:'mcq', tag:{en:'Figurative language',id:'Bahasa figuratif'}, q:{en:'"The cookie called my name from the jar." Cookies don\'t actually talk. What is this writer doing?', id:'"Kue itu memanggil namaku dari toplesnya." Kue tak benar-benar bisa bicara. Apa yang sedang dilakukan penulis?'}, options:[{en:'metaphor',id:'metafora'},{en:'personification (giving human actions to non-human things)',id:'personifikasi (memberi tindakan manusia pada benda)'},{en:'irony',id:'ironi'},{en:'understatement',id:'litotes'}], a:1, explain:{en:'Cookies can\'t talk — only people can. Letting an object DO something only a person can do is called personification. It also makes writing fun and alive.', id:'Kue tak bisa bicara — hanya manusia bisa. Membiarkan benda MELAKUKAN sesuatu yang hanya bisa dilakukan manusia disebut personifikasi. Juga membuat tulisan jadi hidup.'}},
  {type:'mcq', tag:{en:'Figurative language',id:'Bahasa figuratif'}, q:{en:'"Mom, I\'ve asked you a MILLION times — can I have a dog?" Have you really asked a million times? Probably not. What kind of figurative language is this?', id:'"Bu, aku sudah tanya SEJUTA kali — boleh aku punya anjing?" Sungguh sudah sejuta kali? Belum. Ini majas apa?'}, options:[{en:'hyperbole (super-exaggeration on purpose)',id:'hiperbola (pelebihan besar dengan sengaja)'},{en:'pun (a wordplay joke)',id:'pun (permainan kata)'},{en:'allegory (a hidden parallel story)',id:'alegori (cerita sejajar tersembunyi)'},{en:'a real fact',id:'fakta sungguhan'}], a:0, explain:{en:'Hyperbole is exaggerating WAY past the truth on purpose to show strong feelings. You\'ve used it. I\'ve used it. We\'ve ALL "told someone a million times."', id:'Hiperbola adalah pelebih-lebihan SANGAT jauh dari kebenaran dengan sengaja untuk menunjukkan perasaan kuat. Kamu pernah pakai. Aku pernah pakai. Kita SEMUA pernah "bilang sejuta kali."'}},
