<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alesha's English Mastery — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff8eb;
  --paper:#ffffff;
  --ink:#1f2937;
  --slate:#64748b;
  --rule:#fde68a;
  --green:#15803d;
  --green-bg:#dcfce7;
  --coral:#fb7185;
  --coral-bg:#ffe4e6;
  --grape:#a78bfa;
  --gold:#f59e0b;
  --gold-bg:#fef3c7;
  --sky:#0ea5e9;
}
html,body{background:var(--bg);color:var(--ink);min-height:100vh}
body{font-family:'Lora',Georgia,serif;line-height:1.65;-webkit-font-smoothing:antialiased}

/* Per-track accent (changes hero + card stripe color) */
body[data-track=reading]{--acc:#0ea5e9;--acc-dark:#0369a1;--acc-bg:#e0f2fe}
body[data-track=vocab]{--acc:#fb7185;--acc-dark:#be123c;--acc-bg:#ffe4e6}
body[data-track=critical]{--acc:#f59e0b;--acc-dark:#a16207;--acc-bg:#fef3c7}
body[data-track=writing]{--acc:#a78bfa;--acc-dark:#6d28d9;--acc-bg:#ede9fe}

.topbar{background:var(--paper);border-bottom:3px solid var(--rule);padding:14px 22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.back-link{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.88rem;color:var(--acc-dark,#0f766e);text-decoration:none;background:var(--acc-bg,#ccfbf1);padding:8px 16px;border-radius:18px;border:2px solid var(--acc,#5eead4);justify-self:start;transition:transform .15s}
.back-link:hover{transform:translateX(-3px)}
.crest{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.74rem;letter-spacing:.1em;color:var(--coral);text-transform:uppercase;text-align:center}
.lang-toggle{justify-self:end;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.82rem;color:var(--ink);background:#fff;border:2px solid var(--gold);border-radius:18px;padding:7px 14px;cursor:pointer;transition:transform .15s}
.lang-toggle:hover{transform:rotate(-3deg)}

.track-bar{background:linear-gradient(135deg,var(--acc-bg,#ccfbf1) 0%,#fff8eb 100%);border-bottom:3px solid var(--rule);padding:20px 22px;text-align:center;position:relative;overflow:hidden}
.track-bar::after{content:'';position:absolute;top:-20px;right:-10px;width:80px;height:80px;background:radial-gradient(circle,var(--acc,#0ea5e9) 0%,transparent 70%);opacity:.18}
.track-bar .roman{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dark,#0369a1);margin-bottom:4px;position:relative}
.track-bar h1{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.45rem;color:var(--acc-dark,#0369a1);letter-spacing:-.3px;position:relative}
.track-bar h1 em{font-style:italic}

.wrap{max-width:780px;margin:0 auto;padding:32px 22px 80px}

.meta-row{font-family:'Quicksand',sans-serif;font-weight:600;font-size:.78rem;color:var(--slate);display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

.card{background:var(--paper);border:2px solid var(--rule);border-radius:22px;padding:32px 28px;position:relative;animation:fadeIn .3s ease;box-shadow:0 6px 18px rgba(251,191,36,.12)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:7px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,var(--acc,#0ea5e9),var(--acc-dark,#0369a1))}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.q-tag{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc-dark,#0369a1);background:var(--acc-bg,#e0f2fe);display:inline-block;padding:4px 12px;border-radius:11px;margin-bottom:14px}
.q-text{font-family:'Lora',serif;font-size:1.05rem;line-height:1.7;color:var(--ink);margin-bottom:22px}
.q-text em{color:var(--acc-dark,#0369a1);font-weight:600}
.q-text strong{font-weight:600;color:var(--ink)}

.passage{background:linear-gradient(135deg,#fff7ed 0%,#fef3c7 100%);border:2px dashed #fbbf24;border-radius:14px;padding:20px 24px;margin-bottom:22px;font-family:'Lora',serif;font-size:1rem;line-height:1.75;color:var(--ink);position:relative}
.passage::before{content:'📖';position:absolute;top:-14px;left:18px;background:var(--bg);padding:2px 6px;font-size:1.1rem}
.passage .src{display:block;margin-top:10px;font-style:italic;font-size:.84rem;color:var(--slate);text-align:right}
.passage p+p{margin-top:10px}

.sub-head{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.1em;color:var(--coral);text-transform:uppercase;margin-bottom:8px}

.options{list-style:none;margin-bottom:18px}
.options li{font-family:'Lora',serif;font-size:1rem;line-height:1.55;padding:13px 14px 13px 44px;border:2px solid var(--rule);border-radius:14px;margin-bottom:9px;cursor:pointer;position:relative;transition:all .15s;background:#fff}
.options li:hover{background:#fffbeb;border-color:var(--gold);transform:translateX(3px)}
.options li .letter{position:absolute;left:14px;top:11px;font-family:'Quicksand',sans-serif;font-weight:700;color:var(--gold);background:var(--gold-bg);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.84rem}
.options li.selected{background:#fffbeb;border-color:var(--gold)}
.options li.correct{background:var(--green-bg);border-color:var(--green);color:#166534}
.options li.correct .letter{background:var(--green);color:#fff}
.options li.wrong{background:var(--coral-bg);border-color:var(--coral);color:#9f1239}
.options li.wrong .letter{background:var(--coral);color:#fff}
.options li.disabled{cursor:default;pointer-events:none}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.pair-col{display:flex;flex-direction:column;gap:8px}
.pair-col .label{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.1em;color:var(--slate);text-transform:uppercase;margin-bottom:4px}
.pair-item{font-family:'Lora',serif;font-size:.98rem;padding:11px 13px;border:2px solid var(--rule);border-radius:12px;background:#fff;cursor:pointer;transition:all .15s}
.pair-item:hover{background:#fffbeb;border-color:var(--gold)}
.pair-item.selected{background:#fffbeb;border-color:var(--gold)}
.pair-item.matched{background:var(--green-bg);border-color:var(--green);color:#166534;cursor:default}
.pair-item.wrong{background:var(--coral-bg);border-color:var(--coral);color:#9f1239}

.fill-input,.essay-input{width:100%;font-family:'Lora',serif;font-size:1rem;padding:13px 16px;border:2px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:14px;line-height:1.55}
.fill-input:focus,.essay-input:focus{outline:none;border-color:var(--gold);background:#fffbeb;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.essay-input{min-height:150px;resize:vertical}

.model{background:linear-gradient(135deg,#f5f3ff 0%,#ede9fe 100%);border:2px solid #c4b5fd;border-radius:14px;padding:18px 22px;margin-bottom:16px;font-family:'Lora',serif;font-size:.96rem;line-height:1.65;color:var(--ink);position:relative}
.model::before{content:'✨';position:absolute;top:-12px;left:18px;background:var(--bg);padding:2px 6px;font-size:1rem}
.model .label{display:block;font-family:'Quicksand',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.1em;color:#6d28d9;text-transform:uppercase;margin-bottom:8px}

.explain{background:var(--gold-bg);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:16px;font-family:'Lora',serif;font-size:.95rem;line-height:1.6;color:var(--ink)}
.explain strong{color:#a16207;font-weight:600}

.hint{background:#f0fdf4;border:2px dashed #86efac;border-radius:12px;padding:11px 16px;margin-bottom:14px;font-family:'Lora',serif;font-style:italic;font-size:.92rem;color:#166534}
.hint::before{content:'💡 ';font-style:normal}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.88rem;padding:11px 22px;border-radius:18px;border:2px solid var(--acc,#0ea5e9);background:var(--acc,#0ea5e9);color:#fff;cursor:pointer;transition:all .18s cubic-bezier(.34,1.4,.64,1);text-decoration:none;display:inline-block;box-shadow:0 3px 10px rgba(14,165,233,.25)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(14,165,233,.4)}
.btn.ghost{background:#fff;color:var(--acc,#0ea5e9);box-shadow:0 3px 8px rgba(0,0,0,.06)}
.btn.ghost:hover{background:var(--acc-bg,#e0f2fe)}
.btn.crimson{background:var(--coral);border-color:var(--coral);box-shadow:0 3px 10px rgba(251,113,133,.3)}
.btn.crimson:hover{box-shadow:0 6px 16px rgba(251,113,133,.45)}
.btn.gold{background:#fff;color:#a16207;border-color:var(--gold);box-shadow:0 3px 8px rgba(245,158,11,.2)}
.btn.gold:hover{background:var(--gold-bg)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

.intro{text-align:center;padding:24px 0 14px}
.intro .roman{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dark,#0369a1);margin-bottom:12px}
.intro .intro-emoji{font-size:3rem;margin-bottom:8px;display:block}
.intro h2{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.9rem;color:var(--ink);margin-bottom:14px;letter-spacing:-.4px}
.intro h2 em{font-style:italic;color:var(--acc-dark,#0369a1)}
.intro .desc{font-family:'Lora',serif;font-style:italic;font-size:1.04rem;color:var(--slate);max-width:520px;margin:0 auto 26px;line-height:1.6}
.intro .rule{display:none}

.done{text-align:center;padding:30px 0}
.done .roman{font-family:'Quicksand',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dark,#0369a1);margin-bottom:8px}
.done .done-emoji{font-size:3.2rem;display:block;margin-bottom:6px;animation:bounce 1.5s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.done h2{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.85rem;color:var(--ink);margin-bottom:6px;letter-spacing:-.4px}
.done h2 em{font-style:italic;color:var(--acc-dark,#0369a1)}
.done .rule{display:none}
.done .score{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.2rem;color:var(--ink);margin-bottom:18px;margin-top:8px}
.done .score strong{color:var(--acc-dark,#0369a1)}
.done .verdict{font-family:'Lora',serif;font-style:italic;font-size:1.08rem;color:var(--coral);margin-bottom:18px;font-weight:600}
.done .review{font-family:'Lora',serif;font-size:.98rem;color:var(--slate);line-height:1.65;max-width:540px;margin:0 auto 28px}

.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule);transition:all .2s}
.dot.done{background:var(--acc,#0ea5e9)}
.dot.current{background:var(--gold);transform:scale(1.4)}

.self-grade{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

.foot{text-align:center;font-family:'Lora',serif;font-style:italic;font-size:.86rem;color:var(--slate);margin-top:32px;padding-top:20px;border-top:2px dashed var(--rule)}

@media(max-width:600px){
  .card{padding:24px 20px}
  .pairs{grid-template-columns:1fr}
  .topbar{grid-template-columns:auto 1fr auto;font-size:.85rem}
  .crest{font-size:.62rem;letter-spacing:.08em}
  .intro h2,.done h2{font-size:1.5rem}
}
</style>
</head>
<body data-track="reading">

<div class="topbar">
  <a class="back-link" href="../">&larr; Library</a>
  <div class="crest">Academic Track &middot; Beyond School</div>
  <button class="lang-toggle" id="langToggle">EN | ID</button>
</div>

<div class="track-bar">
  <div class="roman" id="trackRoman">Track I</div>
  <h1 id="trackTitle">Advanced Reading Comprehension</h1>
</div>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">Studium sine fine &mdash; study without end.</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const TRACK = ['reading','vocab','critical','writing'].includes(params.get('track')) ? params.get('track') : 'reading';
document.body.dataset.track = TRACK;

const LANG_KEY = 'alesha_excel_lang';
let LANG = localStorage.getItem(LANG_KEY) || 'en';

function t(obj){ return obj[LANG] || obj.en; }

const UI = {
  begin: {en:'Begin', id:'Mulai'},
  continueArr: {en:'Continue →', id:'Lanjutkan →'},
  hint: {en:'Show hint', id:'Tampilkan petunjuk'},
  submit: {en:'Submit', id:'Jawab'},
  showModel: {en:'Show model answer', id:'Tampilkan jawaban model'},
  gotRight: {en:'I got it right', id:'Saya benar'},
  needsReview: {en:'Needs review', id:'Perlu diulas'},
  concluding: {en:'Concluding...', id:'Menyimpulkan...'},
  conclusionOf: {en:'The Conclusion of', id:'Penutup'},
  ofShort: {en:'of', id:'dari'},
  question: {en:'Question', id:'Pertanyaan'},
  passage: {en:'Passage', id:'Bacaan'},
  yourAnswer: {en:'Type your answer...', id:'Tulis jawabanmu...'},
  returnLanding: {en:'Return to library', id:'Kembali ke perpustakaan'},
  restart: {en:'Restart track', id:'Ulang dari awal'},
  modelAnswer: {en:'Model answer', id:'Jawaban model'},
  correct: {en:'Correct.', id:'Benar.'},
  notQuite: {en:'Not quite.', id:'Belum tepat.'},
  youAnswered: {en:'You answered', id:'Kamu menjawab'},
  ofShort2: {en:'of', id:'dari'},
  correctly: {en:'correctly', id:'dengan benar'}
};

const TRACK_META = {
  reading: {
    roman: {en:'Track I', id:'Trek I'},
    title: {en:'Advanced Reading Comprehension', id:'Pemahaman Bacaan Lanjutan'},
    desc: {en:'Literary excerpts and one non-fiction passage. Read carefully; the questions reward attention to diction and inference.', id:'Petikan sastra dan satu bacaan non-fiksi. Baca dengan saksama; pertanyaan menguji ketelitian pada diksi dan inferensi.'},
    skill: {en:'reading comprehension', id:'pemahaman bacaan'}
  },
  vocab: {
    roman: {en:'Track II', id:'Trek II'},
    title: {en:'Vocabulary & Etymology', id:'Kosakata & Etimologi'},
    desc: {en:'Tier-2 academic words, Greek and Latin roots, analogies, and affix analysis. Precision matters more than speed.', id:'Kata akademik Tier-2, akar Yunani dan Latin, analogi, dan analisis imbuhan. Ketepatan lebih penting daripada kecepatan.'},
    skill: {en:'vocabulary and word origin', id:'kosakata dan asal kata'}
  },
  critical: {
    roman: {en:'Track III', id:'Trek III'},
    title: {en:'Critical Reading & Argument', id:'Membaca Kritis & Argumen'},
    desc: {en:'Identify thesis, separate fact from opinion, and name logical fallacies in short analytical passages.', id:'Identifikasi tesis, pisahkan fakta dari opini, dan beri nama kekeliruan logika dalam bacaan analitis singkat.'},
    skill: {en:'critical reading', id:'membaca kritis'}
  },
  writing: {
    roman: {en:'Track IV', id:'Trek IV'},
    title: {en:'Advanced Grammar & Writing Craft', id:'Tata Bahasa Lanjutan & Kerajinan Menulis'},
    desc: {en:'Sentence structure, figurative language, rhetorical devices, and two essay prompts at SAT Writing foundation level.', id:'Struktur kalimat, bahasa figuratif, perangkat retorika, dan dua tugas esai setara dasar SAT Writing.'},
    skill: {en:'writing craft', id:'kerajinan menulis'}
  }
};

const READING = [
  {
    type:'scenario',
    title: {en:'A Barn at Dawn', id:'Kandang Saat Fajar'},
    sourceNote: {en:'Original passage in the spirit of E. B. White', id:'Bacaan asli dalam semangat E. B. White'},
    passage: {
      en:'<p>The barn was old and very large. It carried, all together, the smell of hay, the smell of cows that had been patient for many years, and the warm dusty smell of horses who had worked hard. It was a place that seemed, on certain mornings, to promise that nothing bad could happen.</p><p>Wilbur stood quite still in his pen. He listened for the rooster, and the rooster came on time. He listened for the swallow under the rafters, and the swallow squeaked once. He listened for Charlotte. Of Charlotte he heard nothing at all, and at this small absence his small heart drew tight.</p>',
      id:'<p>Kandang itu tua dan sangat luas. Ia membawa, sekaligus, bau jerami, bau sapi yang telah sabar bertahun-tahun, dan bau hangat berdebu kuda-kuda yang telah bekerja keras. Tempat itu, pada pagi-pagi tertentu, seakan menjanjikan bahwa tak akan ada hal buruk terjadi.</p><p>Wilbur berdiri diam di kandangnya. Ia mendengarkan ayam jantan, dan ayam jantan datang tepat waktu. Ia mendengarkan burung walet di bawah kasau, dan walet berdecit sekali. Ia mendengarkan Charlotte. Tentang Charlotte ia tak mendengar apa pun, dan karena ketidakhadiran kecil itu hati kecilnya mengerut.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'The phrase "promise that nothing bad could happen" most directly establishes a tone of —', id:'Frasa "menjanjikan bahwa tak akan ada hal buruk terjadi" paling langsung membangun nada —'}, options:[{en:'foreboding irony',id:'ironi yang mencekam'},{en:'fragile tranquility',id:'ketenangan yang rapuh'},{en:'comic detachment',id:'kelucuan yang terlepas'},{en:'rigorous skepticism',id:'skeptisisme ketat'}], a:1, explain:{en:'The peace is real, but the next paragraph immediately threatens it through Wilbur\'s tightening heart.', id:'Ketenangan itu nyata, tetapi paragraf berikutnya langsung mengancamnya lewat hati Wilbur yang mengerut.'}},
      {type:'mcq', q:{en:'The detail of Wilbur\'s "small heart drew tight" most directly suggests —', id:'Detail "hati kecilnya mengerut" paling langsung menyiratkan —'}, options:[{en:'physical illness',id:'penyakit fisik'},{en:'sleepy contentment',id:'kepuasan mengantuk'},{en:'quiet apprehension',id:'kecemasan yang sunyi'},{en:'wild excitement',id:'kegembiraan liar'}], a:2, explain:{en:'A tightening heart paired with Charlotte\'s absence signals dread, not illness or joy.', id:'Hati yang mengerut dipadu absennya Charlotte menandakan rasa cemas, bukan sakit atau gembira.'}},
      {type:'mcq', q:{en:'Which word best describes the narrator\'s voice in this passage?', id:'Kata mana yang paling menggambarkan suara narator dalam bacaan ini?'}, options:[{en:'clinical',id:'klinis'},{en:'tender',id:'lembut'},{en:'mocking',id:'mengejek'},{en:'frantic',id:'panik'}], a:1, explain:{en:'Words like "patient," "warm," and the small attention to Wilbur\'s heart mark the narrator\'s affection.', id:'Kata seperti "sabar", "hangat", dan perhatian pada hati Wilbur menandai kasih sayang narator.'}},
      {type:'essay', q:{en:'In two or three sentences, explain how the author balances comfort and dread in this passage. Use one quoted phrase.', id:'Dalam dua atau tiga kalimat, jelaskan bagaimana penulis menyeimbangkan kenyamanan dan ketakutan dalam bacaan ini. Gunakan satu frasa kutipan.'}, model:{en:'The author lingers on warm sensory detail — the smell of "cows that had been patient for many years" — to establish the barn as a place of safety. That comfort is then broken when Wilbur listens for Charlotte and finds only silence, which makes the absence sharper because it interrupts a peace we have just been taught to trust.', id:'Penulis berlama-lama pada detail sensorik yang hangat — bau "sapi yang telah sabar bertahun-tahun" — untuk menetapkan kandang sebagai tempat aman. Kenyamanan itu pecah ketika Wilbur mendengarkan Charlotte dan hanya menemui sunyi, sehingga ketiadaan itu terasa lebih tajam karena memutus ketenangan yang baru saja kita percayai.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'The Folded Cloth', id:'Kain yang Dilipat'},
    sourceNote: {en:'Original passage in the spirit of Madeleine L\'Engle', id:'Bacaan asli dalam semangat Madeleine L\'Engle'},
    passage: {
      en:'<p>Mrs. Whatsit took a small ant from the windowsill and set it carefully on one corner of her skirt. She said that the ant must walk all the long way across, and the ant began to walk. Then she lifted the cloth and brought the two corners together, and the ant, without taking another step, was where it had been going.</p><p>Meg\'s stomach turned over. The mathematics of the thing was beautiful and unbearable at the same time. She wanted, very badly, to argue. But Charles Wallace was nodding the small careful nod he reserved for things that were both impossible and true.</p>',
      id:'<p>Nyonya Whatsit mengambil seekor semut kecil dari ambang jendela dan menaruhnya hati-hati di satu sudut roknya. Ia berkata semut itu harus berjalan jauh sekali melintasinya, dan semut itu mulai berjalan. Lalu ia mengangkat kain itu dan menyatukan kedua sudutnya, dan semut itu, tanpa melangkah lagi, sudah berada di tempat yang dituju.</p><p>Perut Meg bergolak. Matematika dari hal itu indah dan tak tertahankan sekaligus. Ia sangat ingin membantah. Namun Charles Wallace mengangguk kecil hati-hati seperti yang ia simpan untuk hal-hal yang mustahil sekaligus benar.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'The folded cloth functions chiefly as —', id:'Kain yang dilipat itu terutama berfungsi sebagai —'}, options:[{en:'a literal map of the journey',id:'peta harfiah perjalanan'},{en:'a metaphor for compressed space',id:'metafora ruang yang dipadatkan'},{en:'evidence of Mrs. Whatsit\'s sewing',id:'bukti jahitan Nyonya Whatsit'},{en:'a warning against shortcuts',id:'peringatan terhadap jalan pintas'}], a:1, explain:{en:'The cloth visualises how distant points can be made adjacent — the central image of the tesseract.', id:'Kain itu menggambarkan bagaimana titik jauh dapat dijadikan berdampingan — citra inti tesseract.'}},
      {type:'mcq', q:{en:'"Beautiful and unbearable at the same time" is an example of —', id:'"Indah dan tak tertahankan sekaligus" adalah contoh —'}, options:[{en:'hyperbole',id:'hiperbola'},{en:'paradox',id:'paradoks'},{en:'simile',id:'simile'},{en:'understatement',id:'litotes'}], a:1, explain:{en:'Two contradictory qualities held together is the textbook definition of paradox.', id:'Dua kualitas berlawanan yang disatukan adalah definisi paradoks.'}},
      {type:'mcq', q:{en:'Charles Wallace\'s nod reveals that he —', id:'Anggukan Charles Wallace menunjukkan bahwa ia —'}, options:[{en:'has heard the explanation before',id:'pernah mendengarnya sebelumnya'},{en:'is half-asleep',id:'setengah tertidur'},{en:'doubts Mrs. Whatsit',id:'meragukan Nyonya Whatsit'},{en:'accepts a kind of knowing Meg resists',id:'menerima jenis pengetahuan yang ditolak Meg'}], a:3, explain:{en:'"Impossible and true" marks an intuitive acceptance that contrasts with Meg\'s urge to argue.', id:'"Mustahil sekaligus benar" menandai penerimaan intuitif yang berbeda dengan dorongan Meg untuk membantah.'}},
      {type:'essay', q:{en:'Explain in three sentences what Meg\'s reaction reveals about her character.', id:'Jelaskan dalam tiga kalimat apa yang ditunjukkan reaksi Meg tentang karakternya.'}, model:{en:'Meg responds to wonder with the stomach first and the mind second, which marks her as someone whose body knows truth before her reason permits it. Her wish to argue shows she values intellectual rigor and is uncomfortable surrendering to mystery. Yet she does not actually argue, suggesting that under the resistance is a willingness to be convinced.', id:'Meg merespons keajaiban dengan perut dahulu dan pikiran kemudian, menandai dirinya sebagai orang yang tubuhnya tahu kebenaran sebelum nalarnya mengizinkan. Keinginannya untuk membantah menunjukkan ia menghargai ketelitian nalar dan tak nyaman menyerah pada misteri. Namun ia tak benar-benar membantah, menyiratkan bahwa di balik perlawanan ada kesediaan untuk diyakinkan.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'Beyond the Wardrobe', id:'Di Balik Lemari'},
    sourceNote: {en:'Original passage in the spirit of C. S. Lewis', id:'Bacaan asli dalam semangat C. S. Lewis'},
    passage: {
      en:'<p>Lucy pushed past the rough fur coats and felt, instead of more wood, something cold and powdery brush the back of her hand. A moment later she was standing in the middle of a wood at night, with snow under her boots and slow flakes falling through the dark air.</p><p>She was a little frightened, but she was also very curious and rather pleased. She glanced back over her shoulder and there, between the dark trunks, she could still make out the open doorway of the wardrobe and even catch a glimpse of the empty room from which she had set out.</p>',
      id:'<p>Lucy mendorong tubuhnya melewati mantel-mantel bulu yang kasar dan merasakan, alih-alih kayu lagi, sesuatu yang dingin dan berbubuk menyentuh punggung tangannya. Sesaat kemudian ia berdiri di tengah hutan di malam hari, dengan salju di bawah sepatu botnya dan kepingan-kepingan lambat jatuh melewati udara gelap.</p><p>Ia agak takut, tetapi ia juga sangat ingin tahu dan agak senang. Ia menoleh ke belakang dan di sana, di antara batang-batang gelap, ia masih bisa melihat pintu lemari yang terbuka dan bahkan menangkap sekilas kamar kosong tempat ia berangkat.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'The contrast between "rough fur coats" and "cold and powdery" snow chiefly serves to —', id:'Kontras antara "mantel bulu yang kasar" dan salju "dingin dan berbubuk" terutama berfungsi untuk —'}, options:[{en:'emphasise Lucy\'s clumsiness',id:'menekankan kekikukan Lucy'},{en:'mark the threshold between two worlds through touch',id:'menandai ambang dua dunia lewat sentuhan'},{en:'foreshadow a fight',id:'memberi tanda akan terjadi perkelahian'},{en:'criticise her family\'s wealth',id:'mengkritik kekayaan keluarganya'}], a:1, explain:{en:'The sensory shift from fur to snow is the moment the threshold is crossed.', id:'Pergeseran sensorik dari bulu ke salju adalah momen ambang dilewati.'}},
      {type:'mcq', q:{en:'Lucy\'s emotional state is best described as —', id:'Keadaan emosional Lucy paling tepat digambarkan sebagai —'}, options:[{en:'pure terror',id:'ketakutan murni'},{en:'reluctant duty',id:'kewajiban yang enggan'},{en:'fearful curiosity',id:'rasa ingin tahu yang takut'},{en:'bored indifference',id:'kebosanan tak peduli'}], a:2, explain:{en:'"A little frightened" plus "very curious and rather pleased" — fear braided with curiosity.', id:'"Agak takut" ditambah "sangat ingin tahu dan agak senang" — takut dijalin dengan rasa ingin tahu.'}},
      {type:'mcq', q:{en:'That Lucy can still see the wardrobe doorway primarily suggests —', id:'Fakta bahwa Lucy masih bisa melihat pintu lemari terutama menunjukkan —'}, options:[{en:'the new world is an illusion',id:'dunia baru itu ilusi'},{en:'a path back exists, for now',id:'jalan kembali ada, untuk saat ini'},{en:'the wardrobe is broken',id:'lemari itu rusak'},{en:'time has stopped',id:'waktu telah berhenti'}], a:1, explain:{en:'The doorway is a reassurance of return, a gentle on-ramp into the strange.', id:'Pintu itu adalah jaminan kepulangan, jalan landai memasuki keasingan.'}},
      {type:'essay', q:{en:'Why is it important that Lucy enters this place alone? Answer in three or four sentences.', id:'Mengapa penting bahwa Lucy memasuki tempat ini sendirian? Jawab dalam tiga atau empat kalimat.'}, model:{en:'Lucy\'s solitude makes the experience personal and unverifiable: there are no witnesses to corroborate her story, which sets up the conflict of belief that follows. Her aloneness also lets the author show her character — curious and brave rather than panicked — without the noise of her siblings\' reactions. Finally, it establishes Lucy as the moral compass of the book, the first to see what others later must learn to see.', id:'Kesendirian Lucy membuat pengalaman itu pribadi dan tak dapat diverifikasi: tak ada saksi yang menguatkan kisahnya, sehingga muncul konflik kepercayaan setelahnya. Kesendirian itu juga memungkinkan penulis menunjukkan karakternya — ingin tahu dan berani, bukan panik — tanpa kebisingan reaksi saudara-saudaranya. Terakhir, hal itu menetapkan Lucy sebagai kompas moral buku, yang pertama melihat apa yang nanti harus dipelajari orang lain.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'The Receiver of Memory', id:'Penerima Ingatan'},
    sourceNote: {en:'Original passage in the spirit of Lois Lowry', id:'Bacaan asli dalam semangat Lois Lowry'},
    passage: {
      en:'<p>The old man placed his hands on Jonas\'s back. At first there was only the warmth of skin. Then, slowly, a feeling that was not Jonas\'s own began to settle into him: a hillside, snow falling, the particular cold of a wind that had a direction. He had never imagined wind could have a direction.</p><p>When the memory ended, Jonas opened his eyes. The room was the same. The man was the same. But Jonas understood, with a sharpness that felt almost like grief, that his whole community had been living without weather.</p>',
      id:'<p>Lelaki tua itu meletakkan tangannya di punggung Jonas. Mulanya hanya hangat kulit. Lalu, perlahan, sebuah perasaan yang bukan miliknya mulai menetap dalam dirinya: lereng bukit, salju turun, dinginnya angin yang punya arah. Ia tak pernah membayangkan angin bisa punya arah.</p><p>Ketika ingatan itu berakhir, Jonas membuka matanya. Ruangan itu sama. Lelaki itu sama. Namun Jonas mengerti, dengan ketajaman yang nyaris terasa seperti duka, bahwa seluruh komunitasnya selama ini hidup tanpa cuaca.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'"A sharpness that felt almost like grief" most directly conveys —', id:'"Ketajaman yang nyaris terasa seperti duka" paling langsung menyampaikan —'}, options:[{en:'physical pain in the back',id:'sakit fisik di punggung'},{en:'the cost of new awareness',id:'harga dari kesadaran baru'},{en:'fear of the old man',id:'takut pada lelaki tua'},{en:'cold from the snow',id:'dingin dari salju'}], a:1, explain:{en:'The grief is for what the community has been missing — knowledge always exacts a price.', id:'Duka itu untuk apa yang selama ini hilang dari komunitas — pengetahuan selalu menuntut harga.'}},
      {type:'mcq', q:{en:'The phrase "had been living without weather" works on what two levels?', id:'Frasa "selama ini hidup tanpa cuaca" bekerja pada dua tingkat apa?'}, options:[{en:'historical and economic',id:'sejarah dan ekonomi'},{en:'literal and metaphorical',id:'harfiah dan metaforis'},{en:'comic and tragic',id:'komikal dan tragis'},{en:'scientific and political',id:'ilmiah dan politis'}], a:1, explain:{en:'Literally the community has no weather; metaphorically it has no variation, surprise, or feeling.', id:'Secara harfiah komunitas tak memiliki cuaca; secara metaforis tak memiliki variasi, kejutan, atau perasaan.'}},
      {type:'mcq', q:{en:'The detail that wind "had a direction" is meaningful chiefly because it —', id:'Detail bahwa angin "punya arah" bermakna terutama karena —'}, options:[{en:'introduces a navigation theme',id:'memperkenalkan tema navigasi'},{en:'shows Jonas\'s world has been stripped of particulars',id:'menunjukkan dunia Jonas telah dilucuti dari kekhususan'},{en:'predicts a storm',id:'memprediksi badai'},{en:'mocks the old man\'s memory',id:'mengejek ingatan lelaki tua'}], a:1, explain:{en:'A wind without direction is generic; Jonas is learning that reality has texture his world erased.', id:'Angin tanpa arah bersifat umum; Jonas belajar bahwa realitas punya tekstur yang dihapus dunianya.'}},
      {type:'essay', q:{en:'Argue, in three or four sentences, whether Jonas\'s new awareness is a gift or a burden — and why "almost like grief" complicates the question.', id:'Berargumenlah, dalam tiga atau empat kalimat, apakah kesadaran baru Jonas adalah anugerah atau beban — dan mengapa "nyaris seperti duka" memperumit pertanyaan itu.'}, model:{en:'Jonas\'s awareness is both a gift and a burden: he has gained access to the texture of the world, but he now sees that everyone he loves has been deprived of it. The phrase "almost like grief" insists that knowing is mourning — to perceive what is missing is to lose the comfort of not knowing. The passage refuses an easy verdict, which is precisely the moral seriousness Lowry asks of her reader.', id:'Kesadaran Jonas adalah anugerah sekaligus beban: ia mendapat akses pada tekstur dunia, tetapi kini melihat bahwa semua yang ia cintai telah dilucuti darinya. Frasa "nyaris seperti duka" menegaskan bahwa mengetahui adalah berdukacita — memahami apa yang hilang berarti kehilangan kenyamanan ketidaktahuan. Bacaan ini menolak vonis mudah, dan itulah keseriusan moral yang diminta Lowry dari pembacanya.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'The Garden Door', id:'Pintu Taman'},
    sourceNote: {en:'Original passage in the spirit of Frances Hodgson Burnett', id:'Bacaan asli dalam semangat Frances Hodgson Burnett'},
    passage: {
      en:'<p>Mary stood with her hand upon the heavy door and listened. There was no sound in the garden but the small busy noise of a robin somewhere among the tangled vines. She had been a thin and contrary child for as long as she could remember; she had not known, until this morning, that she could feel her heart beat from the inside.</p><p>She pushed. The door swung in slowly, with a long sleepy groan of hinges that had not been asked to move for ten years.</p>',
      id:'<p>Mary berdiri dengan tangan di pintu berat itu dan mendengarkan. Tak ada suara di taman selain suara kecil sibuk seekor robin di antara sulur-sulur kusut. Ia telah menjadi anak yang kurus dan pembangkang sejauh yang ia ingat; ia tak pernah tahu, sampai pagi ini, bahwa ia bisa merasakan detak jantungnya dari dalam.</p><p>Ia mendorong. Pintu itu terbuka perlahan, dengan erangan engsel panjang dan mengantuk yang tak diminta bergerak selama sepuluh tahun.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'"She could feel her heart beat from the inside" suggests Mary is —', id:'"Ia bisa merasakan detak jantungnya dari dalam" menyiratkan Mary —'}, options:[{en:'sick with fever',id:'sakit demam'},{en:'becoming aware of her own aliveness',id:'mulai menyadari kehidupannya sendiri'},{en:'practising for a race',id:'berlatih untuk lomba'},{en:'afraid of the robin',id:'takut pada robin'}], a:1, explain:{en:'Awareness of one\'s own heartbeat marks the awakening of inwardness.', id:'Kesadaran akan detak jantung sendiri menandai bangkitnya batin.'}},
      {type:'mcq', q:{en:'"A long sleepy groan of hinges" is an example of —', id:'"Erangan engsel panjang dan mengantuk" adalah contoh —'}, options:[{en:'metaphor',id:'metafora'},{en:'personification',id:'personifikasi'},{en:'irony',id:'ironi'},{en:'alliteration',id:'aliterasi'}], a:1, explain:{en:'The hinges are given the human attribute of sleepiness — personification.', id:'Engsel diberi sifat manusia: mengantuk — personifikasi.'}},
      {type:'mcq', q:{en:'The detail that the door has not moved "for ten years" implies —', id:'Detail bahwa pintu tak bergerak "selama sepuluh tahun" menyiratkan —'}, options:[{en:'a precise calendar of repairs',id:'jadwal perbaikan yang persis'},{en:'a long-buried sorrow tied to the garden',id:'kesedihan terkubur lama yang terkait taman'},{en:'Mary is ten years old',id:'Mary berusia sepuluh tahun'},{en:'the gardener has died',id:'tukang kebun telah meninggal'}], a:1, explain:{en:'A locked space across a decade carries weight; it points to grief without naming it yet.', id:'Ruang yang terkunci selama satu dekade memikul beban; menunjuk pada duka tanpa menamainya.'}},
      {type:'essay', q:{en:'How does the author parallel Mary\'s inner state with the garden\'s state? Three sentences.', id:'Bagaimana penulis memparalelkan keadaan batin Mary dengan keadaan taman? Tiga kalimat.'}, model:{en:'The garden has been closed for ten years; Mary has, in a sense, been closed for as long as she can remember. Both are described as overgrown or tangled and asked to wake up — the hinges with their groan, Mary with her audible heartbeat. By opening the door, Mary is also opening herself, and the parallel quietly promises that the restoration of one will be the restoration of the other.', id:'Taman telah tertutup selama sepuluh tahun; Mary, dalam arti tertentu, sudah tertutup sejauh yang ia ingat. Keduanya digambarkan ditumbuhi atau kusut dan diminta bangun — engsel dengan erangannya, Mary dengan detak jantungnya yang terdengar. Dengan membuka pintu, Mary juga membuka dirinya, dan paralel ini diam-diam menjanjikan bahwa pemulihan yang satu akan menjadi pemulihan yang lain.'}}
    ]
  },
  {
    type:'scenario',
    title: {en:'Why the Sky is Blue', id:'Mengapa Langit Biru'},
    sourceNote: {en:'Non-fiction science passage (original)', id:'Bacaan sains non-fiksi (asli)'},
    passage: {
      en:'<p>Sunlight looks white, but it is in fact a bundle of every visible colour. When that bundle enters the atmosphere, it strikes molecules of nitrogen and oxygen and bounces in every direction — a process physicists call <em>Rayleigh scattering</em>. Shorter wavelengths, like blue and violet, scatter much more strongly than longer ones, like red.</p><p>The human eye, however, is more sensitive to blue than to violet, and some violet light is absorbed high in the atmosphere. The combined result is the familiar blue dome of the daytime sky. At sunset, when sunlight passes through far more atmosphere, the blues scatter away entirely, and only the longest wavelengths — orange and red — survive the long oblique journey to your eyes.</p>',
      id:'<p>Sinar matahari tampak putih, tetapi sebenarnya merupakan ikatan dari semua warna kasatmata. Ketika ikatan itu masuk atmosfer, ia menumbuk molekul nitrogen dan oksigen lalu memantul ke segala arah — proses yang fisikawan sebut <em>hamburan Rayleigh</em>. Panjang gelombang yang lebih pendek, seperti biru dan ungu, terhambur jauh lebih kuat daripada yang panjang, seperti merah.</p><p>Mata manusia, bagaimanapun, lebih peka pada biru daripada ungu, dan sebagian cahaya ungu diserap tinggi di atmosfer. Hasil gabungannya adalah kubah biru langit siang yang akrab. Saat matahari terbenam, ketika cahaya melintasi atmosfer jauh lebih panjang, biru-biru terhambur habis, dan hanya panjang gelombang terpanjang — jingga dan merah — yang bertahan dalam perjalanan miring panjang ke matamu.</p>'
    },
    subs: [
      {type:'mcq', q:{en:'According to the passage, why does the sky not appear violet?', id:'Menurut bacaan, mengapa langit tidak tampak ungu?'}, options:[{en:'Violet light does not scatter',id:'Cahaya ungu tidak terhambur'},{en:'The eye is less sensitive to violet and some is absorbed high up',id:'Mata kurang peka pada ungu dan sebagian terserap tinggi di atas'},{en:'Violet is blocked by clouds',id:'Ungu dihalangi awan'},{en:'The sun emits no violet',id:'Matahari tak memancarkan ungu'}], a:1, explain:{en:'The text gives both reasons: eye sensitivity and high-altitude absorption.', id:'Teks menyebut keduanya: kepekaan mata dan penyerapan di lapisan tinggi.'}},
      {type:'mcq', q:{en:'The function of the second paragraph is mainly to —', id:'Fungsi paragraf kedua terutama untuk —'}, options:[{en:'contradict the first paragraph',id:'membantah paragraf pertama'},{en:'extend the explanation to a new observation (sunset)',id:'memperluas penjelasan ke pengamatan baru (matahari terbenam)'},{en:'introduce an unrelated topic',id:'memperkenalkan topik tak terkait'},{en:'argue against Rayleigh scattering',id:'menentang hamburan Rayleigh'}], a:1, explain:{en:'It uses the same mechanism to explain a related but different phenomenon.', id:'Ia menggunakan mekanisme yang sama untuk menjelaskan gejala terkait yang berbeda.'}},
      {type:'mcq', q:{en:'The phrase "long oblique journey" emphasises that at sunset light —', id:'Frasa "perjalanan miring panjang" menekankan bahwa saat matahari terbenam cahaya —'}, options:[{en:'travels straight down',id:'merambat lurus ke bawah'},{en:'travels through much more atmosphere at a slanted angle',id:'menempuh atmosfer jauh lebih banyak pada sudut miring'},{en:'avoids the atmosphere',id:'menghindari atmosfer'},{en:'bends around the moon',id:'membelok mengitari bulan'}], a:1, explain:{en:'The angle increases the path length, which is why longer wavelengths dominate.', id:'Sudut itu memperpanjang lintasan, itulah sebabnya panjang gelombang terpanjang yang mendominasi.'}},
      {type:'essay', q:{en:'In your own words and three sentences, explain why sunsets are red using only ideas from the passage.', id:'Dengan kata-katamu sendiri dan tiga kalimat, jelaskan mengapa matahari terbenam berwarna merah, hanya menggunakan ide dari bacaan.'}, model:{en:'At sunset, light from the sun reaches us at a slanted angle, which forces it through a much thicker layer of atmosphere than at noon. The blue and violet wavelengths scatter so much along that long path that they are essentially gone by the time the light arrives. Only the longest wavelengths — orange and red — survive the journey, and that is the colour we see.', id:'Saat matahari terbenam, cahaya matahari mencapai kita pada sudut miring, yang memaksanya menembus lapisan atmosfer jauh lebih tebal dibanding siang. Panjang gelombang biru dan ungu terhambur begitu banyak di sepanjang lintasan panjang itu sehingga praktis habis sebelum cahaya tiba. Hanya panjang gelombang terpanjang — jingga dan merah — yang bertahan menempuh perjalanan, dan itulah warna yang kita lihat.'}}
    ]
  }
];

const VOCAB = [
  {type:'mcq', tag:{en:'Closest meaning',id:'Makna terdekat'}, q:{en:'In context: "Her resolve was <em>steadfast</em> despite the long delay." Choose the closest meaning.', id:'Dalam konteks: "Tekadnya <em>steadfast</em> meskipun penundaan panjang." Pilih makna terdekat.'}, options:[{en:'flexible',id:'lentur'},{en:'unwavering',id:'tak goyah'},{en:'occasional',id:'sesekali'},{en:'reluctant',id:'enggan'}], a:1, explain:{en:'Steadfast = firm, unwavering. From Old English stede (place) + fast (fixed).', id:'Steadfast = teguh, tak goyah. Dari Inggris Kuno stede (tempat) + fast (kokoh).'}},
  {type:'mcq', tag:{en:'Closest meaning',id:'Makna terdekat'}, q:{en:'"The senator gave a <em>perfunctory</em> nod to the visitor." Closest meaning?', id:'"Senator memberi anggukan <em>perfunctory</em> pada tamu." Makna terdekat?'}, options:[{en:'enthusiastic',id:'antusias'},{en:'mechanical and superficial',id:'mekanis dan dangkal'},{en:'hostile',id:'bermusuhan'},{en:'thoughtful',id:'berpikir matang'}], a:1, explain:{en:'Perfunctory = done as routine, without care. From Latin perfungi, to discharge a duty.', id:'Perfunctory = dilakukan sebagai rutinitas, tanpa perhatian. Dari Latin perfungi.'}},
  {type:'mcq', tag:{en:'Greek root',id:'Akar Yunani'}, q:{en:'The Greek root <em>chron-</em> means time. Which word does NOT contain this root?', id:'Akar Yunani <em>chron-</em> berarti waktu. Kata mana yang TIDAK mengandung akar ini?'}, options:[{en:'chronic',id:'chronic'},{en:'chronicle',id:'chronicle'},{en:'chrome',id:'chrome'},{en:'synchronize',id:'synchronize'}], a:2, explain:{en:'Chrome comes from Greek chroma (colour), not chronos (time).', id:'Chrome berasal dari chroma (warna) Yunani, bukan chronos (waktu).'}},
  {type:'mcq', tag:{en:'Latin root',id:'Akar Latin'}, q:{en:'The Latin root <em>scrib-/script-</em> means "to write." A <em>scribe</em> is therefore —', id:'Akar Latin <em>scrib-/script-</em> berarti "menulis." Maka <em>scribe</em> adalah —'}, options:[{en:'a singer',id:'penyanyi'},{en:'a person who copies texts',id:'orang yang menyalin teks'},{en:'a kind of bird',id:'sejenis burung'},{en:'an architect',id:'arsitek'}], a:1, explain:{en:'The same root appears in inscribe, manuscript, prescription.', id:'Akar yang sama ada pada inscribe, manuscript, prescription.'}},
  {type:'mcq', tag:{en:'Analogy',id:'Analogi'}, q:{en:'<em>ARID : DESERT</em> :: ? : ?', id:'<em>ARID : DESERT</em> :: ? : ?'}, options:[{en:'humid : jungle',id:'humid : jungle'},{en:'cold : fire',id:'cold : fire'},{en:'dark : noon',id:'dark : noon'},{en:'silent : market',id:'silent : market'}], a:0, explain:{en:'Quality typical of place: arid is to desert as humid is to jungle.', id:'Sifat khas tempat: arid bagi desert seperti humid bagi jungle.'}},
  {type:'mcq', tag:{en:'Analogy',id:'Analogi'}, q:{en:'<em>WHISPER : SHOUT</em> :: ? : ?', id:'<em>WHISPER : SHOUT</em> :: ? : ?'}, options:[{en:'sip : gulp',id:'sip : gulp'},{en:'eat : sleep',id:'eat : sleep'},{en:'sing : dance',id:'sing : dance'},{en:'walk : think',id:'walk : think'}], a:0, explain:{en:'Same action at small vs. large intensity: whisper/shout and sip/gulp.', id:'Aksi sama dalam intensitas kecil vs besar: whisper/shout dan sip/gulp.'}},
  {type:'mcq', tag:{en:'Prefix',id:'Awalan'}, q:{en:'The prefix <em>bene-</em> in <em>benevolent</em> means —', id:'Awalan <em>bene-</em> dalam <em>benevolent</em> berarti —'}, options:[{en:'against',id:'melawan'},{en:'well or good',id:'baik'},{en:'under',id:'di bawah'},{en:'two',id:'dua'}], a:1, explain:{en:'Bene- = well or good (Latin). Benevolent = wishing well.', id:'Bene- = baik (Latin). Benevolent = berkehendak baik.'}},
  {type:'mcq', tag:{en:'Suffix',id:'Akhiran'}, q:{en:'The suffix <em>-ology</em> means —', id:'Akhiran <em>-ology</em> berarti —'}, options:[{en:'study of',id:'kajian tentang'},{en:'fear of',id:'takut pada'},{en:'lover of',id:'pencinta'},{en:'hatred of',id:'kebencian terhadap'}], a:0, explain:{en:'-ology from Greek logos (word, study). Biology = study of life.', id:'-ology dari logos Yunani (kata, kajian). Biology = kajian kehidupan.'}},
  {type:'mcq', tag:{en:'Closest meaning',id:'Makna terdekat'}, q:{en:'"The lawyer\'s argument was <em>cogent</em> and brief." Closest meaning?', id:'"Argumen pengacara <em>cogent</em> dan ringkas." Makna terdekat?'}, options:[{en:'confused',id:'kacau'},{en:'clear and persuasive',id:'jernih dan meyakinkan'},{en:'angry',id:'marah'},{en:'lengthy',id:'panjang'}], a:1, explain:{en:'Cogent = forcefully convincing. From Latin cogere, to compel.', id:'Cogent = sangat meyakinkan. Dari cogere (memaksa) Latin.'}},
  {type:'mcq', tag:{en:'Closest meaning',id:'Makna terdekat'}, q:{en:'"He spoke with <em>candor</em> about his mistakes." Candor means —', id:'"Ia berbicara dengan <em>candor</em> tentang kesalahannya." Candor berarti —'}, options:[{en:'cheerful flattery',id:'sanjungan ceria'},{en:'frank honesty',id:'kejujuran terus-terang'},{en:'cold detachment',id:'sikap dingin terlepas'},{en:'witty mockery',id:'cemoohan jenaka'}], a:1, explain:{en:'Candor = honest plain speech. From Latin candidus (bright, white).', id:'Candor = ucapan jujur apa adanya. Dari Latin candidus (cerah, putih).'}},
  {type:'mcq', tag:{en:'Greek root',id:'Akar Yunani'}, q:{en:'The root <em>phil-</em> means "love." <em>Philanthropy</em> therefore literally means —', id:'Akar <em>phil-</em> berarti "cinta." <em>Philanthropy</em> secara harfiah berarti —'}, options:[{en:'love of money',id:'cinta uang'},{en:'love of humankind',id:'cinta kemanusiaan'},{en:'love of music',id:'cinta musik'},{en:'love of self',id:'cinta diri'}], a:1, explain:{en:'Phil- (love) + anthropos (human) = love of humankind.', id:'Phil- (cinta) + anthropos (manusia) = cinta kemanusiaan.'}},
  {type:'mcq', tag:{en:'Latin root',id:'Akar Latin'}, q:{en:'The root <em>vid-/vis-</em> means "to see." Which word does NOT share it?', id:'Akar <em>vid-/vis-</em> berarti "melihat." Mana yang TIDAK memilikinya?'}, options:[{en:'evident',id:'evident'},{en:'vision',id:'vision'},{en:'video',id:'video'},{en:'vivid',id:'vivid'}], a:3, explain:{en:'Vivid comes from Latin vivere (to live), not videre (to see).', id:'Vivid berasal dari vivere (hidup) Latin, bukan videre (melihat).'}},
  {type:'mcq', tag:{en:'Analogy',id:'Analogi'}, q:{en:'<em>NOVEL : CHAPTER</em> :: ? : ?', id:'<em>NOVEL : CHAPTER</em> :: ? : ?'}, options:[{en:'symphony : movement',id:'symphony : movement'},{en:'forest : ocean',id:'forest : ocean'},{en:'door : house',id:'door : house'},{en:'bread : flour',id:'bread : flour'}], a:0, explain:{en:'Whole-to-major-part: a novel is divided into chapters as a symphony into movements.', id:'Keseluruhan ke bagian utama: novel dibagi menjadi bab seperti simfoni menjadi movement.'}},
  {type:'mcq', tag:{en:'Closest meaning',id:'Makna terdekat'}, q:{en:'"The instructions were <em>ambiguous</em>, so the students disagreed." Ambiguous means —', id:'"Instruksinya <em>ambiguous</em>, sehingga murid berselisih." Ambiguous berarti —'}, options:[{en:'open to more than one interpretation',id:'terbuka pada lebih dari satu tafsir'},{en:'strict',id:'ketat'},{en:'recent',id:'baru'},{en:'humorous',id:'lucu'}], a:0, explain:{en:'Ambiguous = having multiple possible meanings. From Latin ambi- (both) + agere (to drive).', id:'Ambiguous = punya beberapa makna mungkin. Dari Latin ambi- (kedua) + agere (mendorong).'}},
  {type:'mcq', tag:{en:'Prefix',id:'Awalan'}, q:{en:'The prefix <em>mal-</em> in <em>malevolent</em> means —', id:'Awalan <em>mal-</em> dalam <em>malevolent</em> berarti —'}, options:[{en:'great',id:'besar'},{en:'bad or ill',id:'buruk'},{en:'small',id:'kecil'},{en:'around',id:'sekitar'}], a:1, explain:{en:'Mal- = bad. Malevolent = wishing ill. Sibling to benevolent.', id:'Mal- = buruk. Malevolent = berkehendak buruk. Saudara dari benevolent.'}},
  {type:'mcq', tag:{en:'Closest meaning',id:'Makna terdekat'}, q:{en:'"The judge\'s ruling was <em>impartial</em>." Closest meaning?', id:'"Putusan hakim itu <em>impartial</em>." Makna terdekat?'}, options:[{en:'mistaken',id:'keliru'},{en:'fair, taking no side',id:'adil, tak memihak'},{en:'severe',id:'keras'},{en:'private',id:'pribadi'}], a:1, explain:{en:'Im- (not) + partial (favouring one side) = unbiased.', id:'Im- (tidak) + partial (memihak) = tak berpihak.'}},
  {type:'match_pairs', tag:{en:'Roots & meanings',id:'Akar & makna'}, q:{en:'Match each Greek/Latin root to its meaning.', id:'Pasangkan tiap akar Yunani/Latin dengan maknanya.'}, left:[{en:'aqua-',id:'aqua-'},{en:'bio-',id:'bio-'},{en:'geo-',id:'geo-'},{en:'tele-',id:'tele-'}], right:[{en:'water',id:'air'},{en:'life',id:'hidup'},{en:'earth',id:'bumi'},{en:'far',id:'jauh'}], pairs:[[0,0],[1,1],[2,2],[3,3]], explain:{en:'Aquarium, biology, geography, television all carry these roots.', id:'Aquarium, biology, geography, television semua membawa akar ini.'}},
  {type:'fill', tag:{en:'Word in context',id:'Kata dalam konteks'}, q:{en:'Fill the blank: "The detective\'s suspicion was ____ — based on long experience and not on a single clue." (one word, begins with i)', id:'Isi: "Kecurigaan detektif itu ____ — berdasarkan pengalaman panjang dan bukan satu petunjuk." (satu kata, mulai dengan i)'}, answers:['intuitive','intuition'], explain:{en:'Intuitive: known without explicit reasoning. From Latin intueri, to look upon.', id:'Intuitive: diketahui tanpa penalaran eksplisit. Dari intueri (memandang) Latin.'}}
];

const CRITICAL = [
  {type:'mcq', tag:{en:'Thesis identification',id:'Identifikasi tesis'}, q:{en:'Read: "Many cities invest in bicycle lanes, hoping to reduce traffic. The evidence from Copenhagen, Amsterdam, and Portland shows that protected lanes — not painted ones — actually shift commuter behaviour. Cities serious about cars-out-of-downtown must therefore build infrastructure with concrete, not paint." What is the thesis?', id:'Baca: "Banyak kota membangun jalur sepeda untuk mengurangi macet. Bukti dari Kopenhagen, Amsterdam, Portland menunjukkan jalur yang dilindungi — bukan sekadar dicat — yang benar-benar mengubah perilaku pengendara. Kota yang serius mengeluarkan mobil dari pusat harus membangun infrastruktur dari beton, bukan cat." Apa tesisnya?'}, options:[{en:'Cities invest in bike lanes',id:'Kota membangun jalur sepeda'},{en:'Painted lanes are cheaper',id:'Jalur cat lebih murah'},{en:'Only protected, physical infrastructure changes commuter behaviour',id:'Hanya infrastruktur fisik yang melindungi yang mengubah perilaku komuter'},{en:'Portland is similar to Amsterdam',id:'Portland mirip Amsterdam'}], a:2, explain:{en:'The thesis is the claim the evidence supports — paint will not do, concrete will.', id:'Tesis adalah klaim yang didukung bukti — cat tak cukup, beton-lah yang berlaku.'}},
  {type:'mcq', tag:{en:'Fact vs. opinion',id:'Fakta vs. opini'}, q:{en:'Which sentence is a verifiable fact rather than an opinion?', id:'Kalimat mana yang merupakan fakta yang dapat diverifikasi, bukan opini?'}, options:[{en:'The novel is the most beautiful ever written.',id:'Novel itu paling indah yang pernah ditulis.'},{en:'The novel was published in 1962.',id:'Novel itu terbit pada 1962.'},{en:'Readers should appreciate the novel.',id:'Pembaca seharusnya menghargai novel itu.'},{en:'The novel deserves more attention.',id:'Novel itu pantas mendapat perhatian lebih.'}], a:1, explain:{en:'A date is checkable; the others express judgement.', id:'Tanggal dapat dicek; yang lain mengandung penilaian.'}},
  {type:'mcq', tag:{en:'Logical fallacy',id:'Kekeliruan logika'}, q:{en:'"Either we ban screens for kids entirely, or we accept the collapse of literacy." This is —', id:'"Larang layar untuk anak sepenuhnya, atau terima kehancuran literasi." Ini adalah —'}, options:[{en:'straw man',id:'straw man'},{en:'false dilemma',id:'dilema palsu'},{en:'circular reasoning',id:'penalaran berputar'},{en:'ad hominem',id:'ad hominem'}], a:1, explain:{en:'Only two options are presented when many exist between them.', id:'Hanya dua opsi disodorkan padahal ada banyak di antaranya.'}},
  {type:'mcq', tag:{en:'Logical fallacy',id:'Kekeliruan logika'}, q:{en:'"Of course she is wrong about the budget — she has never even managed a household." This is —', id:'"Tentu ia salah soal anggaran — bahkan ia tak pernah mengurus rumah tangga." Ini adalah —'}, options:[{en:'red herring',id:'red herring'},{en:'ad hominem',id:'ad hominem'},{en:'slippery slope',id:'slippery slope'},{en:'appeal to authority',id:'appeal to authority'}], a:1, explain:{en:'The attack is on the person rather than the argument.', id:'Serangan ditujukan ke orangnya, bukan argumennya.'}},
  {type:'mcq', tag:{en:'Logical fallacy',id:'Kekeliruan logika'}, q:{en:'"This medicine must work — millions of people use it." This is —', id:'"Obat ini pasti manjur — jutaan orang memakainya." Ini adalah —'}, options:[{en:'appeal to popularity',id:'appeal to popularity'},{en:'false cause',id:'sebab palsu'},{en:'straw man',id:'straw man'},{en:'tu quoque',id:'tu quoque'}], a:0, explain:{en:'Popularity is offered as proof of truth — ad populum.', id:'Popularitas diajukan sebagai bukti kebenaran — ad populum.'}},
  {type:'mcq', tag:{en:'Bias detection',id:'Deteksi bias'}, q:{en:'A news headline reads: "Failed senator finally admits weak policy was reckless." Which words signal bias?', id:'Judul berita: "Senator gagal akhirnya mengakui kebijakan lemah itu ceroboh." Kata mana yang menandai bias?'}, options:[{en:'senator, policy, admits',id:'senator, kebijakan, mengakui'},{en:'failed, weak, reckless',id:'gagal, lemah, ceroboh'},{en:'finally, was, that',id:'akhirnya, telah, itu'},{en:'None of the words',id:'Tak ada kata yang bias'}], a:1, explain:{en:'Loaded adjectives presuppose judgements a neutral report would attribute to sources.', id:'Kata sifat bermuatan mengandaikan penilaian yang dalam laporan netral akan disandarkan ke sumber.'}},
  {type:'mcq', tag:{en:'Logical fallacy',id:'Kekeliruan logika'}, q:{en:'"After he started jogging, his grades improved. Clearly, jogging makes you smarter." This is —', id:'"Setelah ia mulai jogging, nilainya naik. Jelas jogging membuatmu cerdas." Ini adalah —'}, options:[{en:'post hoc (false cause)',id:'post hoc (sebab palsu)'},{en:'straw man',id:'straw man'},{en:'red herring',id:'red herring'},{en:'appeal to authority',id:'appeal to authority'}], a:0, explain:{en:'A following B does not mean B caused A. Other variables may explain it.', id:'A setelah B tak berarti B menyebabkan A. Variabel lain bisa menjelaskannya.'}},
  {type:'mcq', tag:{en:'Evidence evaluation',id:'Penilaian bukti'}, q:{en:'Which kind of evidence would best support the claim "this app improves sleep"?', id:'Bukti macam apa yang paling mendukung klaim "aplikasi ini memperbaiki tidur"?'}, options:[{en:'A single five-star review',id:'Satu ulasan bintang lima'},{en:'A randomised controlled trial with 800 participants',id:'Uji acak terkendali dengan 800 partisipan'},{en:'A founder\'s personal testimonial',id:'Testimoni pendiri sendiri'},{en:'A celebrity endorsement',id:'Dukungan selebritas'}], a:1, explain:{en:'RCTs control for variables and chance; the others are weak or biased.', id:'Uji acak mengendalikan variabel dan kebetulan; yang lain lemah atau bias.'}},
  {type:'mcq', tag:{en:'Logical fallacy',id:'Kekeliruan logika'}, q:{en:'"If we allow students to retake one test, soon they will demand to retake all of them, then redo whole semesters — exams will be meaningless." This is —', id:'"Jika siswa boleh mengulang satu ujian, segera mereka minta mengulang semuanya, lalu mengulang satu semester — ujian jadi tak bermakna." Ini adalah —'}, options:[{en:'slippery slope',id:'slippery slope'},{en:'false dilemma',id:'dilema palsu'},{en:'ad hominem',id:'ad hominem'},{en:'appeal to tradition',id:'appeal to tradition'}], a:0, explain:{en:'A small step is claimed to lead inevitably to extreme outcomes.', id:'Langkah kecil diklaim pasti menuntun ke akibat ekstrem.'}},
  {type:'mcq', tag:{en:'Scenario thesis',id:'Tesis skenario'}, q:{en:'Read: "Standardised tests claim to measure ability, but they mostly measure test-taking practice. Students with tutors gain twice the score of students without — independent of intelligence. Until we control for coaching, the test is a measure of access, not ability." What is the writer\'s strongest claim?', id:'Baca: "Tes terstandar mengaku mengukur kemampuan, padahal mereka kebanyakan mengukur latihan ujian. Siswa dengan tutor naik dua kali lipat dibanding tanpa tutor — terlepas dari kecerdasan. Selama kita tak mengontrol bimbingan, tes itu mengukur akses, bukan kemampuan." Klaim terkuat penulis?'}, options:[{en:'Tutoring is too expensive',id:'Bimbingan terlalu mahal'},{en:'Standardised tests currently measure access more than ability',id:'Tes terstandar saat ini mengukur akses lebih dari kemampuan'},{en:'All testing should be abolished',id:'Semua ujian harus dihapus'},{en:'Intelligent students always do well',id:'Siswa cerdas selalu unggul'}], a:1, explain:{en:'The argument concedes intent and then redefines what is actually measured.', id:'Argumen mengakui niatnya lalu mendefinisikan ulang apa yang sebenarnya diukur.'}}
];

const WRITING = [
  {type:'mcq', tag:{en:'Subject-verb agreement',id:'Kesesuaian subjek-predikat'}, q:{en:'Choose the correct sentence.', id:'Pilih kalimat yang benar.'}, options:[{en:'The bouquet of roses are on the table.',id:'The bouquet of roses are on the table.'},{en:'The bouquet of roses is on the table.',id:'The bouquet of roses is on the table.'},{en:'The bouquet of roses were on the table.',id:'The bouquet of roses were on the table.'},{en:'The bouquet of roses be on the table.',id:'The bouquet of roses be on the table.'}], a:1, explain:{en:'The subject is "bouquet" (singular), not "roses." Singular verb "is" is required.', id:'Subjek adalah "bouquet" (tunggal), bukan "roses". Predikat tunggal "is" diperlukan.'}},
  {type:'mcq', tag:{en:'Modifier placement',id:'Penempatan keterangan'}, q:{en:'Which sentence avoids a misplaced modifier?', id:'Kalimat mana yang menghindari modifier salah letak?'}, options:[{en:'Running through the park, the statue surprised me.',id:'Running through the park, the statue surprised me.'},{en:'Running through the park, I was surprised by the statue.',id:'Running through the park, I was surprised by the statue.'},{en:'The statue surprised, running through the park, me.',id:'The statue surprised, running through the park, me.'},{en:'Surprised the statue running through the park me.',id:'Surprised the statue running through the park me.'}], a:1, explain:{en:'The participle "running" must attach to the human runner, not the statue.', id:'Partisip "running" harus melekat pada pelari manusia, bukan patung.'}},
  {type:'mcq', tag:{en:'Parallel structure',id:'Struktur paralel'}, q:{en:'Which sentence uses correct parallel structure?', id:'Kalimat mana yang menggunakan struktur paralel yang benar?'}, options:[{en:'She likes reading, to swim, and hiking.',id:'She likes reading, to swim, and hiking.'},{en:'She likes reading, swimming, and hiking.',id:'She likes reading, swimming, and hiking.'},{en:'She likes to read, swimming, and hike.',id:'She likes to read, swimming, and hike.'},{en:'She likes read, swim, and hiking.',id:'She likes read, swim, and hiking.'}], a:1, explain:{en:'All three items must be the same grammatical form — here, -ing gerunds.', id:'Ketiganya harus dalam bentuk gramatikal sama — di sini, gerund -ing.'}},
  {type:'mcq', tag:{en:'Comma usage',id:'Penggunaan koma'}, q:{en:'Choose the correctly punctuated sentence.', id:'Pilih kalimat dengan tanda baca benar.'}, options:[{en:'After the long quiet performance the audience applauded.',id:'After the long quiet performance the audience applauded.'},{en:'After the long, quiet performance, the audience applauded.',id:'After the long, quiet performance, the audience applauded.'},{en:'After the, long quiet performance the audience, applauded.',id:'After the, long quiet performance the audience, applauded.'},{en:'After the long quiet, performance the audience applauded.',id:'After the long quiet, performance the audience applauded.'}], a:1, explain:{en:'Comma between coordinate adjectives and after the introductory phrase.', id:'Koma di antara kata sifat sejajar dan setelah frasa pembuka.'}},
  {type:'mcq', tag:{en:'Figurative language',id:'Bahasa figuratif'}, q:{en:'"Her voice was a knife in the still air." This is —', id:'"Suaranya bagai pisau di udara sunyi." Ini adalah —'}, options:[{en:'simile',id:'simile'},{en:'metaphor',id:'metafora'},{en:'hyperbole',id:'hiperbola'},{en:'oxymoron',id:'oksimoron'}], a:1, explain:{en:'No "like/as" — direct identification, so metaphor.', id:'Tanpa "bagai/seperti" — identifikasi langsung, jadi metafora.'}},
  {type:'mcq', tag:{en:'Figurative language',id:'Bahasa figuratif'}, q:{en:'"The wind whispered through the pines." This is —', id:'"Angin berbisik melewati pinus." Ini adalah —'}, options:[{en:'metaphor',id:'metafora'},{en:'personification',id:'personifikasi'},{en:'irony',id:'ironi'},{en:'understatement',id:'litotes'}], a:1, explain:{en:'Wind is given the human action of whispering — personification.', id:'Angin diberi tindakan manusia "berbisik" — personifikasi.'}},
  {type:'mcq', tag:{en:'Figurative language',id:'Bahasa figuratif'}, q:{en:'"I have told you a million times." This is —', id:'"Aku sudah bilang sejuta kali." Ini adalah —'}, options:[{en:'hyperbole',id:'hiperbola'},{en:'metonymy',id:'metonimi'},{en:'pun',id:'permainan kata'},{en:'allegory',id:'alegori'}], a:0, explain:{en:'Deliberate exaggeration for effect = hyperbole.', id:'Pelebih-lebihan sengaja untuk efek = hiperbola.'}},
  {type:'mcq', tag:{en:'Rhetorical device',id:'Perangkat retorika'}, q:{en:'"We shall fight on the beaches; we shall fight on the landing grounds; we shall fight in the fields." This device is —', id:'"Kita akan bertarung di pantai; kita akan bertarung di lapangan pendaratan; kita akan bertarung di ladang." Perangkat ini adalah —'}, options:[{en:'chiasmus',id:'kiasmus'},{en:'anaphora',id:'anafora'},{en:'antithesis',id:'antitesis'},{en:'litotes',id:'litotes'}], a:1, explain:{en:'Repetition of a phrase at the start of successive clauses = anaphora.', id:'Pengulangan frasa di awal klausa berturut-turut = anafora.'}},
  {type:'mcq', tag:{en:'Sentence structure',id:'Struktur kalimat'}, q:{en:'Which is a complex sentence?', id:'Kalimat mana yang kompleks?'}, options:[{en:'The dog barked, and the cat ran.',id:'The dog barked, and the cat ran.'},{en:'Although the dog barked, the cat did not run.',id:'Although the dog barked, the cat did not run.'},{en:'The dog barked.',id:'The dog barked.'},{en:'The dog barked; the cat ran.',id:'The dog barked; the cat ran.'}], a:1, explain:{en:'Complex = one independent + one or more dependent clauses. "Although..." is dependent.', id:'Kompleks = satu klausa bebas + satu atau lebih klausa tergantung. "Although..." adalah klausa tergantung.'}},
  {type:'mcq', tag:{en:'Apostrophe',id:'Apostrof'}, q:{en:'Choose the correct sentence.', id:'Pilih kalimat yang benar.'}, options:[{en:'The childrens\' books are on the shelf.',id:'The childrens\' books are on the shelf.'},{en:'The children\'s books are on the shelf.',id:'The children\'s books are on the shelf.'},{en:'The childrens books are on the shelf.',id:'The childrens books are on the shelf.'},{en:'The childrens\'s books are on the shelf.',id:'The childrens\'s books are on the shelf.'}], a:1, explain:{en:'Children is already plural; possessive adds ’s.', id:'Children sudah jamak; bentuk kepunyaan menambah ’s.'}},
  {type:'mcq', tag:{en:'Concise writing',id:'Tulisan ringkas'}, q:{en:'Which is the most concise version with the same meaning?', id:'Mana versi paling ringkas dengan makna sama?'}, options:[{en:'Due to the fact that it was raining, we decided to make the decision to stay home.',id:'Due to the fact that it was raining, we decided to make the decision to stay home.'},{en:'Because it was raining, we stayed home.',id:'Because it was raining, we stayed home.'},{en:'On account of the rain happening, the decision was that we stayed.',id:'On account of the rain happening, the decision was that we stayed.'},{en:'It was the rain that caused us, in the end, to stay at home.',id:'It was the rain that caused us, in the end, to stay at home.'}], a:1, explain:{en:'Strong writing prefers active, lean phrasing.', id:'Tulisan kuat memilih frasa aktif dan ramping.'}},
  {type:'mcq', tag:{en:'Active vs. passive',id:'Aktif vs. pasif'}, q:{en:'Which is the active-voice version?', id:'Mana versi kalimat aktif?'}, options:[{en:'The window was broken by the storm.',id:'The window was broken by the storm.'},{en:'The storm broke the window.',id:'The storm broke the window.'},{en:'The window had been broken.',id:'The window had been broken.'},{en:'It was the storm that broke the window.',id:'It was the storm that broke the window.'}], a:1, explain:{en:'Active voice puts the agent (storm) before the verb.', id:'Suara aktif menempatkan pelaku (storm) sebelum verba.'}},
  {type:'mcq', tag:{en:'Pronoun case',id:'Kasus pronomina'}, q:{en:'Choose the grammatically correct sentence.', id:'Pilih kalimat yang benar secara tata bahasa.'}, options:[{en:'Between you and I, the test was hard.',id:'Between you and I, the test was hard.'},{en:'Between you and me, the test was hard.',id:'Between you and me, the test was hard.'},{en:'Between yourself and I, the test was hard.',id:'Between yourself and I, the test was hard.'},{en:'Between we, the test was hard.',id:'Between we, the test was hard.'}], a:1, explain:{en:'After a preposition, use the objective case "me."', id:'Setelah preposisi, gunakan kasus objek "me".'}},
  {type:'mcq', tag:{en:'Essay craft',id:'Kerajinan esai'}, q:{en:'Which opening best sets up an argumentative essay?', id:'Pembuka mana yang paling sesuai untuk esai argumentatif?'}, options:[{en:'In this essay, I will talk about phones.',id:'In this essay, I will talk about phones.'},{en:'Phones are interesting things invented in 1876.',id:'Phones are interesting things invented in 1876.'},{en:'Smartphones in classrooms harm focus more than they aid learning — and the research is clearer than the policy.',id:'Smartphones in classrooms harm focus more than they aid learning — and the research is clearer than the policy.'},{en:'Phones, phones, phones — everywhere.',id:'Phones, phones, phones — everywhere.'}], a:2, explain:{en:'A strong opening names the claim and signals stakes — no padding.', id:'Pembuka kuat menamai klaim dan menunjukkan taruhan — tanpa basa-basi.'}},
  {type:'essay', tag:{en:'Essay prompt',id:'Tugas esai'}, q:{en:'In 150-200 words, argue whether schools should require students to read at least one book per month outside the curriculum. Use one specific example.', id:'Dalam 150-200 kata, berargumenlah apakah sekolah harus mewajibkan siswa membaca setidaknya satu buku per bulan di luar kurikulum. Gunakan satu contoh spesifik.'}, model:{en:'Schools should require monthly outside reading, because the habit of independent reading is the single most reliable predictor of long-term verbal ability. A required reading log — one short book, freely chosen — protects time that screens now devour by default. The point is not to add work but to defend a habit. Consider a student who, faced with a list, chooses a slim historical novel about wartime courage. In a month she has practised inference, met an unfamiliar setting, and built a private opinion about what bravery costs. Multiply that by twelve, then by twelve years, and the cumulative effect dwarfs any single curriculum unit. Critics will protest that mandatory reading kills the love of it. The answer is structural: require quantity, not specific titles, and grade only on completion plus a one-page response. The constraint is small; the leverage is enormous.', id:'Sekolah sebaiknya mewajibkan bacaan bulanan, karena kebiasaan membaca mandiri adalah prediktor paling andal kemampuan verbal jangka panjang. Catatan baca wajib — satu buku tipis, bebas pilih — melindungi waktu yang kini ditelan layar. Tujuannya bukan menambah beban tetapi mempertahankan kebiasaan. Bayangkan siswa yang, dihadapkan pada daftar, memilih novel sejarah tipis tentang keberanian masa perang. Dalam sebulan ia berlatih inferensi, menjumpai latar baru, dan membangun pendapat pribadi tentang harga keberanian. Kalikan dua belas, lalu dua belas tahun, akumulasinya mengerdilkan unit kurikulum mana pun. Pengkritik akan protes bahwa keharusan membunuh cinta membaca. Jawabannya struktural: wajibkan jumlah, bukan judul; nilai hanya dari penyelesaian plus respons satu halaman. Pembatasannya kecil; daya ungkitnya raksasa.'}},
  {type:'essay', tag:{en:'Essay prompt',id:'Tugas esai'}, q:{en:'In 150-200 words, describe a place from your childhood so vividly that the reader sees it. Use at least two sensory details and one figure of speech.', id:'Dalam 150-200 kata, gambarkan satu tempat dari masa kecilmu secara hidup hingga pembaca melihatnya. Gunakan setidaknya dua detail indrawi dan satu majas.'}, model:{en:'My grandmother\'s back porch faced east, and the morning sun came through the slats of the wooden blinds in long, dust-coloured bars. The boards beneath my feet were warm by seven and hot by ten, and they smelled of varnish that had been re-applied every summer since before I was born. A ceiling fan turned overhead with a tired, friendly tick, like a clock too old to keep accurate time but unwilling to quit. From the porch I could see the lemon tree, its fruit so heavy the branches bowed like elderly shoulders. When the wind moved, the leaves made a sound that was almost like whispering, and the lemons knocked softly against one another. Inside, my grandmother would be measuring rice, and the radio would be playing something in a language I did not speak. I did not understand then that I was being given a place to remember. I understand it now.', id:'Beranda belakang nenekku menghadap timur, dan sinar matahari pagi masuk lewat bilah kerai kayu sebagai garis-garis panjang berwarna debu. Papan di bawah kakiku hangat pukul tujuh dan panas pukul sepuluh, berbau pernis yang dipoles ulang tiap musim panas sejak sebelum aku lahir. Kipas langit-langit berputar dengan tik-tik yang lelah dan akrab, seperti jam tua yang tak lagi tepat tetapi enggan berhenti. Dari beranda aku bisa melihat pohon lemon, buahnya begitu berat hingga dahan-dahan menunduk seperti bahu orang tua. Saat angin bergerak, daun-daun mengeluarkan suara nyaris seperti bisikan, dan lemon-lemon saling menumbuk lembut. Di dalam, nenekku menakar beras, dan radio memutar sesuatu dalam bahasa yang tak kupahami. Aku tak mengerti saat itu bahwa aku sedang diberi sebuah tempat untuk diingat. Aku mengerti sekarang.'}}
];

const BANKS = {reading: READING, vocab: VOCAB, critical: CRITICAL, writing: WRITING};

const PROGRESS_KEY = 'alesha_excel_'+TRACK+'_progress';
function loadProgress(){
  try{ const r = localStorage.getItem(PROGRESS_KEY); return r ? JSON.parse(r) : []; }
  catch(e){ return []; }
}
function saveProgress(arr){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(arr)); }catch(e){}
}
const SCORE_KEY = 'alesha_excel_'+TRACK+'_score';
function loadScore(){
  try{ const r = localStorage.getItem(SCORE_KEY); return r ? JSON.parse(r) : {right:0, total:0}; }
  catch(e){ return {right:0, total:0}; }
}
function saveScore(s){
  try{ localStorage.setItem(SCORE_KEY, JSON.stringify(s)); }catch(e){}
}

const app = document.getElementById('app');
const bank = BANKS[TRACK];
let state = {
  index: 0,
  answered: false,
  selected: null,
  subStep: 0,
  subAnswered: false,
  subSelected: null,
  pairLeftSel: null,
  pairsMatched: [],
  pairsWrong: []
};

function setHeader(){
  const meta = TRACK_META[TRACK];
  document.getElementById('trackRoman').textContent = t(meta.roman);
  document.getElementById('trackTitle').textContent = t(meta.title);
  document.title = "Alesha's English Mastery — " + t(meta.title);
}

function renderIntro(){
  const meta = TRACK_META[TRACK];
  const progress = loadProgress();
  const labelEN = TRACK==='reading'?'passages':'exercises';
  const labelID = TRACK==='reading'?'bacaan':'latihan';
  const progressLabel = LANG==='en' ? progress.length+' of '+bank.length+' '+labelEN+' completed' : progress.length+' dari '+bank.length+' '+labelID+' selesai';
  app.innerHTML = '<div class="card"><div class="intro">'
    +'<div class="roman">'+t(meta.roman)+'</div>'
    +'<h2>'+t(meta.title)+'</h2>'
    +'<div class="rule"></div>'
    +'<div class="desc">'+t(meta.desc)+'</div>'
    +'<div class="meta-row" style="justify-content:center;margin-bottom:18px"><span>'+progressLabel+'</span></div>'
    +'<div class="btn-row" style="justify-content:center">'
    +'<button class="btn" id="beginBtn">'+(progress.length>0 ? t(UI.continueArr) : t(UI.begin))+'</button>'
    +'</div></div></div>';
  document.getElementById('beginBtn').onclick = function(){
    const done = loadProgress();
    let next = bank.length;
    for(let i=0;i<bank.length;i++){ if(!done.includes(i)){ next=i; break; } }
    state.index = next;
    if(state.index >= bank.length){ renderDone(); return; }
    resetItemState();
    renderItem();
  };
}

function resetItemState(){
  state.answered=false; state.selected=null;
  state.subStep=0; state.subAnswered=false; state.subSelected=null;
  state.pairLeftSel=null; state.pairsMatched=[]; state.pairsWrong=[];
}

function progressDots(){
  const done = loadProgress();
  let html = '<div class="dots">';
  for(let i=0;i<bank.length;i++){
    let cls = 'dot';
    if(done.includes(i)) cls+=' done';
    if(i===state.index) cls+=' current';
    html += '<span class="'+cls+'"></span>';
  }
  html += '</div>';
  return html;
}

function metaRow(){
  const labelEN = TRACK==='reading'?'Passage':'Question';
  const labelID = TRACK==='reading'?'Bacaan':'Pertanyaan';
  const label = LANG==='en'?labelEN:labelID;
  return '<div class="meta-row"><span>'+label+' '+(state.index+1)+' '+t(UI.ofShort)+' '+bank.length+'</span><span>'+t(TRACK_META[TRACK].roman)+'</span></div>';
}

function renderItem(){
  const item = bank[state.index];
  if(item.type==='scenario') return renderScenario(item);
  if(item.type==='mcq') return renderMCQ(item);
  if(item.type==='essay') return renderEssay(item);
  if(item.type==='fill') return renderFill(item);
  if(item.type==='match_pairs') return renderPairs(item);
}

function renderMCQ(item){
  const tag = item.tag ? '<div class="q-tag">'+t(item.tag)+'</div>' : '';
  let opts = '';
  item.options.forEach(function(opt,i){
    let cls = '';
    if(state.answered){
      if(i===item.a) cls=' correct disabled';
      else if(i===state.selected) cls=' wrong disabled';
      else cls=' disabled';
    } else if(state.selected===i) cls=' selected';
    const letter = String.fromCharCode(65+i);
    opts += '<li class="'+cls+'" data-i="'+i+'"><span class="letter">'+letter+'.</span>'+t(opt)+'</li>';
  });
  let explainHtml = '';
  if(state.answered){
    const correct = state.selected===item.a;
    explainHtml = '<div class="explain"><strong>'+(correct? t(UI.correct):t(UI.notQuite))+'</strong> '+t(item.explain||{en:'',id:''})+'</div>';
  }
  const nextLabel = state.index===bank.length-1? t(UI.concluding) : t(UI.continueArr);
  app.innerHTML = metaRow()+'<div class="card">'+tag
    +'<div class="q-text">'+t(item.q)+'</div>'
    +'<ul class="options">'+opts+'</ul>'
    +explainHtml
    +'<div class="btn-row">'
    +(state.answered
      ? '<button class="btn" id="nextBtn">'+nextLabel+'</button>'
      : '<button class="btn" id="submitBtn"'+(state.selected===null?' disabled':'')+'>'+t(UI.submit)+'</button>')
    +'</div>'+progressDots()+'</div>';
  document.querySelectorAll('.options li').forEach(function(li){
    li.onclick = function(){
      if(state.answered) return;
      state.selected = parseInt(li.dataset.i);
      renderItem();
    };
  });
  if(!state.answered){
    document.getElementById('submitBtn').onclick = function(){
      if(state.selected===null) return;
      state.answered = true;
      const sc = loadScore();
      sc.total++; if(state.selected===item.a) sc.right++;
      saveScore(sc);
      renderItem();
    };
  } else {
    document.getElementById('nextBtn').onclick = advance;
  }
}

function renderEssay(item){
  const tag = item.tag ? '<div class="q-tag">'+t(item.tag)+'</div>' : '';
  let body = tag
    +'<div class="q-text">'+t(item.q)+'</div>'
    +'<textarea class="essay-input" id="essayInput" placeholder="'+t(UI.yourAnswer)+'"'+(state.answered?' disabled':'')+'>'+(state._essayDraft||'')+'</textarea>';
  if(state.answered){
    body += '<div class="model"><span class="label">'+t(UI.modelAnswer)+'</span>'+t(item.model)+'</div>';
    body += '<div class="self-grade">'
      +'<button class="btn ghost" id="rightBtn">'+t(UI.gotRight)+'</button>'
      +'<button class="btn ghost" id="reviewBtn">'+t(UI.needsReview)+'</button>'
      +'</div>';
  }
  let buttons = !state.answered ? '<button class="btn" id="showModelBtn">'+t(UI.showModel)+'</button>' : '';
  app.innerHTML = metaRow()+'<div class="card">'+body
    +'<div class="btn-row" style="margin-top:14px">'+buttons+'</div>'
    +progressDots()+'</div>';
  const input = document.getElementById('essayInput');
  if(input){ input.oninput = function(e){ state._essayDraft = e.target.value; }; }
  if(!state.answered){
    document.getElementById('showModelBtn').onclick = function(){
      state.answered = true; renderItem();
    };
  } else {
    document.getElementById('rightBtn').onclick = function(){
      const sc = loadScore(); sc.total++; sc.right++; saveScore(sc);
      state._essayDraft=''; advance();
    };
    document.getElementById('reviewBtn').onclick = function(){
      const sc = loadScore(); sc.total++; saveScore(sc);
      state._essayDraft=''; advance();
    };
  }
}

function renderFill(item){
  const tag = item.tag ? '<div class="q-tag">'+t(item.tag)+'</div>' : '';
  let explainHtml = '';
  if(state.answered){
    const v = (state._fillVal||'').trim().toLowerCase();
    const ok = item.answers.some(function(a){ return a.toLowerCase()===v; });
    explainHtml = '<div class="explain"><strong>'+(ok? t(UI.correct):t(UI.notQuite))+'</strong> '+t(item.explain||{en:'',id:''})+(ok?'':' <em>('+item.answers[0]+')</em>')+'</div>';
  }
  const nextLabel = state.index===bank.length-1? t(UI.concluding):t(UI.continueArr);
  app.innerHTML = metaRow()+'<div class="card">'+tag
    +'<div class="q-text">'+t(item.q)+'</div>'
    +'<input type="text" class="fill-input" id="fillInput" value="'+(state._fillVal||'')+'"'+(state.answered?' disabled':'')+' placeholder="'+t(UI.yourAnswer)+'">'
    +explainHtml
    +'<div class="btn-row">'
