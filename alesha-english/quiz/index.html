  {type:'mcq', tag:{en:'Rhetorical device',id:'Perangkat retorika'}, q:{en:'"We will not give up. We will not back down. We will not lose hope." Starting three sentences the same way on purpose has a name. What is it?', id:'"Kita tidak akan menyerah. Kita tidak akan mundur. Kita tidak akan hilang harapan." Memulai tiga kalimat dengan cara yang sama secara sengaja punya nama. Apa namanya?'}, options:[{en:'chiasmus',id:'kiasmus'},{en:'anaphora (repeating opening words like a drumbeat)',id:'anafora (mengulang kata pembuka seperti tabuhan drum)'},{en:'antithesis',id:'antitesis'},{en:'understatement',id:'litotes'}], a:1, explain:{en:'Anaphora is when a writer or speaker repeats the same opening words. It feels like a drumbeat. Speeches use it because it makes simple words feel powerful.', id:'Anafora adalah saat penulis atau pembicara mengulang kata pembuka yang sama. Terasa seperti tabuhan drum. Pidato sering memakainya karena membuat kata sederhana terasa kuat.'}},
  {type:'mcq', tag:{en:'Complex sentence',id:'Kalimat kompleks'}, q:{en:'A "complex" sentence has one part that CAN stand alone and another that CAN\'T. Which sentence is complex?', id:'Kalimat "kompleks" punya satu bagian yang BISA berdiri sendiri dan satu bagian yang TIDAK BISA. Kalimat mana yang kompleks?'}, options:[{en:'The puppy yipped, and the cat ran.',id:'The puppy yipped, and the cat ran.'},{en:'Although the puppy yipped, the cat didn\'t run.',id:'Although the puppy yipped, the cat didn\'t run.'},{en:'The puppy yipped.',id:'The puppy yipped.'},{en:'The puppy yipped; the cat ran.',id:'The puppy yipped; the cat ran.'}], a:1, explain:{en:'"Although the puppy yipped" can\'t stand alone (it leaves you hanging — although WHAT?). Pair it with a full sentence and you get a complex sentence.', id:'"Although the puppy yipped" tak bisa berdiri sendiri (kamu jadi penasaran — although APA?). Pasangkan dengan kalimat lengkap, jadilah kalimat kompleks.'}},
  {type:'mcq', tag:{en:'Apostrophes',id:'Apostrof'}, q:{en:'Whose books are these? They belong to several children. Choose the correct sentence.', id:'Buku siapa ini? Buku itu milik beberapa anak. Pilih kalimat yang benar.'}, options:[{en:'The childrens\' books are on the shelf.',id:'The childrens\' books are on the shelf.'},{en:'The children\'s books are on the shelf.',id:'The children\'s books are on the shelf.'},{en:'The childrens books are on the shelf.',id:'The childrens books are on the shelf.'},{en:'The childrens\'s books are on the shelf.',id:'The childrens\'s books are on the shelf.'}], a:1, explain:{en:'"Children" is already plural — you don\'t add an "s" to make it plural again. For ownership, just add \'s. So: children\'s. (Same trick: women\'s, men\'s, people\'s.)', id:'"Children" sudah jamak — kamu tak menambah "s" lagi. Untuk kepemilikan, cukup tambah \'s. Jadi: children\'s. (Trik sama: women\'s, men\'s, people\'s.)'}},
  {type:'mcq', tag:{en:'Trim the fluff!',id:'Pangkas yang bertele-tele!'}, q:{en:'Which version says the same thing in the cleanest, strongest way?', id:'Versi mana yang mengatakan hal yang sama dengan cara paling bersih dan kuat?'}, options:[{en:'Due to the fact that it was raining, we decided to make the decision to stay home.',id:'Due to the fact that it was raining, we decided to make the decision to stay home.'},{en:'Because it was raining, we stayed home.',id:'Because it was raining, we stayed home.'},{en:'On account of the rain happening, the decision was that we stayed.',id:'On account of the rain happening, the decision was that we stayed.'},{en:'It was the rain that caused us, in the end, to stay at home.',id:'It was the rain that caused us, in the end, to stay at home.'}], a:1, explain:{en:'Strong writing isn\'t fancy — it\'s clean. "Because it was raining, we stayed home" is six words. The others are bloated with extra puffy phrases.', id:'Tulisan kuat tidak harus mewah — yang penting bersih. "Because it was raining, we stayed home" hanya enam kata. Yang lain bengkak dengan frasa basa-basi.'}},
  {type:'mcq', tag:{en:'Active vs. passive voice',id:'Suara aktif vs pasif'}, q:{en:'Which sentence is in ACTIVE voice (the doer comes first)?', id:'Kalimat mana yang dalam suara AKTIF (pelakunya dulu)?'}, options:[{en:'The window was broken by the storm.',id:'The window was broken by the storm.'},{en:'The storm broke the window.',id:'The storm broke the window.'},{en:'The window had been broken.',id:'The window had been broken.'},{en:'It was the storm that broke the window.',id:'It was the storm that broke the window.'}], a:1, explain:{en:'Active voice = doer + action + thing. "The storm (doer) broke (action) the window (thing)." Passive flips it around and feels mushier.', id:'Suara aktif = pelaku + tindakan + objek. "The storm (pelaku) broke (tindakan) the window (objek)." Pasif membaliknya dan terasa lebih lemas.'}},
  {type:'mcq', tag:{en:'Tricky pronouns',id:'Pronomina rumit'}, q:{en:'Which sentence is grammatically correct? (Trick: try removing "you and" — does it still sound right?)', id:'Kalimat mana yang benar secara tata bahasa? (Trik: coba hilangkan "you and" — apa masih kedengaran benar?)'}, options:[{en:'Between you and I, the quiz was hard.',id:'Between you and I, the quiz was hard.'},{en:'Between you and me, the quiz was hard.',id:'Between you and me, the quiz was hard.'},{en:'Between yourself and I, the quiz was hard.',id:'Between yourself and I, the quiz was hard.'},{en:'Between we, the quiz was hard.',id:'Between we, the quiz was hard.'}], a:1, explain:{en:'After "between" we use "me," not "I." Quick test: you\'d never say "between I"! "I" is for doing things; "me" is for things being done to or about you.', id:'Setelah "between" kita pakai "me", bukan "I". Tes cepat: kamu tak akan pernah bilang "between I"! "I" untuk melakukan; "me" untuk dijadikan objek.'}},
  {type:'mcq', tag:{en:'Strong essay opening',id:'Pembuka esai yang kuat'}, q:{en:'You\'re writing an essay arguing that recess should be longer. Which opening sentence is the strongest?', id:'Kamu menulis esai argumen bahwa istirahat harus lebih lama. Kalimat pembuka mana yang paling kuat?'}, options:[{en:'In this essay, I am going to talk about recess.',id:'In this essay, I am going to talk about recess.'},{en:'Recess is an interesting time of the school day.',id:'Recess is an interesting time of the school day.'},{en:'Short recess breaks hurt kids\' focus more than long ones — and the science is clearer than most schools admit.',id:'Short recess breaks hurt kids\' focus more than long ones — and the science is clearer than most schools admit.'},{en:'Recess, recess, recess — what a topic!',id:'Recess, recess, recess — what a topic!'}], a:2, explain:{en:'A strong opening states the claim AND hints at why it matters. The others either announce themselves (boring), state nothing, or wave their arms.', id:'Pembuka kuat menyatakan klaim DAN menyentuh kenapa penting. Yang lain hanya mengumumkan diri (membosankan), tak menyatakan apa-apa, atau melambai tangan.'}},
  {type:'essay', tag:{en:'Your turn to argue!',id:'Giliranmu berargumen!'}, q:{en:'Write 150-200 words arguing whether kids should have at least 30 minutes of recess every school day. Pick a side and use ONE specific example (a kid you know, a real activity, a story from your own life).', id:'Tulis 150-200 kata berargumen apakah anak harus punya minimal 30 menit istirahat setiap hari sekolah. Pilih satu sisi dan pakai SATU contoh spesifik (anak yang kamu kenal, aktivitas nyata, kisah dari hidupmu).'}, model:{en:'Yes — every kid deserves at least 30 minutes of real recess every single day, because brains are not meant to sit still for hours. When you let kids run, climb, and shout for half an hour, two amazing things happen: bodies wake up, and friendships get built in ways no group project ever could. My friend Ayla used to dread math, but she made her best friend on the monkey bars at recess — and that friend turned out to be a math genius who helps her every day at lunch now. Math got easier because recess existed. Some teachers worry recess "wastes" learning time. But a tired, restless brain doesn\'t learn anyway. A short recess gets you a glassy, fidgety afternoon. A full recess gets you laughing kids who come back ready to think. If schools really want better test scores, they should stop cutting the one thing that actually helps: time outside, with friends, being a kid.', id:'Ya — setiap anak pantas mendapat minimal 30 menit istirahat sungguhan setiap hari, karena otak tidak dirancang untuk duduk diam berjam-jam. Saat kamu membiarkan anak berlari, memanjat, dan berteriak selama setengah jam, dua hal luar biasa terjadi: tubuhnya bangun, dan persahabatan terbentuk dengan cara yang tak pernah bisa dilakukan tugas kelompok. Temanku Ayla dulu takut pelajaran matematika, tapi ia bertemu sahabat terbaiknya di palang monyet saat istirahat — dan ternyata sahabat itu jago matematika yang sekarang membantunya tiap hari saat makan siang. Matematika jadi lebih mudah karena ada istirahat. Beberapa guru khawatir istirahat "membuang" waktu belajar. Tapi otak yang lelah dan gelisah memang tak bisa belajar. Istirahat pendek menghasilkan sore yang melamun dan tak fokus. Istirahat penuh menghasilkan anak-anak tertawa yang kembali siap berpikir. Kalau sekolah sungguh ingin nilai ujian lebih baik, mereka harus berhenti memotong satu hal yang benar-benar membantu: waktu di luar, bersama teman, menjadi anak.'}},
  {type:'essay', tag:{en:'Describe a place using your senses',id:'Gambarkan satu tempat dengan inderamu'}, q:{en:'Write 150-200 words describing your favourite hiding spot or cozy place from when you were younger — so vividly that the reader can almost see it. Use at least TWO senses (sight, sound, smell, taste, or touch) and ONE figure of speech (simile, metaphor, or personification).', id:'Tulis 150-200 kata menggambarkan tempat persembunyian atau tempat nyaman favoritmu saat kamu masih lebih kecil — sehingga pembaca hampir bisa melihatnya. Gunakan minimal DUA indera (lihat, dengar, cium, rasa, atau sentuh) dan SATU majas (simile, metafora, atau personifikasi).'}, model:{en:'My favourite hiding spot was the space under my grandmother\'s big wooden dining table, behind the long blue tablecloth that touched the floor. From outside it looked like just a piece of furniture, but underneath it was its own tiny country. The wood smelled like old beeswax and a little like lemon from the polish my grandma rubbed in every Sunday. When I held still, I could hear the giant grandfather clock in the hallway, ticking patiently like a heartbeat that belonged to the whole house. The blue tablecloth turned the light underneath into a soft, swimmy ocean colour, and dust drifted through it like tiny silver fish. I would bring three things every time: a book, a flashlight, and a banana. Up above, my whole noisy family lived their lives. Down below, the table was a friendly old whale who had swallowed me on purpose, just for an afternoon, just to give me somewhere quiet.', id:'Tempat persembunyianku yang paling kusuka adalah ruang di bawah meja makan kayu besar milik nenekku, di balik taplak biru panjang yang menyentuh lantai. Dari luar tampak hanya perabot, tapi di bawahnya ia adalah negaranya sendiri yang mungil. Kayunya berbau seperti lilin lebah tua dan sedikit lemon dari poles yang digosok nenek tiap Minggu. Saat aku diam, aku bisa mendengar jam dinding raksasa di lorong, berdetak sabar seperti detak jantung milik seluruh rumah. Taplak biru itu mengubah cahaya di bawahnya jadi warna laut yang lembut dan berenang-renang, dan debu melayang melewatinya seperti ikan-ikan perak mungil. Aku selalu membawa tiga hal: sebuah buku, senter, dan pisang. Di atas sana, seluruh keluargaku yang ribut menjalani harinya. Di bawah sini, meja itu adalah paus tua yang ramah, yang sengaja menelanku — hanya untuk satu sore, hanya untuk memberiku tempat yang sunyi.'}}
];

function setHeader(){
  const meta = TRACK_META[TRACK];
  document.getElementById('trackRoman').textContent = t(meta.roman);
  document.getElementById('trackTitle').textContent = t(meta.title);
  document.title = "Alesha's English Mastery — " + t(meta.title);
}

function renderIntro(){
  const meta = TRACK_META[TRACK];
  const progress = loadProgress();
  const labelEN = TRACK==='reading'?'passages':'exercises';
  const labelID = TRACK==='reading'?'bacaan':'latihan';
  const progressLabel = LANG==='en' ? progress.length+' of '+bank.length+' '+labelEN+' completed' : progress.length+' dari '+bank.length+' '+labelID+' selesai';
  app.innerHTML = '<div class="card"><div class="intro">'
    +'<div class="roman">'+t(meta.roman)+'</div>'
    +'<h2>'+t(meta.title)+'</h2>'
    +'<div class="rule"></div>'
    +'<div class="desc">'+t(meta.desc)+'</div>'
    +'<div class="meta-row" style="justify-content:center;margin-bottom:18px"><span>'+progressLabel+'</span></div>'
    +'<div class="btn-row" style="justify-content:center">'
    +'<button class="btn" id="beginBtn">'+(progress.length>0 ? t(UI.continueArr) : t(UI.begin))+'</button>'
    +'</div></div></div>';
  document.getElementById('beginBtn').onclick = function(){
    const done = loadProgress();
    let next = bank.length;
    for(let i=0;i<bank.length;i++){ if(!done.includes(i)){ next=i; break; } }
    state.index = next;
    if(state.index >= bank.length){ renderDone(); return; }
    resetItemState();
    renderItem();
  };
}

function resetItemState(){
  state.answered=false; state.selected=null;
  state.subStep=0; state.subAnswered=false; state.subSelected=null;
  state.pairLeftSel=null; state.pairsMatched=[]; state.pairsWrong=[];
}

function progressDots(){
  const done = loadProgress();
  let html = '<div class="dots">';
  for(let i=0;i<bank.length;i++){
    let cls = 'dot';
    if(done.includes(i)) cls+=' done';
    if(i===state.index) cls+=' current';
    html += '<span class="'+cls+'"></span>';
  }
  html += '</div>';
  return html;
}

function metaRow(){
  const labelEN = TRACK==='reading'?'Passage':'Question';
  const labelID = TRACK==='reading'?'Bacaan':'Pertanyaan';
  const label = LANG==='en'?labelEN:labelID;
  return '<div class="meta-row"><span>'+label+' '+(state.index+1)+' '+t(UI.ofShort)+' '+bank.length+'</span><span>'+t(TRACK_META[TRACK].roman)+'</span></div>';
}

function renderItem(){
  const item = bank[state.index];
  if(item.type==='scenario') return renderScenario(item);
  if(item.type==='mcq') return renderMCQ(item);
  if(item.type==='essay') return renderEssay(item);
  if(item.type==='fill') return renderFill(item);
  if(item.type==='match_pairs') return renderPairs(item);
}

function renderMCQ(item){
  const tag = item.tag ? '<div class="q-tag">'+t(item.tag)+'</div>' : '';
  let opts = '';
  item.options.forEach(function(opt,i){
    let cls = '';
    if(state.answered){
      if(i===item.a) cls=' correct disabled';
      else if(i===state.selected) cls=' wrong disabled';
      else cls=' disabled';
    } else if(state.selected===i) cls=' selected';
    const letter = String.fromCharCode(65+i);
    opts += '<li class="'+cls+'" data-i="'+i+'"><span class="letter">'+letter+'.</span>'+t(opt)+'</li>';
  });
  let explainHtml = '';
  if(state.answered){
    const correct = state.selected===item.a;
    explainHtml = '<div class="explain"><strong>'+(correct? t(UI.correct):t(UI.notQuite))+'</strong> '+t(item.explain||{en:'',id:''})+'</div>';
  }
  const nextLabel = state.index===bank.length-1? t(UI.concluding) : t(UI.continueArr);
  app.innerHTML = metaRow()+'<div class="card">'+tag
    +'<div class="q-text">'+t(item.q)+'</div>'
    +'<ul class="options">'+opts+'</ul>'
    +explainHtml
    +'<div class="btn-row">'
    +(state.answered
      ? '<button class="btn" id="nextBtn">'+nextLabel+'</button>'
      : '<button class="btn" id="submitBtn"'+(state.selected===null?' disabled':'')+'>'+t(UI.submit)+'</button>')
    +'</div>'+progressDots()+'</div>';
  document.querySelectorAll('.options li').forEach(function(li){
    li.onclick = function(){
      if(state.answered) return;
      state.selected = parseInt(li.dataset.i);
      renderItem();
    };
  });
  if(!state.answered){
    document.getElementById('submitBtn').onclick = function(){
      if(state.selected===null) return;
      state.answered = true;
      const sc = loadScore();
      sc.total++; if(state.selected===item.a) sc.right++;
      saveScore(sc);
      renderItem();
    };
  } else {
    document.getElementById('nextBtn').onclick = advance;
  }
}

function renderEssay(item){
  const tag = item.tag ? '<div class="q-tag">'+t(item.tag)+'</div>' : '';
  let body = tag
    +'<div class="q-text">'+t(item.q)+'</div>'
    +'<textarea class="essay-input" id="essayInput" placeholder="'+t(UI.yourAnswer)+'"'+(state.answered?' disabled':'')+'>'+(state._essayDraft||'')+'</textarea>';
  if(state.answered){
    body += '<div class="model"><span class="label">'+t(UI.modelAnswer)+'</span>'+t(item.model)+'</div>';
    body += '<div class="self-grade">'
      +'<button class="btn ghost" id="rightBtn">'+t(UI.gotRight)+'</button>'
      +'<button class="btn ghost" id="reviewBtn">'+t(UI.needsReview)+'</button>'
      +'</div>';
  }
  let buttons = !state.answered ? '<button class="btn" id="showModelBtn">'+t(UI.showModel)+'</button>' : '';
  app.innerHTML = metaRow()+'<div class="card">'+body
    +'<div class="btn-row" style="margin-top:14px">'+buttons+'</div>'
    +progressDots()+'</div>';
  const input = document.getElementById('essayInput');
  if(input){ input.oninput = function(e){ state._essayDraft = e.target.value; }; }
  if(!state.answered){
    document.getElementById('showModelBtn').onclick = function(){
      state.answered = true; renderItem();
    };
  } else {
    document.getElementById('rightBtn').onclick = function(){
      const sc = loadScore(); sc.total++; sc.right++; saveScore(sc);
      state._essayDraft=''; advance();
    };
    document.getElementById('reviewBtn').onclick = function(){
      const sc = loadScore(); sc.total++; saveScore(sc);
      state._essayDraft=''; advance();
    };
  }
}

function renderFill(item){
  const tag = item.tag ? '<div class="q-tag">'+t(item.tag)+'</div>' : '';
  let explainHtml = '';
  if(state.answered){
    const v = (state._fillVal||'').trim().toLowerCase();
    const ok = item.answers.some(function(a){ return a.toLowerCase()===v; });
    explainHtml = '<div class="explain"><strong>'+(ok? t(UI.correct):t(UI.notQuite))+'</strong> '+t(item.explain||{en:'',id:''})+(ok?'':' <em>('+item.answers[0]+')</em>')+'</div>';
  }
  const nextLabel = state.index===bank.length-1? t(UI.concluding):t(UI.continueArr);
  app.innerHTML = metaRow()+'<div class="card">'+tag
    +'<div class="q-text">'+t(item.q)+'</div>'
    +'<input type="text" class="fill-input" id="fillInput" value="'+(state._fillVal||'')+'"'+(state.answered?' disabled':'')+' placeholder="'+t(UI.yourAnswer)+'">'
    +explainHtml
    +'<div class="btn-row">'
    +(state.answered
      ? '<button class="btn" id="nextBtn">'+nextLabel+'</button>'
      : '<button class="btn" id="submitBtn">'+t(UI.submit)+'</button>')
    +'</div>'+progressDots()+'</div>';
  const input = document.getElementById('fillInput');
  if(input){ input.oninput = function(e){ state._fillVal = e.target.value; }; }
  if(!state.answered){
    document.getElementById('submitBtn').onclick = function(){
      if(!(state._fillVal||'').trim()) return;
      state.answered = true;
      const v = state._fillVal.trim().toLowerCase();
      const ok = item.answers.some(function(a){ return a.toLowerCase()===v; });
      const sc = loadScore(); sc.total++; if(ok) sc.right++; saveScore(sc);
      renderItem();
    };
  } else {
    document.getElementById('nextBtn').onclick = function(){ state._fillVal=''; advance(); };
  }
}

function renderPairs(item){
  const tag = item.tag ? '<div class="q-tag">'+t(item.tag)+'</div>' : '';
  let leftHtml = '<div class="pair-col"><div class="label">A</div>';
  item.left.forEach(function(L,i){
    let cls = 'pair-item';
    if(state.pairsMatched.some(function(m){return m[0]===i;})) cls+=' matched';
    else if(state.pairLeftSel===i) cls+=' selected';
    leftHtml += '<div class="'+cls+'" data-side="L" data-i="'+i+'">'+t(L)+'</div>';
  });
  leftHtml += '</div>';
  let rightHtml = '<div class="pair-col"><div class="label">B</div>';
  item.right.forEach(function(R,i){
    let cls = 'pair-item';
    if(state.pairsMatched.some(function(m){return m[1]===i;})) cls+=' matched';
    else if(state.pairsWrong.includes(i)) cls+=' wrong';
    rightHtml += '<div class="'+cls+'" data-side="R" data-i="'+i+'">'+t(R)+'</div>';
  });
  rightHtml += '</div>';
  const allDone = state.pairsMatched.length===item.left.length;
  let explainHtml = '';
  if(allDone){
    explainHtml = '<div class="explain"><strong>'+t(UI.correct)+'</strong> '+t(item.explain||{en:'',id:''})+'</div>';
  }
  const nextLabel = state.index===bank.length-1? t(UI.concluding):t(UI.continueArr);
  app.innerHTML = metaRow()+'<div class="card">'+tag
    +'<div class="q-text">'+t(item.q)+'</div>'
    +'<div class="pairs">'+leftHtml+rightHtml+'</div>'
    +explainHtml
    +'<div class="btn-row">'+(allDone ? '<button class="btn" id="nextBtn">'+nextLabel+'</button>' : '')+'</div>'
    +progressDots()+'</div>';
  document.querySelectorAll('.pair-item').forEach(function(el){
    el.onclick = function(){
      if(el.classList.contains('matched')) return;
      const side = el.dataset.side, i = parseInt(el.dataset.i);
      if(side==='L'){
        state.pairLeftSel = i;
        state.pairsWrong = [];
        renderPairs(item);
      } else {
        if(state.pairLeftSel===null) return;
        const target = item.pairs.find(function(p){return p[0]===state.pairLeftSel;});
        if(target && target[1]===i){
          state.pairsMatched.push([state.pairLeftSel, i]);
          state.pairLeftSel = null;
          state.pairsWrong = [];
          if(state.pairsMatched.length===item.left.length){
            const sc = loadScore(); sc.total++; sc.right++; saveScore(sc);
          }
        } else {
          state.pairsWrong = [i];
        }
        renderPairs(item);
      }
    };
  });
  if(allDone){
    document.getElementById('nextBtn').onclick = advance;
  }
}

function renderScenario(item){
  const sub = item.subs[state.subStep];
  const passageHtml = '<div class="passage">'+t(item.passage)+'<span class="src">— '+t(item.sourceNote)+'</span></div>';
  const subHead = '<div class="sub-head">'+(LANG==='en'?'Part':'Bagian')+' '+(state.subStep+1)+' '+t(UI.ofShort)+' '+item.subs.length+' · '+t(item.title)+'</div>';

  if(sub.type==='mcq'){
    let opts='';
    sub.options.forEach(function(opt,i){
      let cls='';
      if(state.subAnswered){
        if(i===sub.a) cls=' correct disabled';
        else if(i===state.subSelected) cls=' wrong disabled';
        else cls=' disabled';
      } else if(state.subSelected===i) cls=' selected';
      const letter = String.fromCharCode(65+i);
      opts += '<li class="'+cls+'" data-i="'+i+'"><span class="letter">'+letter+'.</span>'+t(opt)+'</li>';
    });
    let explainHtml='';
    if(state.subAnswered){
      const ok = state.subSelected===sub.a;
      explainHtml = '<div class="explain"><strong>'+(ok? t(UI.correct):t(UI.notQuite))+'</strong> '+t(sub.explain||{en:'',id:''})+'</div>';
    }
    const isLastSub = state.subStep===item.subs.length-1;
    const isLastItem = state.index===bank.length-1;
    const nextLabel = (isLastSub && isLastItem) ? t(UI.concluding) : t(UI.continueArr);
    app.innerHTML = metaRow()+'<div class="card">'
      +passageHtml
      +subHead
      +'<div class="q-text">'+t(sub.q)+'</div>'
      +'<ul class="options">'+opts+'</ul>'
      +explainHtml
      +'<div class="btn-row">'
      +(state.subAnswered
        ? '<button class="btn" id="nextBtn">'+nextLabel+'</button>'
        : '<button class="btn" id="submitBtn"'+(state.subSelected===null?' disabled':'')+'>'+t(UI.submit)+'</button>')
      +'</div>'+progressDots()+'</div>';
    document.querySelectorAll('.options li').forEach(function(li){
      li.onclick = function(){
        if(state.subAnswered) return;
        state.subSelected = parseInt(li.dataset.i);
        renderItem();
      };
    });
    if(!state.subAnswered){
      document.getElementById('submitBtn').onclick = function(){
        if(state.subSelected===null) return;
        state.subAnswered = true;
        const sc = loadScore(); sc.total++; if(state.subSelected===sub.a) sc.right++; saveScore(sc);
        renderItem();
      };
    } else {
      document.getElementById('nextBtn').onclick = function(){ nextSubOrAdvance(item); };
    }
  } else if(sub.type==='essay'){
    let body = passageHtml+subHead
      +'<div class="q-text">'+t(sub.q)+'</div>'
      +'<textarea class="essay-input" id="essayInput" placeholder="'+t(UI.yourAnswer)+'"'+(state.subAnswered?' disabled':'')+'>'+(state._essayDraft||'')+'</textarea>';
    if(state.subAnswered){
      body += '<div class="model"><span class="label">'+t(UI.modelAnswer)+'</span>'+t(sub.model)+'</div>';
      body += '<div class="self-grade">'
        +'<button class="btn ghost" id="rightBtn">'+t(UI.gotRight)+'</button>'
        +'<button class="btn ghost" id="reviewBtn">'+t(UI.needsReview)+'</button>'
        +'</div>';
    }
    let buttons = !state.subAnswered ? '<button class="btn" id="showModelBtn">'+t(UI.showModel)+'</button>' : '';
    app.innerHTML = metaRow()+'<div class="card">'+body
      +'<div class="btn-row" style="margin-top:14px">'+buttons+'</div>'
      +progressDots()+'</div>';
    const input = document.getElementById('essayInput');
    if(input){ input.oninput = function(e){ state._essayDraft = e.target.value; }; }
    if(!state.subAnswered){
      document.getElementById('showModelBtn').onclick = function(){
        state.subAnswered = true; renderItem();
      };
    } else {
      document.getElementById('rightBtn').onclick = function(){
        const sc = loadScore(); sc.total++; sc.right++; saveScore(sc);
        state._essayDraft=''; nextSubOrAdvance(item);
      };
      document.getElementById('reviewBtn').onclick = function(){
        const sc = loadScore(); sc.total++; saveScore(sc);
        state._essayDraft=''; nextSubOrAdvance(item);
      };
    }
  }
}

function nextSubOrAdvance(item){
  if(state.subStep < item.subs.length-1){
    state.subStep++; state.subAnswered=false; state.subSelected=null;
    renderItem();
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    advance();
  }
}

function advance(){
  const prog = loadProgress();
  if(!prog.includes(state.index)) prog.push(state.index);
  saveProgress(prog);
  state.index++;
  resetItemState();
  if(state.index >= bank.length){
    renderDone();
  } else {
    renderItem();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

function renderDone(){
  const meta = TRACK_META[TRACK];
  const sc = loadScore();
  const pct = sc.total ? Math.round(100*sc.right/sc.total) : 0;
  let verdictEN, verdictID, reviewEN, reviewID;
  if(pct>=80){
    verdictEN = 'Strong command of '+t(meta.skill)+'.';
    verdictID = 'Penguasaan kuat pada '+t(meta.skill)+'.';
    reviewEN = 'You read with precision. To deepen, revisit the few items you missed and rewrite each question stem in your own words. The next horizon is to articulate not just the right answer but why each wrong answer is wrong.';
    reviewID = 'Kamu membaca dengan ketelitian. Untuk memperdalam, tinjau ulang item yang salah dan tulis ulang inti pertanyaan dengan kata-katamu. Cakrawala berikutnya adalah menjelaskan bukan hanya jawaban benar, tetapi juga mengapa tiap pilihan salah itu salah.';
  } else if(pct>=55){
    verdictEN = 'Solid command of '+t(meta.skill)+'.';
    verdictID = 'Penguasaan solid pada '+t(meta.skill)+'.';
    reviewEN = 'You have the foundation. Return to the items marked for review, write down the trap you fell for, and read one of the recommended books this week. Mastery comes from reflective re-attempts, not from fresh practice alone.';
    reviewID = 'Kamu punya fondasi. Kembali ke item yang ditandai untuk diulas, catat jebakan yang menjeratmu, dan baca satu buku dari daftar pekan ini. Penguasaan datang dari mencoba ulang dengan refleksi, bukan sekadar latihan baru.';
  } else {
    verdictEN = 'Developing command of '+t(meta.skill)+'.';
    verdictID = 'Penguasaan yang sedang berkembang pada '+t(meta.skill)+'.';
    reviewEN = 'Reset, slow down, and treat each question as a small essay. Read the prompt twice before reading the options. The track will be waiting; restart it after a week of reading and notice how much further you have moved.';
    reviewID = 'Mulai ulang, perlambat, dan perlakukan tiap soal sebagai esai kecil. Baca prompt dua kali sebelum membaca pilihan. Trek ini akan menunggu; ulangi setelah sepekan membaca dan lihat seberapa jauh kamu telah bergerak.';
  }
  const verdict = LANG==='en'?verdictEN:verdictID;
  const review = LANG==='en'?reviewEN:reviewID;
  app.innerHTML = '<div class="card"><div class="done">'
    +'<div class="roman">'+t(UI.conclusionOf)+' '+t(meta.roman)+'</div>'
    +'<h2>'+t(meta.title)+'</h2>'
    +'<div class="rule"></div>'
    +'<div class="score">'+t(UI.youAnswered)+' <strong>'+sc.right+'</strong> '+t(UI.ofShort2)+' <strong>'+sc.total+'</strong> '+t(UI.correctly)+' (<strong>'+pct+'%</strong>).</div>'
    +'<div class="verdict">'+verdict+'</div>'
    +'<div class="review">'+review+'</div>'
    +'<div class="btn-row" style="justify-content:center">'
    +'<a class="btn ghost" href="../">'+t(UI.returnLanding)+'</a>'
    +'<button class="btn crimson" id="restartBtn">'+t(UI.restart)+'</button>'
    +'</div></div></div>';
  document.getElementById('restartBtn').onclick = function(){
    localStorage.removeItem(PROGRESS_KEY);
    localStorage.removeItem(SCORE_KEY);
    state.index = 0;
    resetItemState();
    renderIntro();
  };
}

document.getElementById('langToggle').onclick = function(){
  LANG = LANG==='en'?'id':'en';
  localStorage.setItem(LANG_KEY, LANG);
  setHeader();
  if(state.index >= bank.length){ renderDone(); return; }
  if(document.querySelector('.intro')){ renderIntro(); return; }
  renderItem();
};

setHeader();
renderIntro();
</script>

</body>
</html>
