<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alesha's English Library — Practice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#f5f3ff 0%,#ecfeff 100%);min-height:100vh;display:flex;flex-direction:column;color:#1a1a2e}

/* Header */
.hdr{background:linear-gradient(135deg,#a78bfa 0%,#ec4899 30%,#06b6d4 70%,#8b5cf6 100%);color:#fff;padding:14px 18px;position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-back{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:18px;font-size:.78rem;font-weight:800;text-decoration:none}
.hdr-back:hover{background:rgba(255,255,255,.28)}
.hdr-title{font-size:1.1rem;font-weight:900;letter-spacing:-.3px;flex:1}
.hdr-meta{font-size:.78rem;font-weight:700;opacity:.95;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:16px}

/* Progress bar */
.progress-wrap{background:#fff;padding:10px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.progress{display:flex;gap:4px;align-items:center}
.progress-bar{flex:1;height:8px;background:#ede9fe;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#06b6d4);border-radius:5px;transition:width .35s ease}
.progress-text{font-size:.78rem;font-weight:800;color:#7c3aed;min-width:75px;text-align:right}

/* Score chips */
.score-row{display:flex;gap:10px;margin:14px auto 0;max-width:760px;padding:0 16px;flex-wrap:wrap}
.score-chip{flex:1;min-width:0;background:#fff;border-radius:14px;padding:10px 12px;text-align:center;border:1.5px solid #e8ecef;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#666}
.score-chip strong{display:block;font-size:1.3rem;letter-spacing:-.5px;margin-bottom:2px;color:#1a1a2e;text-transform:none}
.score-chip.correct{border-color:#06b6d4;background:#ecfeff}
.score-chip.correct strong{color:#0891b2}
.score-chip.wrong{border-color:#f43f5e;background:#fff5f5}
.score-chip.wrong strong{color:#e11d48}
.score-chip.answered{border-color:#a78bfa;background:#f5f3ff}
.score-chip.answered strong{color:#7c3aed}

/* Main quiz container */
.main{max-width:760px;margin:18px auto 0;padding:0 16px 80px;width:100%}
.q-card{background:#fff;border-radius:24px;padding:30px 26px 24px;box-shadow:0 8px 32px rgba(167,139,250,.16)}
.q-badge{display:inline-block;background:#ede9fe;color:#7c3aed;font-size:.7rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:14px;margin-bottom:14px}
.q-badge.mcq{background:#e0e7ff;color:#4338ca}
.q-badge.tf{background:#ffedd5;color:#c2410c}
.q-badge.fill{background:#ede9fe;color:#6d28d9}
.q-badge.essay{background:#cffafe;color:#0e7490}
.q-badge.fill_bank{background:#fce7f3;color:#be185d}
.q-badge.multi_check{background:#dbeafe;color:#1e40af}
.q-badge.scenario{background:#fef3c7;color:#92400e}

/* Word bank chips */
.bank-wrap{background:#fffbeb;border:1.5px solid #f59e0b;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.bank-title{font-size:.72rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#92400e;margin-bottom:8px}
.bank-chips{display:flex;flex-wrap:wrap;gap:6px}
.bank-chip{background:#fff;border:1.5px solid #f59e0b;color:#7c2d12;padding:6px 12px;border-radius:14px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.bank-chip:hover:not(:disabled){background:#fef3c7;transform:translateY(-1px)}
.bank-chip:disabled{cursor:not-allowed;opacity:.5}

/* Multi-check */
.mc-instr{font-size:.85rem;color:#666;font-weight:700;margin-bottom:8px}
.mc-opt{background:#fff;border:2px solid #e8ecef;border-radius:14px;padding:12px 16px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;gap:12px;transition:all .15s;font-family:inherit;text-align:left;width:100%;color:inherit;margin-bottom:8px}
.mc-opt:hover:not(.locked){border-color:#1e40af;background:#dbeafe}
.mc-box{width:24px;height:24px;border-radius:6px;border:2px solid #c0c8d0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900;color:#fff;background:#fff}
.mc-opt.checked .mc-box{background:#1e40af;border-color:#1e40af}
.mc-opt.checked .mc-box::after{content:'✓'}
.mc-opt.correct{border-color:#06b6d4;background:#ecfeff}
.mc-opt.correct .mc-box{background:#06b6d4;border-color:#06b6d4}
.mc-opt.correct .mc-box::after{content:'✓'}
.mc-opt.wrong{border-color:#f43f5e;background:#fff5f5}
.mc-opt.wrong .mc-box{background:#f43f5e;border-color:#f43f5e}
.mc-opt.wrong .mc-box::after{content:'✗'}
.mc-opt.missed{border-color:#f59e0b;background:#fffbeb}
.mc-opt.missed .mc-box{background:#f59e0b;border-color:#f59e0b}
.mc-opt.missed .mc-box::after{content:'!'}
.mc-opt.locked{cursor:not-allowed}

/* Scenario */
.scenario-part{background:#faf5ff;border-left:4px solid #a78bfa;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.scenario-part-label{font-size:.78rem;font-weight:900;color:#7c3aed;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.scenario-part-q{font-size:.96rem;line-height:1.5;margin-bottom:10px;font-weight:600}
.scenario-part .opts{margin-top:6px}
.scenario-part .opt{padding:10px 14px;font-size:.9rem}
.scenario-part .fill-row{margin-top:4px}
.scenario-part .essay-area{min-height:70px}
.scenario-part-result{margin-top:8px;font-size:.86rem;font-weight:700;padding:6px 10px;border-radius:8px;display:none}
.scenario-part-result.show{display:inline-block}
.scenario-part-result.ok{background:#ecfeff;color:#0e7490}
.scenario-part-result.bad{background:#fff5f5;color:#e11d48}
.scenario-check-all{background:linear-gradient(135deg,#a78bfa,#06b6d4);color:#fff;border:none;border-radius:14px;padding:12px 24px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;width:100%;margin-top:6px}
.scenario-check-all:hover:not(:disabled){opacity:.9}
.scenario-check-all:disabled{cursor:not-allowed;opacity:.5}

.q-text{font-size:1.05rem;line-height:1.6;background:#f5f3ff;border-left:4px solid #a78bfa;padding:14px 18px;border-radius:8px;margin-bottom:18px}
.q-text strong{font-weight:800}
.passage-box{background:#fdfaff;border:1.5px solid #ddd6fe;border-radius:14px;padding:16px 20px;margin-bottom:18px;font-size:.95rem;line-height:1.65;color:#3b2461;font-style:italic}
.passage-box .passage-label{display:block;font-style:normal;font-size:.7rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#7c3aed;margin-bottom:8px}

/* MCQ options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid #e8ecef;border-radius:14px;padding:14px 18px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;gap:14px;transition:all .15s;font-family:inherit;text-align:left;width:100%;color:inherit}
.opt:hover:not(:disabled){border-color:#a78bfa;background:#f5f3ff}
.opt-letter{width:30px;height:30px;border-radius:50%;background:#ede9fe;color:#7c3aed;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.opt:disabled{cursor:not-allowed}
.opt.correct{border-color:#06b6d4;background:#ecfeff}
.opt.correct .opt-letter{background:#06b6d4;color:#fff}
.opt.wrong{border-color:#f43f5e;background:#fff5f5}
.opt.wrong .opt-letter{background:#f43f5e;color:#fff}

/* True/False */
.tf-row{display:flex;gap:12px}
.tf-btn{flex:1;background:#fff;border:2px solid #e8ecef;border-radius:14px;padding:20px 16px;cursor:pointer;font-size:1.1rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .15s;font-family:inherit;color:inherit}
.tf-btn:hover:not(:disabled){transform:translateY(-2px);border-color:#a78bfa}
.tf-btn.true{color:#0891b2}
.tf-btn.false{color:#e11d48}
.tf-btn:disabled{cursor:not-allowed;opacity:.7}
.tf-btn.correct{border-color:#06b6d4;background:#ecfeff}
.tf-btn.wrong{border-color:#f43f5e;background:#fff5f5}
.tf-icon{font-size:1.4rem}

/* Fill */
.fill-row{display:flex;gap:10px;align-items:stretch}
.fill-input{flex:1;font-family:inherit;font-size:1rem;font-weight:700;padding:14px 18px;border:2px dashed #a78bfa;border-radius:14px;background:#faf9ff;color:#1a1a2e;outline:none}
.fill-input:focus{border-style:solid;border-color:#7c3aed;background:#fff;box-shadow:0 0 0 3px rgba(167,139,250,.2)}
.fill-input:disabled{opacity:.85;background:#f8f9fb}
.fill-submit{background:linear-gradient(135deg,#a78bfa,#06b6d4);color:#fff;border:none;border-radius:14px;padding:0 24px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.fill-submit:hover:not(:disabled){opacity:.88}
.fill-submit:disabled{cursor:not-allowed;opacity:.5}

/* Essay */
.essay-area{width:100%;font-family:inherit;font-size:.95rem;padding:14px 16px;border:2px dashed #a78bfa;border-radius:14px;background:#faf9ff;color:#1a1a2e;outline:none;resize:vertical;min-height:110px;line-height:1.5}
.essay-area:focus{border-style:solid;border-color:#7c3aed;background:#fff;box-shadow:0 0 0 3px rgba(167,139,250,.2)}
.essay-area:disabled{opacity:.85;background:#f8f9fb}
.essay-show{margin-top:12px;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border:none;border-radius:14px;padding:11px 22px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s}
.essay-show:hover:not(:disabled){opacity:.88}
.essay-self{display:none;gap:10px;margin-top:12px}
.essay-self.show{display:flex}
.essay-self button{flex:1;border:2px solid;border-radius:14px;padding:12px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;background:#fff}
.essay-self .got{border-color:#06b6d4;color:#0891b2}
.essay-self .got:hover{background:#ecfeff}
.essay-self .miss{border-color:#e11d48;color:#e11d48}
.essay-self .miss:hover{background:#fff5f5}

/* Feedback */
.fb{border-radius:14px;padding:16px 18px;margin-top:16px;font-size:.92rem;line-height:1.6;display:none}
.fb.show{display:block}
.fb.correct{background:#ecfeff;border:1.5px solid #06b6d4;color:#0e4f60}
.fb.wrong{background:#fff5f5;border:1.5px solid #f43f5e;color:#9f1239}
.fb.info{background:#f5f3ff;border:1.5px solid #a78bfa;color:#5b21b6}
.fb strong{font-weight:900}
.steps{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.step-num{width:22px;height:22px;border-radius:50%;background:#a78bfa;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0}
.concept-box{margin-top:12px;background:#fffbeb;border:1.5px solid #f59e0b;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#7c2d12}

/* Hint */
.hint-row{margin-top:14px}
.hint-btn{background:transparent;border:1.5px dashed #f59e0b;color:#92400e;font-family:inherit;font-size:.85rem;font-weight:800;padding:8px 16px;border-radius:14px;cursor:pointer}
.hint-btn:hover{background:#fffbeb}
.hint-box{display:none;background:#fffbeb;border:1.5px solid #f59e0b;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#7c2d12;margin-top:10px}
.hint-box.show{display:block}

/* Done */
.done{text-align:center;padding:40px 20px}
.done h2{font-size:2rem;font-weight:900;margin-bottom:10px;background:linear-gradient(135deg,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.done p{color:#666;margin-bottom:24px;line-height:1.6}
.done-stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.done-stat{text-align:center}
.done-stat strong{display:block;font-size:2.2rem;font-weight:900;color:#1a1a2e}
.done-stat span{font-size:.75rem;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:1px}
.restart-btn{background:linear-gradient(135deg,#a78bfa,#06b6d4);color:#fff;border:none;border-radius:24px;padding:14px 32px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(167,139,250,.4)}
.restart-btn:hover{opacity:.92}

/* Confetti */
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1000}

/* GAME UI */
.game-pill{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.45);border-radius:14px;padding:5px 11px;font-size:.75rem;font-weight:900;display:flex;align-items:center;gap:5px;color:#fff;white-space:nowrap}
.game-pill.streak{background:linear-gradient(135deg,rgba(251,146,60,.5),rgba(239,68,68,.5));animation:streakPulse 1.4s ease-in-out infinite}
@keyframes streakPulse{0%,100%{box-shadow:0 0 0 0 rgba(251,146,60,.6)}50%{box-shadow:0 0 0 6px rgba(251,146,60,0)}}
.xp-float{position:fixed;font-size:1.4rem;font-weight:900;color:#fbbf24;text-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none;z-index:9999;animation:xpFloat 1.4s ease-out forwards}
@keyframes xpFloat{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1;transform:translateY(-20px) scale(1.2)}100%{opacity:0;transform:translateY(-110px) scale(1)}}
.level-up-overlay{position:fixed;inset:0;background:radial-gradient(circle,rgba(251,191,36,.4),rgba(15,12,40,.92));display:flex;align-items:center;justify-content:center;z-index:9998;animation:fadeOverlay .4s ease}
@keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
.level-up-card{background:linear-gradient(135deg,#fbbf24,#ec4899,#8b5cf6);color:#fff;padding:36px 50px;border-radius:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:levelPop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes levelPop{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.level-up-card h2{font-size:2.4rem;font-weight:900;margin-bottom:10px;letter-spacing:-1px}
.level-up-card .big-lv{font-size:4.5rem;font-weight:900;line-height:1;margin:8px 0;text-shadow:0 4px 12px rgba(0,0,0,.3)}
.badge-toast{position:fixed;top:14px;right:14px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a2e;padding:12px 18px;border-radius:16px;font-weight:900;box-shadow:0 8px 24px rgba(251,191,36,.5);z-index:9997;display:flex;align-items:center;gap:10px;animation:badgeIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes badgeIn{from{transform:translateX(120%) scale(.7)}to{transform:translateX(0) scale(1)}}
.badge-toast .badge-icon{font-size:1.8rem}
.badge-toast .badge-text{font-size:.8rem}
.badge-toast .badge-text strong{display:block;font-size:.95rem}

/* SPEED GAME */
.speed-arena{text-align:center}
.speed-timer{font-size:4rem;font-weight:900;background:linear-gradient(135deg,#ec4899,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.speed-timer.warn{animation:timerWarn .5s ease-in-out infinite alternate}
@keyframes timerWarn{from{transform:scale(1)}to{transform:scale(1.08);filter:hue-rotate(-30deg)}}
.speed-score{font-size:1.1rem;font-weight:800;color:#7c3aed;margin:6px 0 18px}
.speed-shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* MATCH GAME */
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.match-card{aspect-ratio:1;background:linear-gradient(135deg,#a78bfa,#06b6d4);border-radius:14px;border:none;cursor:pointer;color:#fff;font-weight:800;font-size:.85rem;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:inherit;transition:transform .2s,opacity .2s;line-height:1.2}
.match-card.flipped{background:#fff;color:#1a1a2e;border:2.5px solid #a78bfa;box-shadow:0 4px 14px rgba(167,139,250,.3)}
.match-card.matched{background:linear-gradient(135deg,#06b6d4,#2dd4bf);color:#fff;border-color:transparent;opacity:.6;cursor:default}
.match-card:not(.matched):not(.flipped):hover{transform:scale(1.05)}
.match-card.shake{animation:shake .35s}
.match-hud{display:flex;justify-content:space-around;font-weight:900;font-size:1rem;margin-bottom:10px}
.match-hud span{color:#7c3aed}
@media(max-width:520px){.match-card{font-size:.72rem}}

/* BUILDER */
.builder-target{background:#fffbeb;border:2px dashed #f59e0b;border-radius:14px;padding:14px;min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.builder-bank{background:#f5f3ff;border:2px solid #a78bfa;border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:6px;min-height:64px;margin-bottom:12px}
.builder-chip{background:#fff;border:2px solid #a78bfa;color:#5b21b6;padding:8px 14px;border-radius:14px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.95rem;transition:transform .15s}
.builder-chip:hover{transform:translateY(-2px);background:#ede9fe}
.builder-chip.placed{background:#fef3c7;border-color:#f59e0b;color:#7c2d12}
.builder-label{font-size:.7rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#92400e;margin-bottom:6px}

@media(max-width:520px){
  .q-card{padding:22px 18px 18px}
  .q-text{font-size:.95rem;padding:12px 14px}
  .opt{padding:12px 14px;font-size:.9rem}
  .tf-btn{padding:16px 12px;font-size:1rem}
  .hdr-title{font-size:.95rem}
  .score-chip{font-size:.65rem;padding:8px}
  .score-chip strong{font-size:1.1rem}
  .fill-row{flex-direction:column}
  .fill-submit{padding:12px}
}
</style>
</head>
<body>

<div class="hdr">
  <a class="hdr-back" href="../">&larr; Map</a>
  <div class="hdr-title" id="hdrTitle">📖 English Practice</div>
  <div class="game-pill" id="lvlPill">Lv <span id="hLv">1</span></div>
  <div class="game-pill streak" id="streakPill" style="display:none">🔥 <span id="hStreak">0</span></div>
  <div class="game-pill" id="xpPill">⭐ <span id="hXp">0</span> XP</div>
  <div class="hdr-meta" id="hdrMeta">Question 1</div>
</div>

<div class="progress-wrap">
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <div class="progress-text" id="progText">0 / 0</div>
  </div>
</div>

<div class="score-row">
  <div class="score-chip correct"><strong id="sCorrect">0</strong><span>✓ Correct</span></div>
  <div class="score-chip wrong"><strong id="sWrong">0</strong><span>✗ Wrong</span></div>
  <div class="score-chip answered"><strong id="sDone">0</strong><span>📝 Answered</span></div>
</div>

<div class="main">
  <div id="quizSlot"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuf = a => { const c=[...a]; for(let i=c.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; } return c; };
const norm = s => String(s||'').trim().toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');

// MCQ shuffle helper
function mkOpts(correct, distractors){
  const all = [correct, ...distractors].slice(0,4);
  while(all.length<4) all.push('—');
  const sh = shuf(all);
  return { opts: sh, ans: sh.indexOf(correct) };
}

// ════════════════════════════════════════════════════════════════
// SAVE / GAMIFICATION
// ════════════════════════════════════════════════════════════════
const SAVE_KEY = 'alesha_save_v1';
const DEFAULT_SAVE = { xp:0, level:1, totalCorrect:0, totalAnswered:0, badges:[], dailyStreak:0, longestStreak:0, lastPlayDate:null, bestSpeedScore:0, bestMatchTime:0, worldsCompleted:[] };
function loadSave(){ try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return s?{...DEFAULT_SAVE,...s}:{...DEFAULT_SAVE};}catch(e){return {...DEFAULT_SAVE};} }
function saveSave(){ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }
function xpForLevel(n){ return (n*(n+1)/2)*100; }
function levelFromXp(xp){ let lv=1; while(xpForLevel(lv) <= xp) lv++; return lv; }
const SAVE = loadSave();
SAVE.level = levelFromXp(SAVE.xp);

let sessionCombo = 0;

function tickDailyStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(SAVE.lastPlayDate === today){ saveSave(); return; }
  if(!SAVE.lastPlayDate){ SAVE.dailyStreak = 1; }
  else {
    const diff = Math.round((new Date(today) - new Date(SAVE.lastPlayDate))/86400000);
    if(diff === 1) SAVE.dailyStreak++;
    else SAVE.dailyStreak = 1;
  }
  if(SAVE.dailyStreak > SAVE.longestStreak) SAVE.longestStreak = SAVE.dailyStreak;
  SAVE.lastPlayDate = today;
  if(SAVE.dailyStreak >= 3) unlockBadge('daily_3');
  if(SAVE.dailyStreak >= 7) unlockBadge('daily_7');
  if(SAVE.dailyStreak >= 30) unlockBadge('daily_30');
  saveSave();
}

function unlockBadge(id){
  if(SAVE.badges.includes(id)) return;
  SAVE.badges.push(id);
  saveSave();
  const meta = ({
    first_correct:{icon:'⭐',name:'First Star!'},
    streak_5:{icon:'🔥',name:'5 Combo!'},
    streak_10:{icon:'🌋',name:'10 Combo!'},
    perfect_chapter:{icon:'💯',name:'Perfect World!'},
    time_traveler:{icon:'⏳',name:'Time Traveler'},
    dreamer:{icon:'🌴',name:'Dreamer'},
    contrast_master:{icon:'🏰',name:'Contrast Master'},
    forest_explorer:{icon:'🌲',name:'Forest Explorer'},
    wordsmith:{icon:'💎',name:'Wordsmith'},
    inference_pro:{icon:'🔍',name:'Inference Pro'},
    daily_3:{icon:'📅',name:'3-Day Streak'},
    daily_7:{icon:'🗓️',name:'Week Warrior'},
    daily_30:{icon:'👑',name:'Monthly Hero'},
    speed_demon:{icon:'⚡',name:'Speed Demon'},
    memory_master:{icon:'🃏',name:'Memory Master'}
  })[id] || {icon:'🏆', name:id};
  const t = document.createElement('div');
  t.className = 'badge-toast';
  t.innerHTML = `<div class="badge-icon">${meta.icon}</div><div class="badge-text">Badge Unlocked!<strong>${meta.name}</strong></div>`;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='all .4s'; t.style.opacity='0'; t.style.transform='translateX(120%)'; setTimeout(()=>t.remove(),400); }, 2800);
}

function awardXp(base, isCorrect){
  if(!isCorrect){ sessionCombo = 0; updateHeaderGame(); return 0; }
  sessionCombo++;
  let mult = 1;
  if(sessionCombo >= 10) mult = 3;
  else if(sessionCombo >= 5) mult = 2;
  else if(sessionCombo >= 3) mult = 1.5;
  const gained = Math.round(base * mult);
  const prevLv = SAVE.level;
  SAVE.xp += gained;
  SAVE.totalCorrect++;
  SAVE.level = levelFromXp(SAVE.xp);
  if(SAVE.totalCorrect === 1) unlockBadge('first_correct');
  if(sessionCombo === 5) unlockBadge('streak_5');
  if(sessionCombo === 10) unlockBadge('streak_10');
  saveSave();
  showXpFloat(gained, mult);
  if(SAVE.level > prevLv) showLevelUp(SAVE.level);
  updateHeaderGame();
  return gained;
}

function showXpFloat(xp, mult){
  const f = document.createElement('div');
  f.className = 'xp-float';
  f.textContent = mult>1 ? `+${xp} XP ×${mult}!` : `+${xp} XP`;
  f.style.left = (window.innerWidth/2 - 50 + (Math.random()-0.5)*100) + 'px';
  f.style.top = (window.innerHeight/2) + 'px';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 1500);
}

function showLevelUp(lv){
  const o = document.createElement('div');
  o.className = 'level-up-overlay';
  o.innerHTML = `<div class="level-up-card"><h2>LEVEL UP!</h2><div class="big-lv">Lv ${lv}</div><p style="font-weight:800;letter-spacing:1px">You're getting stronger! 🚀</p></div>`;
  document.body.appendChild(o);
  for(let i=0;i<5;i++) setTimeout(goldConfetti, i*180);
  o.addEventListener('click', ()=>o.remove());
  setTimeout(()=>{ if(o.parentNode) o.remove(); }, 2800);
}

function updateHeaderGame(){
  const hLv = document.getElementById('hLv');
  const hXp = document.getElementById('hXp');
  const hStr = document.getElementById('hStreak');
  const strPill = document.getElementById('streakPill');
  if(hLv) hLv.textContent = SAVE.level;
  if(hXp) hXp.textContent = SAVE.xp;
  if(hStr) hStr.textContent = sessionCombo;
  if(strPill) strPill.style.display = sessionCombo >= 2 ? 'flex' : 'none';
}

function goldConfetti(){
  const colors=['#fbbf24','#f59e0b','#ec4899','#a78bfa','#06b6d4','#ffffff'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=pick(colors);
    c.style.left=(Math.random()*100)+'vw';
    c.style.top='-20px';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    c.style.borderRadius=Math.random()<0.5?'50%':'2px';
    c.style.width = (8 + Math.random()*8) + 'px';
    c.style.height = c.style.width;
    document.body.appendChild(c);
    const dx=(Math.random()-0.5)*400;
    const dur=1800+Math.random()*1200;
    c.animate([{transform:c.style.transform,opacity:1,top:'-20px'},
               {transform:`translate(${dx}px,${window.innerHeight+40}px) rotate(${Math.random()*1080}deg)`,opacity:0,top:`${window.innerHeight+40}px`}],
              {duration:dur,easing:'cubic-bezier(.3,.7,.4,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}

function vocabMCQ(word, sentence, correct, distractors, concept){
  const { opts, ans } = mkOpts(correct, distractors);
  return { type:'mcq', topic:'vocab_context',
    q:`Choose the closest meaning of <b>${word}</b>: "${sentence}"`,
    opts, ans,
    hint:'Use the other words in the sentence as clues.',
    concept: concept || 'Context clues help us guess the meaning of new words.',
    steps:[`Look at the sentence around "${word}".`,'Pick the option that matches the feeling of the sentence.',`Best match → <b>${correct}</b>.`]
  };
}

The cat tilted its head, hopped down, and began trotting beside me as if it had known me forever. I tried to shoo it gently, but it simply blinked and carried on, its tail high in the air. When I stopped, it stopped. When I sped up, it sped up.

By the time I reached my front gate, the cat sat down once more and waited. I bent down to scratch its ear, and a voice in my head — clear and friendly — said, "About time. We have a lot of work to do." I stared at the cat. The cat winked. And just like that, my ordinary afternoon turned into something else entirely.`),
  w_safe: () => writingPrompt(
    'Describe a place where you feel completely safe. Use all FIVE senses (sight, sound, smell, touch, taste).',

If I am lucky, Grandma slides a slice of warm apple cake across the table. The first bite is sweet and buttery, with a kiss of cinnamon at the end. In that kitchen, with the radio playing and Grandma humming along, nothing in the world feels scary. It is my safest, warmest, happiest place.`),
  w_bag: () => writingPrompt(
    'Write a story about finding something unexpected in your bag.',

My heart thumped. I glanced around the empty classroom, then back at the watch. One of the arrows was pointing straight at the library. I tucked the watch into my pocket, slung my bag over my shoulder, and tiptoed out — already certain that this would be the most unusual lunchtime of my life.`),
  w_super: () => writingPrompt(
    'Imagine you woke up with a superpower. Describe your day — from morning to night.',
    `I woke up with the strangest feeling in my fingertips, as if tiny sparks were jumping between them. When I reached for my alarm clock, the digital numbers froze, then began rolling backwards. I had the power to control time.

At breakfast, I stopped time to butter my toast perfectly without my little brother stealing a bite. At school, I paused the clock during a maths test just long enough to double-check one tricky question — but never longer, because that wouldn\'t be fair.

By the evening, I had used my power to help an old man cross the road safely, to rewind a moment when I accidentally said something unkind, and to give myself one extra hour to finish a book I loved. As I lay in bed, I decided that the best superpower isn\'t about doing big, flashy things — it\'s about using small moments to be kinder. Then I slowed time just a little, so I could enjoy falling asleep.`),
  w_helped: () => writingPrompt(

I hurried over with my own umbrella and held it above her head. "Let me help you with those bags," I said. At first she protested politely, but when I smiled, she handed one over with a relieved sigh. Together, we walked slowly down the street, chatting about her grandchildren and the cake she was planning to bake.

When we reached her front gate, she squeezed my hand and said, "You are very kind, dear. Thank you." Walking home alone afterwards, I felt warm inside despite the rain. I had only used ten minutes of my afternoon, but I realised that small acts of kindness can mean a lot to someone having a hard day.`)
};

// ════════════════════════════════════════════════════════════════
// CHAPTERS
// ════════════════════════════════════════════════════════════════
const CHAPTERS = {
  '1': { title:'⏳ Time Travel Tower', gen: CH1_GEN, badge:'time_traveler' },
  '2': { title:'🌴 Imagination Island', gen: CH2_GEN, badge:'dreamer' },
  '3': { title:'🏰 Contrast Castle', gen: CH3_GEN, badge:'contrast_master' },
  '4': { title:'🌲 Story Forest', gen: CH4_GEN, badge:'forest_explorer' },
  '5': { title:'💎 Vocab Cavern', gen: CH5_GEN, badge:'wordsmith' },
  '6': { title:'💬 Quotation Quarry', gen: CH6_GEN, badge:null },
  '7': { title:'🔍 Hidden Clue Caves', gen: CH7_GEN, badge:'inference_pro' },
  '8': { title:"✒️ Writer's Workshop", gen: CH8_GEN, badge:null }
};

const ALL_GENS = { ...CH1_GEN, ...CH2_GEN, ...CH3_GEN, ...CH4_GEN, ...CH5_GEN, ...CH6_GEN, ...CH7_GEN, ...CH8_GEN };

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let queue=[], current=null, idx=0, total=0;
let stats={correct:0, wrong:0, done:0};
let lastResult=null;
let currentChapterTitle=null;
let currentChapterKey=null;

function buildQueue(chKey){
  currentChapterKey = chKey;
  if(chKey === 'mix'){
    currentChapterTitle = '🎯 Cambridge Stage 5 Mix';
    const all = Object.keys(ALL_GENS);
    const picked = shuf(all).slice(0, 20);
    queue = picked.map(k => ALL_GENS[k]());
  } else {
    const ch = CHAPTERS[chKey] || CHAPTERS['1'];
    currentChapterTitle = ch.title;
    const keys = shuf(Object.keys(ch.gen));
    queue = keys.map(k => ch.gen[k]());
  }
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  sessionCombo = 0;
  tickDailyStreak();
  updateHeader();
  updateHeaderGame();
  updateScore();
  next();
}

function updateHeader(){
  document.getElementById('hdrTitle').textContent = currentChapterTitle || 'English Practice';
}

function updateScore(){
  document.getElementById('sCorrect').textContent = stats.correct;
  document.getElementById('sWrong').textContent = stats.wrong;
  document.getElementById('sDone').textContent = stats.done;
  const pct = total>0 ? (stats.done/total)*100 : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progText').textContent = `${stats.done} / ${total}`;
  document.getElementById('hdrMeta').textContent = 'Question ' + Math.min(idx+1, total) + ' of ' + total;
}

function next(){
  if(idx >= total){ renderDone(); return; }
  current = queue[idx];
  lastResult = null;
  renderQuestion();
  updateScore();
}

// ════════════════════════════════════════════════════════════════
// RENDERERS
// ════════════════════════════════════════════════════════════════
function renderQuestion(){
  const slot = document.getElementById('quizSlot');
  let inner = '';
  switch(current.type){
    case 'mcq':         inner = mcqHtml(current); break;
    case 'tf':          inner = tfHtml(current); break;
    case 'fill':        inner = fillHtml(current); break;
    case 'essay':       inner = essayHtml(current); break;
    case 'fill_bank':   inner = fillBankHtml(current); break;
    case 'multi_check': inner = multiCheckHtml(current); break;
    case 'scenario':    inner = scenarioHtml(current); break;
    case 'sentence_builder': inner = builderHtml(current); break;
  }
  slot.innerHTML = `<div class="q-card">${inner}</div>`;
  switch(current.type){
    case 'mcq':         attachMCQ(); break;
    case 'tf':          attachTF(); break;
    case 'fill':        attachFill(); break;
    case 'essay':       attachEssay(); break;
    case 'fill_bank':   attachFillBank(); break;
    case 'multi_check': attachMultiCheck(); break;
    case 'scenario':    attachScenario(); break;
    case 'sentence_builder': attachBuilder(); break;
  }
  attachHint();
}

function badgeFor(typ){
  const labels = {
    mcq:'📝 Multiple Choice', tf:'✅ True or False', fill:'📋 Fill in the Blank',
    essay:'📖 Short Answer', fill_bank:'🗂️ Word Bank Fill',
    multi_check:'☑️ Tick Multiple', scenario:'📚 Passage / Scenario',
    sentence_builder:'🧩 Sentence Puzzle'
  };
  return `<span class="q-badge ${typ}">${labels[typ]}</span>`;
}

// ── SENTENCE BUILDER ────────────────────────────────────────────
function builderHtml(q){
  const shuffled = shuf(q.words.map((w,i)=>({w,i})));
  current._builderShuffled = shuffled;
  const chips = shuffled.map((o,j)=>`<button type="button" class="builder-chip" data-orig="${o.i}" data-pos="${j}">${o.w}</button>`).join('');
  return `${badgeFor('sentence_builder')}<div class="q-text">${q.prompt}</div>
    <div class="builder-label">📝 Your sentence (click to remove)</div>
    <div class="builder-target" id="builderTarget"></div>
    <div class="builder-label">📦 Word bank (click to add)</div>
    <div class="builder-bank" id="builderBank">${chips}</div>
    <button class="fill-submit" id="builderCheck" style="width:100%;padding:14px">✓ Check Sentence</button>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachBuilder(){
  const bank = document.getElementById('builderBank');
  const tgt = document.getElementById('builderTarget');
  bank.addEventListener('click', e=>{
    const c = e.target.closest('.builder-chip');
    if(!c || c.disabled) return;
    if(c.parentNode === bank){ tgt.appendChild(c); c.classList.add('placed'); }
    else { bank.appendChild(c); c.classList.remove('placed'); }
  });
  tgt.addEventListener('click', e=>{
    const c = e.target.closest('.builder-chip');
    if(!c || c.disabled) return;
    bank.appendChild(c); c.classList.remove('placed');
  });
  document.getElementById('builderCheck').addEventListener('click', ()=>{
    const built = Array.from(tgt.querySelectorAll('.builder-chip')).map(c=>c.textContent).join(' ').trim();
    const ok = norm(built) === norm(current.answer);
    checkAnswer(ok, ()=>{
      tgt.querySelectorAll('.builder-chip').forEach(c=>c.disabled=true);
      bank.querySelectorAll('.builder-chip').forEach(c=>c.disabled=true);
      document.getElementById('builderCheck').disabled = true;
    });
  });
}

function hintBlock(q){
  if(!q.hint) return '';
  return `<div class="hint-row">
    <button class="hint-btn" id="hintBtn">💡 Show Hint</button>
    <div class="hint-box" id="hintBox">${q.hint}</div>
  </div>`;
}

function feedbackBlock(){ return `<div class="fb" id="fb"></div>`; }

// ── MCQ ─────────────────────────────────────────────────────────
function mcqHtml(q){
  const letters=['A','B','C','D'];
  const opts = q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="opt-letter">${letters[i]}</span><span>${o}</span></button>`).join('');
  return `${badgeFor('mcq')}<div class="q-text">${q.q}</div><div class="opts">${opts}</div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachMCQ(){
  document.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = parseInt(b.dataset.i);
      checkAnswer(i === current.ans, ()=>{
        document.querySelectorAll('.opt').forEach((btn,j)=>{
          btn.disabled = true;
          if(j === current.ans) btn.classList.add('correct');
          else if(j === i) btn.classList.add('wrong');
        });
      });
    });
  });
}

// ── T/F ─────────────────────────────────────────────────────────
function tfHtml(q){
  return `${badgeFor('tf')}<div class="q-text">${q.q}</div>
    <div class="tf-row">
      <button class="tf-btn true" data-v="true"><span class="tf-icon">✓</span> True</button>
      <button class="tf-btn false" data-v="false"><span class="tf-icon">✗</span> False</button>
    </div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachTF(){
  document.querySelectorAll('.tf-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const v = b.dataset.v === 'true';
      checkAnswer(v === current.ans, ()=>{
        document.querySelectorAll('.tf-btn').forEach(btn=>{
          btn.disabled = true;
          const bv = btn.dataset.v === 'true';
          if(bv === current.ans) btn.classList.add('correct');
          else if(bv === v) btn.classList.add('wrong');
        });
      });
    });
  });
}

// ── FILL ────────────────────────────────────────────────────────
function fillHtml(q){
  return `${badgeFor('fill')}<div class="q-text">${q.q}</div>
    <div class="fill-row">
      <input type="text" class="fill-input" id="fillInp" placeholder="Type your answer…" autocomplete="off"/>
      <button class="fill-submit" id="fillSub">Check</button>
    </div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachFill(){
  const inp = document.getElementById('fillInp');
  const sub = document.getElementById('fillSub');
  inp.focus();
  const submit = ()=>{
    const u = norm(inp.value);
    if(!u){ inp.focus(); return; }
    const ok = current.answers.some(a => norm(a) === u);
    checkAnswer(ok, ()=>{
      inp.disabled = true; sub.disabled = true;
      inp.style.borderColor = ok ? '#06b6d4' : '#f43f5e';
      inp.style.background = ok ? '#ecfeff' : '#fff5f5';
    });
  };
  sub.addEventListener('click', submit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

// ── ESSAY ───────────────────────────────────────────────────────
function essayHtml(q){
  return `${badgeFor('essay')}<div class="q-text">${q.q}</div>
    <textarea class="essay-area" id="essayInp" placeholder="Write your answer in your own words…"></textarea>
    <button class="essay-show" id="essayShow">📋 Show Model Answer</button>
    <div class="essay-self" id="essaySelf">
      <button class="got" data-v="1">✓ I got it right</button>
      <button class="miss" data-v="0">✗ Need to review</button>
    </div>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachEssay(){
  const area = document.getElementById('essayInp');
  const show = document.getElementById('essayShow');
  const self = document.getElementById('essaySelf');
  const fb = document.getElementById('fb');
  show.addEventListener('click', ()=>{
    if(area.value.trim().length < 5){
      fb.className='fb info show';
      fb.innerHTML = `<strong>Write your answer first</strong> — even a sentence or two. Then click "Show Model Answer" to compare.`;
      return;
    }
    area.disabled = true;
    show.style.display = 'none';
    const u = norm(area.value);
    const hits = (current.keys||[]).filter(k => u.includes(norm(k))).length;
    const ttl = (current.keys||[]).length || 1;
    fb.className = 'fb info show';
    fb.innerHTML = `<strong>📋 Model Answer:</strong><br><br>${current.model}<br><br><small>🔍 Your answer mentioned <strong>${hits} of ${ttl}</strong> key ideas. Compare with the model and grade yourself honestly:</small>`;
    self.classList.add('show');
  });
  self.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const ok = b.dataset.v === '1';
      self.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.style.background = ok ? '#ecfeff' : '#fff5f5';
      registerResult(ok);
      if(current.concept){
        fb.innerHTML += `<div class="concept-box">💡 ${current.concept}</div>`;
      }
      setTimeout(()=>{
        const nxt = document.createElement('button');
        nxt.className = 'restart-btn';
        nxt.style.marginTop = '16px';
        nxt.style.padding = '10px 24px';
        nxt.style.fontSize = '.88rem';
        nxt.textContent = idx+1 >= total ? '🏁 See Results' : 'Next Question →';
        nxt.onclick = ()=>{ idx++; next(); };
        fb.appendChild(nxt);
      }, 200);
    });
  });
}

// ── FILL_BANK ───────────────────────────────────────────────────
function fillBankHtml(q){
  const chips = (q.bank||[]).map(w=>`<button type="button" class="bank-chip" data-w="${w}">${w}</button>`).join('');
  return `${badgeFor('fill_bank')}<div class="q-text">${q.q}</div>
    <div class="bank-wrap">
      <div class="bank-title">📦 Word Bank</div>
      <div class="bank-chips">${chips}</div>
    </div>
    <div class="fill-row">
      <input type="text" class="fill-input" id="fillInp" placeholder="Type or click a word…" autocomplete="off"/>
      <button class="fill-submit" id="fillSub">Check</button>
    </div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachFillBank(){
  const inp = document.getElementById('fillInp');
  const sub = document.getElementById('fillSub');
  inp.focus();
  document.querySelectorAll('.bank-chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      if(c.disabled) return;
      inp.value = c.dataset.w;
      inp.focus();
    });
  });
  const submit = ()=>{
    const u = norm(inp.value);
    if(!u){ inp.focus(); return; }
    const ok = current.answers.some(a => norm(a) === u);
    checkAnswer(ok, ()=>{
      inp.disabled = true; sub.disabled = true;
      inp.style.borderColor = ok ? '#06b6d4' : '#f43f5e';
      inp.style.background = ok ? '#ecfeff' : '#fff5f5';
      document.querySelectorAll('.bank-chip').forEach(c=>c.disabled=true);
    });
  };
  sub.addEventListener('click', submit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

// ── MULTI_CHECK ─────────────────────────────────────────────────
function multiCheckHtml(q){
  const need = q.require || (q.correctIdx||[]).length;
  const opts = q.opts.map((o,i)=>`
    <button type="button" class="mc-opt" data-i="${i}">
      <span class="mc-box"></span><span>${o}</span>
    </button>`).join('');
  return `${badgeFor('multi_check')}<div class="q-text">${q.q}</div>
    <div class="mc-instr">Tick <b>${need}</b> answer${need>1?'s':''}.</div>
    <div>${opts}</div>
    <button class="scenario-check-all" id="mcSub" style="margin-top:10px">Submit</button>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachMultiCheck(){
  const need = current.require || (current.correctIdx||[]).length;
  const picked = new Set();
  document.querySelectorAll('.mc-opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.classList.contains('locked')) return;
      const i = parseInt(b.dataset.i);
      if(picked.has(i)){ picked.delete(i); b.classList.remove('checked'); }
      else { picked.add(i); b.classList.add('checked'); }
    });
  });
  document.getElementById('mcSub').addEventListener('click', ()=>{
    if(picked.size !== need){
      const fb = document.getElementById('fb');
      fb.className='fb info show';
      fb.innerHTML = `<strong>Please select exactly ${need} answer${need>1?'s':''}.</strong>`;
      return;
    }
    const correctSet = new Set(current.correctIdx);
    let allRight = true;
    for(const c of correctSet) if(!picked.has(c)) allRight = false;
    for(const p of picked) if(!correctSet.has(p)) allRight = false;
    checkAnswer(allRight, ()=>{
      document.querySelectorAll('.mc-opt').forEach(b=>{
        b.classList.add('locked');
        const i = parseInt(b.dataset.i);
        if(correctSet.has(i) && picked.has(i)) b.classList.add('correct');
        else if(picked.has(i) && !correctSet.has(i)) b.classList.add('wrong');
        else if(correctSet.has(i) && !picked.has(i)) b.classList.add('missed');
      });
      document.getElementById('mcSub').disabled = true;
    });
  });
}

// ── SCENARIO ────────────────────────────────────────────────────
function scenarioHtml(q){
  const parts = q.parts.map((p,i)=>{
    let body = '';
    if(p.kind==='mcq'){
      const letters=['A','B','C','D'];
      body = `<div class="opts">${p.opts.map((o,j)=>`<button type="button" class="opt sc-opt" data-part="${i}" data-i="${j}"><span class="opt-letter">${letters[j]}</span><span>${o}</span></button>`).join('')}</div>`;
    } else if(p.kind==='fill'){
      body = `<div class="fill-row"><input type="text" class="fill-input sc-fill" data-part="${i}" placeholder="Type your answer…" autocomplete="off"/></div>`;
    } else if(p.kind==='essay'){
      body = `<textarea class="essay-area sc-essay" data-part="${i}" placeholder="Write your answer…"></textarea>`;
    }
    return `<div class="scenario-part" data-part="${i}">
      <div class="scenario-part-label">Part ${i+1}</div>
      <div class="scenario-part-q">${p.q}</div>
      ${body}
      <div class="scenario-part-result" data-part-result="${i}"></div>
    </div>`;
  }).join('');
  return `${badgeFor('scenario')}<div class="q-text">${q.q}</div>
    ${parts}
    <button class="scenario-check-all" id="scCheck">✓ Check All Answers</button>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachScenario(){
  document.querySelectorAll('.sc-opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(b.disabled) return;
      const part = b.dataset.part;
      document.querySelectorAll(`.sc-opt[data-part="${part}"]`).forEach(x=>{
        x.classList.remove('correct','wrong');
        x.dataset.picked = '0';
        x.style.borderColor=''; x.style.background='';
      });
      b.dataset.picked = '1';
      b.style.borderColor = '#a78bfa';
      b.style.background = '#f5f3ff';
    });
  });
  document.getElementById('scCheck').addEventListener('click', ()=>{
    const parts = current.parts;
    let correctCount = 0;
    parts.forEach((p,i)=>{
      const resEl = document.querySelector(`[data-part-result="${i}"]`);
      let ok = false;
      if(p.kind==='mcq'){
        const picked = document.querySelector(`.sc-opt[data-part="${i}"][data-picked="1"]`);
        const pickedIdx = picked ? parseInt(picked.dataset.i) : -1;
        ok = pickedIdx === p.ans;
        document.querySelectorAll(`.sc-opt[data-part="${i}"]`).forEach(b=>{
          b.disabled = true;
          const j = parseInt(b.dataset.i);
          b.style.borderColor=''; b.style.background='';
          if(j === p.ans) b.classList.add('correct');
          else if(j === pickedIdx) b.classList.add('wrong');
        });
      } else if(p.kind==='fill'){
        const inp = document.querySelector(`.sc-fill[data-part="${i}"]`);
        const u = norm(inp.value);
        ok = !!u && p.answers.some(a => norm(a) === u);
        inp.disabled = true;
        inp.style.borderColor = ok ? '#06b6d4' : '#f43f5e';
        inp.style.background = ok ? '#ecfeff' : '#fff5f5';
      } else if(p.kind==='essay'){
        const area = document.querySelector(`.sc-essay[data-part="${i}"]`);
        const u = norm(area.value);
        const hits = (p.keys||[]).filter(k => u.includes(norm(k))).length;
        const need = Math.max(1, Math.ceil((p.keys||[]).length * 0.3));
        ok = u.length >= 20 && hits >= need;
        area.disabled = true;
        area.style.borderColor = ok ? '#06b6d4' : '#f59e0b';
        area.style.background = ok ? '#ecfeff' : '#fffbeb';
      }
      if(ok) correctCount++;
      resEl.classList.remove('ok','bad'); resEl.classList.add('show', ok?'ok':'bad');
      if(p.kind==='essay'){
        resEl.innerHTML = ok
          ? '✓ Good — key ideas covered.'
          : `✗ Missing some key ideas. Model answer:<div style="font-weight:600;margin-top:6px;color:#333">${p.model}</div>`;
      } else if(p.kind==='fill'){
        resEl.innerHTML = ok ? '✓ Correct!' : `✗ Expected: <b>${p.display || p.answers[0]}</b>`;
      } else {
        resEl.innerHTML = ok ? '✓ Correct!' : '✗ Not quite.';
      }
    });
    document.getElementById('scCheck').disabled = true;
    const partTotal = parts.length;
    const ok = correctCount >= Math.ceil(partTotal * 0.6);
    const fb = document.getElementById('fb');
    fb.className = `fb ${ok?'correct':'wrong'} show`;
    const conceptHtml = current.concept ? `<div class="concept-box">💡 ${current.concept}</div>` : '';
    fb.innerHTML = `<strong>${ok?'✅ Well done!':'📚 Keep practising.'}</strong> You got <strong>${correctCount} of ${partTotal}</strong> parts correct.${conceptHtml}`;
    registerResult(ok);
    setTimeout(()=>{
      const nxt = document.createElement('button');
      nxt.className = 'restart-btn';
      nxt.style.marginTop = '16px';
      nxt.style.padding = '10px 24px';
      nxt.style.fontSize = '.88rem';
      nxt.textContent = idx+1 >= total ? '🏁 See Results' : 'Next Question →';
      nxt.onclick = ()=>{ idx++; next(); };
      fb.appendChild(nxt);
    }, 300);
  });
}

function attachHint(){
  const btn = document.getElementById('hintBtn');
  const box = document.getElementById('hintBox');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    box.classList.toggle('show');
    btn.textContent = box.classList.contains('show') ? '🙈 Hide Hint' : '💡 Show Hint';
  });
}

// ════════════════════════════════════════════════════════════════
// ANSWER CHECK
// ════════════════════════════════════════════════════════════════
function registerResult(ok){
  if(lastResult !== null) return;
  lastResult = ok ? 'correct' : 'wrong';
  if(ok) stats.correct++; else stats.wrong++;
  stats.done++;
  SAVE.totalAnswered++;
  awardXp(10, ok);
  updateScore();
}

function checkAnswer(ok, lockFn){
  registerResult(ok);
  if(lockFn) lockFn();
  const fb = document.getElementById('fb');
  const stepsArr = current.steps || [];
  const stepsHtml = stepsArr.map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('');
  const conceptHtml = current.concept ? `<div class="concept-box">💡 ${current.concept}</div>` : '';
  if(ok){
    fb.className = 'fb correct show';
    fb.innerHTML = `<strong>✅ Correct! Well done!</strong>${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
    if(stats.correct>0 && stats.correct%3===0) confetti();
  } else {
    fb.className = 'fb wrong show';
    let correctText = '';
    if(current.type==='mcq') correctText = current.opts[current.ans];
    else if(current.type==='tf') correctText = current.ans ? 'True' : 'False';
    else if(current.type==='fill' || current.type==='fill_bank') correctText = current.display || current.answers[0];
    else if(current.type==='multi_check') correctText = current.correctIdx.map(i=>current.opts[i]).join(' + ');
    else if(current.type==='sentence_builder') correctText = current.answer;
    fb.innerHTML = `<strong>❌ Not quite.</strong> The correct answer is <strong>${correctText}</strong>.${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
  }
  setTimeout(()=>{
    const nxt = document.createElement('button');
    nxt.className = 'restart-btn';
    nxt.style.marginTop = '16px';
    nxt.style.padding = '10px 24px';
    nxt.style.fontSize = '.88rem';
    nxt.textContent = idx+1 >= total ? '🏁 See Results' : 'Next Question →';
    nxt.onclick = ()=>{ idx++; next(); };
    fb.appendChild(nxt);
  }, 300);
}

// ════════════════════════════════════════════════════════════════
// DONE
// ════════════════════════════════════════════════════════════════
function renderDone(){
  const pct = total>0 ? Math.round((stats.correct/total)*100) : 0;
  const msg = pct>=80 ? '🎉 Outstanding!' : pct>=60 ? '👍 Great job!' : pct>=40 ? '💪 Keep practising!' : '📚 Time to review!';
  // Award world completion + badges
  if(currentChapterKey && currentChapterKey !== 'mix'){
    if(!SAVE.worldsCompleted.includes(currentChapterKey)) SAVE.worldsCompleted.push(currentChapterKey);
    const chMeta = CHAPTERS[currentChapterKey];
    if(chMeta && chMeta.badge && pct >= 60) unlockBadge(chMeta.badge);
    if(pct === 100) unlockBadge('perfect_chapter');
    saveSave();
  }
  document.getElementById('quizSlot').innerHTML = `
    <div class="q-card done">
      <h2>${msg}</h2>
      <p>You finished <strong>${total}</strong> questions.</p>
      <div class="done-stats">
        <div class="done-stat"><strong>${stats.correct}</strong><span>Correct</span></div>
        <div class="done-stat"><strong>${stats.wrong}</strong><span>Wrong</span></div>
        <div class="done-stat"><strong>${pct}%</strong><span>Score</span></div>
        <div class="done-stat"><strong>Lv ${SAVE.level}</strong><span>${SAVE.xp} XP</span></div>
      </div>
      <button class="restart-btn" onclick="location.reload()">🔄 Try Again</button>
      <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#7c3aed;font-weight:700;text-decoration:none">← Back to map</a></p>
    </div>`;
  if(pct>=70) for(let i=0;i<3;i++) setTimeout(goldConfetti, i*250);
}

function confetti(){
  const colors=['#a78bfa','#06b6d4','#818cf8','#f59e0b','#38bdf8','#2dd4bf'];
  for(let i=0;i<24;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=pick(colors);
    c.style.left=(Math.random()*100)+'vw';
    c.style.top='-20px';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    c.style.borderRadius=Math.random()<0.5?'50%':'2px';
    document.body.appendChild(c);
    const dx=(Math.random()-0.5)*200;
    const dur=1500+Math.random()*1000;
    c.animate([{transform:c.style.transform,opacity:1,top:'-20px'},
               {transform:`translate(${dx}px,${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:0,top:`${window.innerHeight+40}px`}],
              {duration:dur,easing:'cubic-bezier(.3,.7,.4,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}

// ════════════════════════════════════════════════════════════════
// MINI-GAME: SPEED CHALLENGE (60s)
// ════════════════════════════════════════════════════════════════
function startSpeedGame(){
  currentChapterTitle = '⚡ Lightning Tournament';
  currentChapterKey = null;
  sessionCombo = 0;
  tickDailyStreak();
  updateHeader();
  updateHeaderGame();
  document.querySelector('.progress-wrap').style.display='none';
  document.querySelector('.score-row').style.display='none';
  let timeLeft = 60, score = 0, qIdx = 0;
  const mcqGens = Object.values(ALL_GENS).filter(g => { try{const x=g();return x.type==='mcq'||x.type==='tf';}catch(e){return false;} });
  const slot = document.getElementById('quizSlot');
  slot.innerHTML = `<div class="q-card speed-arena">
    <div class="speed-timer" id="spTimer">60</div>
    <div class="speed-score">Score: <span id="spScore">0</span> &nbsp;·&nbsp; Best: ${SAVE.bestSpeedScore}</div>
    <div id="spQuestion"></div>
  </div>`;
  function loadQ(){
    const q = pick(mcqGens)();
    const box = document.getElementById('spQuestion');
    if(q.type === 'tf'){
      box.innerHTML = `<div class="q-text">${q.q}</div><div class="tf-row">
        <button class="tf-btn true" data-v="true">✓ True</button>
        <button class="tf-btn false" data-v="false">✗ False</button></div>`;
      box.querySelectorAll('.tf-btn').forEach(b=>{
        b.addEventListener('click', ()=>{
          const v = b.dataset.v === 'true';
          if(v === q.ans){ score++; document.getElementById('spScore').textContent = score; loadQ(); }
          else { box.classList.add('speed-shake'); setTimeout(()=>box.classList.remove('speed-shake'),350); loadQ(); }
        });
      });
    } else {
      const letters=['A','B','C','D'];
      box.innerHTML = `<div class="q-text">${q.q}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="opt-letter">${letters[i]}</span><span>${o}</span></button>`).join('')}</div>`;
      box.querySelectorAll('.opt').forEach(b=>{
        b.addEventListener('click', ()=>{
          const i = parseInt(b.dataset.i);
          if(i === q.ans){ score++; document.getElementById('spScore').textContent = score; loadQ(); }
          else { box.classList.add('speed-shake'); setTimeout(()=>box.classList.remove('speed-shake'),350); loadQ(); }
        });
      });
    }
  }
  loadQ();
  const timer = setInterval(()=>{
    timeLeft--;
    const t = document.getElementById('spTimer');
    if(t){ t.textContent = timeLeft; if(timeLeft <= 10) t.classList.add('warn'); }
    if(timeLeft <= 0){
      clearInterval(timer);
      if(score > SAVE.bestSpeedScore){ SAVE.bestSpeedScore = score; saveSave(); }
      if(score >= 20) unlockBadge('speed_demon');
      slot.innerHTML = `<div class="q-card done">
        <h2>⚡ Time's Up!</h2>
        <p>You smashed <strong>${score}</strong> questions!</p>
        <p style="margin-bottom:18px">Personal best: <strong>${SAVE.bestSpeedScore}</strong></p>
        <button class="restart-btn" onclick="location.reload()">🔄 Play Again</button>
        <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#7c3aed;font-weight:700;text-decoration:none">← Back to map</a></p>
      </div>`;
      if(score >= 15) for(let i=0;i<3;i++) setTimeout(goldConfetti, i*250);
    }
  }, 1000);
}

// ════════════════════════════════════════════════════════════════
// MINI-GAME: MEMORY MATCH
// ════════════════════════════════════════════════════════════════
const MATCH_PAIRS = [
  ['carefully','cautiously'],
  ['exhausted','very tired'],
  ['enormous','very large'],
  ['whispered','spoke softly'],
  ['ancient','very old'],
  ['furious','very angry'],
  ['sprinted','ran fast'],
  ['delighted','very pleased'],
  ['tiny','very small'],
  ['silent','completely quiet']
];
function startMatchGame(){
  currentChapterTitle = '🃏 Memory Match';
  currentChapterKey = null;
  sessionCombo = 0;
  tickDailyStreak();
  updateHeader();
  updateHeaderGame();
  document.querySelector('.progress-wrap').style.display='none';
  document.querySelector('.score-row').style.display='none';
  const pairs = shuf(MATCH_PAIRS).slice(0,6);
  const cards = [];
  pairs.forEach((p,i)=>{ cards.push({txt:p[0], pair:i}); cards.push({txt:p[1], pair:i}); });
  const deck = shuf(cards);
  const slot = document.getElementById('quizSlot');
  let elapsed = 0, matches = 0, flipped = [], locked = false;
  slot.innerHTML = `<div class="q-card">
    <div class="match-hud"><div>⏱️ <span id="mTime">0</span>s</div><div>🃏 <span id="mMatch">0</span>/6</div><div>🏆 Best: ${SAVE.bestMatchTime?SAVE.bestMatchTime+'s':'—'}</div></div>
    <div class="match-grid" id="mGrid">${deck.map((c,i)=>`<button class="match-card" data-i="${i}" data-pair="${c.pair}">?</button>`).join('')}</div>
  </div>`;
  const timer = setInterval(()=>{ elapsed++; const t=document.getElementById('mTime'); if(t) t.textContent = elapsed; else clearInterval(timer); }, 1000);
  document.getElementById('mGrid').addEventListener('click', e=>{
    const c = e.target.closest('.match-card');
    if(!c || locked || c.classList.contains('matched') || c.classList.contains('flipped')) return;
    const i = parseInt(c.dataset.i);
    c.classList.add('flipped');
    c.textContent = deck[i].txt;
    flipped.push(c);
    if(flipped.length === 2){
      locked = true;
      const [a,b] = flipped;
      if(a.dataset.pair === b.dataset.pair){
        setTimeout(()=>{
          a.classList.add('matched'); b.classList.add('matched');
          matches++;
          document.getElementById('mMatch').textContent = matches;
          flipped = []; locked = false;
          if(matches === 6){
            clearInterval(timer);
            if(!SAVE.bestMatchTime || elapsed < SAVE.bestMatchTime){ SAVE.bestMatchTime = elapsed; saveSave(); }
            if(elapsed <= 30) unlockBadge('memory_master');
            setTimeout(()=>{
              slot.innerHTML = `<div class="q-card done">
                <h2>🃏 All Matched!</h2>
                <p>Time: <strong>${elapsed}s</strong></p>
                <p style="margin-bottom:18px">Best: <strong>${SAVE.bestMatchTime}s</strong></p>
                <button class="restart-btn" onclick="location.reload()">🔄 Play Again</button>
                <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#7c3aed;font-weight:700;text-decoration:none">← Back to map</a></p>
              </div>`;
              for(let i=0;i<3;i++) setTimeout(goldConfetti, i*250);
            }, 300);
          }
        }, 350);
      } else {
        a.classList.add('shake'); b.classList.add('shake');
        setTimeout(()=>{
          a.classList.remove('flipped','shake'); a.textContent='?';
          b.classList.remove('flipped','shake'); b.textContent='?';
          flipped = []; locked = false;
        }, 900);
      }
    }
  });
}

// ════════════════════════════════════════════════════════════════
// MINI-GAME: SENTENCE BUILDER (uses sentence_builder gens)
// ════════════════════════════════════════════════════════════════
function startBuilderGame(){
  currentChapterTitle = '🧩 Sentence Puzzle Cove';
  currentChapterKey = null;
  const builderGens = Object.values(ALL_GENS).filter(g => { try{return g().type==='sentence_builder';}catch(e){return false;} });
  queue = shuf(builderGens.map(g=>g()));
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  sessionCombo = 0;
  tickDailyStreak();
  updateHeader();
  updateHeaderGame();
  updateScore();
  next();
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
const params = new URLSearchParams(location.search);
const game = params.get('game');
updateHeaderGame();
if(game === 'speed') startSpeedGame();
else if(game === 'match') startMatchGame();
else if(game === 'builder') startBuilderGame();
else { const chKey = params.get('ch') || '1'; buildQueue(chKey); }
</script>
