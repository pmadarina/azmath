<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan IPS — AzIPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#fff7ed 0%,#fef3c7 100%);min-height:100vh;display:flex;flex-direction:column;color:#1a1a2e}

.hdr{background:linear-gradient(135deg,#d97706,#b45309 60%,#92400e);color:#fff;padding:18px 20px;position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr-back{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:18px;font-size:.78rem;font-weight:800;text-decoration:none}
.hdr-back:hover{background:rgba(255,255,255,.28)}
.hdr-title{font-size:1.05rem;font-weight:900;letter-spacing:-.3px;flex:1}
.hdr-meta{font-size:.78rem;font-weight:700;opacity:.95;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:16px}

.progress-wrap{background:#fff;padding:10px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.progress{display:flex;gap:4px;align-items:center}
.progress-bar{flex:1;height:8px;background:#fde68a;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#d97706,#f59e0b);border-radius:5px;transition:width .35s ease}
.progress-text{font-size:.78rem;font-weight:800;color:#b45309;min-width:75px;text-align:right}

.score-row{display:flex;gap:10px;margin:14px auto 0;max-width:720px;padding:0 16px;flex-wrap:wrap}
.score-chip{flex:1;min-width:0;background:#fff;border-radius:14px;padding:10px 12px;text-align:center;border:1.5px solid #e8ecef;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#666}
.score-chip strong{display:block;font-size:1.3rem;letter-spacing:-.5px;margin-bottom:2px;color:#1a1a2e;text-transform:none}
.score-chip.correct{border-color:#16a34a;background:#f0fdf4}
.score-chip.correct strong{color:#16a34a}
.score-chip.wrong{border-color:#dc2626;background:#fef2f2}
.score-chip.wrong strong{color:#dc2626}
.score-chip.answered{border-color:#d97706;background:#fffbeb}
.score-chip.answered strong{color:#d97706}

.main{max-width:720px;margin:18px auto 0;padding:0 16px 80px;width:100%}
.q-card{background:#fff;border-radius:24px;padding:30px 26px 24px;box-shadow:0 8px 32px rgba(180,83,9,.13)}
.q-badge{display:inline-block;background:#fef3c7;color:#b45309;font-size:.7rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:14px;margin-bottom:14px}
.q-badge.mcq{background:#fef3c7;color:#b45309}
.q-badge.fill{background:#fef3c7;color:#a16207}
.q-badge.essay{background:#fde68a;color:#78350f}

.q-text{font-size:1.05rem;line-height:1.6;background:#fffbeb;border-left:4px solid #d97706;padding:14px 18px;border-radius:8px;margin-bottom:18px}
.q-text strong{font-weight:800}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid #e8ecef;border-radius:14px;padding:14px 18px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;gap:14px;transition:all .15s;font-family:inherit;text-align:left;width:100%;color:inherit}
.opt:hover:not(:disabled){border-color:#d97706;background:#fffbeb}
.opt-letter{width:30px;height:30px;border-radius:50%;background:#fef3c7;color:#b45309;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.opt:disabled{cursor:not-allowed}
.opt.correct{border-color:#16a34a;background:#f0fdf4}
.opt.correct .opt-letter{background:#16a34a;color:#fff}
.opt.wrong{border-color:#dc2626;background:#fef2f2}
.opt.wrong .opt-letter{background:#dc2626;color:#fff}

.fill-row{display:flex;gap:10px;align-items:stretch}
.fill-input{flex:1;font-family:inherit;font-size:1rem;font-weight:700;padding:14px 18px;border:2px dashed #d97706;border-radius:14px;background:#fffbeb;color:#1a1a2e;outline:none}
.fill-input:focus{border-style:solid;border-color:#b45309;background:#fff;box-shadow:0 0 0 3px rgba(217,119,6,.2)}
.fill-input:disabled{opacity:.85;background:#f8f9fb}
.fill-submit{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;border:none;border-radius:14px;padding:0 24px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.fill-submit:hover:not(:disabled){opacity:.88}
.fill-submit:disabled{cursor:not-allowed;opacity:.5}

.essay-area{width:100%;font-family:inherit;font-size:.95rem;padding:14px 16px;border:2px dashed #d97706;border-radius:14px;background:#fffbeb;color:#1a1a2e;outline:none;resize:vertical;min-height:110px;line-height:1.5}
.essay-area:focus{border-style:solid;border-color:#b45309;background:#fff;box-shadow:0 0 0 3px rgba(217,119,6,.2)}
.essay-area:disabled{opacity:.85;background:#f8f9fb}
.essay-show{margin-top:12px;background:linear-gradient(135deg,#b45309,#92400e);color:#fff;border:none;border-radius:14px;padding:11px 22px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s}
.essay-show:hover:not(:disabled){opacity:.88}
.essay-self{display:none;gap:10px;margin-top:12px}
.essay-self.show{display:flex}
.essay-self button{flex:1;border:2px solid;border-radius:14px;padding:12px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;background:#fff}
.essay-self .got{border-color:#16a34a;color:#16a34a}
.essay-self .got:hover{background:#f0fdf4}
.essay-self .miss{border-color:#e17055;color:#e17055}
.essay-self .miss:hover{background:#fff5f0}

.fb{border-radius:14px;padding:16px 18px;margin-top:16px;font-size:.92rem;line-height:1.6;display:none}
.fb.show{display:block}
.fb.correct{background:#f0fdf4;border:1.5px solid #16a34a;color:#14532d}
.fb.wrong{background:#fef2f2;border:1.5px solid #dc2626;color:#7f1d1d}
.fb.info{background:#fffbeb;border:1.5px solid #d97706;color:#78350f}
.fb strong{font-weight:900}
.steps{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.step-num{width:22px;height:22px;border-radius:50%;background:#d97706;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0}
.concept-box{margin-top:12px;background:#fef9c3;border:1.5px solid #f9ca24;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#7c5e02}

.hint-row{margin-top:14px}
.hint-btn{background:transparent;border:1.5px dashed #f9ca24;color:#a16207;font-family:inherit;font-size:.85rem;font-weight:800;padding:8px 16px;border-radius:14px;cursor:pointer}
.hint-btn:hover{background:#fef9c3}
.hint-box{display:none;background:#fef9c3;border:1.5px solid #f9ca24;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#7c5e02;margin-top:10px}
.hint-box.show{display:block}

.done{text-align:center;padding:40px 20px}
.done h2{font-size:2rem;font-weight:900;margin-bottom:10px;background:linear-gradient(135deg,#d97706,#92400e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.done p{color:#666;margin-bottom:24px;line-height:1.6}
.done-stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.done-stat{text-align:center}
.done-stat strong{display:block;font-size:2.2rem;font-weight:900;color:#1a1a2e}
.done-stat span{font-size:.75rem;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:1px}
.restart-btn{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;border:none;border-radius:24px;padding:14px 32px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(180,83,9,.4)}
.restart-btn:hover{opacity:.92}

.breakdown{text-align:left;background:#fffbeb;border-radius:14px;padding:14px 18px;margin:0 auto 22px;max-width:480px}
.breakdown h4{font-size:.85rem;font-weight:900;margin-bottom:10px;color:#92400e;letter-spacing:.5px;text-transform:uppercase}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #fde68a;font-size:.88rem}
.breakdown-row:last-child{border-bottom:none}
.breakdown-row .bd-label{font-weight:700;color:#333;flex:1}
.breakdown-row .bd-score{font-weight:800;color:#16a34a}
.breakdown-row .bd-score.low{color:#dc2626}

.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1000}

@media(max-width:520px){
  .q-card{padding:22px 18px 18px}
  .q-text{font-size:.95rem;padding:12px 14px}
  .opt{padding:12px 14px;font-size:.9rem}
  .hdr-title{font-size:.92rem}
  .score-chip{font-size:.65rem;padding:8px}
  .score-chip strong{font-size:1.1rem}
  .fill-row{flex-direction:column}
  .fill-submit{padding:12px}
}
</style>
</head>
<body>

<div class="hdr">
  <a class="hdr-back" href="../">← Kembali</a>
  <div class="hdr-title" id="hdrTitle">🌏 Latihan IPS</div>
  <div class="hdr-meta" id="hdrMeta">Soal 1</div>
</div>

<div class="progress-wrap">
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <div class="progress-text" id="progText">0 / 0</div>
  </div>
</div>

<div class="score-row">
  <div class="score-chip correct"><strong id="sCorrect">0</strong><span>✓ Benar</span></div>
  <div class="score-chip wrong"><strong id="sWrong">0</strong><span>✗ Salah</span></div>
  <div class="score-chip answered"><strong id="sDone">0</strong><span>📝 Dijawab</span></div>
</div>

<div class="main">
  <div id="quizSlot"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const norm=s=>String(s||'').trim().toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');

function t(obj){
  if(obj==null) return '';
  if(typeof obj==='string') return obj;
  if(typeof obj==='object' && 'id' in obj) return obj.id || '';
  return String(obj);
}

// MCQ shuffle helper
function mkOpts(correct, distractors){
  const all=[correct, ...distractors].slice(0,4);
  while(all.length<4) all.push('—');
  const sh=shuf(all);
  return {opts:sh, ans:sh.indexOf(correct)};
}

// ════════════════════════════════════════════════════════════════
// BAB 8 — Peran Ekonomi untuk Meningkatkan Kesejahteraan Masyarakat
// Topik: warisan_budaya, kegiatan_ekonomi, faktor_ekonomi, produk_unggulan, bencana_alam
// ════════════════════════════════════════════════════════════════
const BAB8_GEN = {
  // ── WARISAN BUDAYA ────────────────────────────────────────────
  warisan_wayang:()=>{
    const cor='Wayang kulit';
    const {opts,ans}=mkOpts(cor,['Smartphone','Mobil sport','Pesawat terbang']);
    return {type:'mcq',topic:'warisan_budaya',
      q:'Manakah berikut ini yang <b>termasuk warisan budaya</b> Indonesia?',
      opts,ans,
      hint:'Warisan budaya adalah peninggalan dari nenek moyang yang dijaga turun-temurun.',
      concept:'Warisan budaya adalah hasil karya budaya yang diwariskan dari generasi ke generasi, seperti kesenian tradisional.',
      steps:['Wayang kulit adalah seni pertunjukan tradisional dari Jawa.','Sudah ada sejak ratusan tahun lalu dan diwariskan turun-temurun.','Jadi jawabannya: <b>Wayang kulit</b>.']};
  },
  warisan_batik:()=>{
    const cor='Batik';
    const {opts,ans}=mkOpts(cor,['Jas modern','Kaos polos','Sepatu sneakers']);
    return {type:'mcq',topic:'warisan_budaya',
      q:'Kain tradisional Indonesia yang diakui UNESCO sebagai warisan budaya tak benda adalah ___.',
      opts,ans,
      hint:'Diakui UNESCO pada 2 Oktober 2009.',
      concept:'Batik diakui UNESCO sebagai Masterpiece of Oral and Intangible Heritage of Humanity.',
      steps:['Setiap 2 Oktober diperingati Hari Batik Nasional.','Batik adalah warisan budaya khas Indonesia.']};
  },
  warisan_bukan:()=>{
    const cor='Robot pabrik';
    const {opts,ans}=mkOpts(cor,['Tari Saman','Angklung','Rumah Gadang']);
    return {type:'mcq',topic:'warisan_budaya',
      q:'Manakah yang <b>BUKAN</b> termasuk warisan budaya Indonesia?',
      opts,ans,
      hint:'Cari yang merupakan teknologi modern, bukan tradisi.',
      concept:'Warisan budaya berasal dari tradisi nenek moyang, bukan teknologi modern.',
      steps:['Tari Saman → Aceh.','Angklung → Jawa Barat.','Rumah Gadang → Sumatera Barat.','Robot pabrik = teknologi modern, bukan warisan budaya.']};
  },
  warisan_tari_saman:()=>{
    const cor='Aceh';
    const {opts,ans}=mkOpts(cor,['Bali','Papua','Sulawesi']);
    return {type:'mcq',topic:'warisan_budaya',
      q:'Tari Saman merupakan warisan budaya yang berasal dari daerah ___.',
      opts,ans,
      hint:'Daerah di ujung barat Indonesia.',
      concept:'Tari Saman berasal dari Aceh, diciptakan oleh Syekh Saman.',
      steps:['Tari Saman = tarian khas suku Gayo di Aceh.','Diakui UNESCO sebagai warisan budaya tak benda tahun 2011.']};
  },
  fill_warisan_batik:()=>({type:'fill',topic:'warisan_budaya',
    q:'Kain tradisional Indonesia yang diakui UNESCO sebagai warisan budaya adalah ___.',
    answers:['batik'],
    display:'batik',
    hint:'Memiliki motif khas dan dibuat dengan teknik canting.',
    concept:'Batik adalah kain tradisional Indonesia dengan motif khas, diakui UNESCO.',
    steps:['Kain tradisional dengan motif = <b>batik</b>.']}),
  fill_warisan_borobudur:()=>({type:'fill',topic:'warisan_budaya',
    q:'Candi Buddha terbesar di Indonesia yang terletak di Magelang, Jawa Tengah adalah Candi ___.',
    answers:['borobudur'],
    display:'Borobudur',
    hint:'Salah satu keajaiban dunia.',
    concept:'Candi Borobudur dibangun pada abad ke-8 oleh Dinasti Syailendra.',
    steps:['Candi Buddha terbesar = <b>Borobudur</b>.']}),
  fill_warisan_angklung:()=>({type:'fill',topic:'warisan_budaya',
    q:'Alat musik tradisional dari Jawa Barat yang terbuat dari bambu disebut ___.',
    answers:['angklung'],
    display:'angklung',
    hint:'Dimainkan dengan cara digoyangkan.',
    concept:'Angklung adalah alat musik bambu khas Sunda, Jawa Barat.',
    steps:['Alat musik bambu khas Jawa Barat = <b>angklung</b>.']}),

  // ── KEGIATAN EKONOMI ──────────────────────────────────────────
  ekonomi_pantai:()=>{
    const cor='Nelayan menangkap ikan';
    const {opts,ans}=mkOpts(cor,['Bertani padi','Beternak sapi perah','Menambang emas']);
    return {type:'mcq',topic:'kegiatan_ekonomi',
      q:'Kegiatan ekonomi yang paling banyak dilakukan masyarakat di daerah <b>pantai</b> adalah ___.',
      opts,ans,
      hint:'Pantai dekat dengan laut, sumber daya utamanya adalah ikan.',
      concept:'Kegiatan ekonomi masyarakat sangat dipengaruhi oleh kondisi alam tempat tinggal mereka.',
      steps:['Daerah pantai = dekat laut.','Sumber daya utama = ikan dan hasil laut.','Maka mata pencaharian utama = <b>nelayan</b>.']};
  },
  ekonomi_pegunungan:()=>{
    const cor='Bertani sayuran dan teh';
    const {opts,ans}=mkOpts(cor,['Menangkap ikan tuna','Membuat garam','Mencari mutiara']);
    return {type:'mcq',topic:'kegiatan_ekonomi',
      q:'Kegiatan ekonomi yang sesuai untuk masyarakat di daerah <b>pegunungan</b> adalah ___.',
      opts,ans,
      hint:'Pegunungan berhawa sejuk dan tanahnya subur.',
      concept:'Daerah pegunungan cocok untuk pertanian sayur, teh, dan kopi karena hawanya sejuk.',
      steps:['Pegunungan = sejuk, tanah subur.','Tanaman cocok = sayur, teh, kopi, stroberi.']};
  },
  ekonomi_produksi:()=>{
    const cor='Petani menanam padi di sawah';
    const {opts,ans}=mkOpts(cor,['Ibu membeli sayur di pasar','Ali mengantar barang ke toko','Toko menjual roti ke pembeli']);
    return {type:'mcq',topic:'kegiatan_ekonomi',
      q:'Contoh kegiatan <b>produksi</b> adalah ___.',
      opts,ans,
      hint:'Produksi = menghasilkan barang atau jasa.',
      concept:'Tiga kegiatan ekonomi utama: produksi (menghasilkan), distribusi (menyalurkan), konsumsi (memakai).',
      steps:['Produksi = membuat/menghasilkan barang.','Petani menanam padi → menghasilkan beras.','Maka itu kegiatan produksi.']};
  },
  ekonomi_distribusi:()=>{
    const cor='Sopir truk mengantar barang ke toko';
    const {opts,ans}=mkOpts(cor,['Pengrajin membuat tas','Ayah makan siang','Petani memanen jagung']);
    return {type:'mcq',topic:'kegiatan_ekonomi',
      q:'Contoh kegiatan <b>distribusi</b> adalah ___.',
      opts,ans,
      hint:'Distribusi = menyalurkan barang dari produsen ke konsumen.',
      concept:'Distribusi adalah kegiatan menyalurkan barang/jasa dari produsen ke konsumen.',
      steps:['Distribusi = menyalurkan barang.','Sopir truk mengantar barang = menyalurkan.','Jadi itu kegiatan distribusi.']};
  },
  ekonomi_konsumsi:()=>{
    const cor='Ibu membeli sayur untuk dimasak';
    const {opts,ans}=mkOpts(cor,['Nelayan menjala ikan','Pengrajin membuat keramik','Sopir mengirim paket']);
    return {type:'mcq',topic:'kegiatan_ekonomi',
      q:'Contoh kegiatan <b>konsumsi</b> adalah ___.',
      opts,ans,
      hint:'Konsumsi = memakai atau menghabiskan barang/jasa.',
      concept:'Konsumsi adalah kegiatan memakai/menghabiskan barang atau jasa untuk memenuhi kebutuhan.',
      steps:['Konsumsi = memakai barang.','Membeli sayur untuk dimasak = akan dipakai/dimakan.']};
  },
  ekonomi_dataran_rendah:()=>{
    const cor='Bertani padi';
    const {opts,ans}=mkOpts(cor,['Berkebun teh','Mencari ikan tuna','Menambang emas']);
    return {type:'mcq',topic:'kegiatan_ekonomi',
      q:'Kegiatan ekonomi utama masyarakat di daerah <b>dataran rendah</b> umumnya adalah ___.',
      opts,ans,
      hint:'Sawah banyak ditemukan di dataran rendah.',
      concept:'Dataran rendah memiliki tanah subur dan air cukup, cocok untuk padi.',
      steps:['Dataran rendah = banyak sawah.','Tanaman utama = padi.']};
  },
  fill_ekonomi_nelayan:()=>({type:'fill',topic:'kegiatan_ekonomi',
    q:'Penduduk yang tinggal di pantai sebagian besar bermata pencaharian sebagai ___.',
    answers:['nelayan'],
    display:'nelayan',
    hint:'Pekerjaan yang berhubungan dengan menangkap ikan di laut.',
    concept:'Nelayan adalah pekerjaan utama masyarakat pesisir/pantai.',
    steps:['Pantai → laut → ikan → <b>nelayan</b>.']}),
  fill_ekonomi_produksi:()=>({type:'fill',topic:'kegiatan_ekonomi',
    q:'Kegiatan menghasilkan barang atau jasa disebut ___.',
    answers:['produksi'],
    display:'produksi',
    hint:'Kebalikan dari konsumsi.',
    concept:'Produksi = membuat/menghasilkan barang atau jasa.',
    steps:['Menghasilkan barang = <b>produksi</b>.']}),
  fill_ekonomi_konsumen:()=>({type:'fill',topic:'kegiatan_ekonomi',
    q:'Orang yang memakai atau menggunakan barang dan jasa disebut ___.',
    answers:['konsumen'],
    display:'konsumen',
    hint:'Lawan kata dari produsen.',
    concept:'Konsumen adalah pihak yang menggunakan barang/jasa untuk memenuhi kebutuhan.',
    steps:['Pemakai barang/jasa = <b>konsumen</b>.']}),

  // ── FAKTOR PENDUKUNG PEREKONOMIAN DAERAH ─────────────────────
  faktor_sda:()=>{
    const cor='Sumber daya alam yang melimpah';
    const {opts,ans}=mkOpts(cor,['Cuaca yang panas','Jumlah turis asing','Banyaknya gunung berapi']);
    return {type:'mcq',topic:'faktor_ekonomi',
      q:'Faktor utama yang mendukung perekonomian suatu daerah adalah ___.',
      opts,ans,
      hint:'Faktor yang langsung memberi bahan baku produksi.',
      concept:'Sumber daya alam (SDA) menjadi modal utama perekonomian daerah, seperti hasil tani, tambang, dan laut.',
      steps:['Daerah yang kaya SDA → banyak bahan baku.','Bahan baku → produksi → ekonomi tumbuh.']};
  },
  faktor_sdm:()=>{
    const cor='Sumber Daya Manusia (SDM)';
    const {opts,ans}=mkOpts(cor,['Sumber Daya Asing','Sumber Daya Mineral','Sumber Daya Mesin']);
    return {type:'mcq',topic:'faktor_ekonomi',
      q:'Tenaga kerja yang terampil dan berpendidikan termasuk dalam ___.',
      opts,ans,
      hint:'Faktor yang berhubungan dengan manusia.',
      concept:'SDM (Sumber Daya Manusia) yang berkualitas mendukung perekonomian melalui produktivitas dan inovasi.',
      steps:['Tenaga kerja = manusia.','Manusia = <b>SDM</b>.']};
  },

// CHAPTERS
// ════════════════════════════════════════════════════════════════
const CHAPTERS = {
  '1': {title:'Bab 8 · Peran Ekonomi', gen: BAB8_GEN},
  '2': {title:'Bab 9 · Perubahan Kenampakan Alam', gen: BAB9_GEN},
};

// UAS kisi-kisi: total = 20 PG + 10 Isian + 5 Uraian = 35
// Distribution: 10 PG + 5 Isian + 2-3 Uraian per bab
const UAS_KISI = [
  // BAB 8
  {topic:'warisan_budaya', type:'mcq', n:2, chapter:'Bab 8'},
  {topic:'kegiatan_ekonomi', type:'mcq', n:2, chapter:'Bab 8'},
  {topic:'faktor_ekonomi', type:'mcq', n:2, chapter:'Bab 8'},
  {topic:'produk_unggulan', type:'mcq', n:2, chapter:'Bab 8'},
  {topic:'bencana_alam', type:'mcq', n:2, chapter:'Bab 8'},
  {topic:'warisan_budaya', type:'fill', n:1, chapter:'Bab 8'},
  {topic:'kegiatan_ekonomi', type:'fill', n:1, chapter:'Bab 8'},
  {topic:'faktor_ekonomi', type:'fill', n:1, chapter:'Bab 8'},
  {topic:'produk_unggulan', type:'fill', n:1, chapter:'Bab 8'},
  {topic:'bencana_alam', type:'fill', n:1, chapter:'Bab 8'},
  {topic:'produk_unggulan', type:'essay', n:1, chapter:'Bab 8'},
  {topic:'warisan_budaya', type:'essay', n:1, chapter:'Bab 8'},
  {topic:'kegiatan_ekonomi', type:'essay', n:1, chapter:'Bab 8'},

  // BAB 9
  {topic:'sampah_lingkungan', type:'mcq', n:4, chapter:'Bab 9'},
  {topic:'aktivitas_manusia', type:'mcq', n:4, chapter:'Bab 9'},
  {topic:'perubahan_alam', type:'mcq', n:2, chapter:'Bab 9'},
  {topic:'sampah_lingkungan', type:'fill', n:2, chapter:'Bab 9'},
  {topic:'aktivitas_manusia', type:'fill', n:2, chapter:'Bab 9'},
  {topic:'perubahan_alam', type:'fill', n:1, chapter:'Bab 9'},
  {topic:'aktivitas_manusia', type:'essay', n:1, chapter:'Bab 9'},
  {topic:'sampah_lingkungan', type:'essay', n:1, chapter:'Bab 9'},
];

const ALL_GENS = {...BAB8_GEN, ...BAB9_GEN};

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let queue=[], current=null, idx=0, total=0;
let stats={correct:0, wrong:0, done:0};
let lastResult=null;
let currentChapterTitle = null;
let isUAS = false;
let uasBreakdown = {};

// ── Auto-Weak-Practice state (kicks in when UAS finishes with acc < 90%) ──
let topicStats = {};
let isWeakPractice = false;
let smartScore = 0;
let originalUasAcc = 0;
let weakTopicSet = [];
let weakCount = 0;

function buildQueue(chKey){
  if(chKey === 'uas'){ buildUAS(); return; }
  isUAS = false;
  const ch = CHAPTERS[chKey] || CHAPTERS['1'];
  currentChapterTitle = ch.title;
  const keys = shuf(Object.keys(ch.gen));
  let qs = keys.map(k => ch.gen[k]());
  // Order: mcq → fill → essay
  const typeOrder = {mcq:0, fill:1, essay:2};
  qs.sort((a,b)=>(typeOrder[a.type]??9) - (typeOrder[b.type]??9));
  queue = qs;
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  updateHeader();
  updateScore();
  next();
}

function buildUAS(){
  isUAS = true;
  currentChapterTitle = 'UAS — Ujian Akhir Semester (35 Soal)';
  uasBreakdown = {};

  const byTopicType = {};
  for(const [key,fn] of Object.entries(ALL_GENS)){
    const sample = fn();
    const k = sample.topic + ':' + sample.type;
    (byTopicType[k] = byTopicType[k] || []).push(fn);
  }

  const built = [];
  for(const spec of UAS_KISI){
    const key = spec.topic + ':' + spec.type;
    const pool = byTopicType[key] || [];
    uasBreakdown[spec.chapter] = uasBreakdown[spec.chapter] || {correct:0,total:0};
    uasBreakdown[spec.chapter].total += spec.n;
    if(pool.length === 0){
      for(let i=0;i<spec.n;i++){
        built.push({type:spec.type,
          q:`[Soal hilang: ${spec.topic} / ${spec.type}]`,
          opts:['—','—','—','—'], ans:0,
          answers:['—'], display:'—', model:'—', keys:[],
          _chapter:spec.chapter, _topic:spec.topic});
      }
      continue;
    }
    const shuffled = shuf(pool);
    for(let i=0;i<spec.n;i++){
      const fn = shuffled[i % shuffled.length];
      const q = fn();
      q._chapter = spec.chapter;
      q._topic = spec.topic;
      built.push(q);
    }
  }

  // Order: MCQ → FILL → ESSAY (preserve chapter order within each block)
  const typeOrder = {mcq:0, fill:1, essay:2};
  built.sort((a,b)=> (typeOrder[a.type]??9) - (typeOrder[b.type]??9));

  queue = built;
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  updateHeader();
  updateScore();
  next();
}

function updateHeader(){
  document.getElementById('hdrTitle').textContent = '🌏 ' + (currentChapterTitle || 'Latihan IPS');
}

function updateScore(){
  document.getElementById('sCorrect').textContent = stats.correct;
  document.getElementById('sWrong').textContent = stats.wrong;
  document.getElementById('sDone').textContent = stats.done;
  const pct = total>0 ? (stats.done/total)*100 : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progText').textContent = `${stats.done} / ${total}`;
  if(isWeakPractice){
    document.getElementById('progFill').style.width = smartScore + '%';
    document.getElementById('progText').textContent = 'SmartScore: ' + smartScore + '/100';
    document.getElementById('hdrMeta').textContent = 'Latihan area lemah · Soal ' + (idx+1);
  } else {
    document.getElementById('hdrMeta').textContent = 'Soal ' + Math.min(idx+1,total) + ' dari ' + total;
  }
}

// ── Auto-Weak-Practice helpers ──
function _genKeysForTopics(topicSet){
  const out = [];
  for(const [key, fn] of Object.entries(ALL_GENS)){
    try { const s = fn(); if(topicSet.includes(s.topic)) out.push(key); } catch(e){}
  }
  return out;
}
function enterWeakPractice(acc){
  weakTopicSet = Object.keys(topicStats).filter(tp => topicStats[tp].wrong > 0);
  if(weakTopicSet.length === 0) weakTopicSet = Object.keys(topicStats);
  if(weakTopicSet.length === 0){
    const tset = new Set();
    for(const fn of Object.values(ALL_GENS)){ try { tset.add(fn().topic); } catch(e){} }
    weakTopicSet = Array.from(tset);
  }
  isWeakPractice = true;
  originalUasAcc = acc;
  smartScore = acc;
  weakCount = 0;
  stats = {correct:0, wrong:0, done:0};
  idx = 0;
  const pool = _genKeysForTopics(weakTopicSet);
  const usePool = pool.length > 0 ? pool : Object.keys(ALL_GENS);
  const built = [];
  const shuffled = shuf(usePool);
  for(let i=0;i<8;i++){
    const k = shuffled[i % shuffled.length];
    const q = ALL_GENS[k]();
    q._weak = true;
    built.push(q);
  }
  queue = built;
  total = queue.length;
  document.getElementById('quizSlot').innerHTML = `
    <div class="q-card done">
      <h2>🎯 Saatnya naik level!</h2>
      <p>Kamu dapat <strong>${acc}%</strong> di UAS — yuk kuasai topik yang masih lemah!</p>
      <p style="opacity:.75;font-size:.9rem">Latihan berlanjut sampai SmartScore 100.</p>
      <button class="restart-btn" id="startWeakBtn">Mulai Latihan Area Lemah →</button>
    </div>`;
  document.getElementById('startWeakBtn').addEventListener('click', ()=>{ updateScore(); next(); });
}
function refillWeakQueue(){
  const pool = _genKeysForTopics(weakTopicSet);
  const usePool = pool.length > 0 ? pool : Object.keys(ALL_GENS);
  const weighted = usePool.map(k => {
    let w = 1;
    try {
      const tp = ALL_GENS[k]().topic;
      const st = topicStats[tp] || {wrong:0,correct:0,recentWrong:[]};
      const recent = (st.recentWrong||[]).slice(-3).reduce((a,b)=>a+b,0);
      w = 1 + 2*st.wrong + 3*recent;
    } catch(e){}
    return {k, w};
  });
  const totalW = weighted.reduce((s,x)=>s+x.w, 0) || 1;
  for(let i=0;i<5;i++){
    let r = Math.random()*totalW, pickKey = weighted[0].k;
    for(const w of weighted){ r -= w.w; if(r <= 0){ pickKey = w.k; break; } }
    const q = ALL_GENS[pickKey]();
    q._weak = true;
    queue.push(q);
  }
  total = queue.length;
}

function next(){
  if(idx >= total){
    if(isWeakPractice && smartScore < 100){
      refillWeakQueue();
      current = queue[idx];
      lastResult = null;
      renderQuestion();
      updateScore();
      return;
    }
    if(isUAS && !isWeakPractice){
      const acc = total>0 ? Math.round((stats.correct/total)*100) : 0;
      if(acc < 90){ enterWeakPractice(acc); return; }
    }
    renderDone();
    return;
  }
  current = queue[idx];
  lastResult = null;
  renderQuestion();
  updateScore();
}

// ════════════════════════════════════════════════════════════════
// RENDERERS
// ════════════════════════════════════════════════════════════════
function renderQuestion(){
  const slot = document.getElementById('quizSlot');
  let inner = '';
  switch(current.type){
    case 'mcq':   inner = mcqHtml(current); break;
    case 'fill':  inner = fillHtml(current); break;
    case 'essay': inner = essayHtml(current); break;
  }
  slot.innerHTML = `<div class="q-card">${inner}</div>`;
  switch(current.type){
    case 'mcq':   attachMCQ(); break;
    case 'fill':  attachFill(); break;
    case 'essay': attachEssay(); break;
  }
  attachHint();
}

function badgeFor(typ){
  const labels = {
    mcq:'📝 Pilihan Ganda',
    fill:'📋 Isian Singkat',
    essay:'📖 Uraian'
  };
  return `<span class="q-badge ${typ}">${labels[typ]}</span>`;
}

function hintBlock(q){
  if(!q.hint) return '';
  return `<div class="hint-row">
    <button class="hint-btn" id="hintBtn">💡 Tampilkan Petunjuk</button>
    <div class="hint-box" id="hintBox">${t(q.hint)}</div>
  </div>`;
}

function feedbackBlock(){ return `<div class="fb" id="fb"></div>`; }

// ── MCQ ─────────────────────────────────────────────────────────
function mcqHtml(q){
  const letters=['A','B','C','D'];
  const opts = q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="opt-letter">${letters[i]}</span><span>${t(o)}</span></button>`).join('');
  return `${badgeFor('mcq')}<div class="q-text">${t(q.q)}</div><div class="opts">${opts}</div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachMCQ(){
  document.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = parseInt(b.dataset.i);
      checkAnswer(i === current.ans, ()=>{
        document.querySelectorAll('.opt').forEach((btn,j)=>{
          btn.disabled = true;
          if(j === current.ans) btn.classList.add('correct');
          else if(j === i) btn.classList.add('wrong');
        });
      });
    });
  });
}

// ── FILL ────────────────────────────────────────────────────────
function fillHtml(q){
  return `${badgeFor('fill')}<div class="q-text">${t(q.q)}</div>
    <div class="fill-row">
      <input type="text" class="fill-input" id="fillInp" placeholder="Ketik jawabanmu…" autocomplete="off"/>
      <button class="fill-submit" id="fillSub">Periksa</button>
    </div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachFill(){
  const inp = document.getElementById('fillInp');
  const sub = document.getElementById('fillSub');
  inp.focus();
  const submit = ()=>{
    const u = norm(inp.value);
    if(!u){ inp.focus(); return; }
    const ok = current.answers.some(a => norm(a) === u);
    checkAnswer(ok, ()=>{
      inp.disabled = true; sub.disabled = true;
      inp.style.borderColor = ok ? '#16a34a' : '#dc2626';
      inp.style.background = ok ? '#f0fdf4' : '#fef2f2';
    });
  };
  sub.addEventListener('click', submit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

// ── ESSAY ───────────────────────────────────────────────────────
function essayHtml(q){
  return `${badgeFor('essay')}<div class="q-text">${t(q.q)}</div>
    <textarea class="essay-area" id="essayInp" placeholder="Tulis jawabanmu dengan kata-katamu sendiri…"></textarea>
    <button class="essay-show" id="essayShow">📋 Tampilkan Jawaban Contoh</button>
    <div class="essay-self" id="essaySelf">
      <button class="got" data-v="1">✓ Saya benar</button>
      <button class="miss" data-v="0">✗ Perlu belajar lagi</button>
    </div>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachEssay(){
  const area = document.getElementById('essayInp');
  const show = document.getElementById('essayShow');
  const self = document.getElementById('essaySelf');
  const fb = document.getElementById('fb');
  show.addEventListener('click', ()=>{
    if(area.value.trim().length < 5){
      fb.className='fb info show';
      fb.innerHTML = `<strong>Tulis jawabanmu dulu</strong> — minimal satu atau dua kalimat. Lalu klik "Tampilkan Jawaban Contoh" untuk membandingkan.`;
      return;
    }
    area.disabled = true;
    show.style.display = 'none';
    const u = norm(area.value);
    const hits = (current.keys||[]).filter(k => u.includes(norm(k))).length;
    const ttl = (current.keys||[]).length || 1;
    fb.className = 'fb info show';
    fb.innerHTML = `<strong>📋 Jawaban Contoh:</strong><br><br>${t(current.model)}<br><br><small>🔍 Jawabanmu memuat <strong>${hits} dari ${ttl}</strong> konsep kunci. Bandingkan dengan contoh, lalu nilai jujur:</small>`;
    self.classList.add('show');
  });
  self.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const ok = b.dataset.v === '1';
      self.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.style.background = ok ? '#f0fdf4' : '#fff5f0';
      registerResult(ok);
      if(current.concept){
        fb.innerHTML += `<div class="concept-box">💡 ${t(current.concept)}</div>`;
      }
      setTimeout(()=>{ idx++; next(); }, 1600);
    });
  });
}

function attachHint(){
  const btn = document.getElementById('hintBtn');
  const box = document.getElementById('hintBox');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    box.classList.toggle('show');
    btn.textContent = box.classList.contains('show')
      ? '🙈 Sembunyikan Petunjuk'
      : '💡 Tampilkan Petunjuk';
  });
}

// ════════════════════════════════════════════════════════════════
// ANSWER CHECK
// ════════════════════════════════════════════════════════════════
function registerResult(ok){
  if(lastResult !== null) return;
  lastResult = ok ? 'correct' : 'wrong';
  if(ok) stats.correct++; else stats.wrong++;
  stats.done++;
  if(isUAS && current._chapter){
    uasBreakdown[current._chapter] = uasBreakdown[current._chapter] || {correct:0,total:0};
    if(ok) uasBreakdown[current._chapter].correct++;
  }
  const tp = (current && (current._topic || current.topic)) || null;
  if(tp){
    topicStats[tp] = topicStats[tp] || {correct:0, wrong:0, recentWrong:[]};
    if(ok){ topicStats[tp].correct++; topicStats[tp].recentWrong.push(0); }
    else  { topicStats[tp].wrong++;   topicStats[tp].recentWrong.push(1); }
    if(topicStats[tp].recentWrong.length > 5) topicStats[tp].recentWrong.shift();
  }
  if(isWeakPractice){
    weakCount++;
    if(ok) smartScore = Math.min(100, smartScore + 5);
    else   smartScore = Math.max(0,   smartScore - 3);
  }
  updateScore();
}

function checkAnswer(ok, lockFn){
  registerResult(ok);
  if(lockFn) lockFn();
  const fb = document.getElementById('fb');
  const stepsArr = current.steps ? (Array.isArray(current.steps) ? current.steps : t(current.steps)) : [];
  const stepsHtml = (stepsArr||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('');
  const conceptHtml = current.concept ? `<div class="concept-box">💡 ${t(current.concept)}</div>` : '';
  if(ok){
    fb.className = 'fb correct show';
    fb.innerHTML = `<strong>✅ Benar! Bagus sekali!</strong>${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
    if(stats.correct>0 && stats.correct%3===0) confetti();
  } else {
    fb.className = 'fb wrong show';
    let correctText = '';
    if(current.type==='mcq') correctText = t(current.opts[current.ans]);
    else if(current.type==='fill') correctText = current.display ? t(current.display) : current.answers[0];
    fb.innerHTML = `<strong>❌ Belum tepat.</strong> Jawaban yang benar adalah <strong>${correctText}</strong>.${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
  }
  setTimeout(()=>{
    const nxt = document.createElement('button');
    nxt.className = 'restart-btn';
    nxt.style.marginTop = '16px';
    nxt.style.padding = '10px 24px';
    nxt.style.fontSize = '.88rem';
    const willContinue = isWeakPractice && smartScore < 100;
    nxt.textContent = (idx+1 >= total && !willContinue) ? '🏁 Lihat Hasil' : 'Soal Berikutnya →';
    nxt.onclick = ()=>{ idx++; next(); };
    fb.appendChild(nxt);
  }, 300);
}

// ════════════════════════════════════════════════════════════════
// DONE SCREEN
// ════════════════════════════════════════════════════════════════
function renderDone(){
  if(isWeakPractice && smartScore >= 100){
    document.getElementById('quizSlot').innerHTML = `
      <div class="q-card done">
        <h2>🏆 Mantap!</h2>
        <p>Kamu mencapai 100% setelah berlatih area lemah.</p>
        <div class="done-stats">
          <div class="done-stat"><strong>${originalUasAcc}%</strong><span>Skor UAS</span></div>
          <div class="done-stat"><strong>100/100</strong><span>SmartScore</span></div>
          <div class="done-stat"><strong>${weakCount}</strong><span>Soal latihan area lemah</span></div>
        </div>
        <button class="restart-btn" onclick="location.reload()">🔄 Coba Lagi</button>
        <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#b45309;font-weight:700;text-decoration:none">← Kembali ke daftar bab</a></p>
      </div>`;
    for(let i=0;i<5;i++) setTimeout(confetti, i*250);
    return;
  }
  const pct = total>0 ? Math.round((stats.correct/total)*100) : 0;
  const msg = pct>=80 ? '🎉 Luar biasa!' : pct>=60 ? '👍 Kerja bagus!' : pct>=40 ? '💪 Terus berlatih!' : '📚 Saatnya belajar lagi!';

  let breakdownHtml = '';
  if(isUAS){
    const rows = Object.entries(uasBreakdown).map(([ch,v])=>{
      const ratio = v.total>0 ? (v.correct/v.total) : 0;
      const cls = ratio < 0.5 ? 'low' : '';
      return `<div class="breakdown-row"><span class="bd-label">${ch}</span><span class="bd-score ${cls}">${v.correct} / ${v.total}</span></div>`;
    }).join('');
    breakdownHtml = `<div class="breakdown"><h4>📊 Skor per Bab</h4>${rows}</div>`;
  }

  const greatWorkNote = (isUAS && !isWeakPractice && pct>=90)
    ? `<p style="margin-top:8px;color:#16a34a;font-weight:600">✨ Mantap — tidak perlu latihan area lemah!</p>` : '';

  document.getElementById('quizSlot').innerHTML = `
    <div class="q-card done">
      <h2>${msg}</h2>
      <p>Kamu menyelesaikan <strong>${total}</strong> soal.</p>
      ${greatWorkNote}
      <div class="done-stats">
        <div class="done-stat"><strong>${stats.correct}</strong><span>Benar</span></div>
        <div class="done-stat"><strong>${stats.wrong}</strong><span>Salah</span></div>
        <div class="done-stat"><strong>${pct}%</strong><span>Skor</span></div>
      </div>
      ${breakdownHtml}
      <button class="restart-btn" onclick="location.reload()">🔄 Coba Lagi</button>
      <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#b45309;font-weight:700;text-decoration:none">← Kembali ke daftar bab</a></p>
    </div>`;
  if(pct>=70) for(let i=0;i<3;i++) setTimeout(confetti, i*250);
}

function confetti(){
  const colors=['#d97706','#b45309','#f9ca24','#92400e','#fbbf24','#fde68a'];
  for(let i=0;i<24;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=pick(colors);
    c.style.left=(Math.random()*100)+'vw';
    c.style.top='-20px';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    c.style.borderRadius=Math.random()<0.5?'50%':'2px';
    document.body.appendChild(c);
    const dx=(Math.random()-0.5)*200;
    const dur=1500+Math.random()*1000;
    c.animate([{transform:c.style.transform,opacity:1,top:'-20px'},
               {transform:`translate(${dx}px,${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:0,top:`${window.innerHeight+40}px`}],
              {duration:dur,easing:'cubic-bezier(.3,.7,.4,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}
