<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Practice — AzEnglish</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#fff0f4 0%,#ffe8ee 100%);min-height:100vh;display:flex;flex-direction:column;color:#1a1a2e}

.hdr{background:linear-gradient(135deg,#ec4899,#f43f5e 50%,#f97316);color:#fff;padding:18px 20px;position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr-back{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:18px;font-size:.78rem;font-weight:800;text-decoration:none}
.hdr-back:hover{background:rgba(255,255,255,.28)}
.hdr-title{font-size:1.1rem;font-weight:900;letter-spacing:-.3px;flex:1}
.hdr-meta{font-size:.78rem;font-weight:700;opacity:.9;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:16px}
.lang-toggle{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:18px;font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit}
.lang-toggle:hover{background:rgba(255,255,255,.28)}

.progress-wrap{background:#fff;padding:10px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.progress{display:flex;gap:4px;align-items:center}
.progress-bar{flex:1;height:8px;background:#ffe4e6;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ec4899,#f97316);border-radius:5px;transition:width .35s ease}
.progress-text{font-size:.78rem;font-weight:800;color:#ec4899;min-width:75px;text-align:right}

.score-row{display:flex;gap:10px;margin:14px auto 0;max-width:720px;padding:0 16px;flex-wrap:wrap}
.score-chip{flex:1;min-width:0;background:#fff;border-radius:14px;padding:10px 12px;text-align:center;border:1.5px solid #f3e8ec;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#666}
.score-chip strong{display:block;font-size:1.3rem;letter-spacing:-.5px;margin-bottom:2px;color:#1a1a2e;text-transform:none}
.score-chip.correct{border-color:#10b981;background:#ecfdf5}
.score-chip.correct strong{color:#10b981}
.score-chip.wrong{border-color:#d63031;background:#fff5f5}
.score-chip.wrong strong{color:#d63031}
.score-chip.answered{border-color:#ec4899;background:#fdf2f8}
.score-chip.answered strong{color:#ec4899}

.main{max-width:720px;margin:18px auto 0;padding:0 16px 80px;width:100%}
.q-card{background:#fff;border-radius:24px;padding:30px 26px 24px;box-shadow:0 8px 32px rgba(236,72,153,.13)}
.q-badge{display:inline-block;background:#fce7f3;color:#be185d;font-size:.7rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:14px;margin-bottom:14px}
.q-badge.mcq{background:#fce7f3;color:#be185d}
.q-badge.fill{background:#f0eeff;color:#6c5ce7}
.q-badge.essay{background:#ecfdf5;color:#10b981}

.q-text{font-size:1.05rem;line-height:1.6;background:#fdf2f8;border-left:4px solid #ec4899;padding:14px 18px;border-radius:8px;margin-bottom:18px}
.q-text strong{font-weight:800}
.q-text i{font-style:italic;color:#be185d;font-weight:700}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid #f3e8ec;border-radius:14px;padding:14px 18px;cursor:pointer;font-size:.95rem;display:flex;align-items:center;gap:14px;transition:all .15s;font-family:inherit;text-align:left;width:100%;color:inherit}
.opt:hover:not(:disabled){border-color:#ec4899;background:#fdf2f8}
.opt-letter{width:30px;height:30px;border-radius:50%;background:#fce7f3;color:#be185d;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.opt:disabled{cursor:not-allowed}
.opt.correct{border-color:#10b981;background:#ecfdf5}
.opt.correct .opt-letter{background:#10b981;color:#fff}
.opt.wrong{border-color:#d63031;background:#fff5f5}
.opt.wrong .opt-letter{background:#d63031;color:#fff}

.fill-row{display:flex;gap:10px;align-items:stretch}
.fill-input{flex:1;font-family:inherit;font-size:1rem;font-weight:700;padding:14px 18px;border:2px dashed #6c5ce7;border-radius:14px;background:#faf9ff;color:#1a1a2e;outline:none}
.fill-input:focus{border-style:solid;border-color:#ec4899;background:#fff;box-shadow:0 0 0 3px rgba(236,72,153,.2)}
.fill-input:disabled{opacity:.85;background:#f8f9fb}
.fill-submit{background:linear-gradient(135deg,#ec4899,#f97316);color:#fff;border:none;border-radius:14px;padding:0 24px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s;white-space:nowrap}
.fill-submit:hover:not(:disabled){opacity:.88}
.fill-submit:disabled{cursor:not-allowed;opacity:.5}

.essay-area{width:100%;font-family:inherit;font-size:.95rem;padding:14px 16px;border:2px dashed #6c5ce7;border-radius:14px;background:#faf9ff;color:#1a1a2e;outline:none;resize:vertical;min-height:100px;line-height:1.5}
.essay-area:focus{border-style:solid;border-color:#ec4899;background:#fff;box-shadow:0 0 0 3px rgba(236,72,153,.2)}
.essay-area:disabled{opacity:.85;background:#f8f9fb}
.essay-show{margin-top:12px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:14px;padding:11px 22px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s}
.essay-show:hover:not(:disabled){opacity:.88}
.essay-self{display:none;gap:10px;margin-top:12px}
.essay-self.show{display:flex}
.essay-self button{flex:1;border:2px solid;border-radius:14px;padding:12px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;background:#fff}
.essay-self .got{border-color:#10b981;color:#10b981}
.essay-self .got:hover{background:#ecfdf5}
.essay-self .miss{border-color:#e17055;color:#e17055}
.essay-self .miss:hover{background:#fff5f0}

.fb{border-radius:14px;padding:16px 18px;margin-top:16px;font-size:.92rem;line-height:1.6;display:none}
.fb.show{display:block}
.fb.correct{background:#ecfdf5;border:1.5px solid #10b981;color:#065f46}
.fb.wrong{background:#fff5f5;border:1.5px solid #d63031;color:#a30000}
.fb.info{background:#fdf2f8;border:1.5px solid #ec4899;color:#831843}
.fb strong{font-weight:900}
.steps{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:.88rem}
.step-num{width:22px;height:22px;border-radius:50%;background:#10b981;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.78rem;flex-shrink:0}
.concept-box{margin-top:12px;background:#fffbe8;border:1.5px solid #f9ca24;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#7c5e02}

.hint-row{margin-top:14px}
.hint-btn{background:transparent;border:1.5px dashed #f9ca24;color:#b7760a;font-family:inherit;font-size:.85rem;font-weight:800;padding:8px 16px;border-radius:14px;cursor:pointer}
.hint-btn:hover{background:#fffbe8}
.hint-box{display:none;background:#fffbe8;border:1.5px solid #f9ca24;border-radius:10px;padding:10px 14px;font-size:.86rem;color:#7c5e02;margin-top:10px}
.hint-box.show{display:block}

.done{text-align:center;padding:40px 20px}
.done h2{font-size:2rem;font-weight:900;margin-bottom:10px;background:linear-gradient(135deg,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.done p{color:#666;margin-bottom:24px;line-height:1.6}
.done-stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.done-stat{text-align:center}
.done-stat strong{display:block;font-size:2.2rem;font-weight:900;color:#1a1a2e}
.done-stat span{font-size:.75rem;font-weight:800;color:#888;text-transform:uppercase;letter-spacing:1px}
.restart-btn{background:linear-gradient(135deg,#ec4899,#f97316);color:#fff;border:none;border-radius:24px;padding:14px 32px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(236,72,153,.4)}
.restart-btn:hover{opacity:.92}

.breakdown{text-align:left;background:#fdf2f8;border-radius:14px;padding:14px 18px;margin:0 auto 22px;max-width:480px}
.breakdown h4{font-size:.85rem;font-weight:900;margin-bottom:10px;color:#be185d;letter-spacing:.5px;text-transform:uppercase}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #f3e8ec;font-size:.88rem}
.breakdown-row:last-child{border-bottom:none}
.breakdown-row .bd-label{font-weight:700;color:#333;flex:1}
.breakdown-row .bd-score{font-weight:800;color:#10b981}
.breakdown-row .bd-score.low{color:#d63031}

.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1000}

@media(max-width:520px){
  .q-card{padding:22px 18px 18px}
  .q-text{font-size:.95rem;padding:12px 14px}
  .opt{padding:12px 14px;font-size:.9rem}
  .hdr-title{font-size:.95rem}
  .score-chip{font-size:.65rem;padding:8px}
  .score-chip strong{font-size:1.1rem}
  .fill-row{flex-direction:column}
  .fill-submit{padding:12px}
  .lang-toggle{padding:5px 9px;font-size:.7rem}
}
</style>
</head>
<body>

<div class="hdr">
  <a class="hdr-back" href="../">← All</a>
  <div class="hdr-title" id="hdrTitle">📚 English Practice</div>
  <button class="lang-toggle" id="langBtn" onclick="toggleLang()">🌐 ID</button>
  <div class="hdr-meta" id="hdrMeta">Question 1</div>
</div>

<div class="progress-wrap">
  <div class="progress">
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <div class="progress-text" id="progText">0 / 0</div>
  </div>
</div>

<div class="score-row">
  <div class="score-chip correct"><strong id="sCorrect">0</strong><span id="lblCorrect">✓ Correct</span></div>
  <div class="score-chip wrong"><strong id="sWrong">0</strong><span id="lblWrong">✗ Wrong</span></div>
  <div class="score-chip answered"><strong id="sDone">0</strong><span id="lblDone">📝 Answered</span></div>
</div>

<div class="main">
  <div id="quizSlot"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const norm=s=>String(s||'').trim().toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ');

let lang = localStorage.getItem('azeng_lang') || 'en';
function t(obj){
  if(obj==null) return '';
  if(typeof obj==='string') return obj;
  if(Array.isArray(obj)) return obj.map(t);
  if(typeof obj==='object' && ('en' in obj || 'id' in obj)) return obj[lang] || obj.en || obj.id || '';
  return obj;
}
function toggleLang(){
  lang = lang==='en' ? 'id' : 'en';
  localStorage.setItem('azeng_lang', lang);
  updateLangUI();
  if(current) renderQuestion();
}
function updateLangUI(){
  document.getElementById('langBtn').textContent = lang==='en' ? '🌐 ID' : '🌐 EN';
  document.getElementById('lblCorrect').textContent = lang==='en' ? '✓ Correct' : '✓ Benar';
  document.getElementById('lblWrong').textContent = lang==='en' ? '✗ Wrong' : '✗ Salah';
  document.getElementById('lblDone').textContent = lang==='en' ? '📝 Answered' : '📝 Dijawab';
  document.getElementById('hdrTitle').textContent = '📚 ' + (currentChapterTitle ? t(currentChapterTitle) : (lang==='en'?'English Practice':'Latihan Bahasa Inggris'));
  document.getElementById('hdrMeta').textContent = (lang==='en'?'Question ':'Soal ') + Math.min(idx+1,total) + (lang==='en'?' of ':' dari ') + total;
}

function mkOpts(correct, distractors){
  const all=[correct, ...distractors].slice(0,4);
  while(all.length<4) all.push({en:'—',id:'—'});
  const sh=shuf(all);
  return {opts:sh, ans:sh.indexOf(correct)};
}

// ════════════════════════════════════════════════════════════════
// MODULE 7 — Let's help (verb maybe, future will, vocab)
// Topics: m7_maybe, m7_will, m7_vocab
// ════════════════════════════════════════════════════════════════
const M7_GEN = {
  m7_will_basic:()=>{
    const cor={en:'will help',id:'will help'};
    const{opts,ans}=mkOpts(cor,[
      {en:'helps',id:'helps'},
      {en:'helped',id:'helped'},
      {en:'helping',id:'helping'}]);
    return{type:'mcq',topic:'m7_will',
      q:{en:'Choose the correct form: "Tomorrow, I ___ the children clean the park."',
         id:'Pilih bentuk yang benar: "Tomorrow, I ___ the children clean the park."'},
      opts,ans,
      hint:{en:'"Tomorrow" signals the future. Use will + base verb.',
            id:'Kata "tomorrow" menandakan waktu mendatang. Gunakan will + kata kerja dasar.'},
      concept:{en:'Future "will" + base verb is used for promises and predictions.',
               id:'Future "will" + kata kerja dasar dipakai untuk janji dan prediksi.'},
      steps:{en:['"Tomorrow" → future time.','Use <b>will + base verb</b>: will help.'],
             id:['"Tomorrow" → waktu mendatang.','Gunakan <b>will + kata kerja dasar</b>: will help.']}};
  },
  m7_will_promise:()=>{
    const cor={en:"I'll bring some pills and vitamins.",id:"I'll bring some pills and vitamins."};
    const{opts,ans}=mkOpts(cor,[
      {en:'I bring some pills and vitamins.',id:'I bring some pills and vitamins.'},
      {en:'I bringing some pills and vitamins.',id:'I bringing some pills and vitamins.'},
      {en:'I brought some pills and vitamins.',id:'I brought some pills and vitamins.'}]);
    return{type:'mcq',topic:'m7_will',
      q:{en:'Sara is sick. You want to make a promise to visit her. Which sentence is correct?',
         id:'Sara sakit. Kamu ingin berjanji menjenguknya. Kalimat mana yang benar?'},
      opts,ans,
      hint:{en:'Promises in English use "I will" or the contraction "I\'ll".',
            id:'Janji dalam bahasa Inggris menggunakan "I will" atau singkatannya "I\'ll".'},
      concept:{en:'Use "will" (or "\'ll") for spontaneous promises and offers.',
               id:'Gunakan "will" (atau "\'ll") untuk janji dan tawaran spontan.'},
      steps:{en:['A promise → future tense.','Use <b>I\'ll + base verb</b>.'],
             id:['Janji → future tense.','Gunakan <b>I\'ll + kata kerja dasar</b>.']}};
  },
  m7_maybe_position:()=>{
    const cor={en:'Maybe I will join the charity event.',id:'Maybe I will join the charity event.'};
    const{opts,ans}=mkOpts(cor,[
      {en:'I will maybe join the charity event.',id:'I will maybe join the charity event.'},
      {en:'I will join maybe the charity event.',id:'I will join maybe the charity event.'},
      {en:'I will join the charity event maybe.',id:'I will join the charity event maybe.'}]);
    return{type:'mcq',topic:'m7_maybe',
      q:{en:'Where does "maybe" usually go in a sentence?',id:'Di posisi mana "maybe" biasanya diletakkan dalam kalimat?'},
      opts,ans,
      hint:{en:'"Maybe" usually starts the sentence.',id:'"Maybe" biasanya berada di awal kalimat.'},
      concept:{en:'"Maybe" is an adverb of possibility — usually placed at the beginning of a sentence.',
               id:'"Maybe" adalah kata keterangan kemungkinan — biasanya diletakkan di awal kalimat.'},
      steps:{en:['"Maybe" = perhaps / possibly.','Standard position: <b>at the start</b>.'],
             id:['"Maybe" = mungkin.','Posisi standar: <b>di awal kalimat</b>.']}};
  },
  m7_maybe_meaning:()=>{
    const cor={en:'mungkin / barangkali',id:'mungkin / barangkali'};
    const{opts,ans}=mkOpts(cor,[
      {en:'pasti',id:'pasti'},
      {en:'tidak pernah',id:'tidak pernah'},
      {en:'selalu',id:'selalu'}]);
    return{type:'mcq',topic:'m7_maybe',
      q:{en:'What is the meaning of "maybe" in "Maybe it will rain tomorrow"?',
         id:'Apa arti "maybe" pada kalimat "Maybe it will rain tomorrow"?'},
      opts,ans,
      hint:{en:'It shows something is not certain.',id:'Menunjukkan sesuatu yang belum pasti.'},
      concept:{en:'"Maybe" expresses possibility — something is not 100% sure.',
               id:'"Maybe" menyatakan kemungkinan — belum 100% pasti.'},
      steps:{en:['Maybe → expresses uncertainty.','Indonesian: <b>mungkin</b>.'],
             id:['Maybe → menyatakan ketidakpastian.','Bahasa Indonesia: <b>mungkin</b>.']}};
  },
  m7_vocab_raise:()=>{
    const cor={en:'raise money',id:'raise money'};
    const{opts,ans}=mkOpts(cor,[
      {en:'lift money',id:'lift money'},
      {en:'reach money',id:'reach money'},
      {en:'put away money',id:'put away money'}]);
    return{type:'mcq',topic:'m7_vocab',
      q:{en:'The children want to ___ for the homeless shelter by selling cookies.',
         id:'Anak-anak ingin ___ untuk panti tunawisma dengan menjual kue.'},
      opts,ans,
      hint:{en:'It means "collect money from people for a cause".',
            id:'Artinya "mengumpulkan uang untuk suatu tujuan".'},
      concept:{en:'"Raise money" = collect money for a charity or cause.',
               id:'"Raise money" = mengumpulkan uang untuk amal atau tujuan tertentu.'},
      steps:{en:['Selling cookies for charity → collecting money.','The phrase is <b>raise money</b>.'],
             id:['Menjual kue untuk amal → mengumpulkan uang.','Frasanya adalah <b>raise money</b>.']}};
  },
  m7_vocab_putaway:()=>{
    const cor={en:'put away',id:'put away'};
    const{opts,ans}=mkOpts(cor,[
      {en:'put on',id:'put on'},
      {en:'put up',id:'put up'},
      {en:'put down',id:'put down'}]);
    return{type:'mcq',topic:'m7_vocab',
      q:{en:'After playing, please ___ your toys in the box.',
         id:'Setelah bermain, tolong ___ mainanmu di dalam kotak.'},
      opts,ans,
      hint:{en:'It means "store something in its proper place".',
            id:'Artinya "menyimpan sesuatu di tempatnya".'},
      concept:{en:'"Put away" = store / tidy something into its proper place.',
               id:'"Put away" = menyimpan / merapikan sesuatu ke tempatnya.'},
      steps:{en:['Storing toys → <b>put away</b>.'],
             id:['Menyimpan mainan → <b>put away</b>.']}};
  },
  m7_vocab_makefun:()=>{
    const cor={en:'make fun of',id:'make fun of'};
    const{opts,ans}=mkOpts(cor,[
      {en:'make up',id:'make up'},
      {en:'make sure',id:'make sure'},
      {en:'make out',id:'make out'}]);
    return{type:'mcq',topic:'m7_vocab',
      q:{en:'It is unkind to ___ your friends.',id:'Tidak baik untuk ___ temanmu.'},
      opts,ans,
      hint:{en:'Means to laugh at someone in a hurtful way.',id:'Artinya menertawakan seseorang dengan cara menyakitkan.'},
      concept:{en:'"Make fun of" = tease or laugh at someone.',
               id:'"Make fun of" = mengejek atau menertawakan seseorang.'},
      steps:{en:['Teasing someone → <b>make fun of</b>.'],
             id:['Mengejek seseorang → <b>make fun of</b>.']}};
  },
  m7_vocab_charity:()=>{
    const cor={en:'a charity',id:'a charity'};
    const{opts,ans}=mkOpts(cor,[
      {en:'a chore',id:'a chore'},
      {en:'a wish',id:'a wish'},
      {en:'a legend',id:'a legend'}]);
    return{type:'mcq',topic:'m7_vocab',
      q:{en:'An organization that helps people in need is called ___.',
         id:'Organisasi yang membantu orang yang membutuhkan disebut ___.'},
      opts,ans,
      hint:{en:'Begins with "ch".',id:'Diawali huruf "ch".'},
      concept:{en:'A charity is an organization that helps others.',
               id:'A charity adalah organisasi yang menolong orang lain.'},
      steps:{en:['Helping organization = <b>charity</b>.'],
             id:['Organisasi penolong = <b>charity</b>.']}};
  },
  m7_vocab_secondhand:()=>{
    const cor={en:'second-hand',id:'second-hand'};
    const{opts,ans}=mkOpts(cor,[
      {en:'modern',id:'modern'},
      {en:'brand new',id:'brand new'},
      {en:'broken',id:'broken'}]);
    return{type:'mcq',topic:'m7_vocab',
      q:{en:'Clothes that were used by someone before are called ___ clothes.',
         id:'Pakaian yang sudah pernah dipakai orang lain disebut pakaian ___.'},
      opts,ans,
      hint:{en:'Hyphenated word: "second-___".',id:'Kata berhubung-strip: "second-___".'},
      concept:{en:'"Second-hand" = previously owned / used.',
               id:'"Second-hand" = bekas / sudah pernah dipakai.'},
      steps:{en:['Pre-owned → <b>second-hand</b>.'],
             id:['Bekas → <b>second-hand</b>.']}};
  },
  m7_vocab_legend:()=>{
    const cor={en:'a legend',id:'a legend'};
    const{opts,ans}=mkOpts(cor,[
      {en:'a chore',id:'a chore'},
      {en:'an illness',id:'an illness'},
      {en:'a vitamin',id:'a vitamin'}]);
    return{type:'mcq',topic:'m7_vocab',
      q:{en:'An old story passed down from grandparents to children is called ___.',
         id:'Cerita tua yang diwariskan dari kakek-nenek ke anak-anak disebut ___.'},
      opts,ans,
      hint:{en:'Like the story of Malin Kundang.',id:'Seperti cerita Malin Kundang.'},
      concept:{en:'A legend is a traditional story from long ago.',
               id:'A legend adalah cerita tradisional dari masa lalu.'},
      steps:{en:['Old traditional story = <b>legend</b>.'],
             id:['Cerita tradisional lama = <b>legend</b>.']}};
  },
  // FILL

let queue=[], current=null, idx=0, total=0;
let stats={correct:0, wrong:0, done:0};
let lastResult=null;

let topicStats = {};

function buildQueue(chKey){
  if(chKey === 'uas'){ buildUAS(); return; }
  isUAS = false;
  const ch = CHAPTERS[chKey] || CHAPTERS['1'];
  currentChapterTitle = ch.title;
  const keys = shuf(Object.keys(ch.gen));
  let qs = keys.map(k => ({key:k, gen:ch.gen[k]}));
  // order: mcq, fill, essay
  qs = qs.map(q => ({...q, _t: q.gen().type}));
  const typeOrder = {mcq:0, fill:1, essay:2};
  qs.sort((a,b)=>(typeOrder[a._t]??9) - (typeOrder[b._t]??9));
  queue = qs.map(q => q.gen());
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  updateLangUI();
  updateScore();
  next();
}

function buildUAS(){
  isUAS = true;
  currentChapterTitle = {en:'UAS — Final Exam (35 Q)',id:'UAS — Ujian Akhir (35 Soal)'};
  uasBreakdown = {};

  const byTopicType = {};
  for(const [key,fn] of Object.entries(ALL_GENS)){
    const sample = fn();
    const k = sample.topic + ':' + sample.type;
    (byTopicType[k] = byTopicType[k] || []).push(fn);
  }

  const built = [];
  for(const spec of UAS_KISI){
    const key = spec.topic + ':' + spec.type;
    const pool = byTopicType[key] || [];
    uasBreakdown[spec.chapter] = uasBreakdown[spec.chapter] || {correct:0,total:0};
    uasBreakdown[spec.chapter].total += spec.n;
    if(pool.length === 0){
      for(let i=0;i<spec.n;i++){
        built.push({type:spec.type,
          q:{en:`[Missing question for ${spec.topic}]`,id:`[Soal hilang untuk ${spec.topic}]`},
          opts:[{en:'—',id:'—'},{en:'—',id:'—'},{en:'—',id:'—'},{en:'—',id:'—'}],
          ans:0, answers:['—'], display:{en:'—',id:'—'}, model:{en:'—',id:'—'}, keys:[],
          _chapter:spec.chapter, _topic:spec.topic});
      }
      continue;
    }
    const shuffled = shuf(pool);
    for(let i=0;i<spec.n;i++){
      const fn = shuffled[i % shuffled.length];
      const q = fn();
      q._chapter = spec.chapter;
      q._topic = spec.topic;
      built.push(q);
    }
  }

  const typeOrder = {mcq:0, fill:1, essay:2};
  built.sort((a,b)=> (typeOrder[a.type]??9) - (typeOrder[b.type]??9));

  queue = built;
  total = queue.length;
  idx = 0;
  stats = {correct:0, wrong:0, done:0};
  updateLangUI();
  updateScore();
  next();
}

function updateScore(){
  document.getElementById('sCorrect').textContent = stats.correct;
  document.getElementById('sWrong').textContent = stats.wrong;
  document.getElementById('sDone').textContent = stats.done;
  if(isWeakPractice){
    document.getElementById('progFill').style.width = smartScore + '%';
    document.getElementById('progText').textContent = 'SmartScore: ' + smartScore + '/100';
    document.getElementById('hdrMeta').textContent =
      (lang==='en'?'Weak practice · Q':'Latihan area lemah · Soal ') + (idx+1);
  } else {
    const pct = total>0 ? (stats.done/total)*100 : 0;
    document.getElementById('progFill').style.width = pct + '%';
    document.getElementById('progText').textContent = `${stats.done} / ${total}`;
    document.getElementById('hdrMeta').textContent =
      (lang==='en'?'Question ':'Soal ') + Math.min(idx+1,total) + (lang==='en'?' of ':' dari ') + total;
  }
}

// ────────────────────────────────────────────────────────────────
// AUTO-WEAK-PRACTICE — drills topics the student missed on UAS
// until SmartScore reaches 100.
// ────────────────────────────────────────────────────────────────
function _genKeysForTopics(topicSet){
  const out = [];
  for(const [key, fn] of Object.entries(ALL_GENS)){
    try { const s = fn(); if(topicSet.includes(s.topic)) out.push(key); } catch(e){}
  }
  return out;
}
function enterWeakPractice(acc){
  weakTopicSet = Object.keys(topicStats).filter(tp => topicStats[tp].wrong > 0);
  if(weakTopicSet.length === 0) weakTopicSet = Object.keys(topicStats);
  if(weakTopicSet.length === 0){
    const tset = new Set();
    for(const fn of Object.values(ALL_GENS)){ try { tset.add(fn().topic); } catch(e){} }
    weakTopicSet = Array.from(tset);
  }
  isWeakPractice = true;
  originalUasAcc = acc;
  smartScore = acc;
  weakCount = 0;
  stats = {correct:0, wrong:0, done:0};
  idx = 0;
  const pool = _genKeysForTopics(weakTopicSet);
  const usePool = pool.length > 0 ? pool : Object.keys(ALL_GENS);
  const QN = 8;
  const built = [];
  const shuffled = shuf(usePool);
  for(let i=0;i<QN;i++){
    const k = shuffled[i % shuffled.length];
    const q = ALL_GENS[k]();
    q._weak = true;
    built.push(q);
  }
  queue = built;
  total = queue.length;
  const enMsg = `You got <strong>${acc}%</strong> on the UAS — let's master the topics you missed!`;
  const idMsg = `Kamu dapat <strong>${acc}%</strong> di UAS — yuk kuasai topik yang masih lemah!`;
  const enSub = `Practice continues until SmartScore 100.`;
  const idSub = `Latihan berlanjut sampai SmartScore 100.`;
  const enBtn = `Start Weak Practice →`;
  const idBtn = `Mulai Latihan Area Lemah →`;
  document.getElementById('quizSlot').innerHTML = `
    <div class="q-card done">
      <h2>🎯 ${lang==='en'?'Time to level up!':'Saatnya naik level!'}</h2>
      <p>${lang==='en'?enMsg:idMsg}</p>
      <p style="opacity:.75;font-size:.9rem">${lang==='en'?enSub:idSub}</p>
      <button class="restart-btn" id="startWeakBtn">${lang==='en'?enBtn:idBtn}</button>
    </div>`;
  document.getElementById('startWeakBtn').addEventListener('click', ()=>{ updateScore(); next(); });
}
function refillWeakQueue(){
  const pool = _genKeysForTopics(weakTopicSet);
  const usePool = pool.length > 0 ? pool : Object.keys(ALL_GENS);
  const weighted = usePool.map(k => {
    let w = 1;
    try {
      const tp = ALL_GENS[k]().topic;
      const st = topicStats[tp] || {wrong:0,correct:0,recentWrong:[]};
      const recent = (st.recentWrong||[]).slice(-3).reduce((a,b)=>a+b,0);
      w = 1 + 2*st.wrong + 3*recent;
    } catch(e){}
    return {k, w};
  });
  const totalW = weighted.reduce((s,x)=>s+x.w, 0) || 1;
  for(let i=0;i<5;i++){
    let r = Math.random()*totalW, pickKey = weighted[0].k;
    for(const w of weighted){ r -= w.w; if(r <= 0){ pickKey = w.k; break; } }
    const q = ALL_GENS[pickKey]();
    q._weak = true;
    queue.push(q);
  }
  total = queue.length;
}

function next(){
  if(idx >= total){
    if(isWeakPractice && smartScore < 100){
      refillWeakQueue();
      current = queue[idx];
      lastResult = null;
      renderQuestion();
      updateScore();
      return;
    }
    if(isUAS && !isWeakPractice){
      const acc = total>0 ? Math.round((stats.correct/total)*100) : 0;
      if(acc < 90){ enterWeakPractice(acc); return; }
    }
    renderDone();
    return;
  }
  current = queue[idx];
  lastResult = null;
  renderQuestion();
  updateScore();
}

function renderQuestion(){
  const slot = document.getElementById('quizSlot');
  let inner = '';
  switch(current.type){
    case 'mcq':   inner = mcqHtml(current); break;
    case 'fill':  inner = fillHtml(current); break;
    case 'essay': inner = essayHtml(current); break;
  }
  slot.innerHTML = `<div class="q-card">${inner}</div>`;
  switch(current.type){
    case 'mcq':   attachMCQ(); break;
    case 'fill':  attachFill(); break;
    case 'essay': attachEssay(); break;
  }
  attachHint();
}

function badgeFor(typ){
  const labels = {
    mcq:{en:'📝 Multiple Choice',id:'📝 Pilihan Ganda'},
    fill:{en:'📋 Fill in the Blank',id:'📋 Isian Singkat'},
    essay:{en:'📖 Short Answer',id:'📖 Uraian Singkat'},
  };
  return `<span class="q-badge ${typ}">${t(labels[typ])}</span>`;
}

function hintBlock(q){
  if(!q.hint) return '';
  const showLbl = lang==='en' ? '💡 Show Hint' : '💡 Tampilkan Petunjuk';
  return `<div class="hint-row">
    <button class="hint-btn" id="hintBtn">${showLbl}</button>
    <div class="hint-box" id="hintBox">${t(q.hint)}</div>
  </div>`;
}

function feedbackBlock(){ return `<div class="fb" id="fb"></div>`; }

function mcqHtml(q){
  const letters=['A','B','C','D'];
  const opts = q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="opt-letter">${letters[i]}</span><span>${t(o)}</span></button>`).join('');
  return `${badgeFor('mcq')}<div class="q-text">${t(q.q)}</div><div class="opts">${opts}</div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachMCQ(){
  document.querySelectorAll('.opt').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = parseInt(b.dataset.i);
      checkAnswer(i === current.ans, ()=>{
        document.querySelectorAll('.opt').forEach((btn,j)=>{
          btn.disabled = true;
          if(j === current.ans) btn.classList.add('correct');
          else if(j === i) btn.classList.add('wrong');
        });
      });
    });
  });
}

function fillHtml(q){
  const ph = lang==='en' ? 'Type your answer…' : 'Ketik jawabanmu…';
  const btn = lang==='en' ? 'Check' : 'Periksa';
  return `${badgeFor('fill')}<div class="q-text">${t(q.q)}</div>
    <div class="fill-row">
      <input type="text" class="fill-input" id="fillInp" placeholder="${ph}" autocomplete="off"/>
      <button class="fill-submit" id="fillSub">${btn}</button>
    </div>${hintBlock(q)}${feedbackBlock()}`;
}
function attachFill(){
  const inp = document.getElementById('fillInp');
  const sub = document.getElementById('fillSub');
  inp.focus();
  const submit = ()=>{
    const u = norm(inp.value);
    if(!u){ inp.focus(); return; }
    const ok = current.answers.some(a => norm(a) === u);
    checkAnswer(ok, ()=>{
      inp.disabled = true; sub.disabled = true;
      inp.style.borderColor = ok ? '#10b981' : '#d63031';
      inp.style.background = ok ? '#ecfdf5' : '#fff5f5';
    });
  };
  sub.addEventListener('click', submit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

function essayHtml(q){
  const ph = lang==='en' ? 'Write your answer in your own words…' : 'Tulis jawabanmu dengan kata-katamu sendiri…';
  const showBtn = lang==='en' ? '📋 Show Model Answer' : '📋 Tampilkan Jawaban Contoh';
  const got = lang==='en' ? '✓ I got it right' : '✓ Saya benar';
  const miss = lang==='en' ? '✗ Need to review' : '✗ Perlu belajar lagi';
  return `${badgeFor('essay')}<div class="q-text">${t(q.q)}</div>
    <textarea class="essay-area" id="essayInp" placeholder="${ph}"></textarea>
    <button class="essay-show" id="essayShow">${showBtn}</button>
    <div class="essay-self" id="essaySelf">
      <button class="got" data-v="1">${got}</button>
      <button class="miss" data-v="0">${miss}</button>
    </div>
    ${hintBlock(q)}${feedbackBlock()}`;
}
function attachEssay(){
  const area = document.getElementById('essayInp');
  const show = document.getElementById('essayShow');
  const self = document.getElementById('essaySelf');
  const fb = document.getElementById('fb');
  show.addEventListener('click', ()=>{
    if(area.value.trim().length < 5){
      fb.className='fb info show';
      fb.innerHTML = lang==='en'
        ? `<strong>Write your answer first</strong> — even a sentence or two. Then click "Show Model Answer" to compare.`
        : `<strong>Tulis jawabanmu dulu</strong> — minimal satu atau dua kalimat. Lalu klik "Tampilkan Jawaban Contoh" untuk membandingkan.`;
      return;
    }
    area.disabled = true;
    show.style.display = 'none';
    const u = norm(area.value);
    const hits = (current.keys||[]).filter(k => u.includes(norm(k))).length;
    const ttl = (current.keys||[]).length || 1;
    fb.className = 'fb info show';
    const modelLbl = lang==='en' ? '📋 Model Answer:' : '📋 Jawaban Contoh:';
    const smallLbl = lang==='en'
      ? `🔍 Your answer mentioned <strong>${hits} of ${ttl}</strong> key terms. Compare with the model and grade yourself honestly:`
      : `🔍 Jawabanmu memuat <strong>${hits} dari ${ttl}</strong> kata kunci. Bandingkan dengan contoh dan nilai jujur:`;
    fb.innerHTML = `<strong>${modelLbl}</strong><br><br>${t(current.model)}<br><br><small>${smallLbl}</small>`;
    self.classList.add('show');
  });
  self.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const ok = b.dataset.v === '1';
      self.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.style.background = ok ? '#ecfdf5' : '#fff5f0';
      registerResult(ok);
      if(current.concept){
        fb.innerHTML += `<div class="concept-box">💡 ${t(current.concept)}</div>`;
      }
      setTimeout(()=>{ idx++; next(); }, 1600);
    });
  });
}

function attachHint(){
  const btn = document.getElementById('hintBtn');
  const box = document.getElementById('hintBox');
  if(!btn) return;
  btn.addEventListener('click', ()=>{
    box.classList.toggle('show');
    const show = box.classList.contains('show');
    btn.textContent = show
      ? (lang==='en' ? '🙈 Hide Hint' : '🙈 Sembunyikan Petunjuk')
      : (lang==='en' ? '💡 Show Hint' : '💡 Tampilkan Petunjuk');
  });
}

function registerResult(ok){
  if(lastResult !== null) return;
  lastResult = ok ? 'correct' : 'wrong';
  if(ok) stats.correct++; else stats.wrong++;
  stats.done++;
  if(isUAS && current._chapter){
    uasBreakdown[current._chapter] = uasBreakdown[current._chapter] || {correct:0,total:0};
    if(ok) uasBreakdown[current._chapter].correct++;
  }
  // Per-topic tracking for weak-area drill.
  const tp = (current && (current._topic || current.topic)) || null;
  if(tp){
    topicStats[tp] = topicStats[tp] || {correct:0, wrong:0, recentWrong:[]};
    if(ok){ topicStats[tp].correct++; topicStats[tp].recentWrong.push(0); }
    else  { topicStats[tp].wrong++;   topicStats[tp].recentWrong.push(1); }
    if(topicStats[tp].recentWrong.length > 5) topicStats[tp].recentWrong.shift();
  }
  if(isWeakPractice){
    weakCount++;
    if(ok) smartScore = Math.min(100, smartScore + 5);
    else   smartScore = Math.max(0,   smartScore - 3);
  }
  updateScore();
}

function checkAnswer(ok, lockFn){
  registerResult(ok);
  if(lockFn) lockFn();
  const fb = document.getElementById('fb');
  const stepsArr = current.steps ? t(current.steps) : [];
  const stepsHtml = (stepsArr||[]).map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`).join('');
  const conceptHtml = current.concept ? `<div class="concept-box">💡 ${t(current.concept)}</div>` : '';
  if(ok){
    fb.className = 'fb correct show';
    const lbl = lang==='en' ? '✅ Correct! Well done!' : '✅ Benar! Bagus sekali!';
    fb.innerHTML = `<strong>${lbl}</strong>${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
    if(stats.correct>0 && stats.correct%3===0) confetti();
  } else {
    fb.className = 'fb wrong show';
    let correctText = '';
    if(current.type==='mcq') correctText = t(current.opts[current.ans]);
    else if(current.type==='fill') correctText = current.display ? t(current.display) : current.answers[0];
    const lbl = lang==='en' ? '❌ Not quite.' : '❌ Belum tepat.';
    const isLbl = lang==='en' ? 'The correct answer is' : 'Jawaban yang benar adalah';
    fb.innerHTML = `<strong>${lbl}</strong> ${isLbl} <strong>${correctText}</strong>.${stepsHtml?`<div class="steps">${stepsHtml}</div>`:''}${conceptHtml}`;
  }
  // ── Mastery reached during weak-practice → auto-finish (math pattern) ──
  if(isWeakPractice && smartScore >= 100){
    if(typeof confetti === 'function') confetti();
    setTimeout(()=>{ window.scrollTo({top:0,behavior:'smooth'}); renderDone(); }, 1600);
    return;
  }
  setTimeout(()=>{
    const nxt = document.createElement('button');
    nxt.className = 'restart-btn';
    nxt.style.marginTop = '16px';
    nxt.style.padding = '10px 24px';
    nxt.style.fontSize = '.88rem';
    const willContinue = isWeakPractice && smartScore < 100;
    nxt.textContent = (idx+1 >= total && !willContinue)
      ? (lang==='en' ? '🏁 See Results' : '🏁 Lihat Hasil')
      : (lang==='en' ? 'Next Question →' : 'Soal Berikutnya →');
    nxt.onclick = ()=>{ idx++; next(); };
    fb.appendChild(nxt);
  }, 300);
}

function renderDone(){
  // Mastery screen after weak-practice loop reaches SmartScore 100.
  if(isWeakPractice && smartScore >= 100){
    const retryLbl = lang==='en'?'🔄 Try Again':'🔄 Coba Lagi';
    const backLbl  = lang==='en'?'← Back to modules':'← Kembali ke daftar modul';
    const head = lang==='en' ? '🏆 Mastered!' : '🏆 Mantap!';
    const sub  = lang==='en'
      ? 'You reached 100% after practising your weak areas.'
      : 'Kamu mencapai 100% setelah berlatih area lemah.';
    const uasLbl   = lang==='en'?'UAS score':'Skor UAS';
    const smartLbl = 'SmartScore';
    const weakLbl  = lang==='en'?'Weak-area questions answered':'Soal latihan area lemah';
    document.getElementById('quizSlot').innerHTML = `
      <div class="q-card done">
        <h2>${head}</h2>
        <p>${sub}</p>
        <div class="done-stats">
          <div class="done-stat"><strong>${originalUasAcc}%</strong><span>${uasLbl}</span></div>
          <div class="done-stat"><strong>100/100</strong><span>${smartLbl}</span></div>
          <div class="done-stat"><strong>${weakCount}</strong><span>${weakLbl}</span></div>
        </div>
        <button class="restart-btn" onclick="location.reload()">${retryLbl}</button>
        <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#ec4899;font-weight:700;text-decoration:none">${backLbl}</a></p>
      </div>`;
    for(let i=0;i<5;i++) setTimeout(confetti, i*250);
    return;
  }
  const pct = total>0 ? Math.round((stats.correct/total)*100) : 0;
  let msg;
  if(lang==='en'){
    msg = pct>=80 ? '🎉 Outstanding!' : pct>=60 ? '👍 Good job!' : pct>=40 ? '💪 Keep practising!' : '📚 Time to review!';
  } else {
    msg = pct>=80 ? '🎉 Luar biasa!' : pct>=60 ? '👍 Kerja bagus!' : pct>=40 ? '💪 Terus berlatih!' : '📚 Saatnya belajar lagi!';
  }
  const finishedLbl = lang==='en'
    ? `You finished <strong>${total}</strong> questions.`
    : `Kamu menyelesaikan <strong>${total}</strong> soal.`;
  const correctLbl = lang==='en'?'Correct':'Benar';
  const wrongLbl = lang==='en'?'Wrong':'Salah';
  const scoreLbl = lang==='en'?'Score':'Skor';
  const retryLbl = lang==='en'?'🔄 Try Again':'🔄 Coba Lagi';
  const backLbl = lang==='en'?'← Back to modules':'← Kembali ke daftar modul';

  let breakdownHtml = '';
  if(isUAS){
    const bdTitle = lang==='en'?'📊 Score by Module':'📊 Skor per Modul';
    const rows = Object.entries(uasBreakdown).map(([ch,v])=>{
      const ratio = v.total>0 ? (v.correct/v.total) : 0;
      const cls = ratio < 0.5 ? 'low' : '';
      return `<div class="breakdown-row"><span class="bd-label">${ch}</span><span class="bd-score ${cls}">${v.correct} / ${v.total}</span></div>`;
    }).join('');
    breakdownHtml = `<div class="breakdown"><h4>${bdTitle}</h4>${rows}</div>`;
  }

  const greatWorkNote = (isUAS && !isWeakPractice && pct>=90) ? `
    <p style="margin-top:8px;color:#16a34a;font-weight:600">
      ${lang==='en'?'✨ Great work — no weak-area practice needed!':'✨ Mantap — tidak perlu latihan area lemah!'}
    </p>` : '';
  document.getElementById('quizSlot').innerHTML = `
    <div class="q-card done">
      <h2>${msg}</h2>
      <p>${finishedLbl}</p>
      ${greatWorkNote}
      <div class="done-stats">
        <div class="done-stat"><strong>${stats.correct}</strong><span>${correctLbl}</span></div>
        <div class="done-stat"><strong>${stats.wrong}</strong><span>${wrongLbl}</span></div>
        <div class="done-stat"><strong>${pct}%</strong><span>${scoreLbl}</span></div>
      </div>
      ${breakdownHtml}
      <button class="restart-btn" onclick="location.reload()">${retryLbl}</button>
      <p style="margin-top:18px;font-size:.85rem"><a href="../" style="color:#ec4899;font-weight:700;text-decoration:none">${backLbl}</a></p>
    </div>`;
  if(pct>=70) for(let i=0;i<3;i++) setTimeout(confetti, i*250);
}

function confetti(){
  const colors=['#ec4899','#f43f5e','#f97316','#f9ca24','#10b981','#a29bfe'];
  for(let i=0;i<24;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=pick(colors);
    c.style.left=(Math.random()*100)+'vw';
    c.style.top='-20px';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    c.style.borderRadius=Math.random()<0.5?'50%':'2px';
    document.body.appendChild(c);
    const dx=(Math.random()-0.5)*200;
    const dur=1500+Math.random()*1000;
    c.animate([{transform:c.style.transform,opacity:1,top:'-20px'},
               {transform:`translate(${dx}px,${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:0,top:`${window.innerHeight+40}px`}],
              {duration:dur,easing:'cubic-bezier(.3,.7,.4,1)'});
    setTimeout(()=>c.remove(),dur);
  }
}

const params = new URLSearchParams(location.search);
const chKey = params.get('ch') || '1';
updateLangUI();
buildQueue(chKey);
</script>
